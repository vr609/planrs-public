<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indices &amp; Powers Playground</title>
<style>
  :root{
    --violet-1: #2a0a4f;
    --violet-2: #4b1487;
    --violet-3: #7b2ff7;
    --violet-4: #b164f7;
    --pink: #ff6ec7;
    --yellow: #ffd93d;
    --green: #4bff9f;
    --blue: #4dc6ff;
    --orange: #ff9f4d;
    --white-text: #fdf6ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    overflow-x: hidden;
    background: linear-gradient(-45deg, #2a0a4f, #4b1487, #7b2ff7, #3a0ca3);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    color: var(--white-text);
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating background shapes */
  .bg-shapes {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .float-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    filter: blur(1px);
    animation: floatAround linear infinite;
  }

  @keyframes floatAround {
    0% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(30px, -40px) rotate(90deg); }
    50% { transform: translate(-20px, -80px) rotate(180deg); }
    75% { transform: translate(-40px, -20px) rotate(270deg); }
    100% { transform: translate(0,0) rotate(360deg); }
  }

  .star {
    position: absolute;
    animation: twinkle 2.5s ease-in-out infinite, floatAround 20s linear infinite;
    opacity: 0.6;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.2); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
    animation: popIn 0.8s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    margin: 10px 0 6px;
    background: linear-gradient(90deg, var(--yellow), var(--pink), var(--blue), var(--green));
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbowText 6s ease infinite;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  @keyframes rainbowText {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    font-size: 1.05rem;
    opacity: 0.9;
    margin-bottom: 10px;
  }

  .mascot-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin: 10px 0 20px;
  }

  .mascot {
    font-size: 2.2rem;
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
  }
  .mascot:nth-child(2) { animation-delay: 0.2s; }
  .mascot:nth-child(3) { animation-delay: 0.4s; }
  .mascot:nth-child(4) { animation-delay: 0.6s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-16px) rotate(5deg); }
  }

  /* Progress trail */
  .progress-trail {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .progress-node {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.2rem;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.3);
    transition: all 0.4s ease;
    position: relative;
  }

  .progress-node.active {
    background: linear-gradient(135deg, var(--pink), var(--orange));
    border-color: var(--yellow);
    box-shadow: 0 0 25px rgba(255, 217, 61, 0.7);
    animation: pulseNode 1.2s ease-in-out infinite;
  }

  .progress-node.done {
    background: linear-gradient(135deg, var(--green), var(--blue));
    border-color: var(--green);
  }

  @keyframes pulseNode {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .progress-line {
    width: 50px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.2);
    overflow: hidden;
  }

  .progress-line-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--yellow));
    transition: width 0.6s ease;
  }

  /* Activity Card */
  .activity-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 28px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 0 60px rgba(255,255,255,0.03);
    animation: cardIn 0.6s ease;
    position: relative;
    overflow: hidden;
  }

  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(30px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .activity-title {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 6px;
    color: var(--yellow);
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

  .activity-instructions {
    text-align: center;
    opacity: 0.9;
    margin-bottom: 22px;
    font-size: 1rem;
  }

  /* Drag drop layout */
  .dnd-area {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    align-items: flex-start;
  }

  .drop-zone-col, .drag-source-col {
    flex: 1 1 260px;
    min-width: 240px;
  }

  .col-heading {
    text-align: center;
    font-size: 0.95rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 12px;
    color: var(--blue);
  }

  .drop-target {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(255,255,255,0.07);
    border: 3px dashed rgba(255,255,255,0.4);
    border-radius: 18px;
    padding: 14px 18px;
    margin-bottom: 14px;
    font-size: 1.15rem;
    font-weight: bold;
    min-height: 62px;
    transition: all 0.25s ease;
  }

  .drop-target .prompt-label {
    flex: 1;
  }

  .drop-target .drop-slot {
    min-width: 90px;
    min-height: 44px;
    border-radius: 12px;
    background: rgba(0,0,0,0.2);
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    transition: all 0.25s ease;
  }

  .drop-target.drag-over {
    background: rgba(177, 100, 247, 0.35);
    border-color: var(--pink);
    transform: scale(1.03);
  }

  .drop-target.filled .drop-slot {
    background: linear-gradient(135deg, var(--violet-4), var(--pink));
    border-color: var(--yellow);
    color: white;
  }

  .drop-target.correct {
    border-color: var(--green);
    background: rgba(75, 255, 159, 0.18);
    animation: correctPulse 0.5s ease;
  }

  .drop-target.wrong {
    border-color: #ff5d5d;
    background: rgba(255, 93, 93, 0.18);
    animation: shake 0.5s ease;
  }

  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .draggable {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px;
    margin: 8px;
    border-radius: 16px;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: grab;
    color: #2a0a4f;
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 8px 18px rgba(0,0,0,0.3);
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: wiggle 3s ease-in-out infinite;
  }

  .draggable:nth-child(2n) {
    background: linear-gradient(135deg, var(--green), var(--blue));
    animation-delay: 0.3s;
  }
  .draggable:nth-child(3n) {
    background: linear-gradient(135deg, var(--pink), var(--violet-4));
    color: white;
    animation-delay: 0.6s;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  .draggable:active {
    cursor: grabbing;
    transform: scale(1.1) rotate(0deg);
  }

  .draggable.dragging {
    opacity: 0.4;
  }

  .draggable.used {
    opacity: 0.25;
    pointer-events: none;
    filter: grayscale(0.6);
  }

  .drag-source-col .pool {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    background: rgba(0,0,0,0.15);
    border-radius: 20px;
    padding: 14px;
    min-height: 100px;
  }

  .check-row {
    text-align: center;
    margin-top: 26px;
  }

  .check-btn {
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1.15rem;
    font-weight: bold;
    padding: 14px 38px;
    border-radius: 40px;
    color: white;
    background: linear-gradient(135deg, var(--pink), var(--violet-3));
    box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 10px 24px rgba(0,0,0,0.35);
    transition: transform 0.15s ease;
    animation: floatBtn 2.4s ease-in-out infinite;
  }

  @keyframes floatBtn {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .check-btn:hover { transform: translateY(-4px) scale(1.04); }
  .check-btn:active { transform: translateY(2px) scale(0.98); }

  .check-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    animation: none;
  }

  /* Popups */
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 0, 40, 0.65);
    backdrop-filter: blur(4px);
    z-index: 50;
  }

  .overlay.show {
    display: flex;
    animation: fadeInOverlay 0.3s ease;
  }

  @keyframes fadeInOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .popup {
    background: linear-gradient(160deg, var(--violet-2), var(--violet-1));
    border: 4px solid var(--pink);
    border-radius: 30px;
    padding: 36px 30px;
    text-align: center;
    max-width: 380px;
    width: 88%;
    box-shadow: 0 0 60px rgba(255, 110, 199, 0.5), 0 20px 50px rgba(0,0,0,0.5);
    animation: popupBounce 0.5s cubic-bezier(.34,1.56,.64,1);
    position: relative;
  }

  @keyframes popupBounce {
    0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.08) rotate(3deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .popup .big-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 10px;
    animation: emojiSpin 1s ease;
  }

  @keyframes emojiSpin {
    0% { transform: scale(0) rotate(-180deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .popup h2 {
    margin: 0 0 10px;
    font-size: 1.6rem;
  }

  .popup.try-again h2 { color: #ff8080; }
  .popup.next-activity h2 { color: var(--green); }

  .popup p {
    margin: 0 0 20px;
    font-size: 1.05rem;
    opacity: 0.95;
  }

  .popup-btn {
    border: none;
    outline: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 40px;
    color: white;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    transition: transform 0.15s ease;
  }

  .popup.try-again .popup-btn {
    background: linear-gradient(135deg, #ff8080, #ff5d5d);
  }

  .popup.next-activity .popup-btn {
    background: linear-gradient(135deg, var(--green), var(--blue));
    color: #133;
  }

  .popup-btn:hover { transform: translateY(-3px) scale(1.05); }
  .popup-btn:active { transform: translateY(1px) scale(0.97); }

  /* Celebration screen */
  .celebration {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: linear-gradient(-45deg, #ff6ec7, #7b2ff7, #4dc6ff, #ffd93d);
    background-size: 400% 400%;
    animation: gradientShift 6s ease infinite;
    overflow: hidden;
  }

  .celebration.show { display: flex; }

  .celebration h1 {
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    margin: 0;
    color: white;
    -webkit-text-stroke: 2px rgba(0,0,0,0.15);
    animation: celebPop 0.8s cubic-bezier(.34,1.56,.64,1);
    text-shadow: 0 6px 0 rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.4);
  }

  @keyframes celebPop {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .celebration .sub {
    font-size: 1.3rem;
    color: white;
    margin-top: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .celebration .trophy-row {
    font-size: 3.5rem;
    margin: 20px 0;
    animation: bounce 1.4s ease-in-out infinite;
  }

  .play-again-btn {
    margin-top: 24px;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1.3rem;
    font-weight: bold;
    padding: 16px 44px;
    border-radius: 50px;
    color: #4b1487;
    background: white;
    box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 14px 30px rgba(0,0,0,0.35);
    transition: transform 0.15s ease;
    z-index: 5;
    position: relative;
  }

  .play-again-btn:hover { transform: translateY(-4px) scale(1.05); }
  .play-again-btn:active { transform: translateY(2px) scale(0.97); }

  .confetti-piece {
    position: absolute;
    top: -20px;
    border-radius: 3px;
    animation: confettiFall linear infinite;
    z-index: 1;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }

  footer {
    text-align: center;
    margin-top: 30px;
    opacity: 0.6;
    font-size: 0.85rem;
  }

  @media (max-width: 480px) {
    .activity-card { padding: 20px 14px; }
    .progress-trail { gap: 8px; }
    .progress-line { width: 26px; }
  }
</style>
</head>
<body>

<div class="bg-shapes" id="bgShapes"></div>

<div class="container">
  <header>
    <h1>Powers &amp; Indices Playground</h1>
    <div class="mascot-row">
      <span class="mascot">🚀</span>
      <span class="mascot">⭐</span>
      <span class="mascot">🎈</span>
      <span class="mascot">🪐</span>
    </div>
  </header>

  <div class="progress-trail" id="progressTrail">
    <div class="progress-node active" id="node1">1</div>
    <div class="progress-line"><div class="progress-line-fill" id="line1"></div></div>
    <div class="progress-node" id="node2">2</div>
    <div class="progress-line"><div class="progress-line-fill" id="line2"></div></div>
    <div class="progress-node" id="node3">3</div>
  </div>

  <div class="activity-card" id="activityCard">
    <!-- Filled by JS -->
  </div>

  <footer>Match, drag, and celebrate every power-up! 🎉</footer>
</div>

<!-- Try Again Popup -->
<div class="overlay" id="tryAgainOverlay">
  <div class="popup try-again">
    <span class="big-emoji">🙈</span>
    <h2>Oops! Not Quite!</h2>
    <p id="tryAgainMsg">Some answers need another look. Give it another shot!</p>
    <button class="popup-btn" id="tryAgainBtn">Try Again</button>
  </div>
</div>

<!-- Next Activity Popup -->
<div class="overlay" id="nextOverlay">
  <div class="popup next-activity">
    <span class="big-emoji">🌟</span>
    <h2 id="nextTitle">Awesome Job!</h2>
    <p id="nextMsg">You unlocked the next activity!</p>
    <button class="popup-btn" id="nextBtn">Next Activity →</button>
  </div>
</div>

<!-- Celebration Screen -->
<div class="celebration" id="celebration">
  <div class="trophy-row">🏆🎉🏆</div>
  <h1>You Did It!</h1>
  <p class="sub">All three activities completed like a true power champion!</p>
  <button class="play-again-btn" id="playAgainBtn">Play Again 🔁</button>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Floating background shapes ---------- */
  const bgShapes = document.getElementById('bgShapes');
  const shapeColors = ['#ff6ec7','#ffd93d','#4bff9f','#4dc6ff','#b164f7','#ff9f4d'];
  const shapeEmojis = ['⭐','🎈','🪁','✨','🌟','🎨','🔮'];

  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    const isEmoji = i % 2 === 0;
    if (isEmoji) {
      s.className = 'star';
      s.textContent = shapeEmojis[i % shapeEmojis.length];
      s.style.fontSize = (16 + Math.random()*22) + 'px';
    } else {
      s.className = 'float-shape';
      const size = 20 + Math.random()*50;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.background = shapeColors[i % shapeColors.length];
    }
    s.style.left = Math.random()*96 + '%';
    s.style.top = Math.random()*96 + '%';
    s.style.animationDuration = (10 + Math.random()*14) + 's, ' + (2+Math.random()*2) + 's';
    s.style.animationDelay = (Math.random()*4) + 's';
    bgShapes.appendChild(s);
  }

  /* ---------- Activity Data ---------- */
  // Activity 1: Match expression to its value
  const activity1 = {
    title: "Match the Power to its Value 🎯",
    instructions: "Drag each value bubble into the box next to the matching power expression.",
    type: "match",
    pairs: [
      { label: "2³", answer: "8" },
      { label: "5²", answer: "25" },
      { label: "10³", answer: "1000" },
      { label: "3²", answer: "9" }
    ],
    options: ["8", "25", "1000", "9"]
  };

  // Activity 2: Match expanded form to index form
  const activity2 = {
    title: "Match Expanded Form to Index Form 🧩",
    instructions: "Drag the correct index-form bubble into the box next to its expanded multiplication.",
    type: "match",
    pairs: [
      { label: "4 × 4 × 4", answer: "4³" },
      { label: "6 × 6", answer: "6²" },
      { label: "2 × 2 × 2 × 2", answer: "2⁴" },
      { label: "7 × 7 × 7", answer: "7³" }
    ],
    options: ["4³", "6²", "2⁴", "7³"]
  };

  // Activity 3: Match power to base & exponent identification (bigger challenge - order power terms by value)
  const activity3 = {
    title: "Order the Powers from Smallest to Largest 📶",
    instructions: "Drag each power bubble into the correct rank box, from smallest value to largest value.",
    type: "order",
    slots: ["Smallest", "2nd Smallest", "2nd Largest", "Largest"],
    items: [
      { label: "2²", value: 4 },
      { label: "3²", value: 9 },
      { label: "2⁴", value: 16 },
      { label: "5²", value: 25 }
    ]
  };

  const activities = [activity1, activity2, activity3];
  let currentActivityIndex = 0;
  let placedCount = 0;
  let totalSlots = 0;

  const activityCard = document.getElementById('activityCard');
  const tryAgainOverlay = document.getElementById('tryAgainOverlay');
  const nextOverlay = document.getElementById('nextOverlay');
  const celebration = document.getElementById('celebration');

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function updateProgress() {
    for (let i = 1; i <= 3; i++) {
      const node = document.getElementById('node' + i);
      node.classList.remove('active','done');
      if (i - 1 < currentActivityIndex) {
        node.classList.add('done');
        node.textContent = '✓';
      } else if (i - 1 === currentActivityIndex) {
        node.classList.add('active');
        node.textContent = i;
      } else {
        node.textContent = i;
      }
    }
    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    line1.style.width = currentActivityIndex >= 1 ? '100%' : '0%';
    line2.style.width = currentActivityIndex >= 2 ? '100%' : '0%';
  }

  function renderActivity(index) {
    const act = activities[index];
    activityCard.innerHTML = '';

    const titleEl = document.createElement('h2');
    titleEl.className = 'activity-title';
    titleEl.textContent = act.title;
    activityCard.appendChild(titleEl);

    const instrEl = document.createElement('p');
    instrEl.className = 'activity-instructions';
    instrEl.textContent = act.instructions;
    activityCard.appendChild(instrEl);

    const dndArea = document.createElement('div');
    dndArea.className = 'dnd-area';

    const dropCol = document.createElement('div');
    dropCol.className = 'drop-zone-col';
    const dropHeading = document.createElement('div');
    dropHeading.className = 'col-heading';
    dropHeading.textContent = act.type === 'order' ? 'Rank Boxes' : 'Match Boxes';
    dropCol.appendChild(dropHeading);

    const dragCol = document.createElement('div');
    dragCol.className = 'drag-source-col';
    const dragHeading = document.createElement('div');
    dragHeading.className = 'col-heading';
    dragHeading.textContent = 'Drag From Here';
    dragCol.appendChild(dragHeading);

    const pool = document.createElement('div');
    pool.className = 'pool';
    dragCol.appendChild(pool);

    let dropTargets = [];
    let draggables = [];

    if (act.type === 'match') {
      act.pairs.forEach((pair, i) => {
        const dt = document.createElement('div');
        dt.className = 'drop-target';
        dt.dataset.answer = pair.answer;
        dt.dataset.slotId = 'slot' + i;

        const labelSpan = document.createElement('span');
        labelSpan.className = 'prompt-label';
        labelSpan.textContent = pair.label;

        const slot = document.createElement('span');
        slot.className = 'drop-slot';
        slot.textContent = '?';

        dt.appendChild(labelSpan);
        dt.appendChild(slot);
        dropCol.appendChild(dt);
        dropTargets.push(dt);
      });

      const shuffledOptions = shuffle(act.options);
      shuffledOptions.forEach((opt, i) => {
        const d = document.createElement('div');
        d.className = 'draggable';
        d.textContent = opt;
        d.draggable = true;
        d.dataset.value = opt;
        d.dataset.dragId = 'drag' + i;
        pool.appendChild(d);
        draggables.push(d);
      });
    } else if (act.type === 'order') {
      act.slots.forEach((slotName, i) => {
        const dt = document.createElement('div');
        dt.className = 'drop-target';
        dt.dataset.rank = i;
        dt.dataset.slotId = 'slot' + i;

        const labelSpan = document.createElement('span');
        labelSpan.className = 'prompt-label';
        labelSpan.textContent = slotName;

        const slot = document.createElement('span');
        slot.className = 'drop-slot';
        slot.textContent = '?';

        dt.appendChild(labelSpan);
        dt.appendChild(slot);
        dropCol.appendChild(dt);
        dropTargets.push(dt);
      });

      const sortedItems = act.items.slice().sort((a,b) => a.value - b.value);
      const shuffledItems = shuffle(act.items);
      shuffledItems.forEach((item, i) => {
        const d = document.createElement('div');
        d.className = 'draggable';
        d.textContent = item.label;
        d.draggable = true;
        d.dataset.value = item.value;
        d.dataset.label = item.label;
        d.dataset.dragId = 'drag' + i;
        pool.appendChild(d);
        draggables.push(d);
      });

      act._sortedOrder = sortedItems.map(it => it.value);
    }

    dndArea.appendChild(dropCol);
    dndArea.appendChild(dragCol);
    activityCard.appendChild(dndArea);

    const checkRow = document.createElement('div');
    checkRow.className = 'check-row';
    const checkBtn = document.createElement('button');
    checkBtn.className = 'check-btn';
    checkBtn.textContent = 'Check My Answers ✅';
    checkRow.appendChild(checkBtn);
    activityCard.appendChild(checkRow);

    totalSlots = dropTargets.length;
    placedCount = 0;

    let draggedEl = null;

    function attachDragEvents(el) {
      el.addEventListener('dragstart', (e) => {
        draggedEl = el;
        el.classList.add('dragging');
        e.dataTransfer.setData('text/plain', el.dataset.dragId);
        e.dataTransfer.effectAllowed = 'move';
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
      });

      // touch support
      el.addEventListener('touchstart', function(e) {
        if (el.classList.contains('used')) return;
        draggedEl = el;
        el.classList.add('dragging');
      }, {passive: true});
    }

    draggables.forEach(attachDragEvents);

    dropTargets.forEach(dt => {
      dt.addEventListener('dragover', (e) => {
        e.preventDefault();
        dt.classList.add('drag-over');
      });
      dt.addEventListener('dragleave', () => {
        dt.classList.remove('drag-over');
      });
      dt.addEventListener('drop', (e) => {
        e.preventDefault();
        dt.classList.remove('drag-over');
        handleDrop(dt);
      });

      // touch support: tap a drop target after picking a draggable
      dt.addEventListener('touchend', function(e) {
        if (draggedEl) {
          e.preventDefault();
          handleDrop(dt);
        }
      });
    });

    function handleDrop(dt) {
      if (!draggedEl) return;
      // If slot already filled, return previous item to pool
      const slotSpan = dt.querySelector('.drop-slot');
      const prevDragId = dt.dataset.filledDragId;
      if (prevDragId) {
        const prevEl = pool.querySelector('[data-drag-id="' + prevDragId + '"]');
        if (prevEl) {
          prevEl.classList.remove('used');
        }
        placedCount--;
      }

      slotSpan.textContent = draggedEl.textContent;
      dt.dataset.filledValue = draggedEl.dataset.value;
      dt.dataset.filledDragId = draggedEl.dataset.dragId;
      dt.classList.add('filled');
      dt.classList.remove('correct','wrong');
      draggedEl.classList.add('used');
      draggedEl.classList.remove('dragging');
      placedCount++;
      draggedEl = null;
    }

    checkBtn.addEventListener('click', () => {
      if (placedCount < totalSlots) {
        showTryAgain("Fill in every box first, then check your answers!");
        return;
      }
      let allCorrect = true;

      if (act.type === 'match') {
        dropTargets.forEach(dt => {
          const correct = dt.dataset.filledValue === dt.dataset.answer;
          dt.classList.toggle('correct', correct);
          dt.classList.toggle('wrong', !correct);
          if (!correct) allCorrect = false;
        });
      } else if (act.type === 'order') {
        dropTargets.forEach((dt, i) => {
          const correct = Number(dt.dataset.filledValue) === act._sortedOrder[i];
          dt.classList.toggle('correct', correct);
          dt.classList.toggle('wrong', !correct);
          if (!correct) allCorrect = false;
        });
      }

      if (allCorrect) {
        setTimeout(() => {
          if (index === activities.length - 1) {
            showCelebration();
          } else {
            showNextActivity(index);
          }
        }, 500);
      } else {
        setTimeout(() => {
          resetWrongOnes(dropTargets, draggables, pool);
          showTryAgain();
        }, 400);
      }
    });
  }

  function resetWrongOnes(dropTargets, draggables, pool) {
    dropTargets.forEach(dt => {
      if (dt.classList.contains('wrong')) {
        const dragId = dt.dataset.filledDragId;
        const el = pool.querySelector('[data-drag-id="' + dragId + '"]');
        if (el) el.classList.remove('used');
        dt.dataset.filledValue = '';
        dt.dataset.filledDragId = '';
        dt.classList.remove('filled','wrong');
        dt.querySelector('.drop-slot').textContent = '?';
        placedCount--;
      }
    });
  }

  function showTryAgain(customMsg) {
    document.getElementById('tryAgainMsg').textContent = customMsg || "Some answers need another look. Give it another shot!";
    tryAgainOverlay.classList.add('show');
  }

  document.getElementById('tryAgainBtn').addEventListener('click', () => {
    tryAgainOverlay.classList.remove('show');
  });

  function showNextActivity(completedIndex) {
    const nextAct = activities[completedIndex + 1];
    document.getElementById('nextTitle').textContent = "Awesome Job! 🎉";
    document.getElementById('nextMsg').textContent = "You unlocked: " + nextAct.title;
    nextOverlay.classList.add('show');
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    nextOverlay.classList.remove('show');
    currentActivityIndex++;
    updateProgress();
    renderActivity(currentActivityIndex);
  });

  /* ---------- Celebration ---------- */
  function showCelebration() {
    // mark last node done
    currentActivityIndex = activities.length; // beyond range so all nodes marked done next update
    for (let i = 1; i <= 3; i++) {
      const node = document.getElementById('node' + i);
      node.classList.add('done');
      node.classList.remove('active');
      node.textContent = '✓';
    }
    document.getElementById('line1').style.width = '100%';
    document.getElementById('line2').style.width = '100%';

    celebration.classList.add('show');
    launchConfetti();
  }

  function launchConfetti() {
    // clear old confetti
    const olds = celebration.querySelectorAll('.confetti-piece');
    olds.forEach(o => o.remove());

    const colors = ['#ff6ec7','#ffd93d','#4bff9f','#4dc6ff','#b164f7','#ff9f4d','#ffffff'];
    const count = 90;
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      const size = 6 + Math.random() * 10;
      piece.style.width = size + 'px';
      piece.style.height = (size * (0.5 + Math.random())) + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.left = Math.random() * 100 + '%';
      piece.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      piece.style.animationDelay = (Math.random() * 2) + 's';
      piece.style.opacity = String(0.8 + Math.random() * 0.2);
      celebration.appendChild(piece);
    }
  }

  document.getElementById('playAgainBtn').addEventListener('click', () => {
    celebration.classList.remove('show');
    currentActivityIndex = 0;
    updateProgress();
    renderActivity(0);
  });

  /* ---------- Init ---------- */
  updateProgress();
  renderActivity(0);

})();
</script>

</body>
</html>
