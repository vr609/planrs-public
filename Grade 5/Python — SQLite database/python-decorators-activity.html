<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decorator Playground</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --violet-1:#2b0a4e;
    --violet-2:#4b1487;
    --violet-3:#7b2ff7;
    --violet-4:#b46bff;
    --pink:#ff6bcb;
    --yellow:#ffd93d;
    --cyan:#3de3ff;
    --green:#5cf29a;
    --orange:#ff9f4d;
    --text:#fbeaff;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Trebuchet MS','Comic Sans MS',Verdana,sans-serif;
    overflow-x:hidden;
    background:linear-gradient(135deg,var(--violet-1),var(--violet-2) 40%,var(--violet-3) 75%,var(--pink));
    background-size:400% 400%;
    animation:bgShift 16s ease infinite;
    color:var(--text);
    min-height:100vh;
  }

  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* floating background blobs */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(6px);
    opacity:.35;
    z-index:0;
    animation:float 12s ease-in-out infinite;
  }
  .blob1{ width:180px;height:180px; background:var(--yellow); top:8%; left:6%; animation-duration:14s;}
  .blob2{ width:130px;height:130px; background:var(--cyan); top:70%; left:80%; animation-duration:10s;}
  .blob3{ width:100px;height:100px; background:var(--green); top:15%; left:82%; animation-duration:11s;}
  .blob4{ width:150px;height:150px; background:var(--orange); top:78%; left:10%; animation-duration:13s;}
  .blob5{ width:90px;height:90px; background:var(--pink); top:45%; left:48%; animation-duration:9s;}

  @keyframes float{
    0%,100%{ transform:translateY(0) translateX(0) scale(1); }
    33%{ transform:translateY(-30px) translateX(20px) scale(1.1); }
    66%{ transform:translateY(20px) translateX(-25px) scale(0.9); }
  }

  /* moving cartoon characters */
  .critter{
    position:fixed;
    font-size:2.4rem;
    z-index:0;
    pointer-events:none;
    animation:drift linear infinite;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.35));
  }
  @keyframes drift{
    0%{ transform:translateX(-10vw) translateY(0) rotate(0deg); }
    50%{ transform:translateX(50vw) translateY(-40px) rotate(15deg); }
    100%{ transform:translateX(110vw) translateY(0) rotate(0deg); }
  }
  .critter.slow{ animation-duration:28s; }
  .critter.med{ animation-duration:20s; }
  .critter.fast{ animation-duration:14s; }

  .wrap{
    position:relative;
    z-index:2;
    max-width:900px;
    margin:0 auto;
    padding:28px 18px 80px;
  }

  header{
    text-align:center;
    margin-bottom:18px;
    animation:popIn .7s ease;
  }

  header h1{
    font-size:2.3rem;
    margin:0 0 6px;
    background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--green));
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:rainbowText 6s linear infinite;
    text-shadow:0 4px 18px rgba(0,0,0,.25);
  }
  @keyframes rainbowText{
    0%{background-position:0% center;}
    100%{background-position:300% center;}
  }

  header p{
    margin:0;
    font-size:1.05rem;
    color:var(--violet-4);
    background:rgba(255,255,255,.08);
    display:inline-block;
    padding:6px 18px;
    border-radius:20px;
  }

  /* progress dots */
  .progress{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:22px 0 10px;
  }
  .dot{
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;
    background:rgba(255,255,255,.12);
    border:3px solid rgba(255,255,255,.25);
    color:var(--text);
    transition:all .4s ease;
    position:relative;
  }
  .dot.active{
    background:linear-gradient(135deg,var(--pink),var(--violet-4));
    border-color:var(--yellow);
    transform:scale(1.15);
    box-shadow:0 0 20px var(--pink);
    animation:pulseDot 1.4s ease-in-out infinite;
  }
  .dot.done{
    background:linear-gradient(135deg,var(--green),var(--cyan));
    border-color:var(--green);
  }
  .dot.locked{ opacity:.4; }
  @keyframes pulseDot{
    0%,100%{ box-shadow:0 0 12px var(--pink); }
    50%{ box-shadow:0 0 26px var(--pink); }
  }
  .progress-line{
    position:absolute;
    top:22px; left:0; right:0;
    height:4px;
    z-index:-1;
  }

  /* card */
  .card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border:2px solid rgba(255,255,255,.18);
    border-radius:26px;
    padding:26px 22px 34px;
    box-shadow:0 20px 50px rgba(20,0,50,.4);
    animation:cardIn .5s ease;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(30px) scale(.96); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .card h2{
    margin-top:0;
    font-size:1.5rem;
    color:var(--yellow);
    text-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .card .instructions{
    color:var(--text);
    opacity:.9;
    line-height:1.5;
    margin-bottom:20px;
  }
  .card code{
    background:rgba(0,0,0,.35);
    padding:2px 8px;
    border-radius:6px;
    color:var(--cyan);
    font-family:'Consolas','Courier New',monospace;
  }

  /* code block with blanks */
  .code-block{
    background:linear-gradient(160deg,#1a0533,#2c0a52);
    border-radius:18px;
    padding:20px;
    font-family:'Consolas','Courier New',monospace;
    font-size:1.05rem;
    line-height:2.1;
    color:#e6d9ff;
    border:2px dashed rgba(255,255,255,.25);
    overflow-x:auto;
    white-space:pre-wrap;
    margin-bottom:22px;
    box-shadow:inset 0 0 30px rgba(123,47,247,.3);
  }
  .code-block .keyword{ color:var(--cyan); }
  .code-block .comment{ color:#9a86c9; font-style:italic; }
  .code-block .strdef{ color:var(--green); }

  .blank{
    display:inline-flex;
    min-width:120px;
    min-height:38px;
    vertical-align:middle;
    background:rgba(255,255,255,.1);
    border:3px dashed var(--violet-4);
    border-radius:10px;
    margin:0 4px;
    align-items:center;
    justify-content:center;
    transition:all .25s ease;
  }
  .blank.over{
    background:rgba(255,217,61,.25);
    border-color:var(--yellow);
    transform:scale(1.06);
  }
  .blank.filled{
    border-style:solid;
    border-color:var(--green);
  }
  .blank.wrong-flash{
    animation:shakeWrong .5s;
    border-color:#ff5d7a;
  }
  @keyframes shakeWrong{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }

  /* draggable options */
  .options{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-top:14px;
  }
  .option{
    padding:10px 18px;
    border-radius:14px;
    font-family:'Consolas','Courier New',monospace;
    font-weight:bold;
    font-size:1rem;
    cursor:grab;
    color:#2b0a4e;
    user-select:none;
    box-shadow:0 6px 0 rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.25);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:bobble 2.6s ease-in-out infinite;
  }
  .option:nth-child(1){ background:var(--yellow); animation-delay:0s;}
  .option:nth-child(2){ background:var(--cyan); animation-delay:.2s;}
  .option:nth-child(3){ background:var(--green); animation-delay:.4s;}
  .option:nth-child(4){ background:var(--pink); animation-delay:.6s;}
  .option:nth-child(5){ background:var(--orange); animation-delay:.8s;}
  .option:nth-child(6){ background:#c6f4ff; animation-delay:1s;}

  @keyframes bobble{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .option:active{ cursor:grabbing; }
  .option.dragging{
    opacity:.6;
    transform:scale(1.1) rotate(-4deg);
    animation:none;
  }
  .option.placed{
    opacity:0;
    pointer-events:none;
    position:absolute;
  }
  .option.used-in-blank{
    padding:8px 14px;
    box-shadow:none;
    animation:none;
    cursor:grab;
  }

  .check-row{
    text-align:center;
    margin-top:24px;
  }
  .btn{
    border:none;
    padding:14px 34px;
    font-size:1.1rem;
    font-weight:bold;
    border-radius:30px;
    cursor:pointer;
    color:#2b0a4e;
    background:linear-gradient(135deg,var(--yellow),var(--orange));
    box-shadow:0 8px 0 rgba(0,0,0,.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-3px); }
  .btn:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.25); }
  .btn:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
  }
  .btn.secondary{
    background:linear-gradient(135deg,var(--cyan),var(--green));
  }

  .feedback-msg{
    text-align:center;
    margin-top:16px;
    font-weight:bold;
    min-height:26px;
    font-size:1.05rem;
  }
  .feedback-msg.good{ color:var(--green); }
  .feedback-msg.bad{ color:#ff8fa8; }

  /* popup overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,0,45,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .overlay.show{
    opacity:1;
    pointer-events:all;
  }

  .popup{
    border-radius:26px;
    padding:34px 40px;
    text-align:center;
    max-width:380px;
    transform:scale(.6) rotate(-8deg);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .overlay.show .popup{ transform:scale(1) rotate(0deg); }

  .popup.retry{
    background:linear-gradient(145deg,#ff5d7a,#ff9f4d);
  }
  .popup.next{
    background:linear-gradient(145deg,var(--green),var(--cyan));
  }
  .popup h3{
    font-size:1.7rem;
    margin:6px 0 10px;
    color:#2b0a4e;
  }
  .popup p{
    color:#2b0a4e;
    font-weight:600;
    margin:0 0 18px;
  }
  .popup .emoji{
    font-size:3.4rem;
    display:block;
    animation:emojiBounce .8s ease-in-out infinite;
  }
  @keyframes emojiBounce{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-14px) rotate(8deg); }
  }
  .popup .btn{
    background:#2b0a4e;
    color:var(--yellow);
    box-shadow:0 6px 0 rgba(0,0,0,.35);
  }

  /* celebration screen */
  #celebration{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    overflow:hidden;
    background:linear-gradient(135deg,var(--violet-1),var(--violet-3),var(--pink),var(--violet-2));
    background-size:400% 400%;
    animation:bgShift 8s ease infinite;
  }
  #celebration.show{ display:flex; }

  #celebration h1{
    font-size:3rem;
    margin:0;
    background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--green),var(--yellow));
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:rainbowText 4s linear infinite, popIn .6s ease;
  }
  #celebration .sub{
    font-size:1.3rem;
    color:var(--text);
    margin:10px 0 30px;
    animation:popIn .8s ease;
  }
  #celebration .stars{
    font-size:2.6rem;
    margin-bottom:20px;
    animation:popIn 1s ease;
  }
  #celebration .stars span{
    display:inline-block;
    animation:starSpin 1.6s ease-in-out infinite;
  }
  #celebration .stars span:nth-child(2){ animation-delay:.2s; }
  #celebration .stars span:nth-child(3){ animation-delay:.4s; }
  @keyframes starSpin{
    0%,100%{ transform:rotate(0deg) scale(1); }
    50%{ transform:rotate(20deg) scale(1.3); }
  }

  @keyframes popIn{
    from{ opacity:0; transform:scale(.7); }
    to{ opacity:1; transform:scale(1); }
  }

  .confetti-piece{
    position:fixed;
    top:-20px;
    z-index:99;
    border-radius:2px;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{
      transform:translateY(110vh) rotate(720deg);
      opacity:.9;
    }
  }

  footer{
    text-align:center;
    margin-top:26px;
    font-size:.85rem;
    color:rgba(255,255,255,.5);
  }

  @media (max-width:600px){
    header h1{ font-size:1.7rem; }
    .card{ padding:18px 14px 26px; }
    .code-block{ font-size:.92rem; }
    .blank{ min-width:90px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
  <div class="blob blob5"></div>

  <div class="critter slow" style="top:12%;">🦄</div>
  <div class="critter med" style="top:55%;">🐙</div>
  <div class="critter fast" style="top:80%;">🚀</div>
  <div class="critter slow" style="top:30%; animation-delay:5s;">🎈</div>
  <div class="critter med" style="top:65%; animation-delay:3s;">🦋</div>

  <div class="wrap">
    <header>
      <h1>🎀 The Decorator Playground 🎀</h1>
    </header>

    <div class="progress">
      <div class="dot active" id="dot-1">1</div>
      <div class="dot locked" id="dot-2">2</div>
      <div class="dot locked" id="dot-3">3</div>
    </div>

    <div class="card" id="activity-card">
      <!-- activity content injected here -->
    </div>

    <footer>Drag • Drop • Decorate ✨</footer>
  </div>

  <!-- Retry popup -->
  <div class="overlay" id="retry-overlay">
    <div class="popup retry">
      <span class="emoji">🤔</span>
      <h3>Oops, Try Again!</h3>
      <p id="retry-msg">Something's not quite right. Give it another go!</p>
      <button class="btn" onclick="closeRetry()">Try Again</button>
    </div>
  </div>

  <!-- Next activity popup -->
  <div class="overlay" id="next-overlay">
    <div class="popup next">
      <span class="emoji">🎉</span>
      <h3>Awesome Work!</h3>
      <p id="next-msg">You cracked it! Ready for the next challenge?</p>
      <button class="btn" onclick="goToNextActivity()">Next Activity ➜</button>
    </div>
  </div>

  <!-- Celebration screen -->
  <div id="celebration">
    <div class="stars"><span>⭐</span><span>🌟</span><span>⭐</span></div>
    <h1>YOU'RE A DECORATOR WIZARD!</h1>
    <div class="sub">All 3 activities completed with sparkling success! 🎊</div>
    <button class="btn secondary" onclick="resetAll()">🔄 Play Again</button>
  </div>

<script>
/* ================= DATA ================= */

// Each activity defines a code template with blank slots {{n}}
// and a bank of draggable options (including distractors).
const activities = [
  {
    title: "Activity 1 — Build a Basic Decorator",
    instructions: "A decorator wraps a function to add extra behavior. Drag the correct pieces to finish this simple decorator that prints a message before and after calling the function.",
    codeHTML:
`<span class="keyword">def</span> my_decorator(<span class="strdef">func</span>):
    <span class="keyword">def</span> wrapper():
        {{1}}("Before the function runs")
        {{2}}()
        print("After the function runs")
    {{3}} wrapper

<span class="comment"># Applying the decorator</span>
{{4}}
<span class="keyword">def</span> say_hello():
    print("Hello!")

say_hello()`,
    blanks: {
      1: "print",
      2: "func",
      3: "return",
      4: "@my_decorator"
    },
    options: ["print", "func", "return", "@my_decorator", "yield", "func()"]
  },
  {
    title: "Activity 2 — Pass Arguments Through",
    instructions: "Real functions often take arguments. Drag the pieces so the wrapper accepts and forwards any arguments to the original function using *args and **kwargs.",
    codeHTML:
`<span class="keyword">def</span> shout(func):
    <span class="keyword">def</span> wrapper({{1}}, {{2}}):
        result = func({{3}}, {{4}})
        <span class="keyword">return</span> result.upper()
    return wrapper

{{5}}
<span class="keyword">def</span> greet(name):
    return "hello " + name

print(greet("mira"))`,
    blanks: {
      1: "*args",
      2: "**kwargs",
      3: "*args",
      4: "**kwargs",
      5: "@shout"
    },
    options: ["*args", "**kwargs", "@shout", "args", "kwargs", "*kwargs"]
  },
  {
    title: "Activity 3 — Decorator with Parameters",
    instructions: "Decorators can accept their own arguments using an extra outer function. Drag the pieces to complete a decorator that repeats a function call a given number of times.",
    codeHTML:
`<span class="keyword">def</span> repeat(times):
    <span class="keyword">def</span> {{1}}(func):
        <span class="keyword">def</span> wrapper(*args, **kwargs):
            <span class="keyword">for</span> _ <span class="keyword">in</span> range({{2}}):
                func(*args, **kwargs)
        <span class="keyword">return</span> wrapper
    {{3}} decorator

{{4}}(times=3)
<span class="keyword">def</span> wave():
    print("👋")

wave()`,
    blanks: {
      1: "decorator",
      2: "times",
      3: "return",
      4: "@repeat"
    },
    options: ["decorator", "times", "return", "@repeat", "func", "@decorator"]
  }
];

/* ================= STATE ================= */
let currentActivity = 0;
let filledBlanks = {};   // blankId -> value currently placed
let draggedOption = null;

/* ================= RENDER ================= */

function renderActivity(index){
  filledBlanks = {};
  const data = activities[index];
  const card = document.getElementById('activity-card');

  // build code html by replacing {{n}} with blank spans
  let codeHtml = data.codeHTML.replace(/\{\{(\d+)\}\}/g, (m, n) => {
    return `<span class="blank" data-blank="${n}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,${n})"></span>`;
  });

  // shuffle options
  const shuffled = [...data.options].sort(() => Math.random() - 0.5);
  const optionsHtml = shuffled.map(opt =>
    `<div class="option" draggable="true" data-value="${escapeHtml(opt)}"
         ondragstart="onDragStart(event)" ondragend="onDragEnd(event)">${escapeHtml(opt)}</div>`
  ).join('');

  card.innerHTML = `
    <h2>${data.title}</h2>
    <p class="instructions">${data.instructions}</p>
    <div class="code-block">${codeHtml}</div>
    <div class="options" id="options-bank">${optionsHtml}</div>
    <div class="check-row">
      <button class="btn" id="check-btn" onclick="checkAnswers()">Check My Code ✅</button>
    </div>
    <div class="feedback-msg" id="feedback"></div>
  `;

  updateProgressDots();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateProgressDots(){
  for(let i=1;i<=3;i++){
    const dot = document.getElementById('dot-'+i);
    dot.classList.remove('active','done','locked');
    if(i-1 < currentActivity) dot.classList.add('done');
    else if(i-1 === currentActivity) dot.classList.add('active');
    else dot.classList.add('locked');
  }
}

/* ================= DRAG & DROP ================= */

function onDragStart(e){
  draggedOption = e.target;
  e.dataTransfer.setData('text/plain', e.target.dataset.value);
  setTimeout(() => e.target.classList.add('dragging'), 0);
}

function onDragEnd(e){
  e.target.classList.remove('dragging');
}

function onDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('over');
}

function onDragLeave(e){
  e.currentTarget.classList.remove('over');
}

function onDrop(e, blankId){
  e.preventDefault();
  const blankEl = e.currentTarget;
  blankEl.classList.remove('over');

  if(!draggedOption) return;
  const value = draggedOption.dataset.value;

  // If blank already has something, return previous option to bank visually
  if(blankEl.dataset.filledWith !== undefined && blankEl.firstChild){
    const prevVal = blankEl.dataset.filledWith;
    restoreOptionToBank(prevVal, blankEl.dataset.optionId);
  }

  // place value into blank
  blankEl.innerHTML = '';
  const placedSpan = document.createElement('span');
  placedSpan.textContent = value;
  placedSpan.className = 'option used-in-blank';
  placedSpan.draggable = true;
  placedSpan.dataset.value = value;
  placedSpan.style.margin = '0';
  placedSpan.addEventListener('dragstart', onDragStart);
  placedSpan.addEventListener('dragend', onDragEnd);
  blankEl.appendChild(placedSpan);
  blankEl.classList.add('filled');
  blankEl.dataset.filledWith = value;

  filledBlanks[blankId] = value;

  // remove the original dragged option element from bank (hide it)
  draggedOption.classList.add('placed');
  draggedOption.style.display = 'none';
  blankEl.dataset.optionId = draggedOption.dataset.optId || '';

  draggedOption = null;
}

function restoreOptionToBank(value, optId){
  // find a hidden option in the bank matching this value and show it again
  const bank = document.getElementById('options-bank');
  const hidden = Array.from(bank.children).find(o => o.classList.contains('placed') && o.dataset.value === value);
  if(hidden){
    hidden.classList.remove('placed');
    hidden.style.display = '';
  }
}

// Allow dropping a filled blank's content back onto the bank (optional nicety)
document.addEventListener('dragover', function(e){
  if(e.target && e.target.id === 'options-bank'){
    e.preventDefault();
  }
});

/* ================= CHECK ANSWERS ================= */

function checkAnswers(){
  const data = activities[currentActivity];
  const expected = data.blanks;
  const blankEls = document.querySelectorAll('.blank');
  let allCorrect = true;
  let allFilled = true;

  blankEls.forEach(el => {
    const id = el.dataset.blank;
    const filledVal = filledBlanks[id];
    if(filledVal === undefined){
      allFilled = false;
      return;
    }
    if(filledVal !== expected[id]){
      allCorrect = false;
      el.classList.add('wrong-flash');
      setTimeout(() => el.classList.remove('wrong-flash'), 500);
    }
  });

  const feedback = document.getElementById('feedback');

  if(!allFilled){
    feedback.textContent = "Fill in every blank before checking! 🧩";
    feedback.className = "feedback-msg bad";
    return;
  }

  if(allCorrect){
    feedback.textContent = "Correct! Every piece fits perfectly! 🎯";
    feedback.className = "feedback-msg good";
    document.getElementById('check-btn').disabled = true;
    setTimeout(() => showNextPopup(), 500);
  } else {
    feedback.textContent = "Not quite — some pieces are in the wrong spot.";
    feedback.className = "feedback-msg bad";
    setTimeout(() => showRetryPopup(), 400);
  }
}

/* ================= POPUPS ================= */

function showRetryPopup(){
  document.getElementById('retry-overlay').classList.add('show');
}
function closeRetry(){
  document.getElementById('retry-overlay').classList.remove('show');
}

function showNextPopup(){
  const isLast = currentActivity === activities.length - 1;
  const msg = document.getElementById('next-msg');
  const nextBtn = document.querySelector('#next-overlay .btn');
  if(isLast){
    msg.textContent = "You finished the final activity! Get ready to celebrate!";
    nextBtn.textContent = "See My Celebration 🎊";
  } else {
    msg.textContent = "You cracked it! Ready for the next challenge?";
    nextBtn.textContent = "Next Activity ➜";
  }
  document.getElementById('next-overlay').classList.add('show');
}

function goToNextActivity(){
  document.getElementById('next-overlay').classList.remove('show');
  currentActivity++;
  if(currentActivity >= activities.length){
    showCelebration();
  } else {
    renderActivity(currentActivity);
  }
}

/* ================= CELEBRATION ================= */

function showCelebration(){
  document.getElementById('celebration').classList.add('show');
  launchConfetti();
}

const confettiColors = ['#ffd93d','#ff6bcb','#3de3ff','#5cf29a','#ff9f4d','#b46bff','#ffffff00'];
function launchConfetti(){
  const count = 140;
  for(let i=0;i<count;i++){
    setTimeout(() => spawnConfettiPiece(), i * 25);
  }
}
function spawnConfettiPiece(){
  const piece = document.createElement('div');
  piece.className = 'confetti-piece';
  const size = 6 + Math.random()*8;
  piece.style.width = size + 'px';
  piece.style.height = (size * (0.4+Math.random())) + 'px';
  piece.style.left = Math.random()*100 + 'vw';
  const color = confettiColors[Math.floor(Math.random()*(confettiColors.length-1))];
  piece.style.background = color;
  const duration = 3 + Math.random()*2.5;
  piece.style.animationDuration = duration + 's';
  piece.style.opacity = 0.85;
  document.body.appendChild(piece);
  setTimeout(() => piece.remove(), duration*1000 + 200);
}

// keep spawning a light stream of confetti while celebration is shown
let confettiInterval = null;
function startConfettiLoop(){
  confettiInterval = setInterval(() => {
    if(document.getElementById('celebration').classList.contains('show')){
      spawnConfettiPiece();
    }
  }, 180);
}
startConfettiLoop();

/* ================= RESET ================= */

function resetAll(){
  document.getElementById('celebration').classList.remove('show');
  currentActivity = 0;
  filledBlanks = {};
  renderActivity(0);
}

/* ================= INIT ================= */
renderActivity(0);
</script>
