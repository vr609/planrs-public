<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Python — Implement a Linked List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Mukta:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --night-deep:#160b28;
    --night-mid:#301640;
    --night-glow:#5a2560;
    --dusk:#7a2a4a;
    --gold:#e8b64a;
    --gold-deep:#c8902e;
    --marigold:#ff9d3d;
    --lamp:#ffcf6b;
    --temple-stone:#caa876;
    --temple-dark:#2c1730;
    --lotus-pink:#ff7fa8;
    --lotus-white:#fff0e6;
    --peacock-teal:#1f9e92;
    --peacock-blue:#2a6f9e;
    --panel:#2a1533;
    --panel-light:#402048;
    --ink:#fff6e9;
    --ink-dim:#dcc1a6;
    --correct:#8bd17c;
    --wrong:#ff7a7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    font-family:'Mukta',sans-serif; color:var(--ink);
    background:#0d0616;
    touch-action:none;
    user-select:none;
  }
  h1,h2,h3,.display{font-family:'Cinzel',serif;}

  /* ================= BACKGROUND SCENE ================= */
  #bg{position:fixed; inset:0; overflow:hidden; z-index:0;}
  .sky{position:absolute; inset:0;
    background:
      radial-gradient(ellipse 55% 35% at 50% 12%, rgba(255,207,107,.22) 0%, transparent 60%),
      linear-gradient(180deg, var(--night-deep) 0%, var(--night-mid) 40%, var(--night-glow) 70%, var(--dusk) 100%);
  }
  .star{position:absolute; background:#fff; border-radius:50%; opacity:.7;
    animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:1;}}

  .cloud{position:absolute; opacity:.28; filter:blur(.4px);
    background:linear-gradient(90deg, rgba(255,207,107,.4), rgba(255,159,168,.25));
    border-radius:50px;
    animation:driftCloud linear infinite;}
  @keyframes driftCloud{0%{transform:translateX(-8vw);} 100%{transform:translateX(10vw);}}

  .moon{position:absolute; top:7%; right:12%; width:min(6.5vw,54px); height:min(6.5vw,54px); border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fffbe8, #ffdf9a 60%, #e8b64a 100%);
    box-shadow:0 0 46px 12px rgba(232,182,74,.4);
    animation:glow 5s ease-in-out infinite alternate;}
  @keyframes glow{from{box-shadow:0 0 32px 8px rgba(232,182,74,.3);} to{box-shadow:0 0 58px 16px rgba(232,182,74,.55);}}

  .temple-row{position:absolute; bottom:20%; left:0; width:100%; height:34%;}
  .temple{position:absolute; bottom:0; filter:brightness(.6);}
  .temple svg{width:100%; display:block;}

  .lamp{position:absolute; width:7px; height:9px; border-radius:50% 50% 40% 40%;
    background:radial-gradient(circle at 50% 30%, var(--lamp), #ff9d3d 70%, transparent 100%);
    box-shadow:0 0 10px 4px rgba(255,207,107,.7);
    animation:flicker 1.6s ease-in-out infinite;}
  @keyframes flicker{0%,100%{opacity:.75; transform:scaleY(1);} 50%{opacity:1; transform:scaleY(1.15);}}

  .peacock{position:absolute; bottom:20%; width:min(7vw,58px); opacity:.9; filter:brightness(.65);
    transform-origin:50% 90%; animation:peacockSway 3.4s ease-in-out infinite;}
  .peacock svg{width:100%; display:block;}
  @keyframes peacockSway{0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.03) rotate(-2deg);}}

  .ground{position:absolute; bottom:0; left:0; width:100%; height:20%;
    background:linear-gradient(180deg, var(--temple-stone) 0%, #8a6a3f 100%);
    clip-path:polygon(0% 35%, 15% 45%, 32% 30%, 50% 42%, 68% 28%, 86% 40%, 100% 32%, 100% 100%, 0% 100%);}

  .elephant{position:absolute; bottom:2.5%; width:min(8vw,68px); opacity:.85; filter:brightness(.5) saturate(0);
    animation:walkAcross 36s linear infinite, elephBob .9s ease-in-out infinite;}
  .elephant svg{width:100%; display:block;}
  @keyframes walkAcross{0%{transform:translateX(-15vw) scaleX(1);} 48%{transform:translateX(112vw) scaleX(1);}
    50%{transform:translateX(112vw) scaleX(-1);} 98%{transform:translateX(-15vw) scaleX(-1);} 100%{transform:translateX(-15vw) scaleX(1);}}
  @keyframes elephBob{0%,100%{margin-bottom:0;} 50%{margin-bottom:3px;}}

  .petal{position:absolute; top:-5%; font-size:13px; opacity:.8;
    animation:petalFall linear infinite;}
  @keyframes petalFall{
    0%{transform:translate(0,0) rotate(0deg); opacity:0;}
    10%{opacity:.9;}
    100%{transform:translate(42px,115vh) rotate(320deg); opacity:0;}
  }

  /* ================= APP LAYOUT ================= */
  #app{position:relative; z-index:2; height:100vh; width:100vw; display:flex; flex-direction:column; padding:clamp(8px,1.4vh,16px) clamp(10px,2vw,26px);}
  header{display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; gap:10px;}
  .title-wrap{display:flex; flex-direction:column; gap:2px;}
  h1{margin:0; font-size:clamp(15px,2.2vh,25px); letter-spacing:.4px;
    color:var(--gold); text-shadow:0 0 18px rgba(232,182,74,.4);}
  .subtitle{font-size:clamp(9px,1.1vh,13px); color:var(--ink-dim); font-weight:600;}

  .progress{display:flex; gap:10px; align-items:center;}
  .dot{width:clamp(10px,1.6vh,16px); height:clamp(10px,1.6vh,16px); border-radius:50%;
    background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.28);
    transition:.35s;}
  .dot.active{background:var(--gold); border-color:var(--gold); box-shadow:0 0 12px rgba(232,182,74,.7); transform:scale(1.15);}
  .dot.done{background:var(--correct); border-color:var(--correct);}

  #stage{flex:1 1 auto; min-height:0; position:relative; margin-top:clamp(4px,1vh,10px);}
  .activity{position:absolute; inset:0; display:none; flex-direction:column; gap:8px;}
  .activity.active{display:flex;}

  .act-header{display:flex; justify-content:space-between; align-items:center; flex:0 0 auto;}
  .act-title{font-size:clamp(12px,1.7vh,18px); color:var(--ink); font-weight:700; display:flex; align-items:center; gap:8px;}
  .act-title .tag{font-family:'Cinzel'; padding:2px 10px; border-radius:20px; font-size:clamp(10px,1.3vh,13px);
    background:rgba(232,182,74,.16); border:1px solid rgba(232,182,74,.4); color:var(--gold);}
  .act-body{flex:1 1 auto; min-height:0; display:flex; gap:clamp(8px,1.4vw,18px);}

  button{font-family:'Mukta',sans-serif; font-weight:800; cursor:pointer; border:none; border-radius:12px;}
  .btn{padding:7px 16px; font-size:clamp(10px,1.3vh,13px); background:rgba(255,255,255,0.1);
    color:var(--ink); border:1px solid rgba(255,255,255,0.22); transition:.2s;}
  .btn:hover{background:rgba(255,255,255,0.18);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#2a1706; border:none; box-shadow:0 3px 10px rgba(200,144,46,.4);}
  .btn.gold:hover{filter:brightness(1.08);}

  /* ============ DRAGGABLE base ============ */
  .drag-pool{display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;}
  .chip{
    padding:7px 12px; border-radius:10px; font-size:clamp(9px,1.2vh,12.5px); font-weight:800;
    cursor:grab; touch-action:none; position:relative; z-index:5; white-space:nowrap;
    box-shadow:0 3px 8px rgba(0,0,0,.4); transition:box-shadow .15s, transform .1s;
    border:2px solid rgba(255,255,255,.5);
  }
  .chip:active{cursor:grabbing;}
  .chip.dragging{z-index:999; box-shadow:0 10px 24px rgba(0,0,0,.6); transform:scale(1.06);}
  .chip.placed{cursor:default; opacity:.55; filter:grayscale(.3);}
  .chip.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  .slot{
    border:2px dashed rgba(255,255,255,0.32); border-radius:10px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(8px,1.05vh,11.5px); color:var(--ink-dim); font-weight:700; padding:4px;
    transition:.2s; position:relative;
  }
  .slot.over{border-color:var(--gold); background:rgba(232,182,74,.14);}
  .slot.correct{border-style:solid; border-color:var(--correct); background:rgba(139,209,124,.16); color:var(--correct);}
  .slot.wrong-flash{border-color:var(--wrong); background:rgba(255,122,122,.16);}

  /* ============ MODAL ============ */
  #modalOverlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(48,22,64,.8), rgba(13,6,22,.94));
    backdrop-filter:blur(3px);}
  #modalOverlay.show{display:flex;}
  .modal-box{
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid rgba(232,182,74,.4); border-radius:20px;
    padding:clamp(16px,3vh,30px) clamp(18px,3.5vw,36px); max-width:min(560px,88vw);
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:popIn .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn{0%{transform:scale(.7); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .modal-box h2{margin:0 0 8px; color:var(--gold); font-size:clamp(17px,2.6vh,26px);}
  .modal-box p{margin:0 0 16px; font-size:clamp(11px,1.6vh,15px); color:var(--ink-dim); line-height:1.5;}
  .modal-emoji{font-size:clamp(30px,5vh,52px); margin-bottom:6px;}

  /* ============ ACTIVITY 1 : Connect the Node Chain ============ */
  #a1-diagram{flex:1 1 66%; position:relative; background:radial-gradient(circle at 50% 50%, rgba(232,182,74,.08), transparent 70%);
    border-radius:16px; border:1px solid rgba(232,182,74,.22); overflow:hidden;}
  #a1-svg-wrap{position:absolute; inset:0;}
  .a1-slot{position:absolute; width:16%; min-width:80px; height:26%; min-height:56px; top:37%;}
  .a1-pool{flex:1 1 34%; display:flex; flex-direction:column; justify-content:center; gap:8px;}
  .chip.c1{background:#c8902e; color:#1c1000; border-color:#fff;}

  /* ============ ACTIVITY 2 : Temple Steps Sequence ============ */
  #a2-steps{flex:1 1 auto; position:relative; display:flex; align-items:flex-end; justify-content:space-around;
    padding:0 1%;
    background:linear-gradient(180deg, transparent 55%, rgba(202,168,118,.14) 100%);
    border-radius:16px; border:1px solid rgba(202,168,118,.3);}
  .step-col{display:flex; flex-direction:column-reverse; align-items:center; gap:6px; flex:1; max-width:15%;}
  .step-num{font-family:'Cinzel'; color:var(--gold); font-size:clamp(10px,1.4vh,14px);}
  .lotuspad{
    width:100%; aspect-ratio:1.4/1; border-radius:50% 50% 40% 40%/60% 60% 40% 40%;
    background:linear-gradient(160deg,#3a2440,#25162c);
    border:2px dashed rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(7.5px,.95vh,10.5px); font-weight:700; color:var(--ink-dim); padding:4px;
  }
  .lotuspad.correct{border-style:solid; border-color:var(--correct); background:linear-gradient(160deg,#2f4a2c,#1e321e); color:var(--correct);}
  .lotuspad.over{border-color:var(--gold);}
  #a2-pool{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding-top:6px;}
  .petalcard{
    padding:8px 12px; border-radius:6px 18px 6px 18px; font-size:clamp(9px,1.1vh,12px); font-weight:800;
    background:#d0477a; border:2px solid #fff; color:#2a0414;
    cursor:grab; touch-action:none; box-shadow:0 3px 10px rgba(0,0,0,.45);
  }

  /* ============ ACTIVITY 3 : Mandala Match ============ */
  #a3-mandala{flex:1 1 62%; display:grid; grid-template-columns:1fr 1fr 1fr 1fr; grid-auto-rows:1fr; gap:8px;}
  .medallion{
    border-radius:16px; border:2px dashed rgba(31,158,146,.5); background:rgba(31,158,146,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px; text-align:center;
    position:relative;
  }
  .medallion .lbl{font-family:'Cinzel'; color:var(--peacock-teal); font-size:clamp(9px,1.05vh,12px);}
  .medallion .val{font-size:clamp(7.5px,.9vh,10.5px); color:var(--ink-dim); font-weight:700;}
  .medallion.correct{border-style:solid; border-color:var(--correct); background:rgba(139,209,124,.14);}
  .medallion.over{border-color:var(--gold);}
  #a3-pool{flex:1 1 36%; display:flex; flex-direction:column; gap:7px; justify-content:center;}
  .feathercard{
    padding:9px 13px; border-radius:6px 20px 6px 20px; font-size:clamp(9px,1.0vh,11.5px); font-weight:800; text-align:center;
    background:#2a8f83; border:2px solid #fff; color:#04160f;
    cursor:grab; touch-action:none; box-shadow:0 4px 12px rgba(0,0,0,.5);
  }

  .floating-drag{position:fixed; z-index:1000; pointer-events:none;}

  @media (max-width:720px){
    .act-body{flex-direction:column;}
    #a1-diagram, .a1-pool{flex:1 1 50%;}
    #a3-mandala{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div id="bg">
  <div class="sky"></div>
  <div class="moon"></div>
  <div id="starsLayer"></div>
  <div id="cloudsLayer"></div>
  <div class="temple-row" id="templeRow"></div>
  <div class="peacock" style="left:5%;">
    <svg viewBox="0 0 70 80" fill="#1f9e92">
      <circle cx="35" cy="30" r="30" opacity=".18"/>
      <ellipse cx="35" cy="55" rx="9" ry="14" fill="#14544c"/>
      <circle cx="35" cy="30" r="8" fill="#14544c"/>
      <circle cx="35" cy="16" r="3" fill="#14544c"/>
      <circle cx="14" cy="12" r="5" fill="#1f9e92"/>
      <circle cx="28" cy="6" r="5" fill="#2a6f9e"/>
      <circle cx="45" cy="6" r="5" fill="#1f9e92"/>
      <circle cx="58" cy="12" r="5" fill="#2a6f9e"/>
      <circle cx="6" cy="24" r="5" fill="#2a6f9e"/>
      <circle cx="64" cy="24" r="5" fill="#1f9e92"/>
    </svg>
  </div>
  <div class="peacock" style="right:5%; animation-delay:-1.6s;">
    <svg viewBox="0 0 70 80" fill="#1f9e92">
      <circle cx="35" cy="30" r="30" opacity=".18"/>
      <ellipse cx="35" cy="55" rx="9" ry="14" fill="#14544c"/>
      <circle cx="35" cy="30" r="8" fill="#14544c"/>
      <circle cx="35" cy="16" r="3" fill="#14544c"/>
      <circle cx="14" cy="12" r="5" fill="#1f9e92"/>
      <circle cx="28" cy="6" r="5" fill="#2a6f9e"/>
      <circle cx="45" cy="6" r="5" fill="#1f9e92"/>
      <circle cx="58" cy="12" r="5" fill="#2a6f9e"/>
      <circle cx="6" cy="24" r="5" fill="#2a6f9e"/>
      <circle cx="64" cy="24" r="5" fill="#1f9e92"/>
    </svg>
  </div>
  <div class="ground"></div>
  <div class="elephant" style="animation-delay:-6s;">
    <svg viewBox="0 0 100 70" fill="#20101a">
      <ellipse cx="45" cy="42" rx="34" ry="22"/>
      <circle cx="78" cy="30" r="16"/>
      <path d="M88 32 q10 4 8 22 q-2 8 -8 4 q-4 -14 0 -26 Z"/>
      <rect x="24" y="58" width="8" height="12" rx="2"/>
      <rect x="42" y="58" width="8" height="12" rx="2"/>
      <rect x="58" y="58" width="8" height="12" rx="2"/>
      <ellipse cx="72" cy="20" rx="6" ry="8"/>
      <rect x="30" y="26" width="30" height="8" rx="3" fill="#e8b64a" opacity=".85"/>
    </svg>
  </div>
  <div id="petalsLayer"></div>
</div>

<div id="app">
  <header>
    <div class="title-wrap">
      <h1>🪷 Python — Implement a Linked List</h1>
      <div class="subtitle">Node · Head Pointer · Building the Chain, Bogie by Bogie</div>
    </div>
    <div class="progress">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>
  </header>

  <div id="stage">

    <!-- ACTIVITY 1 -->
    <section class="activity active" id="activity1">
      <div class="act-header">
        <div class="act-title"><span class="tag">Activity 1</span> Connect the Node Chain</div>
        <button class="btn" id="reset1">↺ Reset Activity</button>
      </div>
      <div class="act-body">
        <div id="a1-diagram">
          <div id="a1-svg-wrap"></div>
        </div>
        <div class="a1-pool">
          <div style="font-size:clamp(9px,1.1vh,12px); color:var(--ink-dim); margin-bottom:2px;">Drag each piece onto its spot in the chain, in order 🐘</div>
          <div class="drag-pool" id="a1-pool"></div>
        </div>
      </div>
    </section>

    <!-- ACTIVITY 2 -->
    <section class="activity" id="activity2">
      <div class="act-header">
        <div class="act-title"><span class="tag">Activity 2</span> Climb the Temple Steps — Workflow Order</div>
        <button class="btn" id="reset2">↺ Reset Activity</button>
      </div>
      <div class="act-body" style="flex-direction:column;">
        <div id="a2-steps"></div>
        <div id="a2-pool"></div>
      </div>
    </section>

    <!-- ACTIVITY 3 -->
    <section class="activity" id="activity3">
      <div class="act-header">
        <div class="act-title"><span class="tag">Activity 3</span> Mandala Match — Linked List Challenge</div>
        <button class="btn" id="reset3">↺ Reset Activity</button>
      </div>
      <div class="act-body">
        <div id="a3-mandala"></div>
        <div id="a3-pool"></div>
      </div>
    </section>

  </div>
</div>

<div id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
(function(){
"use strict";

/* ================= UTIL ================= */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function rand(min,max){return Math.random()*(max-min)+min;}
function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}

/* ================= BACKGROUND GENERATION ================= */
function buildStars(){
  const layer=document.getElementById('starsLayer');
  let html='';
  for(let i=0;i<60;i++){
    const size=rand(1,2.6);
    html+=`<div class="star" style="left:${rand(0,100)}%; top:${rand(0,60)}%; width:${size}px; height:${size}px; animation-delay:${rand(0,3)}s; animation-duration:${rand(2,5)}s;"></div>`;
  }
  layer.innerHTML=html;
}
function buildClouds(){
  const layer=document.getElementById('cloudsLayer');
  let html='';
  for(let i=0;i<5;i++){
    const w=rand(60,130), h=w*0.4;
    html+=`<div class="cloud" style="left:${rand(0,90)}%; top:${rand(4,22)}%; width:${w}px; height:${h}px; animation-duration:${rand(32,58)}s; animation-delay:${rand(-30,0)}s;"></div>`;
  }
  layer.innerHTML=html;
}
function buildTemples(){
  const row=document.getElementById('templeRow');
  const positions=[{left:'1%',w:'16%',h:'88%'},{left:'82%',w:'18%',h:'100%'},{left:'42%',w:'13%',h:'70%'}];
  let html='';
  positions.forEach((p,idx)=>{
    html+=`<div class="temple" style="left:${p.left}; width:${p.w}; height:${p.h};">
      <svg viewBox="0 0 60 110">
        <rect x="10" y="60" width="40" height="50" fill="#2c1730"/>
        <rect x="16" y="70" width="10" height="20" fill="#160b28"/>
        <rect x="34" y="70" width="10" height="20" fill="#160b28"/>
        <polygon points="30,10 46,50 14,50" fill="#3a1f42"/>
        <polygon points="30,22 40,50 20,50" fill="#4a2a52"/>
        <circle cx="30" cy="10" r="4" fill="#e8b64a"/>
        <rect x="4" y="60" width="52" height="4" fill="#e8b64a" opacity=".6"/>
      </svg>
      <div class="lamp" style="left:14%; bottom:52%; animation-delay:${rand(0,1.5)}s;"></div>
      <div class="lamp" style="left:80%; bottom:52%; animation-delay:${rand(0,1.5)}s;"></div>
    </div>`;
  });
  row.innerHTML=html;
}
function buildPetals(){
  const layer=document.getElementById('petalsLayer');
  const emojis=['🌸','🪷'];
  let html='';
  for(let i=0;i<9;i++){
    html+=`<div class="petal" style="left:${rand(0,96)}%; animation-duration:${rand(11,19)}s; animation-delay:${rand(0,15)}s;">${emojis[i%2]}</div>`;
  }
  layer.innerHTML=html;
}
buildStars(); buildClouds(); buildTemples(); buildPetals();

/* ================= GENERIC POINTER DRAG ENGINE ================= */
/*
  setupDrag(container, dropSelector, onDropCheck)
  container MUST enclose both the draggable pool AND the drop zones,
  since pointerdown is listened for on the container itself.
*/
function setupDrag(container, dropSelector, onDropCheck){
  let dragging=null, offsetX=0, offsetY=0, startParent=null, startNext=null;

  container.addEventListener('pointerdown', (e)=>{
    const item=e.target.closest('.draggable-item');
    if(!item || item.classList.contains('placed')) return;
    dragging=item;
    startParent=item.parentElement;
    startNext=item.nextSibling;
    const r=item.getBoundingClientRect();
    offsetX=e.clientX-r.left;
    offsetY=e.clientY-r.top;
    item.style.width=r.width+'px';
    document.body.appendChild(item);
    item.classList.add('dragging');
    item.style.position='fixed';
    item.style.left=r.left+'px';
    item.style.top=r.top+'px';
    item.setPointerCapture && item.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  window.addEventListener('pointermove',(e)=>{
    if(!dragging) return;
    dragging.style.left=(e.clientX-offsetX)+'px';
    dragging.style.top=(e.clientY-offsetY)+'px';
    document.querySelectorAll(dropSelector).forEach(z=>z.classList.remove('over'));
    dragging.style.visibility='hidden';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    dragging.style.visibility='visible';
    const zone=under && under.closest(dropSelector);
    if(zone) zone.classList.add('over');
  },{passive:true});

  window.addEventListener('pointerup',(e)=>{
    if(!dragging) return;
    const item=dragging;
    dragging=null;
    document.querySelectorAll(dropSelector).forEach(z=>z.classList.remove('over'));

    item.style.visibility='hidden';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    item.style.visibility='visible';
    const zone=under && under.closest(dropSelector);

    item.classList.remove('dragging');
    item.style.position='';
    item.style.left=''; item.style.top=''; item.style.width='';

    let handled=false;
    if(zone){
      handled=onDropCheck(zone,item);
    }
    if(!handled){
      if(startNext) startParent.insertBefore(item,startNext);
      else startParent.appendChild(item);
      item.classList.add('shake');
      setTimeout(()=>item.classList.remove('shake'),400);
    }
  });
}

/* ================= MODAL SYSTEM ================= */
const overlay=document.getElementById('modalOverlay');
const modalBox=document.getElementById('modalBox');
function showModal({emoji,title,text,buttonText,onButton}){
  modalBox.innerHTML='';
  if(emoji) modalBox.appendChild(el('div','modal-emoji',emoji));
  modalBox.appendChild(el('h2',null,title));
  modalBox.appendChild(el('p',null,text));
  const btnRow=el('div',null,'');
  btnRow.style.display='flex'; btnRow.style.gap='10px'; btnRow.style.justifyContent='center'; btnRow.style.flexWrap='wrap';
  const b=el('button','btn gold',buttonText);
  b.onclick=()=>{ hideModal(); onButton && onButton(); };
  btnRow.appendChild(b);
  modalBox.appendChild(btnRow);
  overlay.classList.add('show');
}
function hideModal(){ overlay.classList.remove('show'); }

/* ================= PROGRESS DOTS ================= */
function setProgress(activeIdx){
  for(let i=1;i<=3;i++){
    const d=document.getElementById('dot'+i);
    d.classList.remove('active','done');
    if(i<activeIdx) d.classList.add('done');
    else if(i===activeIdx) d.classList.add('active');
  }
}
function goToActivity(n){
  document.querySelectorAll('.activity').forEach(a=>a.classList.remove('active'));
  document.getElementById('activity'+n).classList.add('active');
  setProgress(n);
}

/* =========================================================
   ACTIVITY 1 — Connect the Node Chain
   ========================================================= */
const A1_ITEMS=[
  {id:'head',  label:'Head Pointer → first node'},
  {id:'node1', label:'Node: "Samosa"'},
  {id:'node2', label:'Node: "Jalebi"'},
  {id:'node3', label:'Node: "Dhokla"'},
  {id:'tail',  label:'.next → None (end of list)'},
];
const A1_POS={
  head:  {left:'2%'},
  node1: {left:'21%'},
  node2: {left:'40%'},
  node3: {left:'59%'},
  tail:  {left:'78%'},
};
let a1Correct=0;
function buildActivity1(){
  const wrap=document.getElementById('a1-svg-wrap');
  let arrows='';
  const xs=[10,29,48,67,86];
  for(let i=0;i<xs.length-1;i++){
    arrows+=`<line x1="${xs[i]+8}" y1="50" x2="${xs[i+1]-1}" y2="50" stroke="#e8b64a" stroke-width="0.6" stroke-dasharray="2,1.5" marker-end="url(#arrowhead)"/>`;
  }
  wrap.innerHTML=`
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%;">
      <defs>
        <marker id="arrowhead" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
          <path d="M0,0 L4,2 L0,4 Z" fill="#e8b64a"/>
        </marker>
      </defs>
      ${arrows}
    </svg>
  `;
  Object.entries(A1_POS).forEach(([id,pos])=>{
    const slot=el('div','slot a1-slot');
    slot.dataset.id=id;
    slot.style.left=pos.left;
    slot.textContent = id==='head' ? '⚙️ Head' : id==='tail' ? '🏁 None' : '🪷 Node';
    wrap.appendChild(slot);
  });

  const pool=document.getElementById('a1-pool');
  pool.innerHTML='';
  a1Correct=0;
  shuffle(A1_ITEMS).forEach(item=>{
    const chip=el('div','chip c1 draggable-item',item.label);
    chip.dataset.id=item.id;
    pool.appendChild(chip);
  });

  setupDrag(document.getElementById('activity1'), '.a1-slot', (zone,item)=>{
    if(zone.classList.contains('correct')) return false;
    if(zone.dataset.id===item.dataset.id){
      zone.classList.add('correct');
      zone.textContent='✓ '+item.textContent;
      item.classList.add('placed');
      zone.appendChild(item);
      a1Correct++;
      if(a1Correct===A1_ITEMS.length){
        setTimeout(()=>showModal({
          emoji:'🪷🐘',
          title:'The Chain is Connected!',
          text:'Head points to the first node, each node points to the next with .next, and the last node closes the chain with None — just like coaches hooked one after another.',
          buttonText:'Next: Workflow Order →',
          onButton:()=>goToActivity(2)
        }),500);
      }
      return true;
    } else {
      zone.classList.add('wrong-flash');
      setTimeout(()=>zone.classList.remove('wrong-flash'),400);
      return false;
    }
  });
}
document.getElementById('reset1').onclick=buildActivity1;

/* =========================================================
   ACTIVITY 2 — Climb the Temple Steps
   ========================================================= */
const A2_STEPS=[
  {id:1, label:'Create a Node'},
  {id:2, label:'Create the LinkedList'},
  {id:3, label:'Append a node'},
  {id:4, label:'Search for a node'},
  {id:5, label:'Delete a node'},
  {id:6, label:'Display the list with arrows'},
];
let a2Correct=0;
function buildActivity2(){
  const steps=document.getElementById('a2-steps');
  steps.innerHTML='';
  for(let i=1;i<=6;i++){
    const col=el('div','step-col');
    const pad=el('div','lotuspad');
    pad.dataset.id=i;
    pad.textContent='place here';
    col.appendChild(pad);
    col.appendChild(el('div','step-num','Step '+i));
    steps.appendChild(col);
  }
  const pool=document.getElementById('a2-pool');
  pool.innerHTML='';
  a2Correct=0;
  shuffle(A2_STEPS).forEach(step=>{
    const card=el('div','petalcard draggable-item',step.label);
    card.dataset.id=step.id;
    pool.appendChild(card);
  });

  setupDrag(document.getElementById('activity2'), '.lotuspad', (zone,item)=>{
    if(zone.classList.contains('correct')) return false;
    if(String(zone.dataset.id)===String(item.dataset.id)){
      zone.classList.add('correct');
      zone.textContent='';
      item.classList.add('placed');
      item.style.width='92%';
      zone.appendChild(item);
      a2Correct++;
      if(a2Correct===A2_STEPS.length){
        setTimeout(()=>showModal({
          emoji:'🌸🛕',
          title:'You Climbed the Steps!',
          text:'From creating a Node to displaying the full chain with arrows, the linked list workflow is complete — one step at a time, like climbing to a temple.',
          buttonText:'Next: Mandala Match →',
          onButton:()=>goToActivity(3)
        }),500);
      }
      return true;
    } else {
      zone.classList.add('wrong-flash');
      setTimeout(()=>zone.classList.remove('wrong-flash'),400);
      return false;
    }
  });
}
document.getElementById('reset2').onclick=buildActivity2;

/* =========================================================
   ACTIVITY 3 — Mandala Match
   ========================================================= */
const A3_ITEMS=[
  {id:'data',   term:'.data',                       value:'Stores the actual value inside the node'},
  {id:'next',   term:'.next',                        value:'Points to the next node in the chain'},
  {id:'head',   term:'Head Node',                    value:'The starting reference to the whole list'},
  {id:'append', term:'append',                       value:'Adds a new node to the end of the list'},
  {id:'delete', term:'delete',                        value:'Removes a node and re-links its neighbors'},
  {id:'search', term:'search',                        value:'Walks the chain to find a matching value'},
  {id:'arrows', term:'Printed Arrow Representation',  value:'[Samosa] -> [Jalebi] -> [Dhokla] -> None'},
];
let a3Correct=0;
function buildActivity3(){
  const panel=document.getElementById('a3-mandala');
  panel.innerHTML='';
  A3_ITEMS.forEach(it=>{
    const med=el('div','medallion');
    med.dataset.id=it.id;
    med.innerHTML=`<div class="lbl">${it.term}</div><div class="val">drop the matching card</div>`;
    panel.appendChild(med);
  });
  const pool=document.getElementById('a3-pool');
  pool.innerHTML='';
  a3Correct=0;
  shuffle(A3_ITEMS).forEach(it=>{
    const card=el('div','feathercard draggable-item',it.value);
    card.dataset.id=it.id;
    pool.appendChild(card);
  });

  setupDrag(document.getElementById('activity3'), '.medallion', (zone,item)=>{
    if(zone.classList.contains('correct')) return false;
    if(zone.dataset.id===item.dataset.id){
      zone.classList.add('correct');
      const lbl=zone.querySelector('.lbl').textContent;
      zone.innerHTML=`<div class="lbl">✓ ${lbl}</div>`;
      item.classList.add('placed');
      item.style.width='94%';
      zone.appendChild(item);
      a3Correct++;
      if(a3Correct===A3_ITEMS.length){
        setTimeout(()=>finishAll(),500);
      }
      return true;
    } else {
      zone.classList.add('wrong-flash');
      setTimeout(()=>zone.classList.remove('wrong-flash'),400);
      return false;
    }
  });
}
document.getElementById('reset3').onclick=buildActivity3;

/* ================= FINAL CELEBRATION ================= */
function finishAll(){
  setProgress(4);
  burstPetals();
  showModal({
    emoji:'🪷🛕🐘',
    title:'Mission Complete!',
    text:'You connected the node chain, climbed through the full workflow, and matched every piece of the puzzle — the linked list stands complete, like a chain of temple lamps glowing in a row!',
    buttonText:'🔁 Play Again',
    onButton:resetEverything
  });
}
function burstPetals(){
  const layer=document.getElementById('petalsLayer');
  const emojis=['🌸','🪷','✨'];
  for(let i=0;i<22;i++){
    const f=el('div','petal',emojis[i%3]);
    f.style.left=rand(10,90)+'%';
    f.style.top='-5%';
    f.style.animationDuration=rand(3,5)+'s';
    f.style.fontSize=rand(12,20)+'px';
    layer.appendChild(f);
    setTimeout(()=>f.remove(),6000);
  }
}

/* ================= RESET EVERYTHING ================= */
function resetEverything(){
  buildActivity1();
  buildActivity2();
  buildActivity3();
  goToActivity(1);
}

/* ================= INIT ================= */
function init(){
  buildActivity1();
  buildActivity2();
  buildActivity3();
  goToActivity(1);
  showModal({
    emoji:'🪷🛕',
    title:'Welcome, Chain Builder!',
    text:'A linked list is a chain of nodes, each one pointing to the next — like coaches hooked together on a train. Connect the chain, climb the workflow steps, and match every piece — all in three temple activities!',
    buttonText:'Start Activity 1 →'
  });
}
init();

})();
</script>
