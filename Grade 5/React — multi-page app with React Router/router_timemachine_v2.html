<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>React — Multi-Page App with React Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0714;
    --void-mid:#170f2c;
    --indigo:#2a1b4a;
    --violet:#3d2266;
    --brass:#d9a441;
    --brass-deep:#b5761f;
    --copper:#c9702f;
    --clockface:#f2e6c4;
    --electric:#8a63ff;
    --electric2:#4fd6ff;
    --lotus:#ff7fa8;
    --panel:#1c1230;
    --panel-light:#2c1e48;
    --ink:#f5eefe;
    --ink-dim:#c3b2e0;
    --correct:#8bd17c;
    --wrong:#ff7a7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0; overflow:hidden;
    font-family:'Rajdhani',sans-serif; color:var(--ink);
    background:#050310;
    touch-action:none;
    user-select:none;
  }
  h1,h2,h3,.display{font-family:'Orbitron',sans-serif;}

  /* ================= BACKGROUND SCENE ================= */
  #bg{position:fixed; inset:0; overflow:hidden; z-index:0;}
  .sky{position:absolute; inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 40%, rgba(138,99,255,.22) 0%, transparent 65%),
      radial-gradient(ellipse 40% 30% at 80% 15%, rgba(79,214,255,.16) 0%, transparent 60%),
      linear-gradient(180deg, var(--void) 0%, var(--void-mid) 45%, var(--indigo) 100%);
  }
  .spark{position:absolute; border-radius:50%; background:#fff; opacity:.7;
    animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12;} 50%{opacity:1;}}

  .particle{position:absolute; width:4px; height:4px; border-radius:50%;
    background:radial-gradient(circle, #cdb6ff, transparent 70%);
    box-shadow:0 0 8px 3px rgba(138,99,255,.6);
    animation:driftUp linear infinite;}
  @keyframes driftUp{
    0%{transform:translate(0,0); opacity:0;}
    12%{opacity:.9;}
    100%{transform:translate(14px,-100vh); opacity:0;}
  }

  .gear{position:absolute; opacity:.22; filter:brightness(.9);}
  .gear svg{width:100%; height:100%; display:block;}
  .gear.g1{animation:spinCW 26s linear infinite;}
  .gear.g2{animation:spinCCW 34s linear infinite;}
  .gear.g3{animation:spinCW 20s linear infinite;}
  @keyframes spinCW{to{transform:rotate(360deg);}}
  @keyframes spinCCW{to{transform:rotate(-360deg);}}

  .clockface{position:absolute; top:6%; right:5%; width:min(11vw,100px); height:min(11vw,100px);
    border-radius:50%; background:radial-gradient(circle at 35% 32%, var(--clockface), #d9c48a 70%, #a9873f 100%);
    box-shadow:0 0 40px 10px rgba(217,164,65,.35), inset 0 0 10px rgba(0,0,0,.35);
    opacity:.9;}
  .clockface::before{content:''; position:absolute; inset:8%; border-radius:50%; border:2px solid rgba(80,50,10,.4);}
  .hand{position:absolute; left:50%; bottom:50%; transform-origin:50% 100%; background:#3a2410; border-radius:3px;}
  .hand.hour{width:3px; height:26%; animation:spinCW 18s linear infinite;}
  .hand.minute{width:2px; height:36%; animation:spinCW 5s linear infinite;}

  .lightning{position:absolute; top:0; width:2px; height:38%; background:linear-gradient(180deg, var(--electric2), transparent);
    filter:drop-shadow(0 0 8px var(--electric2)); opacity:0; animation:strike 7s ease-in-out infinite;}
  @keyframes strike{0%,92%,100%{opacity:0;} 93%{opacity:.9;} 94%{opacity:.2;} 95%{opacity:.8;} 97%{opacity:0;}}

  .temple-silhouette{position:absolute; bottom:16%; opacity:.5; filter:brightness(.5);}
  .temple-silhouette svg{width:100%; display:block;}
  .lamp{position:absolute; width:6px; height:8px; border-radius:50% 50% 40% 40%;
    background:radial-gradient(circle at 50% 30%, #ffd98a, var(--brass) 70%, transparent 100%);
    box-shadow:0 0 9px 3px rgba(217,164,65,.7);
    animation:flicker 1.6s ease-in-out infinite;}
  @keyframes flicker{0%,100%{opacity:.7; transform:scaleY(1);} 50%{opacity:1; transform:scaleY(1.14);}}

  .ground{position:absolute; bottom:0; left:0; width:100%; height:16%;
    background:linear-gradient(180deg, #241638 0%, #120a1e 100%);
    clip-path:polygon(0% 40%, 18% 28%, 36% 46%, 54% 24%, 72% 42%, 88% 30%, 100% 40%, 100% 100%, 0% 100%);}

  .petal{position:absolute; top:-5%; font-size:13px; opacity:.75;
    animation:petalFall linear infinite;}
  @keyframes petalFall{
    0%{transform:translate(0,0) rotate(0deg); opacity:0;}
    10%{opacity:.85;}
    100%{transform:translate(40px,115vh) rotate(320deg); opacity:0;}
  }

  /* ================= APP LAYOUT ================= */
  #app{position:relative; z-index:2; height:100vh; width:100vw; display:flex; flex-direction:column; padding:clamp(8px,1.4vh,16px) clamp(10px,2vw,26px);}
  header{display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; gap:10px;}
  .title-wrap{display:flex; flex-direction:column; gap:2px;}
  h1{margin:0; font-size:clamp(18px,2.6vh,28px); letter-spacing:.4px;
    color:var(--brass); text-shadow:0 0 18px rgba(217,164,65,.45);}
  .subtitle{font-size:clamp(12px,1.4vh,16px); color:var(--ink-dim); font-weight:600;}

  .progress{display:flex; gap:10px; align-items:center;}
  .dot{width:clamp(10px,1.6vh,16px); height:clamp(10px,1.6vh,16px); border-radius:50%;
    background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.28);
    transition:.35s;}
  .dot.active{background:var(--electric2); border-color:var(--electric2); box-shadow:0 0 12px rgba(79,214,255,.7); transform:scale(1.15);}
  .dot.done{background:var(--correct); border-color:var(--correct);}

  #stage{flex:1 1 auto; min-height:0; position:relative; margin-top:clamp(4px,1vh,10px);}
  .activity{position:absolute; inset:0; display:none; flex-direction:column; gap:8px;}
  .activity.active{display:flex;}

  .act-header{display:flex; justify-content:space-between; align-items:center; flex:0 0 auto;}
  .act-title{font-size:clamp(15px,2vh,22px); color:var(--ink); font-weight:700; display:flex; align-items:center; gap:8px;}
  .act-title .tag{font-family:'Orbitron'; padding:2px 10px; border-radius:20px; font-size:clamp(12px,1.5vh,15px);
    background:rgba(217,164,65,.16); border:1px solid rgba(217,164,65,.4); color:var(--brass);}
  .act-body{
    flex:1 1 auto; min-height:0; display:flex; gap:clamp(8px,1.4vw,18px);
    background:rgba(10,7,20,.5); border-radius:14px;
    border:1px solid rgba(255,255,255,.07); padding:8px;
  }

  button{font-family:'Rajdhani',sans-serif; font-weight:700; cursor:pointer; border:none; border-radius:12px;}
  .btn{padding:7px 16px; font-size:clamp(13px,1.6vh,16px); background:rgba(255,255,255,0.1);
    color:var(--ink); border:1px solid rgba(255,255,255,0.22); transition:.2s;}
  .btn:hover{background:rgba(255,255,255,0.18);}
  .btn.gold{background:linear-gradient(135deg,var(--brass),var(--brass-deep)); color:#2a1706; border:none; box-shadow:0 3px 10px rgba(181,118,31,.4);}
  .btn.gold:hover{filter:brightness(1.08);}

  /* ============ DRAGGABLE base ============ */
  .chip{
    padding:7px 12px; border-radius:10px; font-size:clamp(12px,1.5vh,15px); font-weight:800;
    cursor:grab; touch-action:none; position:relative; z-index:5; white-space:nowrap;
    box-shadow:0 3px 10px rgba(0,0,0,.45); transition:box-shadow .15s, transform .1s;
    border:2px solid rgba(255,255,255,.55);
  }
  .chip:active{cursor:grabbing;}
  .chip.dragging{z-index:999; box-shadow:0 10px 24px rgba(0,0,0,.6); transform:scale(1.06);}
  .chip.placed{cursor:default; opacity:.55; filter:grayscale(.3);}
  .chip.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  .slot{
    border:2px dashed rgba(255,255,255,0.32); border-radius:10px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(11px,1.35vh,14px); color:var(--ink-dim); font-weight:700; padding:4px;
    transition:.2s; position:relative;
  }
  .slot.over{border-color:var(--electric2); background:rgba(79,214,255,.14);}
  .slot.correct{border-style:solid; border-color:var(--correct); background:rgba(139,209,124,.16); color:var(--correct);}
  .slot.wrong-flash{border-color:var(--wrong); background:rgba(255,122,122,.16);}

  /* ============ MODAL ============ */
  #modalOverlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(42,27,74,.82), rgba(10,7,20,.95));
    backdrop-filter:blur(3px);}
  #modalOverlay.show{display:flex;}
  .modal-box{
    background:linear-gradient(160deg, var(--panel-light), var(--panel));
    border:1px solid rgba(217,164,65,.4); border-radius:20px;
    padding:clamp(16px,3vh,30px) clamp(18px,3.5vw,36px); max-width:min(560px,88vw);
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.6);
    animation:popIn .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes popIn{0%{transform:scale(.7); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .modal-box h2{margin:0 0 8px; color:var(--brass); font-size:clamp(20px,3vh,30px); font-family:'Orbitron';}
  .modal-box p{margin:0 0 16px; font-size:clamp(14px,1.9vh,18px); color:var(--ink-dim); line-height:1.5;}
  .modal-emoji{font-size:clamp(30px,5vh,52px); margin-bottom:6px;}

  /* ============ ACTIVITY 1 : Gear Chain — Setup Order ============ */
  #a1-track{
    flex:1 1 auto; min-height:0; position:relative;
    display:flex; align-items:stretch; justify-content:space-around;
    padding:10px 1% 6px; gap:5px;
    background:rgba(20,12,30,.6);
    border-radius:12px; border:1.5px solid rgba(217,164,65,.4);
  }
  .gear-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; max-width:18%; min-width:0;}
  .gear-num{
    font-family:'Orbitron'; color:var(--brass);
    font-size:clamp(12px,1.5vh,15px);
    background:rgba(217,164,65,.14); border-radius:20px;
    padding:1px 8px; border:1px solid rgba(217,164,65,.3);
    white-space:nowrap;
  }
  .cog{
    flex:1 1 auto; width:100%; border-radius:12px;
    background:radial-gradient(circle at 40% 35%, #2a1b42, #160d28);
    border:2px dashed rgba(217,164,65,.5);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(11px,1.3vh,14px); font-weight:700;
    color:rgba(210,190,255,.55); padding:4px 3px;
    transition:.2s;
  }
  .cog.correct{border-style:solid; border-color:var(--correct); background:radial-gradient(circle at 40% 35%,#2f4a2c,#1e321e); color:var(--correct);}
  .cog.over{border-color:var(--electric2); background:rgba(79,214,255,.12);}
  #a1-pool{
    flex:0 0 auto; display:flex; flex-wrap:wrap; gap:7px;
    justify-content:center; padding:6px 4px 2px;
    background:rgba(10,6,20,.45); border-radius:10px;
    border:1px solid rgba(255,255,255,.07);
  }
  .cogcard{
    padding:7px 13px; border-radius:10px;
    font-size:clamp(12px,1.45vh,15px); font-weight:800;
    background:linear-gradient(135deg,#b8851e,#7a5210);
    border:1.5px solid rgba(255,210,100,.4); color:#fff3cc;
    cursor:grab; touch-action:none;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }

  /* ============ ACTIVITY 2 : Match the Pairs ============ */
  #a2-body{
    flex:1 1 auto; min-height:0;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:10px; align-items:stretch;
  }
  /* Left column — fixed concept labels */
  #a2-terms{
    display:flex; flex-direction:column; gap:8px; justify-content:space-around;
  }
  .term-card{
    flex:1; display:flex; align-items:center; padding:0 12px;
    border-radius:10px; font-size:clamp(12px,1.45vh,16px); font-weight:800;
    background:linear-gradient(135deg,#1a5f8a,#0d3a57);
    border:1.5px solid rgba(79,214,255,.5); color:#d0f0ff;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
    min-height:0;
  }
  .term-card .term-icon{ font-size:1.3em; margin-right:7px; flex-shrink:0; }
  /* Centre column — connector line */
  #a2-centre{
    width:32px; display:flex; flex-direction:column; justify-content:space-around; align-items:center; gap:8px;
  }
  .connector-line{
    flex:1; width:2px;
    background:linear-gradient(180deg, rgba(79,214,255,.6), rgba(138,99,255,.6));
    border-radius:2px; position:relative;
  }
  .connector-line::after{
    content:''; position:absolute; right:-4px; top:50%; transform:translateY(-50%);
    border:5px solid transparent; border-left:7px solid rgba(79,214,255,.7);
  }
  /* Right column — drop zones */
  #a2-slots{
    display:flex; flex-direction:column; gap:8px; justify-content:space-around;
  }
  .match-slot{
    flex:1; border:2px dashed rgba(79,214,255,.4); border-radius:10px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(11px,1.3vh,14px); color:rgba(160,200,255,.45); font-weight:700;
    padding:4px 8px; transition:.2s; min-height:0;
    background:rgba(10,20,40,.6);
  }
  .match-slot.over{border-color:var(--electric2); background:rgba(79,214,255,.14);}
  .match-slot.correct{border-style:solid; border-color:var(--correct); background:rgba(35,70,32,.8); color:var(--correct);}
  .match-slot.wrong-flash{border-color:var(--wrong); background:rgba(255,122,122,.14);}
  /* Bottom pool of draggable description cards */
  #a2-desc-pool{
    flex:0 0 auto; display:flex; flex-wrap:wrap; gap:7px;
    justify-content:center; padding:6px 4px 2px;
    background:rgba(10,5,20,.45); border-radius:10px;
    border:1px solid rgba(255,255,255,.07);
  }
  .desc-card{
    padding:7px 12px; border-radius:10px;
    font-size:clamp(12px,1.4vh,15px); font-weight:800;
    background:linear-gradient(135deg,#2e1a55,#1a0e35);
    border:1.5px solid rgba(138,99,255,.5); color:#e0d0ff;
    cursor:grab; touch-action:none;
    box-shadow:0 3px 8px rgba(0,0,0,.5);
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }

  /* ============ ACTIVITY 3 : Timeline Strip ============ */
  #a3-strip{
    flex:1 1 auto; min-height:0;
    display:flex; align-items:stretch;
    gap:6px; padding:10px 1% 6px;
    background:rgba(20,10,35,.6);
    border-radius:12px; border:1.5px solid rgba(138,99,255,.45);
  }
  .tl-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0;}
  .tl-num{
    font-family:'Orbitron'; color:var(--electric);
    font-size:clamp(12px,1.5vh,15px);
    background:rgba(138,99,255,.16); border-radius:20px;
    padding:1px 8px; border:1px solid rgba(138,99,255,.35);
    white-space:nowrap;
  }
  .tl-slot{
    flex:1 1 auto; width:100%; border-radius:10px;
    background:rgba(30,15,50,.8);
    border:2px dashed rgba(138,99,255,.5);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:clamp(11px,1.25vh,14px); font-weight:700;
    color:rgba(200,180,255,.5); padding:4px 3px;
    transition:.2s;
  }
  .tl-slot.correct{border-style:solid; border-color:var(--correct); background:rgba(35,70,32,.85); color:var(--correct);}
  .tl-slot.over{border-color:var(--electric2); background:rgba(79,214,255,.12);}
  #a3-pool{
    flex:0 0 auto; display:flex; flex-wrap:wrap; gap:6px;
    justify-content:center; padding:6px 4px 2px;
    background:rgba(10,5,20,.45); border-radius:10px;
    border:1px solid rgba(255,255,255,.07);
  }
  .timecard{
    padding:7px 11px; border-radius:10px;
    font-size:clamp(12px,1.4vh,15px); font-weight:800; text-align:center;
    background:linear-gradient(135deg,#4a2e80,#2d1a55);
    border:1.5px solid rgba(170,130,255,.45); color:#e8d8ff;
    cursor:grab; touch-action:none;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }

  @media (max-width:720px){
    .act-body{flex-direction:column;}
    #a2-diagram, #a2-side{flex:1 1 50%;}
  }
</style>
</head>
<body>

<div id="bg">
  <div class="sky"></div>
  <div id="sparksLayer"></div>
  <div id="particlesLayer"></div>
  <div class="gear g1" style="top:8%; left:2%; width:min(11vw,90px); height:min(11vw,90px);">
    <svg viewBox="0 0 100 100" fill="#d9a441"><path d="M50 8 l6 10 12-2 2 12 12 4-4 12 8 9-8 9 4 12-12 4-2 12-12-2-6 10-6-10-12 2-2-12-12-4 4-12-8-9 8-9-4-12 12-4 2-12 12 2z"/><circle cx="50" cy="50" r="16" fill="#170f2c"/></svg>
  </div>
  <div class="gear g2" style="bottom:24%; left:8%; width:min(7vw,58px); height:min(7vw,58px);">
    <svg viewBox="0 0 100 100" fill="#c9702f"><path d="M50 8 l6 10 12-2 2 12 12 4-4 12 8 9-8 9 4 12-12 4-2 12-12-2-6 10-6-10-12 2-2-12-12-4 4-12-8-9 8-9-4-12 12-4 2-12 12 2z"/><circle cx="50" cy="50" r="16" fill="#170f2c"/></svg>
  </div>
  <div class="gear g3" style="top:38%; right:3%; width:min(9vw,74px); height:min(9vw,74px);">
    <svg viewBox="0 0 100 100" fill="#d9a441"><path d="M50 8 l6 10 12-2 2 12 12 4-4 12 8 9-8 9 4 12-12 4-2 12-12-2-6 10-6-10-12 2-2-12-12-4 4-12-8-9 8-9-4-12 12-4 2-12 12 2z"/><circle cx="50" cy="50" r="16" fill="#170f2c"/></svg>
  </div>
  <div class="clockface">
    <div class="hand hour"></div>
    <div class="hand minute"></div>
  </div>
  <div class="lightning" style="left:22%; animation-delay:0s;"></div>
  <div class="lightning" style="left:64%; animation-delay:-3.4s;"></div>
  <div class="temple-silhouette" style="left:36%; width:22%; height:44%;">
    <svg viewBox="0 0 60 110">
      <rect x="10" y="60" width="40" height="50" fill="#1c1230"/>
      <rect x="16" y="70" width="10" height="20" fill="#0a0714"/>
      <rect x="34" y="70" width="10" height="20" fill="#0a0714"/>
      <polygon points="30,10 46,50 14,50" fill="#241638"/>
      <polygon points="30,22 40,50 20,50" fill="#2c1e48"/>
      <circle cx="30" cy="10" r="4" fill="#d9a441"/>
      <rect x="4" y="60" width="52" height="4" fill="#d9a441" opacity=".5"/>
    </svg>
    <div class="lamp" style="left:15%; bottom:44%; animation-delay:.3s;"></div>
    <div class="lamp" style="left:80%; bottom:44%; animation-delay:.9s;"></div>
  </div>
  <div class="ground"></div>
  <div id="petalsLayer"></div>
</div>

<div id="app">
  <header>
    <div class="title-wrap">
      <h1>⏱️ React — Multi-Page App with React Router</h1>
      <div class="subtitle">BrowserRouter · Routes · Route · Link — Travelling Through Pages Instantly</div>
    </div>
    <div class="progress">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>
  </header>

  <div id="stage">

    <!-- ACTIVITY 1 -->
    <section class="activity active" id="activity1">
      <div class="act-header">
        <div class="act-title"><span class="tag">Activity 1</span> Turn the Gear Chain — Setup Order</div>
        <button class="btn" id="reset1">↺ Reset Activity</button>
      </div>
      <div class="act-body" style="flex-direction:column; gap:8px;">
        <div id="a1-track"></div>
        <div id="a1-pool"></div>
      </div>
    </section>

    <!-- ACTIVITY 2 -->
    <section class="activity" id="activity2">
      <div class="act-header">
        <div class="act-title"><span class="tag">Activity 2</span> Match the Router Concepts</div>
        <button class="btn" id="reset2">↺ Reset Activity</button>
      </div>
      <div class="act-body" style="flex-direction:column; gap:8px;">
        <div id="a2-body">
          <div id="a2-terms"></div>
          <div id="a2-centre"></div>
          <div id="a2-slots"></div>
        </div>
        <div id="a2-desc-pool"></div>
      </div>
    </section>

    <!-- ACTIVITY 3 -->
    <section class="activity" id="activity3">
      <div class="act-header">
        <div class="act-title"><span class="tag">Activity 3</span> Set the Timeline — React Router Steps</div>
        <button class="btn" id="reset3">↺ Reset Activity</button>
      </div>
      <div class="act-body" style="flex-direction:column; gap:8px;">
        <div id="a3-strip"></div>
        <div id="a3-pool"></div>
      </div>
    </section>

  </div>
</div>

<div id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
(function(){
"use strict";

/* ================= UTIL ================= */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function rand(min,max){return Math.random()*(max-min)+min;}
function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}

/* ================= BACKGROUND GENERATION ================= */
function buildSparks(){
  const layer=document.getElementById('sparksLayer');
  let html='';
  for(let i=0;i<50;i++){
    const size=rand(1,2.4);
    html+=`<div class="spark" style="left:${rand(0,100)}%; top:${rand(0,55)}%; width:${size}px; height:${size}px; animation-delay:${rand(0,3)}s; animation-duration:${rand(2,5)}s;"></div>`;
  }
  layer.innerHTML=html;
}
function buildParticles(){
  const layer=document.getElementById('particlesLayer');
  let html='';
  for(let i=0;i<18;i++){
    html+=`<div class="particle" style="left:${rand(0,100)}%; bottom:${rand(0,20)}%; animation-duration:${rand(7,13)}s; animation-delay:${rand(0,10)}s;"></div>`;
  }
  layer.innerHTML=html;
}
function buildPetals(){
  const layer=document.getElementById('petalsLayer');
  const emojis=['🌸','🪷'];
  let html='';
  for(let i=0;i<7;i++){
    html+=`<div class="petal" style="left:${rand(0,96)}%; animation-duration:${rand(12,20)}s; animation-delay:${rand(0,15)}s;">${emojis[i%2]}</div>`;
  }
  layer.innerHTML=html;
}
buildSparks(); buildParticles(); buildPetals();

/* ================= GENERIC POINTER DRAG ENGINE ================= */
function setupDrag(container, dropSelector, onDropCheck){
  let dragging=null, offsetX=0, offsetY=0, startParent=null, startNext=null;

  container.addEventListener('pointerdown', (e)=>{
    const item=e.target.closest('.draggable-item');
    if(!item || item.classList.contains('placed')) return;
    dragging=item;
    startParent=item.parentElement;
    startNext=item.nextSibling;
    const r=item.getBoundingClientRect();
    offsetX=e.clientX-r.left;
    offsetY=e.clientY-r.top;
    item.style.width=r.width+'px';
    document.body.appendChild(item);
    item.classList.add('dragging');
    item.style.position='fixed';
    item.style.left=r.left+'px';
    item.style.top=r.top+'px';
    item.setPointerCapture && item.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  window.addEventListener('pointermove',(e)=>{
    if(!dragging) return;
    dragging.style.left=(e.clientX-offsetX)+'px';
    dragging.style.top=(e.clientY-offsetY)+'px';
    document.querySelectorAll(dropSelector).forEach(z=>z.classList.remove('over'));
    dragging.style.visibility='hidden';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    dragging.style.visibility='visible';
    const zone=under && under.closest(dropSelector);
    if(zone) zone.classList.add('over');
  },{passive:true});

  window.addEventListener('pointerup',(e)=>{
    if(!dragging) return;
    const item=dragging;
    dragging=null;
    document.querySelectorAll(dropSelector).forEach(z=>z.classList.remove('over'));

    item.style.visibility='hidden';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    item.style.visibility='visible';
    const zone=under && under.closest(dropSelector);

    item.classList.remove('dragging');
    item.style.position='';
    item.style.left=''; item.style.top=''; item.style.width='';

    let handled=false;
    if(zone){
      handled=onDropCheck(zone,item);
    }
    if(!handled){
      if(startNext) startParent.insertBefore(item,startNext);
      else startParent.appendChild(item);
      item.classList.add('shake');
      setTimeout(()=>item.classList.remove('shake'),400);
    }
  });
}

/* ================= MODAL SYSTEM ================= */
const overlay=document.getElementById('modalOverlay');
const modalBox=document.getElementById('modalBox');
function showModal({emoji,title,text,buttonText,onButton}){
  modalBox.innerHTML='';
  if(emoji) modalBox.appendChild(el('div','modal-emoji',emoji));
  modalBox.appendChild(el('h2',null,title));
  modalBox.appendChild(el('p',null,text));
  const btnRow=el('div',null,'');
  btnRow.style.display='flex'; btnRow.style.gap='10px'; btnRow.style.justifyContent='center'; btnRow.style.flexWrap='wrap';
  const b=el('button','btn gold',buttonText);
  b.onclick=()=>{ hideModal(); onButton && onButton(); };
  btnRow.appendChild(b);
  modalBox.appendChild(btnRow);
  overlay.classList.add('show');
}
function hideModal(){ overlay.classList.remove('show'); }

/* ================= PROGRESS DOTS ================= */
function setProgress(activeIdx){
  for(let i=1;i<=3;i++){
    const d=document.getElementById('dot'+i);
    d.classList.remove('active','done');
    if(i<activeIdx) d.classList.add('done');
    else if(i===activeIdx) d.classList.add('active');
  }
}
function goToActivity(n){
  document.querySelectorAll('.activity').forEach(a=>a.classList.remove('active'));
  document.getElementById('activity'+n).classList.add('active');
  setProgress(n);
}

/* =========================================================
   ACTIVITY 1 — Turn the Gear Chain (Setup Order)
   5 steps, column layout with step label on top, cog slot filling height
   ========================================================= */
const A1_STEPS=[
  {id:1, label:'npm install react-router-dom'},
  {id:2, label:'Import BrowserRouter, Routes, Route, Link'},
  {id:3, label:'Wrap app in <BrowserRouter>'},
  {id:4, label:'Define <Routes> with <Route> for each page'},
  {id:5, label:'Add <Link> in Navbar to navigate'},
];
let a1Correct=0;
function buildActivity1(){
  const track=document.getElementById('a1-track');
  track.innerHTML='';
  for(let i=1;i<=5;i++){
    const col=el('div','gear-col');
    col.appendChild(el('div','gear-num','Gear '+i));
    const cog=el('div','cog');
    cog.dataset.id=i;
    cog.textContent='place here';
    col.appendChild(cog);
    track.appendChild(col);
  }
  const pool=document.getElementById('a1-pool');
  pool.innerHTML='';
  a1Correct=0;
  shuffle(A1_STEPS).forEach(step=>{
    const card=el('div','cogcard draggable-item',step.label);
    card.dataset.id=step.id;
    pool.appendChild(card);
  });

  setupDrag(document.getElementById('activity1'), '.cog', (zone,item)=>{
    if(zone.classList.contains('correct')) return false;
    if(String(zone.dataset.id)===String(item.dataset.id)){
      zone.classList.add('correct');
      zone.textContent='';
      item.classList.add('placed');
      item.style.width='92%';
      zone.appendChild(item);
      a1Correct++;
      if(a1Correct===A1_STEPS.length){
        setTimeout(()=>showModal({
          emoji:'⚙️⏱️',
          title:'The Gears Are Turning!',
          text:'react-router-dom is installed, components imported, BrowserRouter wraps the app, Routes and Route are defined, and Links connect the Navbar — the time machine is powered up!',
          buttonText:'Next: Wire the Console →',
          onButton:()=>goToActivity(2)
        }),500);
      }
      return true;
    } else {
      zone.classList.add('wrong-flash');
      setTimeout(()=>zone.classList.remove('wrong-flash'),400);
      return false;
    }
  });
}
document.getElementById('reset1').onclick=buildActivity1;

/* =========================================================
   ACTIVITY 2 — Match the Router Concepts
   Left: fixed term labels. Right: drop slots.
   Bottom pool: shuffled description cards to drag up and match.
   ========================================================= */
const A2_PAIRS=[
  { id:'browserrouter', icon:'🔮', term:'BrowserRouter',      desc:'Wraps the whole app to enable client-side routing' },
  { id:'routes',        icon:'🗺️', term:'Routes',             desc:'Container that picks the first matching Route to render' },
  { id:'route',         icon:'📄', term:'Route',              desc:'Maps a URL path to a specific page component' },
  { id:'link',          icon:'🔗', term:'Link',               desc:'Navigates between pages without reloading the browser' },
  { id:'navlink',       icon:'✨', term:'NavLink',            desc:'Like Link but auto-adds an "active" class to the current page' },
  { id:'notfound',      icon:'🚧', term:'path="*"',           desc:'Catch-all route that shows a 404 page for unknown URLs' },
];
let a2Correct=0;
function buildActivity2(){
  const termsCol=document.getElementById('a2-terms');
  const centreCol=document.getElementById('a2-centre');
  const slotsCol=document.getElementById('a2-slots');
  const pool=document.getElementById('a2-desc-pool');

  termsCol.innerHTML=''; centreCol.innerHTML=''; slotsCol.innerHTML=''; pool.innerHTML='';
  a2Correct=0;

  A2_PAIRS.forEach(pair=>{
    // Term label (left)
    const tc=el('div','term-card');
    tc.innerHTML=`<span class="term-icon">${pair.icon}</span>${pair.term}`;
    termsCol.appendChild(tc);

    // Connector arrow (centre)
    centreCol.appendChild(el('div','connector-line'));

    // Drop slot (right)
    const slot=el('div','match-slot');
    slot.dataset.id=pair.id;
    slot.textContent='drop match here';
    slotsCol.appendChild(slot);
  });

  // Shuffled description cards in the bottom pool
  shuffle(A2_PAIRS).forEach(pair=>{
    const card=el('div','desc-card draggable-item',pair.desc);
    card.dataset.id=pair.id;
    pool.appendChild(card);
  });

  setupDrag(document.getElementById('activity2'), '.match-slot', (zone,item)=>{
    if(zone.classList.contains('correct')) return false;
    if(zone.dataset.id===item.dataset.id){
      zone.classList.add('correct');
      zone.textContent='';
      item.classList.add('placed');
      item.style.width='96%';
      zone.appendChild(item);
      a2Correct++;
      if(a2Correct===A2_PAIRS.length){
        setTimeout(()=>showModal({
          emoji:'🧭⚡',
          title:'All Concepts Matched!',
          text:'BrowserRouter, Routes, Route, Link, NavLink and the 404 catch-all — every React Router building block is locked in. Pages now switch instantly, no reload needed!',
          buttonText:'Next: Set the Timeline →',
          onButton:()=>goToActivity(3)
        }),500);
      }
      return true;
    } else {
      zone.classList.add('wrong-flash');
      setTimeout(()=>zone.classList.remove('wrong-flash'),400);
      return false;
    }
  });
}
document.getElementById('reset2').onclick=buildActivity2;

/* =========================================================
   ACTIVITY 3 — Timeline Strip (6 steps)
   Horizontal strip like Activity 1 but with violet theme
   ========================================================= */
const A3_STEPS=[
  {id:1, label:'Install react-router-dom'},
  {id:2, label:'Wrap app in <BrowserRouter>'},
  {id:3, label:'Define routes with <Routes> & <Route>'},
  {id:4, label:'Create Navbar with <Link> components'},
  {id:5, label:'Add <NavLink> to highlight active page'},
  {id:6, label:'Add path="*" for 404 fallback'},
];
let a3Correct=0;
function buildActivity3(){
  const strip=document.getElementById('a3-strip');
  strip.innerHTML='';
  for(let i=1;i<=6;i++){
    const col=el('div','tl-col');
    col.appendChild(el('div','tl-num','Step '+i));
    const slot=el('div','tl-slot');
    slot.dataset.id=i;
    slot.textContent='drop here';
    col.appendChild(slot);
    strip.appendChild(col);
  }
  const pool=document.getElementById('a3-pool');
  pool.innerHTML='';
  a3Correct=0;
  shuffle(A3_STEPS).forEach(step=>{
    const card=el('div','timecard draggable-item',step.label);
    card.dataset.id=step.id;
    pool.appendChild(card);
  });

  setupDrag(document.getElementById('activity3'), '.tl-slot', (zone,item)=>{
    if(zone.classList.contains('correct')) return false;
    if(String(zone.dataset.id)===String(item.dataset.id)){
      zone.classList.add('correct');
      zone.textContent='';
      item.classList.add('placed');
      item.style.width='92%';
      zone.appendChild(item);
      a3Correct++;
      if(a3Correct===A3_STEPS.length){
        setTimeout(()=>finishAll(),500);
      }
      return true;
    } else {
      zone.classList.add('wrong-flash');
      setTimeout(()=>zone.classList.remove('wrong-flash'),400);
      return false;
    }
  });
}
document.getElementById('reset3').onclick=buildActivity3;

/* ================= FINAL CELEBRATION ================= */
function finishAll(){
  setProgress(4);
  burstParticles();
  showModal({
    emoji:'⏱️⚡🪷',
    title:'Mission Complete!',
    text:'You powered the gears, wired the route console, and set every step on the timeline — the time machine now glides between pages instantly, just like a modern React app should!',
    buttonText:'🔁 Play Again',
    onButton:resetEverything
  });
}
function burstParticles(){
  const layer=document.getElementById('petalsLayer');
  const emojis=['🌸','🪷','✨'];
  for(let i=0;i<22;i++){
    const f=el('div','petal',emojis[i%3]);
    f.style.left=rand(10,90)+'%';
    f.style.top='-5%';
    f.style.animationDuration=rand(3,5)+'s';
    f.style.fontSize=rand(12,20)+'px';
    layer.appendChild(f);
    setTimeout(()=>f.remove(),6000);
  }
}

/* ================= RESET EVERYTHING ================= */
function resetEverything(){
  buildActivity1();
  buildActivity2();
  buildActivity3();
  goToActivity(1);
}

/* ================= INIT ================= */
function init(){
  buildActivity1();
  buildActivity2();
  buildActivity3();
  goToActivity(1);
  showModal({
    emoji:'⏱️⚡',
    title:'Welcome, Route Builder!',
    text:'React Router lets an app flip between pages instantly, without ever reloading — like a magic time machine control panel. Turn the gears, wire the console, and set the timeline — all in three activities!',
    buttonText:'Start Activity 1 →'
  });
}
init();

})();
</script>
</body>
</html>
