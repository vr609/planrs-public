<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeScript Types & Interfaces — Drag & Drop Adventure</title>
<style>
  :root{
    --violet-1:#2e1065;
    --violet-2:#4c1d95;
    --violet-3:#6d28d9;
    --violet-4:#8b5cf6;
    --violet-5:#a78bfa;
    --violet-6:#c4b5fd;
    --pink:#f472b6;
    --gold:#fbbf24;
    --teal:#2dd4bf;
    --lime:#a3e635;
    --sky:#38bdf8;
    --orange:#fb923c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    font-family:'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(196,181,253,0.35), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(244,114,182,0.3), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(56,189,248,0.25), transparent 45%),
      linear-gradient(135deg, var(--violet-1), var(--violet-2) 45%, var(--violet-3) 100%);
    background-size:200% 200%;
    animation:bgShift 18s ease infinite;
    overflow-x:hidden;
    color:#fff;
    position:relative;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* Floating background shapes */
  .float-shapes{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .shape{
    position:absolute;
    border-radius:50%;
    opacity:0.35;
    filter:blur(1px);
    animation:floatAround linear infinite;
  }
  @keyframes floatAround{
    0%{transform:translateY(0) translateX(0) rotate(0deg);}
    25%{transform:translateY(-40px) translateX(30px) rotate(90deg);}
    50%{transform:translateY(10px) translateX(-20px) rotate(180deg);}
    75%{transform:translateY(-25px) translateX(-35px) rotate(270deg);}
    100%{transform:translateY(0) translateX(0) rotate(360deg);}
  }

  .stars-wrap{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .twinkle{
    position:absolute;
    font-size:22px;
    animation:twinkleAnim 3s ease-in-out infinite;
    opacity:0.7;
  }
  @keyframes twinkleAnim{
    0%,100%{opacity:0.2;transform:scale(0.8) rotate(0deg);}
    50%{opacity:0.9;transform:scale(1.2) rotate(20deg);}
  }

  .app{
    position:relative;
    z-index:2;
    max-width:900px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }
  header h1{
    font-size:2.4rem;
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--gold), var(--pink), var(--sky), var(--lime));
    background-size:300% 300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleGradient 6s ease infinite;
    text-shadow:0 0 30px rgba(196,181,253,0.4);
    letter-spacing:1px;
  }
  @keyframes titleGradient{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  header p{
    color:var(--violet-6);
    font-size:1.05rem;
    margin:0;
  }

  /* progress dots */
  .progress-track{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    margin:22px 0 8px;
  }
  .progress-step{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .dot{
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:1.1rem;
    background:rgba(255,255,255,0.12);
    border:3px solid var(--violet-5);
    color:var(--violet-6);
    transition:all 0.4s ease;
    position:relative;
  }
  .dot.locked::after{
    content:"🔒";
    position:absolute;
    font-size:0.8rem;
    bottom:-6px;
    right:-6px;
  }
  .dot.active{
    background:linear-gradient(135deg, var(--pink), var(--gold));
    border-color:var(--gold);
    color:#3b0764;
    transform:scale(1.15);
    box-shadow:0 0 25px rgba(251,191,36,0.7);
    animation:pulseDot 1.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{box-shadow:0 0 15px rgba(251,191,36,0.6);}
    50%{box-shadow:0 0 35px rgba(251,191,36,0.95);}
  }
  .dot.done{
    background:linear-gradient(135deg, var(--lime), var(--teal));
    border-color:var(--teal);
    color:#064e3b;
  }
  .connector{
    width:40px;
    height:6px;
    border-radius:6px;
    background:rgba(255,255,255,0.2);
  }
  .connector.filled{
    background:linear-gradient(90deg, var(--lime), var(--teal));
  }

  .card{
    background:rgba(76, 29, 149, 0.55);
    border:2px solid rgba(196,181,253,0.4);
    border-radius:26px;
    padding:26px 26px 30px;
    margin-top:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 20px 60px rgba(0,0,0,0.35), inset 0 0 40px rgba(167,139,250,0.08);
    position:relative;
    overflow:hidden;
    animation:cardIn 0.6s ease;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(30px) scale(0.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60%;
    left:-60%;
    width:220%;
    height:220%;
    background:conic-gradient(from 0deg, transparent, rgba(244,114,182,0.06), transparent 30%);
    animation:spinGlow 12s linear infinite;
    pointer-events:none;
  }
  @keyframes spinGlow{
    to{transform:rotate(360deg);}
  }

  .activity-title{
    font-size:1.4rem;
    margin:0 0 4px;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .activity-title .emoji{
    font-size:1.6rem;
    animation:wiggle 2s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-8deg);}
    50%{transform:rotate(8deg);}
  }
  .activity-sub{
    color:var(--violet-6);
    margin:0 0 20px;
    font-size:0.98rem;
  }

  /* code display */
  .code-box{
    background:rgba(20,10,45,0.65);
    border:2px dashed var(--violet-5);
    border-radius:16px;
    padding:16px 18px;
    font-family:'Consolas','Courier New',monospace;
    font-size:1rem;
    line-height:1.7;
    margin-bottom:20px;
    color:#e9d5ff;
    white-space:pre-wrap;
    position:relative;
  }
  .blank{
    display:inline-block;
    min-width:90px;
    min-height:34px;
    vertical-align:middle;
    border:3px dashed var(--pink);
    border-radius:10px;
    background:rgba(244,114,182,0.12);
    margin:2px 4px;
    transition:all 0.25s ease;
    position:relative;
    padding:2px 4px;
  }
  .blank.over{
    background:rgba(244,114,182,0.35);
    border-color:var(--gold);
    transform:scale(1.05);
  }
  .blank .placed-chip{
    animation:popIn 0.35s ease;
  }
  @keyframes popIn{
    0%{transform:scale(0.3) rotate(-10deg); opacity:0;}
    70%{transform:scale(1.15) rotate(4deg);}
    100%{transform:scale(1) rotate(0deg); opacity:1;}
  }

  /* draggable chips / bank */
  .bank{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    padding:14px;
    background:rgba(255,255,255,0.06);
    border-radius:16px;
    margin-bottom:16px;
    min-height:70px;
  }
  .chip{
    padding:10px 18px;
    border-radius:14px;
    font-family:'Consolas','Courier New',monospace;
    font-weight:bold;
    font-size:1rem;
    cursor:grab;
    user-select:none;
    color:#2e1065;
    box-shadow:0 6px 0 rgba(0,0,0,0.25), 0 8px 18px rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    position:relative;
    animation:bobChip 2.6s ease-in-out infinite;
  }
  .chip:nth-child(1){background:linear-gradient(135deg, var(--gold), #fde68a); animation-delay:0s;}
  .chip:nth-child(2){background:linear-gradient(135deg, var(--pink), #fbcfe8); animation-delay:0.3s;}
  .chip:nth-child(3){background:linear-gradient(135deg, var(--teal), #99f6e4); animation-delay:0.6s;}
  .chip:nth-child(4){background:linear-gradient(135deg, var(--sky), #bae6fd); animation-delay:0.9s;}
  .chip:nth-child(5){background:linear-gradient(135deg, var(--lime), #d9f99d); animation-delay:1.2s;}
  .chip:nth-child(6){background:linear-gradient(135deg, var(--orange), #fed7aa); animation-delay:1.5s;}
  @keyframes bobChip{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
  }
  .chip:active{cursor:grabbing;}
  .chip.dragging{
    opacity:0.4;
    transform:scale(0.9);
  }
  .chip.used{
    opacity:0.25;
    pointer-events:none;
    animation:none;
  }
  .chip:hover{
    transform:translateY(-10px) scale(1.06);
    box-shadow:0 12px 0 rgba(0,0,0,0.25), 0 16px 24px rgba(0,0,0,0.3);
  }

  /* Matching-style activity (pairs) */
  .match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:10px;
  }
  .match-col h4{
    text-align:center;
    color:var(--violet-6);
    margin:0 0 10px;
    font-size:0.95rem;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .drop-slot{
    min-height:64px;
    border:3px dashed var(--violet-5);
    border-radius:16px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 10px;
    text-align:center;
    font-weight:bold;
    color:#fff;
    background:rgba(255,255,255,0.05);
    transition:all 0.25s ease;
    font-family:'Consolas','Courier New',monospace;
  }
  .drop-slot.over{
    background:rgba(251,191,36,0.25);
    border-color:var(--gold);
    transform:scale(1.04);
  }
  .drop-slot .term-label{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.9rem;
    opacity:0.85;
    display:block;
    margin-bottom:4px;
  }
  .source-chip-wrap{
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }

  /* ordering / sequence activity */
  .sequence-track{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    margin-bottom:20px;
  }
  .seq-slot{
    width:150px;
    min-height:64px;
    border:3px dashed var(--violet-5);
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.05);
    font-family:'Consolas','Courier New',monospace;
    font-weight:bold;
    text-align:center;
    padding:6px;
    transition:all 0.25s ease;
    position:relative;
  }
  .seq-slot::before{
    content:attr(data-index);
    position:absolute;
    top:-14px;
    left:-14px;
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--gold);
    color:#3b0764;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.8rem;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 8px rgba(0,0,0,0.3);
  }
  .seq-slot.over{
    background:rgba(56,189,248,0.25);
    border-color:var(--sky);
    transform:scale(1.05);
  }

  .action-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:10px;
  }
  .btn{
    border:none;
    padding:13px 26px;
    border-radius:50px;
    font-weight:bold;
    font-size:1rem;
    cursor:pointer;
    color:#2e1065;
    background:linear-gradient(135deg, var(--gold), var(--orange));
    box-shadow:0 8px 0 rgba(0,0,0,0.25);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 0 rgba(0,0,0,0.25);
  }
  .btn:active{
    transform:translateY(2px);
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  .btn.secondary{
    background:linear-gradient(135deg, var(--sky), var(--teal));
  }
  .btn.ghost{
    background:rgba(255,255,255,0.12);
    color:#fff;
    box-shadow:none;
    border:2px solid rgba(255,255,255,0.3);
  }

  .feedback-inline{
    text-align:center;
    min-height:28px;
    margin-top:14px;
    font-weight:bold;
    font-size:1.05rem;
  }
  .feedback-inline.correct{ color:var(--lime); }
  .feedback-inline.wrong{ color:#fca5a5; }

  /* ===== Overlay popups ===== */
  .overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(20,8,45,0.72);
    backdrop-filter:blur(4px);
    z-index:50;
  }
  .overlay.show{
    display:flex;
    animation:overlayFade 0.25s ease;
  }
  @keyframes overlayFade{
    from{opacity:0;}
    to{opacity:1;}
  }
  .popup{
    background:linear-gradient(160deg, var(--violet-3), var(--violet-2));
    border:3px solid var(--violet-5);
    border-radius:26px;
    padding:34px 40px;
    text-align:center;
    max-width:420px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(167,139,250,0.4);
    animation:popupBounce 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popupBounce{
    0%{transform:scale(0.4) rotate(-6deg); opacity:0;}
    60%{transform:scale(1.08) rotate(2deg); opacity:1;}
    100%{transform:scale(1) rotate(0deg);}
  }
  .popup .big-emoji{
    font-size:4rem;
    display:block;
    margin-bottom:10px;
    animation:emojiSpin 1.2s ease-in-out infinite;
  }
  @keyframes emojiSpin{
    0%,100%{transform:scale(1) rotate(0deg);}
    25%{transform:scale(1.15) rotate(-10deg);}
    75%{transform:scale(1.15) rotate(10deg);}
  }
  .popup.wrong-popup{
    background:linear-gradient(160deg, #7f1d1d, #9d174d);
    border-color:#fca5a5;
  }
  .popup.wrong-popup .big-emoji{
    animation:shakeEmoji 0.5s ease-in-out infinite;
  }
  @keyframes shakeEmoji{
    0%,100%{transform:translateX(0) rotate(0deg);}
    25%{transform:translateX(-8px) rotate(-8deg);}
    75%{transform:translateX(8px) rotate(8deg);}
  }
  .popup h2{
    margin:0 0 8px;
    font-size:1.6rem;
    color:#fff;
  }
  .popup p{
    margin:0 0 20px;
    color:var(--violet-6);
    font-size:1rem;
  }
  .wrong-popup p{ color:#fecdd3; }

  /* ===== Celebration screen ===== */
  #celebrateScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    background:
      radial-gradient(circle at 30% 30%, rgba(251,191,36,0.25), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(244,114,182,0.25), transparent 50%),
      linear-gradient(135deg, var(--violet-1), var(--violet-3), var(--violet-2));
    background-size:220% 220%;
    animation:bgShift 10s ease infinite;
  }
  #celebrateScreen.show{ display:flex; }
  #celebrateScreen h1{
    font-size:3rem;
    margin:0 0 10px;
    background:linear-gradient(90deg, var(--gold), var(--pink), var(--sky), var(--lime), var(--gold));
    background-size:400% 400%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleGradient 4s ease infinite;
    z-index:5;
  }
  #celebrateScreen p{
    color:#fff;
    font-size:1.2rem;
    max-width:560px;
    z-index:5;
    margin-bottom:26px;
  }
  .trophy{
    font-size:5.5rem;
    animation:trophyBounce 1.4s ease-in-out infinite;
    z-index:5;
    margin-bottom:6px;
  }
  @keyframes trophyBounce{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-22px) scale(1.08);}
  }
  .confetti-piece{
    position:absolute;
    top:-30px;
    border-radius:3px;
    animation-name:confettiFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    z-index:2;
  }
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(110vh) rotate(720deg); opacity:0.9;}
  }
  .balloon{
    position:absolute;
    bottom:-140px;
    font-size:3rem;
    animation-name:balloonRise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    z-index:1;
    opacity:0.85;
  }
  @keyframes balloonRise{
    0%{transform:translateY(0) translateX(0) rotate(0deg);}
    50%{transform:translateY(-60vh) translateX(30px) rotate(10deg);}
    100%{transform:translateY(-130vh) translateX(-20px) rotate(-8deg);}
  }
  #playAgainBtn{
    z-index:5;
    font-size:1.15rem;
    padding:16px 38px;
  }

  .kid-critters{
    position:fixed;
    bottom:10px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-around;
    pointer-events:none;
    z-index:1;
    font-size:2.2rem;
  }
  .critter{
    animation:critterBounce 1.8s ease-in-out infinite;
    opacity:0.85;
  }
  @keyframes critterBounce{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-18px) rotate(4deg);}
  }

  @media (max-width:600px){
    header h1{font-size:1.8rem;}
    .match-grid{grid-template-columns:1fr;}
    .seq-slot{width:110px;}
    .popup{padding:26px 22px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="float-shapes" id="floatShapes"></div>
<div class="stars-wrap" id="starsWrap"></div>

<div class="app">
  <header>
    <h1>🚀 TypeScript Types &amp; Interfaces Quest</h1>
  </header>

  <div class="progress-track" id="progressTrack"></div>

  <div id="activityHost"></div>
</div>

<!-- Wrong answer popup -->
<div class="overlay" id="wrongOverlay">
  <div class="popup wrong-popup">
    <span class="big-emoji">🙈</span>
    <h2>Not quite!</h2>
    <p id="wrongMsg">That's not the right spot — give it another try!</p>
    <button class="btn secondary" id="tryAgainBtn">🔁 Try Again</button>
  </div>
</div>

<!-- Next activity popup -->
<div class="overlay" id="nextOverlay">
  <div class="popup">
    <span class="big-emoji">🎉</span>
    <h2 id="nextTitle">Awesome job!</h2>
    <p id="nextMsg">You unlocked the next activity!</p>
    <button class="btn" id="nextActivityBtn">➡️ Next Activity</button>
  </div>
</div>

<!-- Celebration screen -->
<div id="celebrateScreen">
  <div class="trophy">🏆</div>
  <h1>You Did It!</h1>
  <p>You completed every activity and mastered dragging types &amp; interfaces into place. High five!</p>
  <button class="btn secondary" id="playAgainBtn">🔄 Play Again</button>
  <div class="kid-critters">
    <span class="critter" style="animation-delay:0s;">🦄</span>
    <span class="critter" style="animation-delay:0.3s;">🐸</span>
    <span class="critter" style="animation-delay:0.6s;">🐙</span>
    <span class="critter" style="animation-delay:0.9s;">🦊</span>
    <span class="critter" style="animation-delay:1.2s;">🐼</span>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- decorative background ---------- */
  var shapesHost = document.getElementById('floatShapes');
  var shapeColors = ['#f472b6','#fbbf24','#38bdf8','#a3e635','#a78bfa','#fb923c'];
  for(var i=0;i<16;i++){
    var s = document.createElement('div');
    s.className='shape';
    var size = 18 + Math.random()*50;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.background = shapeColors[i % shapeColors.length];
    s.style.animationDuration = (10 + Math.random()*14)+'s';
    s.style.animationDelay = (Math.random()*5)+'s';
    shapesHost.appendChild(s);
  }
  var starsHost = document.getElementById('starsWrap');
  var starEmojis = ['✨','⭐','🌟','💫'];
  for(var j=0;j<14;j++){
    var st = document.createElement('div');
    st.className='twinkle';
    st.textContent = starEmojis[j % starEmojis.length];
    st.style.left = Math.random()*100+'%';
    st.style.top = Math.random()*100+'%';
    st.style.animationDelay = (Math.random()*3)+'s';
    starsHost.appendChild(st);
  }

  /* ---------- activity definitions ---------- */
  // Activity 1: fill-in-the-blank interface definition (drag chips into blanks)
  // Activity 2: match concept term -> correct code snippet (drag chip into matching slot)
  // Activity 3: put lines of a type-alias/union example into correct order

  var activities = [
    {
      key:'a1',
      title:'Build an Interface',
      emoji:'🧩',
      sub:'Drag the right pieces into the blanks to complete the interface.',
      render:renderActivity1,
    },
    {
      key:'a2',
      title:'Match the Concept',
      emoji:'🎯',
      sub:'Drag each code snippet to the concept it matches.',
      render:renderActivity2,
    },
    {
      key:'a3',
      title:'Order the Type Alias',
      emoji:'🔢',
      sub:'Drag the lines into the correct order to build a valid type alias with a union.',
      render:renderActivity3,
    }
  ];

  var currentIndex = 0;
  var completed = [false,false,false];

  var progressTrack = document.getElementById('progressTrack');
  var activityHost = document.getElementById('activityHost');
  var wrongOverlay = document.getElementById('wrongOverlay');
  var nextOverlay = document.getElementById('nextOverlay');
  var celebrateScreen = document.getElementById('celebrateScreen');

  function buildProgress(){
    progressTrack.innerHTML='';
    activities.forEach(function(act, idx){
      if(idx>0){
        var conn = document.createElement('div');
        conn.className='connector'+(completed[idx-1] ? ' filled':'');
        progressTrack.appendChild(conn);
      }
      var dot = document.createElement('div');
      var cls='dot';
      if(completed[idx]) cls+=' done';
      else if(idx===currentIndex) cls+=' active';
      else if(idx>currentIndex) cls+=' locked';
      dot.className=cls;
      dot.textContent = completed[idx] ? '✓' : (idx+1);
      progressTrack.appendChild(dot);
    });
  }

  function loadActivity(idx){
    currentIndex = idx;
    buildProgress();
    activityHost.innerHTML='';
    var act = activities[idx];
    var card = document.createElement('div');
    card.className='card';
    card.innerHTML =
      '<h2 class="activity-title"><span class="emoji">'+act.emoji+'</span> Activity '+(idx+1)+': '+act.title+'</h2>'+
      '<p class="activity-sub">'+act.sub+'</p>'+
      '<div id="activityBody"></div>'+
      '<div class="feedback-inline" id="feedbackInline"></div>';
    activityHost.appendChild(card);
    act.render(document.getElementById('activityBody'));
  }

  function showWrong(msg){
    document.getElementById('wrongMsg').textContent = msg || "That's not right yet — try again!";
    wrongOverlay.classList.add('show');
  }
  document.getElementById('tryAgainBtn').addEventListener('click', function(){
    wrongOverlay.classList.remove('show');
  });

  function showNext(msg){
    var isLast = currentIndex === activities.length - 1;
    document.getElementById('nextTitle').textContent = isLast ? 'Incredible! Final activity complete!' : 'Awesome job!';
    document.getElementById('nextMsg').textContent = msg || (isLast ? "You've mastered all the activities!" : 'You unlocked the next activity!');
    document.getElementById('nextActivityBtn').textContent = isLast ? '🎉 See Celebration' : '➡️ Next Activity';
    completed[currentIndex] = true;
    buildProgress();
    nextOverlay.classList.add('show');
  }
  document.getElementById('nextActivityBtn').addEventListener('click', function(){
    nextOverlay.classList.remove('show');
    if(currentIndex === activities.length - 1){
      launchCelebration();
    } else {
      loadActivity(currentIndex + 1);
    }
  });

  document.getElementById('playAgainBtn').addEventListener('click', function(){
    resetAll();
  });

  function resetAll(){
    celebrateScreen.classList.remove('show');
    clearConfetti();
    completed = [false,false,false];
    loadActivity(0);
  }

  /* =============== DRAG DROP HELPERS =============== */
  function makeDraggable(el, payload){
    el.setAttribute('draggable','true');
    el.dataset.payload = payload;
    el.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('text/plain', payload);
      e.dataTransfer.effectAllowed='move';
      setTimeout(function(){ el.classList.add('dragging'); },0);
    });
    el.addEventListener('dragend', function(){
      el.classList.remove('dragging');
    });
    // touch support (basic tap-to-place fallback)
    el.addEventListener('touchstart', function(e){
      el._touchPayload = payload;
    }, {passive:true});
  }

  function makeDropTarget(el, onDrop){
    el.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      el.classList.add('over');
    });
    el.addEventListener('dragleave', function(){
      el.classList.remove('over');
    });
    el.addEventListener('drop', function(e){
      e.preventDefault();
      el.classList.remove('over');
      var payload = e.dataTransfer.getData('text/plain');
      onDrop(payload, el);
    });
  }

  // simple mobile fallback: tap a chip to "select" then tap a slot to place
  var selectedChip = null;
  function enableTapFallback(chipEls, slotEls, onPlace){
    chipEls.forEach(function(chip){
      chip.addEventListener('click', function(){
        if(chip.classList.contains('used')) return;
        chipEls.forEach(function(c){ c.style.outline=''; });
        selectedChip = chip;
        chip.style.outline = '3px solid #fbbf24';
      });
    });
    slotEls.forEach(function(slot){
      slot.addEventListener('click', function(){
        if(selectedChip){
          onPlace(selectedChip.dataset.payload, slot);
          selectedChip.style.outline='';
          selectedChip = null;
        }
      });
    });
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var r = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[r]; arr[r]=tmp;
    }
    return arr;
  }

  /* =============== ACTIVITY 1: Build an Interface =============== */
  function renderActivity1(host){
    // interface User { name: ___; age: ___; isAdmin: ___; }
    var answer = {b1:'string', b2:'number', b3:'boolean'};
    var options = shuffle(['string','number','boolean','any[]']);

    host.innerHTML =
      '<div class="code-box">'+
      'interface User {<br>'+
      '&nbsp;&nbsp;name: <span class="blank" id="b1" data-answer="string"></span>;<br>'+
      '&nbsp;&nbsp;age: <span class="blank" id="b2" data-answer="number"></span>;<br>'+
      '&nbsp;&nbsp;isAdmin: <span class="blank" id="b3" data-answer="boolean"></span>;<br>'+
      '}'+
      '</div>'+
      '<div class="bank" id="chipBank1"></div>'+
      '<div class="action-row"><button class="btn" id="checkBtn1">✅ Check My Answer</button></div>';

    var bank = document.getElementById('chipBank1');
    var chipEls = [];
    options.forEach(function(opt, i){
      var chip = document.createElement('div');
      chip.className='chip';
      chip.textContent = opt;
      chip.id = 'chip1_'+i;
      bank.appendChild(chip);
      makeDraggable(chip, opt);
      chipEls.push(chip);
    });

    var blanks = [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3')];

    function placeInBlank(payload, blankEl, chipEl){
      blankEl.innerHTML = '';
      var placed = document.createElement('span');
      placed.className='placed-chip';
      placed.textContent = payload;
      placed.style.color = '#fff';
      placed.style.fontWeight='bold';
      blankEl.appendChild(placed);
      blankEl.dataset.filled = payload;
      if(chipEl) chipEl.classList.add('used');
    }

    blanks.forEach(function(blank){
      makeDropTarget(blank, function(payload){
        // find a chip with this payload not yet used, prefer exact source
        var chipEl = chipEls.find(function(c){ return c.dataset.payload===payload && !c.classList.contains('used'); });
        // free up any chip previously used in this blank
        if(blank.dataset.filled){
          var prevChip = chipEls.find(function(c){ return c.dataset.payload===blank.dataset.filled && c.classList.contains('used'); });
          if(prevChip) prevChip.classList.remove('used');
        }
        placeInBlank(payload, blank, chipEl);
      });
    });

    enableTapFallback(chipEls, blanks, function(payload, blank){
      var chipEl = chipEls.find(function(c){ return c.dataset.payload===payload && !c.classList.contains('used'); });
      if(blank.dataset.filled){
        var prevChip = chipEls.find(function(c){ return c.dataset.payload===blank.dataset.filled && c.classList.contains('used'); });
        if(prevChip) prevChip.classList.remove('used');
      }
      placeInBlank(payload, blank, chipEl);
    });

    document.getElementById('checkBtn1').addEventListener('click', function(){
      var fb = document.getElementById('feedbackInline');
      var ok = blanks.every(function(b){ return b.dataset.filled === b.dataset.answer; });
      var allFilled = blanks.every(function(b){ return !!b.dataset.filled; });
      if(!allFilled){
        fb.className='feedback-inline wrong';
        fb.textContent = 'Fill in all three blanks first!';
        return;
      }
      if(ok){
        fb.className='feedback-inline correct';
        fb.textContent = '🎉 Correct! That is a well-typed interface.';
        setTimeout(function(){ showNext('You built your first interface correctly!'); }, 500);
      } else {
        fb.className='feedback-inline wrong';
        fb.textContent = '';
        showWrong("Hmm, one of those types doesn't match the property. Try again!");
      }
    });
  }

  /* =============== ACTIVITY 2: Match the concept =============== */
  function renderActivity2(host){
    // Concepts (drop targets) vs code snippets (draggable chips)
    var pairs = [
      {id:'slotA', label:'Interface declaration', answer:'ifaceCode'},
      {id:'slotB', label:'Type alias for a union', answer:'unionCode'},
      {id:'slotC', label:'Extending an interface', answer:'extendCode'}
    ];
    var chipDefs = shuffle([
      {id:'ifaceCode', text:'interface Point { x: number; y: number; }'},
      {id:'unionCode', text:'type ID = string | number;'},
      {id:'extendCode', text:'interface Admin extends User { role: string; }'}
    ]);

    var html = '<div class="match-grid">';
    html += '<div class="match-col"><h4>Code Snippets</h4><div id="sourceCol2"></div></div>';
    html += '<div class="match-col"><h4>Concepts</h4>';
    pairs.forEach(function(p){
      html += '<div class="drop-slot" id="'+p.id+'" data-answer="'+p.answer+'"><span class="term-label">'+p.label+'</span></div>';
    });
    html += '</div></div>';
    html += '<div class="action-row"><button class="btn" id="checkBtn2">✅ Check My Answer</button></div>';
    host.innerHTML = html;

    var sourceCol = document.getElementById('sourceCol2');
    var chipEls = [];
    chipDefs.forEach(function(cd){
      var wrap = document.createElement('div');
      wrap.className='source-chip-wrap';
      var chip = document.createElement('div');
      chip.className='chip';
      chip.style.fontSize='0.85rem';
      chip.textContent = cd.text;
      chip.id='mchip_'+cd.id;
      makeDraggable(chip, cd.id);
      wrap.appendChild(chip);
      sourceCol.appendChild(wrap);
      chipEls.push(chip);
    });

    var slots = pairs.map(function(p){ return document.getElementById(p.id); });

    function placeInSlot(payload, slotEl, chipEl, chipText){
      // clear old content but keep label
      var label = slotEl.querySelector('.term-label').outerHTML;
      slotEl.innerHTML = label;
      var placed = document.createElement('div');
      placed.className='placed-chip';
      placed.style.fontSize='0.8rem';
      placed.style.marginTop='4px';
      placed.textContent = chipText;
      slotEl.appendChild(placed);
      slotEl.dataset.filled = payload;
      if(chipEl) chipEl.classList.add('used');
    }

    slots.forEach(function(slot){
      makeDropTarget(slot, function(payload){
        var chipEl = chipEls.find(function(c){ return c.dataset.payload===payload && !c.classList.contains('used'); });
        if(!chipEl) chipEl = chipEls.find(function(c){ return c.dataset.payload===payload; });
        if(slot.dataset.filled){
          var prevChip = chipEls.find(function(c){ return c.dataset.payload===slot.dataset.filled; });
          if(prevChip) prevChip.classList.remove('used');
        }
        var cd = chipDefs.find(function(c){ return c.id===payload; });
        placeInSlot(payload, slot, chipEl, cd ? cd.text : payload);
      });
    });

    enableTapFallback(chipEls, slots, function(payload, slot){
      var chipEl = chipEls.find(function(c){ return c.dataset.payload===payload; });
      if(slot.dataset.filled){
        var prevChip = chipEls.find(function(c){ return c.dataset.payload===slot.dataset.filled; });
        if(prevChip) prevChip.classList.remove('used');
      }
      var cd = chipDefs.find(function(c){ return c.id===payload; });
      placeInSlot(payload, slot, chipEl, cd ? cd.text : payload);
    });

    document.getElementById('checkBtn2').addEventListener('click', function(){
      var fb = document.getElementById('feedbackInline');
      var allFilled = slots.every(function(s){ return !!s.dataset.filled; });
      if(!allFilled){
        fb.className='feedback-inline wrong';
        fb.textContent = 'Place all three snippets first!';
        return;
      }
      var ok = slots.every(function(s){ return s.dataset.filled === s.dataset.answer; });
      if(ok){
        fb.className='feedback-inline correct';
        fb.textContent = '🎉 Perfect matches!';
        setTimeout(function(){ showNext('You matched every concept correctly!'); }, 500);
      } else {
        fb.className='feedback-inline wrong';
        fb.textContent='';
        showWrong('A snippet or two is in the wrong spot. Try again!');
      }
    });
  }

  /* =============== ACTIVITY 3: Order the type alias =============== */
  function renderActivity3(host){
    // Correct order:
    // 1: type Shape =
    // 2: | "circle"
    // 3: | "square"
    // 4: | "triangle";
    var correctLines = [
      'type Shape =',
      '  | "circle"',
      '  | "square"',
      '  | "triangle";'
    ];
    var shuffled = shuffle(correctLines.slice());

    var html = '<div class="sequence-track" id="seqSlots">';
    for(var i=0;i<4;i++){
      html += '<div class="seq-slot" data-index="'+(i+1)+'" id="seqSlot'+i+'"></div>';
    }
    html += '</div>';
    html += '<div class="bank" id="chipBank3"></div>';
    html += '<div class="action-row"><button class="btn" id="checkBtn3">✅ Check My Answer</button></div>';
    host.innerHTML = html;

    var bank = document.getElementById('chipBank3');
    var chipEls = [];
    shuffled.forEach(function(line, i){
      var chip = document.createElement('div');
      chip.className='chip';
      chip.style.fontSize='0.85rem';
      chip.textContent = line;
      chip.id='seqchip_'+i;
      makeDraggable(chip, line);
      bank.appendChild(chip);
      chipEls.push(chip);
    });

    var slots = [];
    for(var s=0;s<4;s++){ slots.push(document.getElementById('seqSlot'+s)); }

    function placeInSlot(payload, slotEl, chipEl){
      slotEl.innerHTML = '';
      var placed = document.createElement('div');
      placed.className='placed-chip';
      placed.style.fontSize='0.85rem';
      placed.textContent = payload;
      slotEl.appendChild(placed);
      slotEl.dataset.filled = payload;
      if(chipEl) chipEl.classList.add('used');
    }

    slots.forEach(function(slot){
      makeDropTarget(slot, function(payload){
        var chipEl = chipEls.find(function(c){ return c.dataset.payload===payload && !c.classList.contains('used'); });
        if(!chipEl) chipEl = chipEls.find(function(c){ return c.dataset.payload===payload; });
        if(slot.dataset.filled){
          var prevChip = chipEls.find(function(c){ return c.dataset.payload===slot.dataset.filled; });
          if(prevChip) prevChip.classList.remove('used');
        }
        placeInSlot(payload, slot, chipEl);
      });
    });

    enableTapFallback(chipEls, slots, function(payload, slot){
      var chipEl = chipEls.find(function(c){ return c.dataset.payload===payload; });
      if(slot.dataset.filled){
        var prevChip = chipEls.find(function(c){ return c.dataset.payload===slot.dataset.filled; });
        if(prevChip) prevChip.classList.remove('used');
      }
      placeInSlot(payload, slot, chipEl);
    });

    document.getElementById('checkBtn3').addEventListener('click', function(){
      var fb = document.getElementById('feedbackInline');
      var allFilled = slots.every(function(s){ return !!s.dataset.filled; });
      if(!allFilled){
        fb.className='feedback-inline wrong';
        fb.textContent = 'Place all four lines first!';
        return;
      }
      var ok = slots.every(function(s, idx){ return s.dataset.filled === correctLines[idx]; });
      if(ok){
        fb.className='feedback-inline correct';
        fb.textContent = '🎉 Perfect order!';
        setTimeout(function(){ showNext('You built a perfectly ordered type alias!'); }, 500);
      } else {
        fb.className='feedback-inline wrong';
        fb.textContent='';
        showWrong('The order is a little mixed up. Try again!');
      }
    });
  }

  /* =============== CELEBRATION =============== */
  var confettiHost = null;
  function launchCelebration(){
    celebrateScreen.classList.add('show');
    clearConfetti();
    var colors = ['#f472b6','#fbbf24','#38bdf8','#a3e635','#a78bfa','#fb923c','#c4b5fd'];
    for(var i=0;i<70;i++){
      var piece = document.createElement('div');
      piece.className='confetti-piece';
      var size = 6 + Math.random()*8;
      piece.style.width = size+'px';
      piece.style.height = (size*1.6)+'px';
      piece.style.left = Math.random()*100+'%';
      piece.style.background = colors[i % colors.length];
      piece.style.animationDuration = (2.5 + Math.random()*3)+'s';
      piece.style.animationDelay = (Math.random()*2)+'s';
      celebrateScreen.appendChild(piece);
    }
    var balloonEmojis = ['🎈','🎈','🎈'];
    for(var b=0;b<6;b++){
      var bal = document.createElement('div');
      bal.className='balloon';
      bal.textContent = balloonEmojis[b % balloonEmojis.length];
      bal.style.left = (10 + b*15)+'%';
      bal.style.animationDuration = (5 + Math.random()*3)+'s';
      bal.style.animationDelay = (Math.random()*2)+'s';
      celebrateScreen.appendChild(bal);
    }
  }
  function clearConfetti(){
    var pieces = celebrateScreen.querySelectorAll('.confetti-piece, .balloon');
    pieces.forEach(function(p){ p.remove(); });
  }

  /* init */
  loadActivity(0);
})();
</script>
