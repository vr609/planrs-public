<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity — Ethical Hacking Basics</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Exo 2',sans-serif;}
body{position:fixed;top:0;left:0;right:0;bottom:0;background:#050a14;}

/* ===== BACKGROUND ===== */
#bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
.bg-base{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0a1f3a 0%,#05111f 45%,#020810 100%);}

/* Circuit pattern */
.circuit-svg{position:absolute;inset:0;opacity:0.07;}

/* Gears */
.gear{position:absolute;border-radius:50%;border:4px solid;animation:spinGear linear infinite;}
.gear::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:4px dashed;opacity:0.4;}
@keyframes spinGear{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes spinGearRev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}

/* Clock face */
.clock-face{position:absolute;border-radius:50%;border:3px solid rgba(80,160,255,0.25);background:rgba(5,20,40,0.6);}
.clock-hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;border-radius:2px;}
.clock-hour{animation:hourHand 43200s linear infinite;}
.clock-min{animation:minHand 3600s linear infinite;}
.clock-sec{animation:secHand 60s linear infinite;}
@keyframes hourHand{from{transform:translateX(-50%) rotate(0deg);}to{transform:translateX(-50%) rotate(360deg);}}
@keyframes minHand{from{transform:translateX(-50%) rotate(0deg);}to{transform:translateX(-50%) rotate(360deg);}}
@keyframes secHand{from{transform:translateX(-50%) rotate(0deg);}to{transform:translateX(-50%) rotate(360deg);}}

/* Portal */
.portal{position:absolute;border-radius:50%;animation:portalPulse 3s ease-in-out infinite;}
@keyframes portalPulse{0%,100%{box-shadow:0 0 40px 10px rgba(0,120,255,0.2),inset 0 0 40px rgba(0,80,200,0.1);}50%{box-shadow:0 0 80px 25px rgba(0,160,255,0.35),inset 0 0 60px rgba(0,120,220,0.2);}}

/* Lightning */
.lightning{position:absolute;width:2px;border-radius:1px;animation:lightningFlash ease-in-out infinite;}
@keyframes lightningFlash{0%,100%{opacity:0;}48%{opacity:0;}50%{opacity:1;}52%{opacity:0.7;}55%{opacity:0;}}

/* Sparks */
.spark{position:absolute;width:3px;height:3px;border-radius:50%;animation:sparkFloat linear infinite;}
@keyframes sparkFloat{0%{transform:translate(0,0);opacity:0;}10%{opacity:1;}90%{opacity:0.4;}100%{transform:translate(var(--dx),var(--dy));opacity:0;}}

/* Floating particles */
.fparticle{position:absolute;border-radius:50%;animation:fpdrift ease-in-out infinite;}
@keyframes fpdrift{0%,100%{transform:translateY(0) translateX(0);opacity:0.3;}50%{transform:translateY(-30px) translateX(15px);opacity:0.8;}}

/* Indian mandala motifs */
.mandala{position:absolute;border-radius:50%;border:1px solid;animation:mandalaRot linear infinite;opacity:0.08;}
@keyframes mandalaRot{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* Scanlines */
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,80,160,0.03) 3px,rgba(0,80,160,0.03) 4px);pointer-events:none;}

/* ===== APP LAYOUT ===== */
#app{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;}

/* HEADER */
#header{text-align:center;margin-bottom:6px;}
#header h1{font-family:'Orbitron',monospace;font-size:clamp(14px,2.6vw,26px);color:#60c8ff;text-shadow:0 0 20px rgba(0,160,255,0.8),0 0 40px rgba(0,100,200,0.4);letter-spacing:2px;line-height:1.1;}
#header .sub{font-size:clamp(9px,1.2vw,12px);color:#4a9fd4;margin-top:3px;font-weight:700;letter-spacing:3px;text-transform:uppercase;}
#header .tag{display:inline-block;padding:2px 10px;border:1px solid rgba(0,200,100,0.5);border-radius:20px;font-size:10px;color:#00cc66;margin-top:4px;letter-spacing:2px;}

/* PROGRESS */
#progress{display:flex;gap:8px;justify-content:center;margin-bottom:6px;align-items:center;}
.pdot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(96,200,255,0.3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:rgba(96,200,255,0.3);font-family:'Orbitron',monospace;transition:all 0.4s;}
.pdot.active{border-color:#60c8ff;color:#60c8ff;background:rgba(0,120,255,0.15);box-shadow:0 0 12px rgba(0,160,255,0.4);}
.pdot.done{border-color:#00cc66;color:#fff;background:#007a3d;box-shadow:0 0 8px rgba(0,200,80,0.4);}
.pline{width:24px;height:1.5px;background:rgba(96,200,255,0.2);border-radius:1px;}

/* PANEL */
#panel{width:min(96vw,900px);background:rgba(5,15,30,0.88);border:1.5px solid rgba(0,120,255,0.3);border-radius:16px;backdrop-filter:blur(10px);padding:12px 16px 10px;position:relative;max-height:calc(100vh - 150px);overflow:hidden;}
#panel::before{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,rgba(0,80,160,0.08) 0%,transparent 50%,rgba(0,40,80,0.05) 100%);pointer-events:none;}
#panel h2{font-family:'Orbitron',monospace;font-size:clamp(11px,1.8vw,16px);color:#60c8ff;margin-bottom:6px;text-align:center;letter-spacing:1px;}
#panel .instr{font-size:clamp(9px,1.2vw,12px);color:#7ab8d8;text-align:center;margin-bottom:8px;line-height:1.4;}

/* DRAG ITEMS */
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px;min-height:32px;padding:4px;}
.drag-item{padding:5px 11px;border-radius:6px;font-size:clamp(9px,1.1vw,11px);font-weight:700;cursor:grab;user-select:none;border:1.5px solid;transition:transform 0.15s,box-shadow 0.15s;white-space:nowrap;position:relative;letter-spacing:0.5px;}
.drag-item:hover{transform:scale(1.05);box-shadow:0 0 12px rgba(0,160,255,0.3);}
.drag-item:active{cursor:grabbing;}
.drag-item.dragging{opacity:0.3;}

/* DROP ZONES */
.zones{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.drop-zone{border-radius:10px;border:1.5px dashed rgba(96,200,255,0.25);padding:7px 8px;min-height:65px;min-width:140px;flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;transition:border-color 0.2s,background 0.2s;background:rgba(0,20,50,0.4);}
.drop-zone.over{border-color:#60c8ff;background:rgba(0,80,200,0.12);}
.drop-zone .zone-label{font-size:clamp(8px,1vw,10px);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;text-align:center;font-family:'Orbitron',monospace;}
.drop-zone .zone-icon{font-size:20px;margin-bottom:3px;}
.drop-zone .dropped-items{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;}

/* CHECK BTN */
.check-btn{display:block;margin:8px auto 0;padding:7px 28px;border-radius:6px;border:1.5px solid;font-family:'Orbitron',monospace;font-size:clamp(10px,1.4vw,13px);cursor:pointer;letter-spacing:1px;transition:transform 0.15s,box-shadow 0.15s;background:transparent;}
.check-btn:hover{transform:scale(1.04);}

/* FEEDBACK */
.feedback{text-align:center;font-size:clamp(10px,1.2vw,12px);font-weight:700;margin-top:6px;min-height:18px;}

/* ===== ACTIVITY 2 ===== */
#act2-wrap{display:flex;gap:10px;align-items:flex-start;}
#sandbox-viz{width:190px;flex-shrink:0;border-radius:10px;border:1.5px solid rgba(0,200,100,0.25);background:rgba(0,20,10,0.7);padding:8px;font-family:'Courier New',monospace;font-size:9px;}
#sandbox-viz .sv-title{color:#00cc66;font-weight:700;font-size:9px;letter-spacing:1px;margin-bottom:6px;text-align:center;border-bottom:1px solid rgba(0,200,100,0.2);padding-bottom:4px;}
.sv-line{color:#4af08a;margin:2px 0;white-space:nowrap;overflow:hidden;}
.sv-line.warn{color:#ffaa00;}
.sv-line.safe{color:#00cc66;}
.sv-line.risk{color:#ff4444;}
#sandbox-status{margin-top:6px;padding:4px 6px;border-radius:6px;font-size:9px;font-weight:700;text-align:center;letter-spacing:1px;transition:all 0.4s;}
#act2-right{flex:1;}

/* ===== ACTIVITY 3 ===== */
.seq-row{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;}
.seq-slot{width:130px;height:62px;border-radius:10px;border:1.5px dashed rgba(96,200,255,0.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:rgba(96,200,255,0.3);letter-spacing:1px;text-transform:uppercase;transition:all 0.25s;position:relative;background:rgba(0,20,50,0.4);}
.seq-slot.over{border-color:#60c8ff;background:rgba(0,80,200,0.12);}
.seq-slot .slot-num{position:absolute;top:3px;left:5px;font-size:8px;color:rgba(96,200,255,0.3);font-weight:800;font-family:'Orbitron',monospace;}
.seq-arrow{color:rgba(96,200,255,0.4);font-size:16px;flex-shrink:0;}
#workflow-bar{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:8px;}
#workflow-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#007acc,#00cc66);width:0%;transition:width 0.5s cubic-bezier(0.34,1.56,0.64,1);}
#workflow-label{text-align:center;font-size:10px;color:#4af08a;margin-top:3px;font-weight:700;min-height:14px;}

/* ===== POPUP ===== */
#popup-overlay{position:fixed;inset:0;background:rgba(0,5,15,0.75);z-index:100;display:none;align-items:center;justify-content:center;}
#popup-overlay.show{display:flex;}
#popup-box{background:linear-gradient(160deg,#050f20,#0a1a30);border:2px solid rgba(0,160,255,0.4);border-radius:20px;padding:24px 30px;text-align:center;max-width:380px;width:90%;box-shadow:0 0 60px rgba(0,120,255,0.25),inset 0 0 40px rgba(0,40,100,0.3);}
#popup-box .pop-icon{font-size:48px;margin-bottom:8px;}
#popup-box h3{font-family:'Orbitron',monospace;font-size:20px;color:#60c8ff;margin-bottom:8px;letter-spacing:1px;}
#popup-box p{font-size:12px;color:#7ab8d8;line-height:1.6;margin-bottom:12px;}
#popup-box .fact{font-size:11px;color:#4af08a;background:rgba(0,120,60,0.15);border-radius:8px;padding:7px 10px;margin-bottom:14px;border:1px solid rgba(0,180,80,0.25);}
.pop-btn{padding:9px 26px;border-radius:6px;border:1.5px solid #007acc;font-family:'Orbitron',monospace;font-size:13px;cursor:pointer;background:rgba(0,80,180,0.3);color:#60c8ff;letter-spacing:1px;transition:transform 0.15s,box-shadow 0.15s;}
.pop-btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,160,255,0.4);}

/* TOAST */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(5,15,30,0.95);color:#60c8ff;padding:8px 22px;border-radius:20px;font-size:12px;font-weight:700;z-index:200;transition:transform 0.4s;border:1px solid rgba(0,160,255,0.3);font-family:'Orbitron',monospace;letter-spacing:1px;}
#toast.show{transform:translateX(-50%) translateY(0);}
.sr-only{position:absolute;left:-9999px;}
</style>
</head>
<body>
<h2 class="sr-only">Cybersecurity and Ethical Hacking Basics — Interactive Activities with Time Machine Theme</h2>

<!-- BACKGROUND -->
<div id="bg">
  <div class="bg-base"></div>
  <svg class="circuit-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" id="circuitSvg"></svg>
  <div class="scanlines"></div>
  <div id="gears-container"></div>
  <div id="clock-container"></div>
  <div id="portal-container"></div>
  <div id="lightning-container"></div>
  <div id="sparks-container"></div>
  <div id="mandala-container"></div>
</div>

<!-- APP -->
<div id="app">
  <div id="header">
    <h1>CYBERSECURITY</h1>
    <div class="sub">The Digital Watchman · Ethical Hacking Basics</div>
    <div class="tag">🛡 ETHICAL · AUTHORIZED · RESPONSIBLE</div>
  </div>

  <div id="progress">
    <div class="pdot active" id="pd1">1</div>
    <div class="pline"></div>
    <div class="pdot" id="pd2">2</div>
    <div class="pline"></div>
    <div class="pdot" id="pd3">3</div>
  </div>

  <div id="panel"></div>
</div>

<div id="popup-overlay">
  <div id="popup-box">
    <div class="pop-icon" id="pop-icon"></div>
    <h3 id="pop-title"></h3>
    <p id="pop-msg"></p>
    <div class="fact" id="pop-fact"></div>
    <button class="pop-btn" id="pop-btn"></button>
  </div>
</div>
<div id="toast">Drop items into the correct zones!</div>

<script>
// ============ BACKGROUND BUILD ============
function buildBG(){
  // Circuit lines SVG
  const svg=document.getElementById('circuitSvg');
  let d='';
  const nodes=[];
  for(let i=0;i<28;i++){
    const x=Math.random()*1000,y=Math.random()*600;
    nodes.push({x,y});
    d+=`<circle cx="${x}" cy="${y}" r="${1.5+Math.random()*2.5}" fill="#00aaff" opacity="${0.2+Math.random()*0.5}"/>`;
  }
  for(let i=0;i<40;i++){
    const a=nodes[Math.floor(Math.random()*nodes.length)];
    const b=nodes[Math.floor(Math.random()*nodes.length)];
    if(a!==b){
      const mx=a.x+(b.x-a.x)*0.5;
      d+=`<path d="M${a.x},${a.y} L${mx},${a.y} L${mx},${b.y} L${b.x},${b.y}" stroke="#0066aa" stroke-width="${0.5+Math.random()}" fill="none" opacity="${0.15+Math.random()*0.25}"/>`;
    }
  }
  svg.innerHTML=d;

  // Gears
  const gc=document.getElementById('gears-container');
  const gData=[
    {x:5,y:8,s:90,dur:22,color:'rgba(0,120,255,0.18)'},
    {x:88,y:12,s:60,dur:15,color:'rgba(0,200,120,0.15)',rev:true},
    {x:3,y:72,s:70,dur:18,color:'rgba(0,100,200,0.15)'},
    {x:90,y:78,s:50,dur:12,color:'rgba(0,180,100,0.12)',rev:true},
    {x:50,y:85,s:40,dur:20,color:'rgba(0,80,180,0.1)'},
  ];
  gData.forEach(g=>{
    const el=document.createElement('div');
    el.className='gear';
    el.style.cssText=`left:${g.x}%;top:${g.y}%;width:${g.s}px;height:${g.s}px;border-color:${g.color};animation:${g.rev?'spinGearRev':'spinGear'} ${g.dur}s linear infinite;margin-left:-${g.s/2}px;margin-top:-${g.s/2}px;`;
    gc.appendChild(el);
  });

  // Clocks
  const cc=document.getElementById('clock-container');
  const clkData=[{x:12,y:30,s:80},{x:85,y:45,s:60}];
  clkData.forEach(c=>{
    const el=document.createElement('div');
    el.className='clock-face';
    el.style.cssText=`left:${c.x}%;top:${c.y}%;width:${c.s}px;height:${c.s}px;transform:translate(-50%,-50%);`;
    const hands=[
      {w:3,h:c.s*0.25,cl:'clock-hand clock-hour',bg:'rgba(96,200,255,0.5)'},
      {w:2,h:c.s*0.33,cl:'clock-hand clock-min',bg:'rgba(0,200,120,0.5)'},
      {w:1,h:c.s*0.38,cl:'clock-hand clock-sec',bg:'rgba(255,100,60,0.6)'},
    ];
    hands.forEach(h=>{
      const hd=document.createElement('div');
      hd.className=h.cl;
      hd.style.cssText=`width:${h.w}px;height:${h.h}px;background:${h.bg};margin-left:${-h.w/2}px;transform:translateX(-50%) rotate(${Math.random()*360}deg);`;
      el.appendChild(hd);
    });
    cc.appendChild(el);
  });

  // Portal
  const pc=document.getElementById('portal-container');
  const portal=document.createElement('div');
  portal.className='portal';
  portal.style.cssText='left:50%;top:50%;width:340px;height:340px;transform:translate(-50%,-50%);border:2px solid rgba(0,120,255,0.12);background:radial-gradient(circle,rgba(0,40,100,0.12) 0%,transparent 70%);';
  pc.appendChild(portal);
  const portal2=document.createElement('div');
  portal2.className='portal';
  portal2.style.cssText='left:50%;top:50%;width:220px;height:220px;transform:translate(-50%,-50%);border:1.5px solid rgba(0,180,255,0.08);animation-delay:1.5s;';
  pc.appendChild(portal2);

  // Lightning
  const lc=document.getElementById('lightning-container');
  for(let i=0;i<6;i++){
    const l=document.createElement('div');
    l.className='lightning';
    const h=40+Math.random()*120;
    l.style.cssText=`left:${10+Math.random()*80}%;top:${5+Math.random()*50}%;height:${h}px;background:linear-gradient(180deg,rgba(100,180,255,0.8),transparent);animation-duration:${3+Math.random()*5}s;animation-delay:${Math.random()*5}s;transform:rotate(${-10+Math.random()*20}deg);`;
    lc.appendChild(l);
  }

  // Sparks
  const sc=document.getElementById('sparks-container');
  for(let i=0;i<30;i++){
    const s=document.createElement('div');
    s.className='spark';
    const dx=(Math.random()-0.5)*80,dy=-(20+Math.random()*80);
    s.style.cssText=`left:${Math.random()*100}%;top:${20+Math.random()*70}%;background:hsl(${180+Math.random()*60},100%,${60+Math.random()*30}%);animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*5}s;--dx:${dx}px;--dy:${dy}px;`;
    sc.appendChild(s);
  }

  // Mandala motifs (Indian-inspired)
  const mc=document.getElementById('mandala-container');
  const mData=[
    {x:20,y:20,s:120,dur:30,color:'rgba(0,200,180,0.15)'},
    {x:80,y:80,s:100,dur:25,color:'rgba(200,150,0,0.1)'},
    {x:75,y:15,s:80,dur:20,color:'rgba(180,0,120,0.08)'},
  ];
  mData.forEach(m=>{
    for(let r=0;r<3;r++){
      const el=document.createElement('div');
      el.className='mandala';
      const sz=m.s-(r*22);
      el.style.cssText=`left:${m.x}%;top:${m.y}%;width:${sz}px;height:${sz}px;transform:translate(-50%,-50%);border-color:${m.color};animation-duration:${m.dur+r*8}s;animation-direction:${r%2?'reverse':'normal'};`;
      mc.appendChild(el);
    }
  });
}

// ============ ACTIVITY 1 ============
const act1Items=[
  {id:'i1',text:'Strong Password: P@ssw0rd!9',color:'#00cc66',border:'#009944',cat:'safe'},
  {id:'i2',text:'Two-Factor Auth Enabled',color:'#00cc66',border:'#009944',cat:'safe'},
  {id:'i3',text:'HTTPS in the URL bar',color:'#00cc66',border:'#009944',cat:'safe'},
  {id:'i4',text:'Regular Software Updates',color:'#00cc66',border:'#009944',cat:'safe'},
  {id:'i5',text:'Password: 123456',color:'#ff6644',border:'#cc3300',cat:'risk'},
  {id:'i6',text:'Clicking unknown email links',color:'#ff6644',border:'#cc3300',cat:'risk'},
  {id:'i7',text:'Public WiFi, no VPN',color:'#ff6644',border:'#cc3300',cat:'risk'},
  {id:'i8',text:'Same password everywhere',color:'#ff6644',border:'#cc3300',cat:'risk'},
  {id:'i9',text:'Security updates ignored',color:'#ff6644',border:'#cc3300',cat:'risk'},
  {id:'i10',text:'Verified SSL certificate',color:'#00cc66',border:'#009944',cat:'safe'},
];

function buildAct1(){
  const shuffled=[...act1Items].sort(()=>Math.random()-0.5);
  document.getElementById('panel').innerHTML=`
    <h2>🔐 ACTIVITY 1: Safe Practice or Security Risk?</h2>
    <div class="instr">Drag each behaviour into the correct zone — like a White Hat hacker reviewing a system!</div>
    <div class="tray" id="tray1">${shuffled.map(it=>`
      <div class="drag-item" id="${it.id}" draggable="true"
        style="background:${it.color}18;color:${it.color};border-color:${it.border}55;"
        data-cat="${it.cat}">${it.text}</div>`).join('')}
    </div>
    <div class="zones" id="zones1">
      <div class="drop-zone" data-zone="safe" id="zone-safe" style="max-width:260px;border-color:rgba(0,200,100,0.3);">
        <div class="zone-icon">🛡️</div>
        <div class="zone-label" style="color:#00cc66">SAFE PRACTICE</div>
        <div class="dropped-items" id="dropped-safe"></div>
      </div>
      <div class="drop-zone" data-zone="risk" id="zone-risk" style="max-width:260px;border-color:rgba(255,80,60,0.3);">
        <div class="zone-icon">⚠️</div>
        <div class="zone-label" style="color:#ff6644">SECURITY RISK</div>
        <div class="dropped-items" id="dropped-risk"></div>
      </div>
    </div>
    <div class="feedback" id="fb1"></div>
    <button class="check-btn" onclick="checkAct1()" style="border-color:#007acc;color:#60c8ff;">SCAN FOR THREATS ▶</button>`;
  setupDrag('#tray1 .drag-item','#zones1 [data-zone]');
}

function checkAct1(){
  let correct=0,total=0;
  ['safe','risk'].forEach(z=>{
    const cont=document.getElementById('dropped-'+z);
    cont.querySelectorAll('.drag-item').forEach(item=>{
      total++;
      if(item.dataset.cat===z){correct++;item.style.outline='2px solid #00cc66';}
      else{item.style.outline='2px solid #ff4444';}
    });
  });

// ============ DRAG ENGINE ============
function setupDrag(itemSel,zoneSel){
  setTimeout(()=>{
    document.querySelectorAll(itemSel).forEach(el=>{
      el.addEventListener('dragstart',e=>{
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',el.id);
      });
      el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    });
    document.querySelectorAll(zoneSel).forEach(zone=>{
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});
      zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
      zone.addEventListener('drop',e=>{
        e.preventDefault();zone.classList.remove('over');
        const id=e.dataTransfer.getData('text/plain');
        const item=document.getElementById(id);
        if(!item)return;
        const dropCont=document.getElementById('dropped-'+zone.dataset.zone);
        if(dropCont){
          dropCont.appendChild(item);
        } else if(zone.classList.contains('seq-slot')){
          const existing=zone.querySelector('.drag-item');
          if(existing){
            const tray=document.getElementById('tray3');
            if(tray)tray.appendChild(existing);
          }
          zone.appendChild(item);
          recalcWorkflow();
        } else {
          zone.appendChild(item);
        }
        item.style.outline='none';
        if(currentActivity===2&&zone.dataset.zone){
          const type=item.dataset.type,effect=item.dataset.effect;
          if(type&&effect)updateSandbox(type,effect);
        }
      });
    });
    ['tray1','tray2','tray3'].forEach(tid=>{
      const tray=document.getElementById(tid);
      if(!tray)return;
      tray.addEventListener('dragover',e=>e.preventDefault());
      tray.addEventListener('drop',e=>{
        e.preventDefault();
        const id=e.dataTransfer.getData('text/plain');
        const item=document.getElementById(id);
        if(item){tray.appendChild(item);item.style.outline='none';}
      });
    });
  },80);
}

function recalcWorkflow(){
  let filled=0;
  for(let n=1;n<=4;n++){
    const slot=document.getElementById('slot-'+n);
    if(slot&&slot.querySelector('.drag-item'))filled++;
  }
  const fill=document.getElementById('workflow-fill');
  if(fill)fill.style.width=Math.round((filled/4)*100)+'%';
}

function showPopup(act){
  const d=popups[act];
  document.getElementById('pop-icon').textContent=d.icon;
  document.getElementById('pop-title').textContent=d.title;
  document.getElementById('pop-msg').textContent=d.msg;
  document.getElementById('pop-fact').textContent='💡 Real World: '+d.fact;
  document.getElementById('pop-btn').textContent=d.btn;
  document.getElementById('pop-btn').onclick=()=>{
    document.getElementById('popup-overlay').classList.remove('show');
    if(act<3){currentActivity=act+1;markProgress(act);loadActivity(currentActivity);}
    else{currentActivity=1;markProgress(0);loadActivity(1);}
  };
  document.getElementById('popup-overlay').classList.add('show');
}

function markProgress(done){
  [1,2,3].forEach(n=>{
    const d=document.getElementById('pd'+n);
    d.className='pdot';
    if(n<=done)d.classList.add('done');
    if(n===done+1)d.classList.add('active');
  });
  if(done===0)document.getElementById('pd1').className='pdot active';
}

function loadActivity(n){
  if(n===1)buildAct1();
  if(n===2)buildAct2();
  if(n===3)buildAct3();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
