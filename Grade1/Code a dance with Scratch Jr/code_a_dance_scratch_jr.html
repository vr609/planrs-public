<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code a Dance with Scratch Jr</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');

:root {
  --ocean-deep:  #020e2a;
  --ocean-mid:   #063356;
  --ocean-teal:  #0e7490;
  --ocean-light: #22d3ee;
  --coral:       #fb7185;
  --coral-dark:  #e11d48;
  --sand:        #fef3c7;
  --seaweed:     #16a34a;
  --gold:        #fbbf24;
  --purple-fish: #a855f7;
  --orange-fish: #f97316;
  --white:       #f0f9ff;

  --block-trigger: #fbbf24;
  --block-motion:  #3b82f6;
  --block-control: #f97316;
  --block-look:    #a855f7;
  --block-sound:   #ec4899;
  --block-end:     #ef4444;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  font-family:'Nunito', sans-serif;
  background: var(--ocean-deep);
  color: var(--white);
}

/* ─── CANVAS BG ─── */
#bg-canvas { position:fixed; inset:0; pointer-events:none; z-index:0; }

/* ─── OCEAN LAYER ─── */
#ocean-layer {
  position:fixed; inset:0;
  pointer-events:none; z-index:1;
  overflow:hidden;
}

/* light rays */
.ray {
  position:absolute; top:0;
  width:60px; opacity:0.07;
  background:linear-gradient(180deg,var(--ocean-light),transparent);
  transform-origin:top center;
  animation:rayWave ease-in-out infinite;
  border-radius:0 0 50% 50%;
}
@keyframes rayWave {
  0%,100%{opacity:0.05;transform:scaleX(1) rotate(var(--ra));} 
  50%{opacity:0.13;transform:scaleX(1.3) rotate(calc(var(--ra)+4deg));}
}

/* seaweed */
.seaweed {
  position:absolute; bottom:0;
  width:18px;
  transform-origin:bottom center;
  animation:sway ease-in-out infinite;
  font-size:2rem; line-height:1;
  filter:drop-shadow(0 0 6px rgba(22,163,74,0.4));
}
@keyframes sway {
  0%,100%{transform:rotate(-10deg);}
  50%{transform:rotate(12deg);}
}

/* bubbles */
.bubble {
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.6),rgba(255,255,255,0.05));
  border:1px solid rgba(255,255,255,0.25);
  animation:bubbleRise linear infinite;
  pointer-events:none;
}
@keyframes bubbleRise {
  0%  {transform:translateY(0) translateX(0) scale(1); opacity:0.7;}
  50% {transform:translateY(-40vh) translateX(12px) scale(1.05); opacity:0.8;}
  100%{transform:translateY(-105vh) translateX(-8px) scale(0.6); opacity:0;}
}

/* fish */
.fish {
  position:absolute;
  font-size:1.4rem;
  animation:swimAcross linear infinite;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
@keyframes swimAcross {
  0%  {transform:translateX(-80px) scaleX(1);}
  49% {transform:translateX(calc(100vw + 80px)) scaleX(1);}
  50% {transform:translateX(calc(100vw + 80px)) scaleX(-1);}
  99% {transform:translateX(-80px) scaleX(-1);}
  100%{transform:translateX(-80px) scaleX(1);}
}

/* jellyfish */
.jelly {
  position:absolute;
  font-size:1.8rem;
  animation:jellyFloat ease-in-out infinite;
  filter:drop-shadow(0 0 10px rgba(168,85,247,0.5));
}
@keyframes jellyFloat {
  0%,100%{transform:translateY(0) scale(1);}
  40%{transform:translateY(-20px) scale(1.06);}
  70%{transform:translateY(8px) scale(0.95);}
}

/* coral */
.coral-piece {
  position:absolute; bottom:0;
  font-size:1.6rem;
  filter:drop-shadow(0 0 8px rgba(251,113,133,0.4));
  animation:coralPulse ease-in-out infinite;
}
@keyframes coralPulse {
  0%,100%{filter:drop-shadow(0 0 6px rgba(251,113,133,0.3));}
  50%{filter:drop-shadow(0 0 16px rgba(251,113,133,0.6));}
}

/* ─── MAIN APP ─── */
#app {
  position:relative; z-index:10;
  width:100vw; height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:5px;
  padding:7px 10px;
}

/* ─── HEADER ─── */
#header {
  text-align:center;
  animation:headerIn 0.8s cubic-bezier(.34,1.56,.64,1);
}
@keyframes headerIn{from{transform:translateY(-28px);opacity:0;}to{transform:translateY(0);opacity:1;}}

#header h1 {
  font-family:'Fredoka One', cursive;
  font-size:clamp(1.05rem, 2.4vw, 1.75rem);
  background:linear-gradient(135deg,#22d3ee,#a855f7,#fb7185,#fbbf24);
  background-size:300%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:shimmerText 5s ease infinite;
  letter-spacing:0.02em;
}
@keyframes shimmerText{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
#header p {
  font-size:clamp(0.58rem,1vw,0.75rem);
  color:rgba(186,230,253,0.7);
  font-weight:700; margin-top:1px;
}

/* ─── PROGRESS ─── */
#progress {
  display:flex; gap:6px; align-items:center;
}
.pdot {
  width:10px; height:10px; border-radius:50%;
  background:rgba(34,211,238,0.15);
  border:2px solid rgba(34,211,238,0.25);
  transition:all 0.4s ease;
}
.pdot.active{background:#22d3ee;box-shadow:0 0 10px #22d3ee;transform:scale(1.25);}
.pdot.done  {background:#34d399;border-color:#34d399;box-shadow:0 0 8px #34d399;}
.pline {
  width:26px; height:2px;
  background:rgba(34,211,238,0.15);
  border-radius:2px; transition:background 0.5s;
}
.pline.done{background:#34d399;}

/* ─── CARD ─── */
#card {
  width:min(97vw, 870px);
  background:rgba(6,51,86,0.88);
  backdrop-filter:blur(18px);
  border-radius:22px;
  border:1.5px solid rgba(34,211,238,0.22);
  box-shadow:0 0 50px rgba(34,211,238,0.1), 0 4px 24px rgba(0,0,0,0.4);
  padding:13px 18px 11px;
  position:relative; overflow:hidden;
  animation:cardIn 0.5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{transform:scale(0.88);opacity:0;}to{transform:scale(1);opacity:1;}}
#card::before {
  content:'';position:absolute;top:0;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,transparent,#22d3ee,#a855f7,#fb7185,transparent);
  border-radius:2px;
}

.ctitle {
  font-family:'Fredoka One',cursive;
  font-size:clamp(0.82rem,1.7vw,1.1rem);
  color:#bae6fd;
  display:flex; align-items:center; gap:8px;
  margin-bottom:4px;
}
.abadge {
  font-family:'Nunito',sans-serif; font-weight:800; font-size:0.58rem;
  background:linear-gradient(135deg,#0e7490,#0369a1);
  color:#e0f2fe; padding:2px 9px; border-radius:20px;
  letter-spacing:0.05em; white-space:nowrap;
  border:1px solid rgba(34,211,238,0.3);
}
.cdesc {
  font-size:clamp(0.58rem,1vw,0.73rem);
  color:rgba(186,230,253,0.75); font-weight:600;
  margin-bottom:9px; line-height:1.4;
}

/* ─── BLOCKS ─── */
.block {
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 11px;
  border-radius:9px;
  font-family:'Fredoka One',cursive;
  font-size:clamp(0.56rem,1vw,0.72rem);
  cursor:grab; user-select:none; position:relative;
  border:none;
  box-shadow:0 3px 0 rgba(0,0,0,0.25), 0 1px 4px rgba(0,0,0,0.15);
  transition:transform 0.15s, filter 0.15s;
  white-space:nowrap; color:white;
}
.block::before {
  content:''; position:absolute;
  left:-6px; top:50%; transform:translateY(-50%);
  width:6px; height:13px; background:inherit;
  border-radius:3px 0 0 3px;
  box-shadow:-1px 2px 0 rgba(0,0,0,0.15);
}
.block::after {
  content:''; position:absolute;
  right:-6px; top:50%; transform:translateY(-50%);
  width:6px; height:13px; background:inherit;
  border-radius:0 3px 3px 0;
  box-shadow:1px 2px 0 rgba(0,0,0,0.15);
}
.block:hover{transform:translateY(-3px) scale(1.06);filter:brightness(1.15);}
.block:active{cursor:grabbing;}
.block.dragging{opacity:0.2;}
.b-trigger{background:var(--block-trigger);color:#1c0a00;}
.b-motion {background:var(--block-motion);}
.b-control{background:var(--block-control);}
.b-look   {background:var(--block-look);}
.b-sound  {background:var(--block-sound);}
.b-end    {background:var(--block-end);}

/* ─── TRAY ─── */
.tray {
  display:flex; flex-wrap:wrap; gap:7px;
  padding:9px 11px;
  background:rgba(255,255,255,0.04);
  border-radius:12px;
  border:2px dashed rgba(34,211,238,0.18);
  min-height:48px; margin-bottom:9px;
  align-items:center;
}
.tray-lbl {
  font-size:0.58rem; font-weight:800;
  color:rgba(34,211,238,0.45);
  text-transform:uppercase; letter-spacing:0.08em;
  width:100%; margin-bottom:1px;
}

/* ─── SEQUENCE ─── */
.seq-area {
  background:rgba(255,255,255,0.03);
  border-radius:12px;
  border:1.5px solid rgba(34,211,238,0.12);
  padding:9px 13px; margin-bottom:7px;
}
.seq-lbl {
  font-size:0.58rem; font-weight:800;
  color:rgba(34,211,238,0.5);
  text-transform:uppercase; letter-spacing:0.08em;
  margin-bottom:5px;
  display:flex; align-items:center; gap:5px;
}
.slot-row {
  display:flex; gap:5px; flex-wrap:wrap;
  align-items:center; min-height:42px;
}
.bslot {
  min-width:78px; height:38px;
  border-radius:9px;
  border:2px dashed rgba(34,211,238,0.25);
  background:rgba(34,211,238,0.04);
  display:flex; align-items:center; justify-content:center;
  font-size:0.58rem; color:rgba(34,211,238,0.35);
  font-weight:700; transition:all 0.2s;
  position:relative;
}
.bslot.over{border-color:#22d3ee;background:rgba(34,211,238,0.12);transform:scale(1.04);}
.bslot.filled{border-style:solid;border-color:transparent;background:transparent;padding:0;}
.bslot.filled .block{cursor:default;}
.bslot.filled .block:hover{transform:none;filter:none;}
.arr{font-size:0.9rem;color:rgba(34,211,238,0.3);flex-shrink:0;}

/* ─── LOOP WRAPPER ─── */
.loop-wrap {
  border:2px solid var(--block-control);
  border-radius:12px;
  padding:6px 8px;
  background:rgba(249,115,22,0.07);
  position:relative;
  display:inline-flex; align-items:center; gap:5px;
  flex-wrap:wrap;
}
.loop-cap {
  position:absolute; top:-10px; left:8px;
  font-family:'Fredoka One',cursive; font-size:0.6rem;
  color:var(--block-control); background:var(--ocean-mid);
  padding:0 5px; border-radius:4px;
}

/* ─── BUTTON ─── */
.mbtn {
  font-family:'Fredoka One',cursive;
  font-size:clamp(0.65rem,1.2vw,0.85rem);
  padding:7px 26px; border-radius:50px;
  border:none; cursor:pointer;
  background:linear-gradient(135deg,#0e7490,#0369a1);
  color:white;
  box-shadow:0 4px 16px rgba(14,116,144,0.5), 0 2px 0 rgba(3,69,161,0.4);
  transition:all 0.2s; display:block; margin:7px auto 0;
  letter-spacing:0.02em;
}
.mbtn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 6px 22px rgba(14,116,144,0.6);}
.mbtn.gold{background:linear-gradient(135deg,#d97706,#b45309);}
.mbtn.coral{background:linear-gradient(135deg,#e11d48,#9f1239);}

/* ─── ACTIVITY 2 LOOP BUILDER ─── */
.loop-builder {
  display:flex; gap:9px; align-items:flex-start;
  flex-wrap:wrap;
}
.loop-track {
  flex:1; min-width:200px;
  background:rgba(249,115,22,0.06);
  border:2px dashed rgba(249,115,22,0.3);
  border-radius:14px; padding:10px 12px;
  min-height:80px;
}
.loop-track-lbl {
  font-size:0.58rem; font-weight:800;
  color:rgba(249,115,22,0.6);
  text-transform:uppercase; letter-spacing:0.08em;
  margin-bottom:6px;
}
.loop-slots { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }

/* ─── PREVIEW STAGE (Act2) ─── */
.stage {
  width:clamp(100px,14vw,140px);
  height:clamp(90px,13vw,130px);
  border-radius:12px;
  background:linear-gradient(180deg,#020e2a 0%,#063356 50%,#0a4d68 100%);
  border:2px solid rgba(34,211,238,0.3);
  position:relative; overflow:hidden; flex-shrink:0;
  box-shadow:0 0 20px rgba(34,211,238,0.1);
}
.stage-dancer {
  position:absolute; bottom:12px;
  font-size:1.8rem;
  transition:left 0.12s linear;
  filter:drop-shadow(0 2px 6px rgba(251,191,36,0.5));
}
@keyframes danceBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.stage-dancer.dancing{animation:danceBob 0.4s ease-in-out infinite;}
.stage-score {
  position:absolute; top:5px; right:7px;
  font-family:'Fredoka One',cursive; font-size:0.85rem;
  color:#fbbf24; text-shadow:0 0 6px #fbbf24;
}
.stage-fish-bg {
  position:absolute; font-size:0.7rem; opacity:0.2;
  animation:swimAcross linear infinite;
}

/* ─── TOAST ─── */
#toast {
  position:fixed; top:11px; left:50%; transform:translateX(-50%) translateY(-8px);
  padding:7px 20px; border-radius:50px;
  font-family:'Fredoka One',cursive; font-size:0.8rem;
  z-index:9999; opacity:0; pointer-events:none;
  transition:opacity 0.3s, transform 0.3s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.good{background:linear-gradient(135deg,#064e3b,#065f46);color:#d1fae5;border:1.5px solid #34d399;}
#toast.bad {background:linear-gradient(135deg,#4c0519,#881337);color:#fce7f3;border:1.5px solid #fb7185;}

/* ─── SPARK ─── */
.spark{
  position:fixed; pointer-events:none; font-size:1rem; z-index:9999;
  animation:sparkFly 0.7s ease-out forwards;
}
@keyframes sparkFly{0%{transform:translate(0,0) scale(0);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0;}}

/* ─── CELEBRATION ─── */
#cel {
  position:fixed; inset:0; z-index:8000;
  display:none; align-items:center; justify-content:center; flex-direction:column;
  background:radial-gradient(ellipse at center,rgba(2,14,42,0.97) 0%,rgba(6,51,86,0.98) 100%);
}
#cel.show{display:flex;}
.cel-title {
  font-family:'Fredoka One',cursive;
  font-size:clamp(1.8rem,4.5vw,3rem);
  background:linear-gradient(135deg,#22d3ee,#a855f7,#fb7185,#fbbf24);
  background-size:300%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:shimmerText 2s infinite, bounceIn 0.6s cubic-bezier(.34,1.56,.64,1);
  text-align:center; margin-bottom:6px;
}
@keyframes bounceIn{from{transform:scale(0.2);opacity:0;}to{transform:scale(1);opacity:1;}}
.cel-stars{font-size:2rem;letter-spacing:5px;animation:starPop 1s ease infinite alternate;}
@keyframes starPop{from{transform:scale(0.9);}to{transform:scale(1.15) rotate(8deg);}}
.cel-msg {
  font-size:clamp(0.7rem,1.4vw,0.92rem);
  color:rgba(186,230,253,0.85); text-align:center;
  max-width:460px; line-height:1.6; margin:8px 0 14px;
  font-weight:700;
}
.bubble-burst {
  position:absolute; border-radius:50%;
  animation:burstOut ease-out forwards;
  pointer-events:none;
}
@keyframes burstOut{0%{transform:scale(0);opacity:1;}100%{transform:scale(1) translate(var(--bx),var(--by));opacity:0;}}
.cel-dancers{font-size:2.5rem;display:flex;gap:20px;margin-bottom:12px;animation:celDance 0.5s ease-in-out infinite alternate;}
@keyframes celDance{from{transform:translateY(0);}to{transform:translateY(-12px);}}

/* ─── TRANSITIONS ─── */
.slide-out{animation:sOut 0.3s ease forwards;}
@keyframes sOut{to{transform:translateX(-50px);opacity:0;}}
.slide-in {animation:sIn 0.4s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes sIn {from{transform:translateX(50px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ─── TWO-COLUMN LAYOUT FOR ACT3 ─── */
.two-col {
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}

@media(max-height:640px){
  #app{gap:3px;} .cdesc{margin-bottom:5px;} .tray{min-height:38px;padding:6px 9px;} .seq-area{padding:6px 10px;margin-bottom:5px;} .mbtn{margin-top:4px;}
}
@media(max-width:600px){ .two-col{grid-template-columns:1fr;} }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="ocean-layer"></div>
<div id="toast"></div>

<div id="app">
  <div id="header">
    <h1>🐟 CODE A DANCE WITH SCRATCH JR 🎵</h1>
    <p>Planrs Academy · Underwater Block Coding Adventure</p>
  </div>
  <div id="progress">
    <div class="pdot active" id="pd1"></div>
    <div class="pline" id="pl1"></div>
    <div class="pdot" id="pd2"></div>
    <div class="pline" id="pl2"></div>
    <div class="pdot" id="pd3"></div>
  </div>
  <div id="card"></div>
</div>

<div id="cel">
  <div class="cel-dancers" id="cel-dancers">🐠🦑🐡🦀🐙</div>
  <div class="cel-title">🎉 Dance Show Complete! 🎉</div>
  <div class="cel-stars">⭐⭐⭐⭐⭐</div>
  <div class="cel-msg">
    You choreographed a full underwater dance show!<br>
    You used <strong style="color:#22d3ee">Triggers</strong>, <strong style="color:#3b82f6">Motion</strong>, <strong style="color:#f97316">Loops</strong>, and <strong style="color:#a855f7">Look</strong> blocks — just like a real coder! 🌊
  </div>
  <button class="mbtn gold" onclick="restartAll()">🔄 Dance Again!</button>
</div>

<script>
/* ══════════════════════════════════════
   OCEAN BACKGROUND CANVAS
══════════════════════════════════════ */
(function(){
  const c=document.getElementById('bg-canvas'), ctx=c.getContext('2d');
  let W,H;
  const glows=[{x:0.2,y:0.3,c:'rgba(14,116,144,0.18)',r:200},{x:0.7,y:0.6,c:'rgba(168,85,247,0.1)',r:180},{x:0.5,y:0.8,c:'rgba(34,211,238,0.08)',r:150}];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  function draw(t){
    ctx.clearRect(0,0,W,H);
    // deep gradient
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#020e2a'); g.addColorStop(0.5,'#052947'); g.addColorStop(1,'#041e36');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    glows.forEach(p=>{
      const gx=ctx.createRadialGradient(p.x*W,p.y*H,0,p.x*W,p.y*H,p.r+40*Math.sin(t*0.0005));
      gx.addColorStop(0,p.c); gx.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gx; ctx.fillRect(0,0,W,H);
    });
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize); resize(); requestAnimationFrame(draw);
})();

/* ══════════════════════════════════════
   OCEAN LAYER — seaweed, bubbles, fish, jellyfish, coral, rays
══════════════════════════════════════ */
(function(){
  const layer=document.getElementById('ocean-layer');

  // Light rays
  for(let i=0;i<6;i++){
    const r=document.createElement('div'); r.className='ray';
    r.style.cssText=`left:${5+i*16}%;height:${30+Math.random()*40}vh;width:${40+Math.random()*40}px;
      --ra:${-15+Math.random()*30}deg;animation-duration:${5+Math.random()*5}s;animation-delay:${-Math.random()*5}s;`;
    layer.appendChild(r);
  }

  // Seaweed
  const sPos=[3,8,15,25,40,55,68,75,82,90,96];
  sPos.forEach(x=>{
    const s=document.createElement('div'); s.className='seaweed';
    const h=50+Math.random()*80;
    s.style.cssText=`left:${x}%;height:${h}px;font-size:${1.4+Math.random()*0.8}rem;
      animation-duration:${2+Math.random()*2.5}s;animation-delay:${-Math.random()*3}s;`;
    s.textContent='🌿'; layer.appendChild(s);
  });

  // Coral
  ['🪸','🪸','🌺','🪸'].forEach((e,i)=>{
    const c=document.createElement('div'); c.className='coral-piece';
    c.textContent=e;
    c.style.cssText=`left:${10+i*23}%;font-size:${1.4+Math.random()*0.8}rem;
      animation-duration:${2+Math.random()*2}s;animation-delay:${-Math.random()*2}s;`;
    layer.appendChild(c);
  });

  // Bubbles
  function spawnBubble(){

══════════════════════════════════════ */
function sparks(x,y,emojis=['✨','💙','🫧']){
  for(let i=0;i<7;i++){
    const s=document.createElement('div'); s.className='spark';
    const a=(i/7)*Math.PI*2, d=35+Math.random()*45;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.left=x+'px'; s.style.top=y+'px';
    s.textContent=emojis[i%emojis.length];
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),750);
  }
}

/* ══════════════════════════════════════
   DRAG — MOUSE
══════════════════════════════════════ */
function bindBlocks(sel,dataAttr){
  document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener('dragstart',e=>{
      drag={id:el.dataset[dataAttr]};
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('touchstart',e=>touchStart(e,el,el.dataset[dataAttr]),{passive:true});
    el.addEventListener('touchmove',touchMove,{passive:false});
    el.addEventListener('touchend',touchEnd);
  });
}
function bindSlots(sel,handler){
  document.querySelectorAll(sel).forEach(slot=>{
    slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('over');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('over'));
    slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('over');handler(slot);});
    slot._handler=handler;
  });
  initTouchSlots(sel,handler);
}

/* ══════════════════════════════════════
   TOUCH DRAG
══════════════════════════════════════ */
let tClone=null,tSrc=null,tOffX=0,tOffY=0;

function touchStart(e,el,id){
  tSrc=el; drag={id};
  const r=el.getBoundingClientRect();
  tOffX=e.touches[0].clientX-r.left; tOffY=e.touches[0].clientY-r.top;
  tClone=el.cloneNode(true);
  tClone.style.cssText+=`;position:fixed;z-index:99999;pointer-events:none;opacity:0.9;
    transform:scale(1.12);transition:none;left:${r.left}px;top:${r.top}px;width:${r.width}px;`;
  document.body.appendChild(tClone);
  el.style.opacity='0.2';
}
function touchMove(e){
  e.preventDefault();
  if(!tClone) return;
  tClone.style.left=(e.touches[0].clientX-tOffX)+'px';
  tClone.style.top=(e.touches[0].clientY-tOffY)+'px';
  const ex=e.touches[0].clientX, ey=e.touches[0].clientY;
  document.querySelectorAll('.bslot').forEach(z=>{
    const r=z.getBoundingClientRect();
    if(ex>=r.left&&ex<=r.right&&ey>=r.top&&ey<=r.bottom) z.classList.add('over');
    else z.classList.remove('over');
  });
}
function touchEnd(e){
  if(tSrc) tSrc.style.opacity='1';
  if(tClone){tClone.remove();tClone=null;}
  const ex=e.changedTouches[0].clientX, ey=e.changedTouches[0].clientY;
  document.querySelectorAll('.bslot').forEach(z=>{
    z.classList.remove('over');
    const r=z.getBoundingClientRect();
    if(ex>=r.left&&ex<=r.right&&ey>=r.top&&ey<=r.bottom && drag && z._handler) z._handler(z);
  });
  drag=null;
}
function initTouchSlots(sel,handler){
  document.querySelectorAll(sel).forEach(slot=>{slot._handler=handler;});
}

/* ══════════════════════════════════════
   SPARK HELPER
══════════════════════════════════════ */
function r_sparks(el){
  const r=el.getBoundingClientRect();
  sparks(r.left+r.width/2,r.top+r.height/2,['✨','🫧','💙','⭐']);
}

/* ══════════════════════════════════════
   BOOT
══════════════════════════════════════ */
render();
</script>
