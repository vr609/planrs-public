<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Jr — Catch the Star Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');

:root {
  --sky1: #fce4ff;
  --sky2: #e0f0ff;
  --sky3: #fff0fa;
  --pink: #f472b6;
  --purple: #a855f7;
  --blue: #60a5fa;
  --yellow: #fbbf24;
  --green: #34d399;
  --orange: #fb923c;
  --red: #f87171;
  --teal: #2dd4bf;
  --white: #ffffff;
  --text-dark: #3b1f6e;
  --text-mid: #6b3fa0;

  /* Block colors - Scratch Jr inspired */
  --block-trigger: #ffcc33;
  --block-motion: #4c97ff;
  --block-look: #9966ff;
  --block-sound: #cf63cf;
  --block-control: #ffab19;
  --block-end: #ff6680;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  font-family:'Nunito', sans-serif;
  color: var(--text-dark);
  background: linear-gradient(160deg, #fce4ff 0%, #e8f4ff 40%, #fff0fa 70%, #fef9c3 100%);
}

/* ── CANVAS BG ── */
#bg-canvas {
  position:fixed; inset:0;
  pointer-events:none;
  z-index:0;
}

/* ── FLOATING DECO LAYER ── */
#deco-layer {
  position:fixed; inset:0;
  pointer-events:none;
  z-index:1;
  overflow:hidden;
}

.cloud {
  position:absolute;
  font-size:2.2rem;
  animation: cloudDrift linear infinite;
  opacity:0.55;
  filter: drop-shadow(0 4px 12px rgba(200,160,255,0.3));
}
@keyframes cloudDrift {
  0%   { transform: translateX(-120px); }
  100% { transform: translateX(calc(100vw + 120px)); }
}

.deco-float {
  position:absolute;
  animation: decoFloat ease-in-out infinite;
  opacity:0.7;
  filter: drop-shadow(0 2px 8px rgba(168,85,247,0.3));
}
@keyframes decoFloat {
  0%,100% { transform: translateY(0) rotate(-3deg) scale(1); }
  50%     { transform: translateY(-14px) rotate(4deg) scale(1.06); }
}

.sparkle {
  position:absolute;
  font-size:1rem;
  animation: sparklePop ease-in-out infinite;
  opacity:0;
}
@keyframes sparklePop {
  0%,100% { opacity:0; transform:scale(0.3) rotate(0deg); }
  40%,60% { opacity:1; transform:scale(1.2) rotate(20deg); }
}

.rainbow-wave {
  position:fixed;
  bottom:-30px; left:-10%;
  width:120%;
  height:80px;
  border-radius:50% 50% 0 0;
  opacity:0.12;
  animation: waveShimmer 6s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes waveShimmer {
  0%,100% { transform: scaleX(1) translateY(0); opacity:0.10; }
  50%     { transform: scaleX(1.04) translateY(-6px); opacity:0.16; }
}

/* ── MAIN APP ── */
#app {
  position:relative; z-index:10;
  width:100vw; height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:6px;
  padding:8px 10px;
}

/* ── HEADER ── */
#header {
  text-align:center;
  animation: slideDown 0.7s cubic-bezier(.34,1.56,.64,1);
}
@keyframes slideDown { from{transform:translateY(-30px);opacity:0;} to{transform:translateY(0);opacity:1;} }

#header h1 {
  font-family:'Fredoka One', cursive;
  font-size: clamp(1.1rem, 2.8vw, 1.9rem);
  background: linear-gradient(135deg, #a855f7, #ec4899, #f59e0b, #10b981);
  background-size:300%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  animation: rainbowText 5s ease infinite;
  letter-spacing:0.02em;
  line-height:1.1;
}
@keyframes rainbowText {
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}
#header p {
  font-size:clamp(0.6rem,1.1vw,0.78rem);
  color: var(--text-mid);
  font-weight:700;
  margin-top:1px;
  opacity:0.85;
}

/* ── PROGRESS ── */
#progress {
  display:flex; gap:7px; align-items:center;
}
.prog-dot {
  width:11px; height:11px; border-radius:50%;
  background:rgba(168,85,247,0.18);
  border:2px solid rgba(168,85,247,0.3);
  transition:all 0.4s ease;
  position:relative;
}
.prog-dot.active {
  background:#a855f7;
  box-shadow:0 0 10px #a855f7;
  transform:scale(1.2);
}
.prog-dot.done {
  background:#34d399;
  border-color:#34d399;
  box-shadow:0 0 8px #34d399;
}
.prog-line {
  width:28px; height:2px;
  background:rgba(168,85,247,0.2);
  border-radius:2px;
  transition:background 0.5s;
}
.prog-line.done { background:#34d399; }

/* ── CARD ── */
#card {
  width:min(97vw, 860px);
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(16px);
  border-radius:24px;
  border:2px solid rgba(168,85,247,0.2);
  box-shadow:0 8px 40px rgba(168,85,247,0.15), 0 2px 8px rgba(0,0,0,0.06);
  padding:14px 18px 12px;
  position:relative;
  overflow:hidden;
  animation: cardPop 0.5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardPop { from{transform:scale(0.88);opacity:0;} to{transform:scale(1);opacity:1;} }

#card::before {
  content:'';
  position:absolute; top:0; left:5%; right:5%; height:3px;
  background:linear-gradient(90deg,transparent,#f472b6,#a855f7,#60a5fa,#34d399,transparent);
  border-radius:2px;
}

.card-title {
  font-family:'Fredoka One', cursive;
  font-size:clamp(0.85rem,1.8vw,1.15rem);
  color: var(--text-dark);
  display:flex; align-items:center; gap:8px;
  margin-bottom:4px;
}
.act-badge {
  font-family:'Nunito',sans-serif;
  font-size:0.6rem; font-weight:800;
  background:linear-gradient(135deg,#a855f7,#6366f1);
  color:white; padding:2px 10px;
  border-radius:20px;
  letter-spacing:0.04em;
  white-space:nowrap;
}
.card-desc {
  font-size:clamp(0.6rem,1.05vw,0.75rem);
  color: var(--text-mid);
  font-weight:600;
  margin-bottom:10px;
  line-height:1.4;
}

/* ── CODE BLOCKS ── */
.block {
  display:inline-flex; align-items:center; gap:5px;
  padding:6px 12px;
  border-radius:10px;
  font-family:'Fredoka One', cursive;
  font-size:clamp(0.58rem,1.1vw,0.75rem);
  cursor:grab;
  user-select:none;
  position:relative;
  border:none;
  box-shadow:0 3px 0 rgba(0,0,0,0.15), 0 1px 4px rgba(0,0,0,0.1);
  transition:transform 0.15s, filter 0.15s;
  white-space:nowrap;
  color:white;
  /* puzzle nub */
}
.block::before {
  content:'';
  position:absolute;
  left:-7px; top:50%; transform:translateY(-50%);
  width:7px; height:14px;
  background:inherit;
  border-radius:3px 0 0 3px;
  box-shadow:-1px 2px 0 rgba(0,0,0,0.1);
}
.block::after {
  content:'';
  position:absolute;
  right:-7px; top:50%; transform:translateY(-50%);
  width:7px; height:14px;
  background:inherit;
  border-radius:0 3px 3px 0;
  box-shadow:1px 2px 0 rgba(0,0,0,0.1);
}
.block:first-child::before { display:none; }
.block:hover { transform:translateY(-3px) scale(1.05); filter:brightness(1.1); }
.block:active { cursor:grabbing; transform:scale(1.08); }
.block.dragging { opacity:0.25; }
.block.b-trigger { background:var(--block-trigger); color:#3b1f00; }
.block.b-motion  { background:var(--block-motion); }
.block.b-look    { background:var(--block-look); }
.block.b-sound   { background:var(--block-sound); }
.block.b-control { background:var(--block-control); color:#3b1f00; }
.block.b-end     { background:var(--block-end); }

/* ── SOURCE TRAY ── */
.block-tray {
  display:flex; flex-wrap:wrap; gap:8px;
  padding:10px 12px;
  background:rgba(168,85,247,0.06);
  border-radius:14px;
  border:2px dashed rgba(168,85,247,0.2);
  min-height:52px;
  margin-bottom:10px;
  align-items:center;
}
.tray-label {
  font-size:0.6rem; font-weight:800; color:rgba(107,63,160,0.55);
  text-transform:uppercase; letter-spacing:0.08em;
  width:100%;
  margin-bottom:2px;
}

/* ── SEQUENCE SLOTS ── */
.sequence-area {
  background:rgba(255,255,255,0.6);
  border-radius:14px;
  border:2px solid rgba(168,85,247,0.15);
  padding:10px 14px;
  margin-bottom:8px;
}
.sequence-label {
  font-size:0.6rem; font-weight:800;
  color:rgba(107,63,160,0.6);
  text-transform:uppercase; letter-spacing:0.08em;
  margin-bottom:6px;
  display:flex; align-items:center; gap:5px;
}
.seq-sprite { font-size:1.1rem; }

.slot-row {
  display:flex; gap:6px; flex-wrap:wrap; align-items:center; min-height:44px;
}
.block-slot {
  min-width:80px; height:40px;
  border-radius:10px;
  border:2px dashed rgba(168,85,247,0.3);
  background:rgba(168,85,247,0.05);
  display:flex; align-items:center; justify-content:center;
  font-size:0.6rem; color:rgba(107,63,160,0.4);
  font-weight:700;
  transition:all 0.2s;
  position:relative;
}
.block-slot.over {
  border-color:#a855f7;
  background:rgba(168,85,247,0.15);
  transform:scale(1.04);
}
.block-slot.filled {
  border-style:solid;
  border-color:transparent;
  background:transparent;
  padding:0;
}
.block-slot.filled .block { cursor:default; }
.block-slot.filled .block:hover { transform:none; }
.arrow-sep { font-size:1rem; color:rgba(168,85,247,0.4); flex-shrink:0; }

/* ── MAGIC BUTTON ── */
.magic-btn {
  font-family:'Fredoka One', cursive;
  font-size:clamp(0.7rem,1.3vw,0.9rem);
  padding:8px 28px;
  border-radius:50px;
  border:none; cursor:pointer;
  background:linear-gradient(135deg,#a855f7,#6366f1);
  color:white;
  box-shadow:0 4px 18px rgba(168,85,247,0.45), 0 2px 0 rgba(99,66,209,0.4);
  transition:all 0.2s;
  display:block; margin:8px auto 0;
  letter-spacing:0.02em;
}
.magic-btn:hover { transform:translateY(-2px) scale(1.04); box-shadow:0 6px 24px rgba(168,85,247,0.55); }
.magic-btn:disabled { opacity:0.35; cursor:not-allowed; transform:none; }
.magic-btn.green { background:linear-gradient(135deg,#10b981,#059669); }
.magic-btn.pink  { background:linear-gradient(135deg,#ec4899,#be185d); }

/* ── GAME PREVIEW AREA (Act2) ── */
.game-canvas {
  background:linear-gradient(180deg,#1e0a3c 0%,#2d1b69 40%,#1e3a5f 100%);
  border-radius:16px;
  position:relative;
  overflow:hidden;
  border:3px solid rgba(168,85,247,0.4);
  box-shadow:0 0 24px rgba(168,85,247,0.2);
}
.game-cat {
  position:absolute;
  bottom:10px;
  font-size:1.8rem;
  transition:left 0.15s linear;
  filter:drop-shadow(0 2px 6px rgba(255,200,100,0.5));
  animation:catBob 0.5s ease-in-out infinite;
}
@keyframes catBob {
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
}
.game-star {
  position:absolute;
  font-size:1.6rem;
  filter:drop-shadow(0 0 8px #fbbf24);
  transition: opacity 0.2s;
}
@keyframes starTwinkle {
  0%,100%{filter:drop-shadow(0 0 8px #fbbf24) brightness(1);}
  50%{filter:drop-shadow(0 0 18px #fbbf24) brightness(1.4);}
}
.game-star.twinkle { animation:starTwinkle 0.8s ease-in-out infinite; }
.score-display {
  position:absolute;
  top:8px; right:10px;
  font-family:'Fredoka One',cursive;
  font-size:1.1rem;
  color:#fbbf24;
  text-shadow:0 0 8px #fbbf24;
}
.lives-display {
  position:absolute;
  top:8px; left:10px;
  font-size:0.9rem;
}

/* ── ACTIVITY 2 ELEMENT SLOTS ── */
.element-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:8px;
}
.elem-slot {
  border-radius:12px;
  border:2px dashed rgba(168,85,247,0.3);
  background:rgba(168,85,247,0.05);
  padding:8px 6px;
  text-align:center;
  min-height:60px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:3px;
  transition:all 0.2s;
  font-size:0.6rem; font-weight:700; color:rgba(107,63,160,0.4);
}
.elem-slot.over { border-color:#a855f7; background:rgba(168,85,247,0.12); transform:scale(1.03); }
.elem-slot.filled { border-style:solid; }
.elem-card {
  display:inline-flex; flex-direction:column;
  align-items:center; gap:3px;
  padding:8px 10px;
  border-radius:12px;
  background:white;
  border:2px solid;
  cursor:grab;
  font-weight:800;
  font-size:clamp(0.58rem,0.95vw,0.7rem);
  transition:all 0.2s;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  user-select:none;
  text-align:center;
}
.elem-card:hover { transform:translateY(-3px) scale(1.06); }
.elem-card:active { cursor:grabbing; }
.elem-card .card-icon { font-size:1.2rem; }

/* ── FEEDBACK TOAST ── */
#toast {
  position:fixed; top:12px; left:50%; transform:translateX(-50%);
  padding:8px 22px; border-radius:50px;
  font-family:'Fredoka One',cursive;
  font-size:0.82rem;
  z-index:9999; opacity:0; pointer-events:none;
  transition:opacity 0.3s, transform 0.3s;
  transform:translateX(-50%) translateY(-10px);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.good { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#065f46; border:2px solid #34d399; }
#toast.bad  { background:linear-gradient(135deg,#fce7f3,#fbcfe8); color:#9d174d; border:2px solid #f472b6; }

/* ── SPARK ── */
.spark {
  position:fixed; pointer-events:none;
  font-size:1.1rem; z-index:9999;
  animation:sparkPop 0.7s ease-out forwards;
}
@keyframes sparkPop {
  0%  { transform:translate(0,0) scale(0); opacity:1; }
  100%{ transform:translate(var(--dx),var(--dy)) scale(1.4); opacity:0; }
}

/* ── CELEBRATION ── */
#celebration {
  position:fixed; inset:0; z-index:8000;
  display:none; align-items:center; justify-content:center; flex-direction:column;
  background:radial-gradient(ellipse at center, rgba(250,220,255,0.97) 0%, rgba(230,245,255,0.98) 100%);
}
#celebration.show { display:flex; }

.cel-title {
  font-family:'Fredoka One',cursive;
  font-size:clamp(2rem,5vw,3.2rem);
  background:linear-gradient(135deg,#a855f7,#ec4899,#f59e0b,#10b981);
  background-size:300%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:rainbowText 2s infinite, bounceIn 0.6s cubic-bezier(.34,1.56,.64,1);
  text-align:center; margin-bottom:6px;
}
@keyframes bounceIn { from{transform:scale(0.2);opacity:0;} to{transform:scale(1);opacity:1;} }

.cel-stars {
  font-size:2.2rem; letter-spacing:6px;
  animation:celStarPulse 1s ease infinite alternate;
}
@keyframes celStarPulse { from{transform:scale(0.9);} to{transform:scale(1.15) rotate(5deg);} }

.cel-message {
  font-size:clamp(0.75rem,1.6vw,1rem);
  color:var(--text-mid);
  text-align:center;
  max-width:480px;
  line-height:1.6;
  margin:8px 0 14px;
  font-weight:700;
}
.cel-blocks {
  display:flex; gap:5px; flex-wrap:wrap; justify-content:center;
  margin-bottom:14px;
}
.confetti-piece {
  position:absolute;
  width:8px; height:8px;
  border-radius:2px;
  animation:confettiFall linear forwards;
  pointer-events:none;
}
@keyframes confettiFall {
  0%  { transform:translate(0,0) rotate(0deg); opacity:1; }
  100%{ transform:translate(var(--cx),var(--cy)) rotate(var(--cr)); opacity:0; }
}

/* ── SLIDE TRANSITIONS ── */
.slide-out { animation:slideOut 0.3s ease forwards; }
@keyframes slideOut { to{ transform:translateX(-50px); opacity:0; } }
.slide-in  { animation:slideIn 0.4s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes slideIn { from{transform:translateX(50px);opacity:0;} to{transform:translateX(0);opacity:1;} }

/* ── SCROLLBAR ── */
.block-tray::-webkit-scrollbar { height:3px; }
.block-tray::-webkit-scrollbar-thumb { background:rgba(168,85,247,0.3); border-radius:2px; }

@media (max-height:640px) {
  #app { gap:3px; }
  .card-desc { margin-bottom:6px; }
  .block-tray { padding:7px 10px; min-height:42px; }
  .sequence-area { padding:7px 10px; margin-bottom:5px; }
  .magic-btn { margin-top:5px; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="deco-layer"></div>

<!-- rainbow wave -->
<div class="rainbow-wave" style="background:linear-gradient(90deg,#f472b6,#a855f7,#60a5fa,#34d399,#fbbf24);"></div>

<div id="toast"></div>
<div id="app">

  <div id="header">
    <h1>🌟 SCRATCH JR — CATCH THE STAR GAME 🦄</h1>
    <p>Planrs Academy · Block Coding Adventure</p>
  </div>

  <div id="progress">
    <div class="prog-dot active" id="pd1"></div>
    <div class="prog-line" id="pl1"></div>
    <div class="prog-dot" id="pd2"></div>
    <div class="prog-line" id="pl2"></div>
    <div class="prog-dot" id="pd3"></div>
  </div>

  <div id="card"></div>

</div>

<!-- CELEBRATION -->
<div id="celebration">
  <div class="cel-title">🏆 You're a Star Catcher! 🏆</div>
  <div class="cel-stars">⭐⭐⭐⭐⭐</div>
  <div class="cel-message">
    Amazing work! You built the <strong>Catch the Star</strong> game from scratch!<br>
    You used <strong>Triggers</strong>, <strong>Motion Blocks</strong>, <strong>Loops</strong>, and <strong>Events</strong> — just like a real programmer! 🎉
  </div>
  <div class="cel-blocks" id="cel-blocks-row"></div>
  <button class="magic-btn" onclick="restartAll()">🔄 Play Again</button>
</div>

<script>
/* ════════════════════════════════════
   BACKGROUND CANVAS — pastel shimmer
════════════════════════════════════ */
(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let W,H;

  function resize(){
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
  }

  const pts = Array.from({length:60},()=>({
    x:Math.random(), y:Math.random(),
    r:15+Math.random()*30,
    color: ['rgba(244,114,182,0.08)','rgba(168,85,247,0.07)','rgba(96,165,250,0.08)','rgba(52,211,153,0.07)','rgba(251,191,36,0.07)'][Math.floor(Math.random()*5)],
    speed:0.0003+Math.random()*0.0004,
    phase:Math.random()*Math.PI*2
  }));

  function draw(t){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      const x = (p.x*W + Math.sin(t*p.speed+p.phase)*40+W)%W;
      const y = (p.y*H + Math.cos(t*p.speed*0.7+p.phase)*30+H)%H;
      const g = ctx.createRadialGradient(x,y,0,x,y,p.r*2);
      g.addColorStop(0,p.color);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(x,y,p.r*2,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(draw);
})();

/* ════════════════════════════════════
   DECO LAYER — clouds, floats, sparkles
════════════════════════════════════ */
(function(){
  const layer = document.getElementById('deco-layer');

  // Clouds
  ['☁️','☁️','🌤️','⛅','☁️'].forEach((e,i)=>{
    const d = document.createElement('div');
    d.className = 'cloud';
    d.textContent = e;
    d.style.top = (8+i*16)+'%';
    d.style.fontSize = (1.6+Math.random()*1)+'rem';
    d.style.animationDuration = (18+i*9)+'s';
    d.style.animationDelay = (-Math.random()*18)+'s';
    d.style.opacity = 0.3+Math.random()*0.3;
    layer.appendChild(d);
  });

  // Floating deco
  ['🦄','🌈','⭐','🌸','🦋','💫','🌟','🎀'].forEach((e,i)=>{
    const d = document.createElement('div');
    d.className = 'deco-float';
    d.textContent = e;
    d.style.left = (5+i*12)+'%';
    d.style.top = (10+Math.random()*75)+'%';

/* ════════════════════════════════════
   SPARK FX
════════════════════════════════════ */
function spawnSparks(x,y,emojis=['✨','💖','⭐']){
  for(let i=0;i<7;i++){
    const s = document.createElement('div');
    s.className='spark';
    const angle=(i/7)*Math.PI*2;
    const dist=35+Math.random()*45;
    s.style.setProperty('--dx',Math.cos(angle)*dist+'px');
    s.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    s.style.left=x+'px'; s.style.top=y+'px';
    s.textContent=emojis[i%emojis.length];
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),750);
  }
}

/* ════════════════════════════════════
   DRAG HELPERS (Mouse)
════════════════════════════════════ */
function initBlockDrag(sel){
  document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragData={id:el.dataset.bid};
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  });
}
function initElemDrag(sel){
  document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragData={id:el.dataset.eid};
      el.style.opacity='0.3';
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend',()=>el.style.opacity='1');
  });
}
function initSlotDrop(sel, handler){
  document.querySelectorAll(sel).forEach(slot=>{
    slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('over');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('over'));
    slot.addEventListener('drop',e=>{
      e.preventDefault(); slot.classList.remove('over');
      handler(slot);
    });
  });
}

/* ════════════════════════════════════
   TOUCH HELPERS
════════════════════════════════════ */
let touchClone=null, touchSrc=null, touchOffX=0, touchOffY=0;

function initTouchBlocks(sel){
  document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener('touchstart',e=>touchStartFn(e,el,el.dataset.bid,'block'),{passive:true});
    el.addEventListener('touchmove',touchMoveFn,{passive:false});
    el.addEventListener('touchend',e=>touchEndFn(e));
  });
}
function initTouchElems(sel){
  document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener('touchstart',e=>touchStartFn(e,el,el.dataset.eid,'elem'),{passive:true});
    el.addEventListener('touchmove',touchMoveFn,{passive:false});
    el.addEventListener('touchend',e=>touchEndFn(e));
  });
}
function initTouchSlots(sel, handler){
  document.querySelectorAll(sel).forEach(slot=>{
    slot._touchHandler=handler;
  });
}

function touchStartFn(e,el,id,type){
  touchSrc=el;
  dragData={id, type};
  const rect=el.getBoundingClientRect();
  touchOffX=e.touches[0].clientX-rect.left;
  touchOffY=e.touches[0].clientY-rect.top;
  touchClone=el.cloneNode(true);
  touchClone.style.cssText+=`;position:fixed;z-index:99999;pointer-events:none;opacity:0.9;transform:scale(1.12);transition:none;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;`;
  document.body.appendChild(touchClone);
  el.style.opacity='0.25';
}
function touchMoveFn(e){
  e.preventDefault();
  if(!touchClone) return;
  const tx=e.touches[0].clientX-touchOffX;
  const ty=e.touches[0].clientY-touchOffY;
  touchClone.style.left=tx+'px';
  touchClone.style.top=ty+'px';
  const ex=e.touches[0].clientX, ey=e.touches[0].clientY;
  document.querySelectorAll('.block-slot,.elem-slot,[id^="esl-"],[id^="a3slot-"]').forEach(z=>{
    const r=z.getBoundingClientRect();
    if(ex>=r.left&&ex<=r.right&&ey>=r.top&&ey<=r.bottom) z.classList.add('over');
    else z.classList.remove('over');
  });
}
function touchEndFn(e){
  if(touchSrc) touchSrc.style.opacity='1';
  if(touchClone){touchClone.remove();touchClone=null;}
  const ex=e.changedTouches[0].clientX, ey=e.changedTouches[0].clientY;
  document.querySelectorAll('.block-slot,.elem-slot,[id^="esl-"],[id^="a3slot-"]').forEach(z=>{
    z.classList.remove('over');
    const r=z.getBoundingClientRect();
    if(ex>=r.left&&ex<=r.right&&ey>=r.top&&ey<=r.bottom && dragData && z._touchHandler){
      z._touchHandler(z);
    }
  });
  dragData=null;
}

/* ════════════════════════════════════
   BOOT
════════════════════════════════════ */
render();
</script>
