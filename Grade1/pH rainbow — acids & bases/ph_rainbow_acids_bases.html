<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pH Rainbow — Acids & Bases</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --deep-navy: #0a0820;
    --midnight: #110d2e;
    --violet: #2d1b69;
    --purple-glow: #7c3aed;
    --acid-red: #ef4444;
    --acid-orange: #f97316;
    --acid-yellow: #eab308;
    --neutral-green: #22c55e;
    --base-teal: #06b6d4;
    --base-blue: #3b82f6;
    --base-indigo: #6366f1;
    --gold: #fbbf24;
    --white: #f0eeff;
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    background: var(--deep-navy);
    color: var(--white);
  }

  /* ─── MAGIC CANVAS BACKGROUND ─── */
  #bg-canvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ─── FLOATING MAGIC OBJECTS ─── */
  .magic-objects {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .float-obj {
    position: absolute;
    font-size: 1.6rem;
    animation: floatDrift linear infinite;
    opacity: 0.55;
    filter: drop-shadow(0 0 6px rgba(167,139,250,0.7));
  }
  @keyframes floatDrift {
    0%   { transform: translateY(0) rotate(0deg) scale(1); }
    33%  { transform: translateY(-18px) rotate(8deg) scale(1.05); }
    66%  { transform: translateY(8px) rotate(-5deg) scale(0.97); }
    100% { transform: translateY(0) rotate(0deg) scale(1); }
  }

  /* ─── PARTICLES ─── */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particleFloat linear infinite;
  }
  @keyframes particleFloat {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ─── MAIN LAYOUT ─── */
  #app {
    position: relative;
    z-index: 10;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ─── HEADER ─── */
  #header {
    text-align: center;
    margin-bottom: 10px;
    animation: fadeSlideDown 0.8s ease;
  }
  @keyframes fadeSlideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  #header h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.1rem, 2.5vw, 1.8rem);
    background: linear-gradient(135deg, #fbbf24, #a78bfa, #34d399, #f472b6);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    letter-spacing: 0.04em;
    text-shadow: none;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  #header p {
    font-size: clamp(0.65rem, 1.2vw, 0.85rem);
    color: rgba(200,185,255,0.8);
    margin-top: 2px;
  }

  /* ─── ACTIVITY CARD ─── */
  #activity-container {
    width: min(96vw, 900px);
    background: linear-gradient(135deg, rgba(45,27,105,0.85), rgba(17,13,46,0.92));
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 60px rgba(124,58,237,0.3), inset 0 0 40px rgba(124,58,237,0.05);
    padding: 16px 20px;
    animation: cardPop 0.5s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
  }
  @keyframes cardPop { from { transform: scale(0.9); opacity:0; } to { transform: scale(1); opacity:1; } }

  #activity-container::before {
    content: '';
    position: absolute;
    top: -1px; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #a78bfa, #34d399, #f472b6, transparent);
    border-radius: 2px;
  }

  .activity-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.8rem, 1.5vw, 1.05rem);
    color: #c4b5fd;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .activity-title .badge {
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.65rem;
    color: white;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    border: 1px solid rgba(167,139,250,0.4);
  }
  .activity-desc {
    font-size: clamp(0.65rem, 1.1vw, 0.78rem);
    color: rgba(200,185,255,0.75);
    margin-bottom: 10px;
  }

  /* ─── PROGRESS DOTS ─── */
  #progress {
    display: flex; gap: 8px; justify-content: center;
    margin-bottom: 8px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(167,139,250,0.2);
    border: 1px solid rgba(167,139,250,0.3);
    transition: all 0.4s ease;
  }
  .dot.active { background: #a78bfa; box-shadow: 0 0 8px #a78bfa; }
  .dot.done { background: #34d399; box-shadow: 0 0 8px #34d399; }

  /* ─── DRAG SOURCE ITEMS ─── */
  .items-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 10px;
    min-height: 46px;
  }
  .drag-item {
    cursor: grab;
    padding: 5px 12px;
    border-radius: 50px;
    font-weight: 700;
    font-size: clamp(0.6rem, 1.1vw, 0.75rem);
    border: 2px solid;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
    display: flex;
    align-items: center;
    gap: 5px;
    animation: itemBob 3s ease-in-out infinite;
    backdrop-filter: blur(4px);
  }
  .drag-item:nth-child(2n) { animation-delay: -1s; }
  .drag-item:nth-child(3n) { animation-delay: -2s; }
  @keyframes itemBob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .drag-item:hover { transform: scale(1.08) translateY(-3px); filter: brightness(1.2); }
  .drag-item:active { cursor: grabbing; transform: scale(1.1); }
  .drag-item.dragging { opacity: 0.3; }

  /* ─── DROP ZONES ─── */
  .zones-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .drop-zone {
    flex: 1;
    min-width: 0;
    border-radius: 14px;
    border: 2px dashed;
    padding: 8px 6px;
    text-align: center;
    transition: all 0.3s ease;
    min-height: 90px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .drop-zone.over {
    transform: scale(1.03);
    filter: brightness(1.3);
  }
  .drop-zone-label {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(0.55rem, 1vw, 0.72rem);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .drop-zone .dropped-item {
    font-size: clamp(0.55rem, 0.9vw, 0.68rem);
    padding: 2px 8px;
    border-radius: 20px;
    margin: 1px;
    animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { transform:scale(0); opacity:0; } to { transform:scale(1); opacity:1; } }

  /* zone colors */
  .zone-acid { border-color: #ef4444; background: rgba(239,68,68,0.08); }
  .zone-acid .drop-zone-label { color: #fca5a5; }
  .zone-neutral { border-color: #22c55e; background: rgba(34,197,94,0.08); }
  .zone-neutral .drop-zone-label { color: #86efac; }
  .zone-base { border-color: #06b6d4; background: rgba(6,182,212,0.08); }
  .zone-base .drop-zone-label { color: #67e8f9; }

  /* ─── BUTTON ─── */
  .magic-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: clamp(0.65rem, 1.2vw, 0.85rem);
    padding: 8px 28px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: white;
    box-shadow: 0 0 20px rgba(124,58,237,0.5);
    transition: all 0.2s ease;
    margin-top: 8px;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .magic-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(124,58,237,0.7); }
  .magic-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ─── FEEDBACK TOAST ─── */
  #feedback {
    position: fixed;
    top: 14px; left: 50%; transform: translateX(-50%);
    padding: 8px 24px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.8rem;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  #feedback.show { opacity: 1; }
  #feedback.correct { background: linear-gradient(135deg,#065f46,#047857); border: 1px solid #34d399; color: #d1fae5; }
  #feedback.wrong { background: linear-gradient(135deg,#7f1d1d,#991b1b); border: 1px solid #f87171; color: #fee2e2; }

  /* ─── ACTIVITY 2: COLOR MATCH ─── */
  .color-cards-tray {
    display: flex; flex-wrap: wrap; gap: 7px;
    justify-content: center; margin-bottom: 10px;
  }
  .color-card {
    width: clamp(38px, 6vw, 52px);
    height: clamp(28px, 4.5vw, 38px);
    border-radius: 8px;
    cursor: grab;
    border: 2px solid rgba(255,255,255,0.3);
    transition: all 0.2s;
    box-shadow: 0 0 12px currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 700; color: rgba(0,0,0,0.7);
  }
  .color-card:hover { transform: scale(1.1); border-color: white; }

  .test-samples {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .test-sample {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .test-tube {
    width: clamp(36px, 6vw, 50px);
    height: clamp(70px, 10vw, 90px);
    border-radius: 0 0 20px 20px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05);
    position: relative;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex; align-items: flex-end;
    overflow: hidden;
  }
  .test-tube .tube-fill {
    width: 100%; border-radius: 0 0 18px 18px;
    background: rgba(255,255,255,0.12);
    height: 60%;
    transition: background 0.5s ease, height 0.3s ease;
  }
  .test-tube.matched { border-color: #34d399; box-shadow: 0 0 14px #34d399; }
  .test-tube-drop {
    width: clamp(36px,6vw,50px);
    height: clamp(24px,3.5vw,32px);
    border-radius: 8px;
    border: 2px dashed rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.04);
    transition: all 0.3s;
    display: flex; align-items: center; justify-content: center;
  }
  .test-tube-drop.over { border-color: white; background: rgba(255,255,255,0.12); }
  .test-tube-drop.filled { border-style: solid; }
  .sample-label {
    font-size: clamp(0.5rem, 0.85vw, 0.65rem);
    color: rgba(200,185,255,0.7);
    text-align: center;
    max-width: 60px;
  }

  /* ─── ACTIVITY 3: RAINBOW SCALE ─── */
  .rainbow-track {
    display: flex;
    align-items: center;
    gap: 4px;
    margin: 8px 0;
    padding: 8px;
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    overflow-x: auto;
  }
  .scale-label {
    font-size: clamp(0.5rem,0.85vw,0.65rem);
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color: rgba(200,185,255,0.5);
    white-space: nowrap;
  }
  .scale-slots {
    display: flex;
    flex: 1;
    gap: 5px;
    justify-content: center;
  }
  .scale-slot {
    flex: 1;
    min-width: 68px;
    max-width: 100px;
    height: 60px;
    border-radius: 10px;
    border: 2px dashed rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 0.55rem;
    color: rgba(255,255,255,0.3);
    transition: all 0.3s;
    gap: 3px;
    position: relative;
  }
  .scale-slot.over { border-color: white; background: rgba(255,255,255,0.1); transform: scale(1.03); }
  .scale-slot.filled { border-style: solid; }
  .scale-slot .slot-number {
    position: absolute;
    top: 2px; left: 6px;
    font-size: 0.5rem;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
  }
  .scale-slot .slot-content {
    font-size: clamp(0.55rem, 0.9vw, 0.68rem);
    font-weight: 700;
    text-align: center;
    padding: 2px 4px;
  }

  .act3-items {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
  }

  /* ─── CELEBRATION OVERLAY ─── */
  #celebration {
    position: fixed; inset: 0;
    z-index: 9000;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(ellipse at center, rgba(45,27,105,0.97) 0%, rgba(10,8,32,0.98) 100%);
  }
  #celebration.show { display: flex; }
  .celebrate-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.5rem, 4vw, 2.8rem);
    background: linear-gradient(135deg, #fbbf24, #f472b6, #a78bfa, #34d399);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 2s ease infinite, bounceIn 0.6s cubic-bezier(.34,1.56,.64,1);
    text-align: center;
    margin-bottom: 12px;
  }
  @keyframes bounceIn { from { transform: scale(0.3); opacity:0; } to { transform: scale(1); opacity:1; } }
  .celebrate-stars {
    font-size: 2.5rem;
    letter-spacing: 8px;
    animation: starPulse 1s ease infinite alternate;
  }
  @keyframes starPulse { from { transform: scale(0.9); } to { transform: scale(1.1); } }
  .firework {
    position: absolute;
    font-size: 2rem;
    animation: fireworkBurst 1.5s ease-out infinite;
    pointer-events: none;
  }
  @keyframes fireworkBurst {
    0%   { transform: translate(0,0) scale(0); opacity:1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity:0; }
  }
  .celebrate-summary {
    font-size: clamp(0.7rem, 1.5vw, 0.95rem);
    color: rgba(200,185,255,0.8);
    text-align: center;
    max-width: 500px;
    line-height: 1.6;
    margin: 8px 0 16px;
  }
  .ph-bar-final {
    display: flex;
    gap: 3px;
    margin: 10px 0;
  }
  .ph-seg {
    width: 36px; height: 22px;
    border-radius: 4px;
    animation: phGlow 1.5s ease-in-out infinite alternate;
  }
  @keyframes phGlow { from { filter: brightness(0.8); } to { filter: brightness(1.3) saturate(1.3); } }

  /* ─── POPUP TRANSITION ─── */
  .slide-out { animation: slideOut 0.35s ease forwards; }
  @keyframes slideOut { to { transform: translateX(-60px); opacity:0; } }
  .slide-in { animation: slideIn 0.4s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes slideIn { from { transform: translateX(60px); opacity:0; } to { transform: translateX(0); opacity:1; } }

  /* ─── MAGIC SPARK ─── */
  .magic-spark {
    position: fixed;
    pointer-events: none;
    font-size: 1.2rem;
    z-index: 9999;
    animation: sparkFly 0.8s ease-out forwards;
  }
  @keyframes sparkFly {
    0%   { transform: scale(0) translate(0,0); opacity: 1; }
    100% { transform: scale(1.5) translate(var(--sx), var(--sy)); opacity: 0; }
  }

  /* scrollbar for small screens */
  .rainbow-track::-webkit-scrollbar { height: 4px; }
  .rainbow-track::-webkit-scrollbar-track { background: transparent; }
  .rainbow-track::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.4); border-radius: 2px; }

  @media (max-height: 650px) {
    #header { margin-bottom: 4px; }
    .activity-desc { margin-bottom: 6px; }
    .items-tray { min-height: 36px; }
    .drop-zone { min-height: 70px; }
    .magic-btn { margin-top: 5px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="magic-objects" id="magic-objects"></div>
<div id="feedback"></div>

<div id="app">
  <!-- HEADER -->
  <div id="header">
    <h1>✨ pH RAINBOW — ACIDS &amp; BASES ✨</h1>
    <p>A Magical Chemistry Adventure · Planrs Academy</p>
  </div>

  <!-- PROGRESS -->
  <div id="progress">
    <div class="dot active" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
    <div class="dot" id="dot-3"></div>
  </div>

  <!-- ACTIVITY CONTAINER -->
  <div id="activity-container">
    <!-- Activities injected by JS -->
  </div>
</div>

<!-- CELEBRATION -->
<div id="celebration">
  <div class="celebrate-title">🏆 Master Wizard! 🏆</div>
  <div class="celebrate-stars">⭐⭐⭐⭐⭐</div>
  <div class="celebrate-summary">
    You have mastered the pH Rainbow!<br>
    <strong style="color:#fbbf24">Acids</strong> turn indicators red & pink ·
    <strong style="color:#22c55e">Neutral</strong> stays purple ·
    <strong style="color:#06b6d4">Bases</strong> glow green & blue
  </div>
  <div class="ph-bar-final" id="ph-bar-final"></div>
  <button class="magic-btn" onclick="restartAll()" style="background:linear-gradient(135deg,#059669,#0891b2);">
    🔄 Play Again
  </button>
</div>

<script>
/* ══════════════════════════════════════════
   BACKGROUND CANVAS — Stars + Nebula
══════════════════════════════════════════ */
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [], nebulaPts = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = Array.from({length: 120}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.008 + 0.003,
      phase: Math.random() * Math.PI * 2
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    // nebula glow
    const grd = ctx.createRadialGradient(W*0.3, H*0.4, 0, W*0.3, H*0.4, W*0.5);
    grd.addColorStop(0, 'rgba(124,58,237,0.12)');
    grd.addColorStop(0.5, 'rgba(79,70,229,0.06)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,W,H);
    const grd2 = ctx.createRadialGradient(W*0.75, H*0.65, 0, W*0.75, H*0.65, W*0.4);
    grd2.addColorStop(0, 'rgba(6,182,212,0.09)');
    grd2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd2;
    ctx.fillRect(0,0,W,H);
    // stars
    stars.forEach(s => {
      const alpha = 0.4 + 0.5 * Math.sin(t * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(220,210,255,${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

/* ══════════════════════════════════════════
   FLOATING MAGIC OBJECTS
══════════════════════════════════════════ */
(function() {
  const objs = ['📚','🪄','🦉','⚗️','🌟','📖','✨','🔮','💫','🌙','⭐','🧪','📜','🕯️','🌟'];
  const container = document.getElementById('magic-objects');
  objs.forEach((emoji, i) => {
    const el = document.createElement('div');
    el.className = 'float-obj';
    el.textContent = emoji;
    el.style.left = (5 + (i * 6.5) % 92) + '%';
    el.style.top = (5 + (i * 7.3) % 85) + '%';
    el.style.animationDuration = (4 + Math.random() * 5) + 's';
    el.style.animationDelay = (-Math.random() * 5) + 's';
    el.style.fontSize = (1 + Math.random() * 0.9) + 'rem';
    container.appendChild(el);
  });

  // Sparkling particles
  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    const colors = ['#a78bfa','#34d399','#f472b6','#fbbf24','#67e8f9','#c084fc'];
    const size = 2 + Math.random() * 4;
    p.style.cssText = `
      left:${Math.random()*100}%;
      width:${size}px; height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${6+Math.random()*8}s;
      animation-delay:${Math.random()*4}s;
      box-shadow:0 0 ${size*2}px currentColor;
    `;
    container.appendChild(p);
    setTimeout(() => p.remove(), 14000);
  }
  for(let i=0;i<18;i++) spawnParticle();
  setInterval(() => spawnParticle(), 1200);
})();

/* ══════════════════════════════════════════
   SPARK EFFECT ON DROP
══════════════════════════════════════════ */
function spawnSparks(x, y, color) {
  const emojis = ['✨','💫','⭐','🌟','★'];
  for(let i=0;i<6;i++) {
    const s = document.createElement('div');
    s.className = 'magic-spark';
    s.textContent = emojis[i % emojis.length];
    const angle = (i / 6) * Math.PI * 2;
    const dist = 40 + Math.random() * 40;
    s.style.setProperty('--sx', Math.cos(angle)*dist + 'px');
    s.style.setProperty('--sy', Math.sin(angle)*dist + 'px');
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.color = color;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}

/* ══════════════════════════════════════════
   FEEDBACK TOAST
══════════════════════════════════════════ */
let feedbackTimeout;
function showFeedback(msg, type) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(feedbackTimeout);
  feedbackTimeout = setTimeout(() => el.className = '', 2200);
}

/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
const LIQUIDS = [
  { id:'lemon',   label:'🍋 Lemon Juice',   type:'acid',    color:'#ef4444', ph:2,  indicator:'#e83e3e' },
  { id:'vinegar', label:'🍶 Vinegar',         type:'acid',    color:'#f97316', ph:3,  indicator:'#f06b35' },
  { id:'cola',    label:'🥤 Cola Drink',      type:'acid',    color:'#eab308', ph:4,  indicator:'#e8a320' },
  { id:'water',   label:'💧 Pure Water',      type:'neutral', color:'#22c55e', ph:7,  indicator:'#8b5cf6' },
  { id:'soap',    label:'🧼 Soap Water',      type:'base',    color:'#06b6d4', ph:10, indicator:'#3b82f6' },
  { id:'detergent',label:'🫧 Detergent',      type:'base',    color:'#6366f1', ph:12, indicator:'#22d3ee' },
];

const PH_COLORS = [
  '#e83e3e','#f06b35','#e8a320','#8b5cf6','#3b82f6','#22d3ee'
];

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let currentActivity = 1;
let act1State = { dropped: {} };
let act2State = { matched: {} };
let act3State = { placed: {} };

/* ══════════════════════════════════════════
   DRAG STATE
══════════════════════════════════════════ */
let dragData = null;

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function render() {
  const container = document.getElementById('activity-container');
  [1,2,3].forEach(i => {
    const dot = document.getElementById('dot-'+i);
    dot.className = 'dot' + (i < currentActivity ? ' done' : i === currentActivity ? ' active' : '');
  });
  if (currentActivity === 1) renderAct1(container);
  else if (currentActivity === 2) renderAct2(container);
  else if (currentActivity === 3) renderAct3(container);
}

/* ══════════════════════════════════════════
   ACTIVITY 1 — Sort Liquids
══════════════════════════════════════════ */
function renderAct1(container) {
  const dropped = act1State.dropped;
  const droppedIds = Object.values(dropped).flat();
  const remaining = LIQUIDS.filter(l => !droppedIds.includes(l.id));

  const zones = ['acid','neutral','base'];
  const zoneInfo = {
    acid:    { label:'⚡ Acid Kingdom', emoji:'🔴', bg:'rgba(239,68,68,0.08)', border:'#ef4444', textColor:'#fca5a5' },
    neutral: { label:'⚖️ Neutral Realm', emoji:'💜', bg:'rgba(34,197,94,0.08)', border:'#22c55e', textColor:'#86efac' },
    base:    { label:'🌊 Base Kingdom', emoji:'🔵', bg:'rgba(6,182,212,0.08)', border:'#06b6d4', textColor:'#67e8f9' },
  };

  container.innerHTML = `
    <div class="activity-title">
      <span class="badge">Activity 1 of 3</span>
      🧪 Sort the Magic Potions
    </div>
    <div class="activity-desc">Drag each liquid into the correct kingdom — Acid, Neutral, or Base!</div>
    <div class="items-tray" id="act1-tray">
      ${remaining.map(l => `
        <div class="drag-item"
          style="background:${l.color}22; border-color:${l.color}; color:${l.color};"
          id="item-${l.id}"
          draggable="true"
          data-id="${l.id}">
          ${l.label}
        </div>
      `).join('')}
    </div>
    <div class="zones-row">
      ${zones.map(z => `
        <div class="drop-zone zone-${z}" id="zone-${z}"
          style="background:${zoneInfo[z].bg}; border-color:${zoneInfo[z].border};">
          <div class="drop-zone-label" style="color:${zoneInfo[z].textColor};">${zoneInfo[z].label}</div>
          ${(dropped[z]||[]).map(id => {
            const liq = LIQUIDS.find(l=>l.id===id);
            return `<div class="dropped-item" style="background:${liq.color}33; color:${liq.color}; border:1px solid ${liq.color};">${liq.label}</div>`;
          }).join('')}
        </div>
      `).join('')}
    </div>
    <button class="magic-btn" id="act1-next" onclick="checkAct1()">
      Check My Answers ✨
    </button>
  `;

  setupDragItems();
  setupAct1DropZones();
}

function setupDragItems() {
  document.querySelectorAll('.drag-item').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragData = { id: el.dataset.id, source: 'tray' };
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    // Touch support
    el.addEventListener('touchstart', touchStart, {passive:true});
    el.addEventListener('touchmove', touchMove, {passive:false});
    el.addEventListener('touchend', touchEnd);
  });
}

function setupAct1DropZones() {
  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      if (!dragData) return;
      const zoneType = zone.id.replace('zone-','');
      const existing = act1State.dropped[zoneType] || [];
      // check not already placed
      for(const z in act1State.dropped) {
        if((act1State.dropped[z]||[]).includes(dragData.id)) return;
      }
      act1State.dropped[zoneType] = [...existing, dragData.id];
      const rect = zone.getBoundingClientRect();
      const liq = LIQUIDS.find(l=>l.id===dragData.id);
      spawnSparks(rect.left + rect.width/2, rect.top + rect.height/2, liq.color);
      dragData = null;
      renderAct1(document.getElementById('activity-container'));
    });
  });
}

function checkAct1() {
  const dropped = act1State.dropped;
  let allCorrect = true;
  let totalPlaced = 0;
  for(const z in dropped) totalPlaced += (dropped[z]||[]).length;
  if(totalPlaced < LIQUIDS.length) {
    showFeedback('⚗️ Place all potions before checking!', 'wrong');
    return;
  }
  for(const z in dropped) {
    for(const id of (dropped[z]||[])) {
      const liq = LIQUIDS.find(l=>l.id===id);
      if(liq.type !== z) { allCorrect = false; break; }
    }
  }
  if(allCorrect) {
    showFeedback('🌟 Brilliant! All potions sorted correctly!', 'correct');
    setTimeout(() => goToActivity(2), 1400);
  } else {
    showFeedback('🤔 Some potions are in the wrong kingdom! Try again!', 'wrong');
    act1State.dropped = {};
    setTimeout(() => renderAct1(document.getElementById('activity-container')), 1400);
  }
}

/* ══════════════════════════════════════════
   ACTIVITY 2 — Match pH Colors
══════════════════════════════════════════ */
function renderAct2(container) {
  const matched = act2State.matched;
  const matchedColorIds = Object.keys(matched);
  const availableColors = LIQUIDS.filter(l => !matchedColorIds.includes(l.id));

  container.innerHTML = `
    <div class="activity-title">
      <span class="badge">Activity 2 of 3</span>
      🌈 Match the Indicator Colors!
    </div>
    <div class="activity-desc">Drag each color card onto the correct test tube — red for acids, purple for neutral, blue/green for bases!</div>
    <div class="color-cards-tray" id="act2-tray">
      ${availableColors.map(l => `
        <div class="color-card" draggable="true"
          data-id="${l.id}"
          style="background:${l.indicator}; box-shadow:0 0 14px ${l.indicator}80;"
          title="${l.label}">
        </div>
      `).join('')}
    </div>
    <div class="test-samples">
      ${LIQUIDS.map(l => {
        const m = matched[l.id];
        return `
        <div class="test-sample">
          <div class="test-tube" id="tube-${l.id}">
            <div class="tube-fill" style="background:${m ? m.indicator + 'cc' : 'rgba(255,255,255,0.06)'}; height:${m?'70%':'40%'}"></div>
          </div>
          <div class="test-tube-drop ${m?'filled':''}"
            id="tslot-${l.id}"
            data-target="${l.id}"
            style="${m ? 'background:'+m.indicator+'55; border-color:'+m.indicator+';' : ''}">
            ${m ? `<div style="font-size:0.6rem;color:${m.indicator};">✓</div>` : ''}
          </div>
          <div class="sample-label" style="color:${l.color}aa">${l.label}</div>
        </div>`;
      }).join('')}
    </div>
    <button class="magic-btn" onclick="checkAct2()">Check Colors ✨</button>
  `;

  document.querySelectorAll('.color-card').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragData = { id: el.dataset.id, type: 'color' };
      el.style.opacity = '0.3';
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => el.style.opacity = '1');
    el.addEventListener('touchstart', touchStart, {passive:true});
    el.addEventListener('touchmove', touchMove, {passive:false});
    el.addEventListener('touchend', touchEnd);
  });

  document.querySelectorAll('.test-tube-drop').forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('over');
      if (!dragData) return;
      const targetId = slot.dataset.target;
      const sourceColor = LIQUIDS.find(l=>l.id===dragData.id);
      act2State.matched[dragData.id] = { ...sourceColor, placedOn: targetId };
      const rect = slot.getBoundingClientRect();
      spawnSparks(rect.left+rect.width/2, rect.top+rect.height/2, sourceColor.indicator);
      dragData = null;
      renderAct2(document.getElementById('activity-container'));
    });
  });
}

function checkAct2() {
  const matched = act2State.matched;
  if(Object.keys(matched).length < LIQUIDS.length) {
    showFeedback('🧪 Match all test tubes first!', 'wrong');
    return;
  }
  let allCorrect = true;
  for(const id in matched) {
    if(matched[id].placedOn !== id) { allCorrect = false; break; }
  }
  if(allCorrect) {
    showFeedback('🌟 Perfect color matches! You\'re a pH wizard!', 'correct');
    setTimeout(() => goToActivity(3), 1400);
  } else {
    showFeedback('🎨 Some colors don\'t match! Try again!', 'wrong');
    act2State.matched = {};
    setTimeout(() => renderAct2(document.getElementById('activity-container')), 1400);
  }
}

/* ══════════════════════════════════════════
   ACTIVITY 3 — pH Rainbow Scale
══════════════════════════════════════════ */
const CORRECT_ORDER = ['lemon','vinegar','cola','water','soap','detergent'];

function renderAct3(container) {
  const placed = act3State.placed;
  const placedIds = Object.values(placed).filter(Boolean);
  const remaining = LIQUIDS.filter(l => !placedIds.includes(l.id));

  const segColors = [
    '#ef4444','#f97316','#eab308','#8b5cf6','#3b82f6','#22d3ee'
  ];

  container.innerHTML = `
    <div class="activity-title">
      <span class="badge">Activity 3 of 3</span>
      🌈 Build the pH Rainbow!
    </div>
    <div class="activity-desc">Arrange all liquids from most acidic (left) to most basic (right) on the rainbow scale!</div>
    <div class="act3-items" id="act3-tray">
      ${remaining.map(l => `
        <div class="drag-item"
          style="background:${l.color}22; border-color:${l.color}; color:${l.color};"
          id="item3-${l.id}"
          draggable="true"
          data-id="${l.id}">
          ${l.label}
        </div>
      `).join('')}
    </div>
    <div class="rainbow-track">
      <div class="scale-label">Most Acidic →</div>
      <div class="scale-slots">
        ${[0,1,2,3,4,5].map(i => {
          const pid = placed[i];
          const liq = pid ? LIQUIDS.find(l=>l.id===pid) : null;
          return `
          <div class="scale-slot ${liq?'filled':''}"
            id="slot-${i}"
            data-slot="${i}"
            style="${liq ? `border-color:${liq.color}; background:${liq.color}18;` : `border-color:${segColors[i]}55;`}">
            <div class="slot-number">${i+1}</div>
            ${liq ? `<div class="slot-content" style="color:${liq.color};">${liq.label}</div>` : `<span style="font-size:1rem;">${['🔴','🟠','🟡','🟣','🔵','🩵'][i]}</span>`}
          </div>`;
        }).join('')}
      </div>
      <div class="scale-label" style="transform:rotate(0deg);writing-mode:horizontal-tb; font-size:0.55rem; color:rgba(200,185,255,0.5);">← Most Basic</div>
    </div>
    <!-- Color legend bar -->
    <div style="display:flex;gap:2px;justify-content:center;margin:4px 0;">
      ${segColors.map((c,i)=>`<div style="width:36px;height:6px;border-radius:3px;background:${c};opacity:0.7;"></div>`).join('')}
    </div>
    <button class="magic-btn" onclick="checkAct3()">Complete the Rainbow! ✨</button>
  `;

  document.querySelectorAll('#act3-tray .drag-item').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragData = { id: el.dataset.id };
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('touchstart', touchStart, {passive:true});
    el.addEventListener('touchmove', touchMove, {passive:false});
    el.addEventListener('touchend', touchEnd);
  });

  document.querySelectorAll('.scale-slot').forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('over');
      if(!dragData) return;
      const slotIdx = parseInt(slot.dataset.slot);
      if(act3State.placed[slotIdx]) return;
      act3State.placed[slotIdx] = dragData.id;
      const liq = LIQUIDS.find(l=>l.id===dragData.id);
      const rect = slot.getBoundingClientRect();
      spawnSparks(rect.left+rect.width/2, rect.top+rect.height/2, liq.color);
      dragData = null;
      renderAct3(document.getElementById('activity-container'));
    });
  });
}

function checkAct3() {
  const placed = act3State.placed;
  if(Object.keys(placed).length < 6) {
    showFeedback('🌈 Place all liquids on the scale first!', 'wrong');
    return;
  }
  let correct = true;
  for(let i=0;i<6;i++) {
    if(placed[i] !== CORRECT_ORDER[i]) { correct = false; break; }
  }
  if(correct) {
    showFeedback('🏆 Perfect Rainbow! You\'re a Master pH Wizard!', 'correct');
    setTimeout(() => showCelebration(), 1400);
  } else {
    showFeedback('🤔 The order isn\'t quite right! Think: most sour → most slippery!', 'wrong');
    act3State.placed = {};
    setTimeout(() => renderAct3(document.getElementById('activity-container')), 1600);
  }
}

/* ══════════════════════════════════════════
   TOUCH DRAG SUPPORT
══════════════════════════════════════════ */
let touchEl = null, touchClone = null, touchOffX=0, touchOffY=0;

function touchStart(e) {
  const el = e.currentTarget;
  dragData = { id: el.dataset.id };
  touchEl = el;
  const rect = el.getBoundingClientRect();
  touchOffX = e.touches[0].clientX - rect.left;
  touchOffY = e.touches[0].clientY - rect.top;
  touchClone = el.cloneNode(true);
  touchClone.style.cssText += `position:fixed;z-index:99999;pointer-events:none;opacity:0.85;transform:scale(1.1);transition:none;left:${rect.left}px;top:${rect.top}px;`;
  document.body.appendChild(touchClone);
  el.style.opacity = '0.3';
}

function touchMove(e) {
  e.preventDefault();
  if(!touchClone) return;
  const tx = e.touches[0].clientX - touchOffX;
  const ty = e.touches[0].clientY - touchOffY;
  touchClone.style.left = tx + 'px';
  touchClone.style.top = ty + 'px';
  // highlight drop targets
  const ex = e.touches[0].clientX, ey = e.touches[0].clientY;
  document.querySelectorAll('.drop-zone,.test-tube-drop,.scale-slot').forEach(z => {
    const r = z.getBoundingClientRect();
    if(ex>=r.left&&ex<=r.right&&ey>=r.top&&ey<=r.bottom) z.classList.add('over');
    else z.classList.remove('over');
  });
}

function touchEnd(e) {
  if(touchEl) touchEl.style.opacity = '1';
  if(touchClone) { touchClone.remove(); touchClone = null; }
  const ex = e.changedTouches[0].clientX, ey = e.changedTouches[0].clientY;
  document.querySelectorAll('.drop-zone,.test-tube-drop,.scale-slot').forEach(z => {
    z.classList.remove('over');
    const r = z.getBoundingClientRect();
    if(ex>=r.left&&ex<=r.right&&ey>=r.top&&ey<=r.bottom && dragData) {
      const ev = new DragEvent ? {preventDefault:()=>{},stopPropagation:()=>{}} : null;
      // Manually trigger drop logic
      if(z.classList.contains('drop-zone')) {
        const zoneType = z.id.replace('zone-','');
        const existing = act1State.dropped[zoneType] || [];
        for(const zz in act1State.dropped) { if((act1State.dropped[zz]||[]).includes(dragData.id)) return; }
        act1State.dropped[zoneType] = [...existing, dragData.id];
        const liq = LIQUIDS.find(l=>l.id===dragData.id);
        spawnSparks(ex, ey, liq.color);
        dragData = null;
        renderAct1(document.getElementById('activity-container'));
      } else if(z.classList.contains('test-tube-drop')) {
        const targetId = z.dataset.target;
        const sourceColor = LIQUIDS.find(l=>l.id===dragData.id);
        act2State.matched[dragData.id] = { ...sourceColor, placedOn: targetId };
        spawnSparks(ex, ey, sourceColor.indicator);
        dragData = null;
        renderAct2(document.getElementById('activity-container'));
      } else if(z.classList.contains('scale-slot')) {
        const slotIdx = parseInt(z.dataset.slot);
        if(!act3State.placed[slotIdx]) {
          act3State.placed[slotIdx] = dragData.id;
          const liq = LIQUIDS.find(l=>l.id===dragData.id);
          spawnSparks(ex, ey, liq.color);
          dragData = null;
          renderAct3(document.getElementById('activity-container'));
        }
      }
    }
  });
  dragData = null;
}

/* ══════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════ */
function goToActivity(n) {
  const container = document.getElementById('activity-container');
  container.classList.add('slide-out');
  setTimeout(() => {
    container.classList.remove('slide-out');
    currentActivity = n;
    render();
    container.classList.add('slide-in');
    setTimeout(() => container.classList.remove('slide-in'), 500);
  }, 350);
}

/* ══════════════════════════════════════════
   CELEBRATION
══════════════════════════════════════════ */
function showCelebration() {
  const cel = document.getElementById('celebration');
  cel.classList.add('show');

  // ph bar
  const colors = ['#ef4444','#f97316','#eab308','#8b5cf6','#3b82f6','#22d3ee'];
  const bar = document.getElementById('ph-bar-final');
  bar.innerHTML = colors.map((c,i) => `<div class="ph-seg" style="background:${c};animation-delay:${i*0.15}s;width:40px;height:24px;border-radius:4px;"></div>`).join('');

  // fireworks
  const emojis = ['🎉','✨','🌟','💫','🎊','⭐','🏆'];
  for(let i=0;i<16;i++) {
    const fw = document.createElement('div');
    fw.className = 'firework';
    fw.textContent = emojis[i % emojis.length];
    const tx = (Math.random()-0.5)*400;
    const ty = (Math.random()-0.5)*400;
    fw.style.setProperty('--tx', tx+'px');
    fw.style.setProperty('--ty', ty+'px');
    fw.style.left = (20 + Math.random()*60) + '%';
    fw.style.top = (20 + Math.random()*60) + '%';
    fw.style.animationDelay = (Math.random()*2) + 's';
    fw.style.animationDuration = (1.2 + Math.random()) + 's';
    cel.appendChild(fw);
  }
}

function restartAll() {
  act1State = { dropped: {} };
  act2State = { matched: {} };
  act3State = { placed: {} };
  currentActivity = 1;
  const cel = document.getElementById('celebration');
  cel.classList.remove('show');
  cel.querySelectorAll('.firework').forEach(f=>f.remove());
  render();
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
render();
</script>
