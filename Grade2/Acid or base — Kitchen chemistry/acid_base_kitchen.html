<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ACID OR BASE? — KITCHEN CHEMISTRY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#1a0a02;font-family:'Nunito',sans-serif;}

/* ══════════ KITCHEN WORLD ══════════ */
#kitchen{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#2d1a08 0%,#3d2010 25%,#4a2812 45%,#3a1e08 65%,#2a1505 100%);}

/* Tile wall */
#wall{position:absolute;top:0;left:0;right:0;height:58%;
  background:repeating-linear-gradient(90deg,#4a2e18 0px,#4a2e18 49px,#5a3820 50px,#5a3820 51px,#4a2e18 52px),
             repeating-linear-gradient(0deg,#4a2e18 0px,#4a2e18 49px,#5a3820 50px,#5a3820 51px,#4a2e18 52px);
  opacity:.55;}
#wall::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,140,0,.06) 0%,rgba(180,80,0,.12) 60%,rgba(80,30,0,.3) 100%);}

/* Counter */
#counter{position:absolute;bottom:0;left:0;right:0;height:34%;
  background:linear-gradient(180deg,#7a4820 0%,#5a3010 40%,#3d200a 100%);
  border-top:4px solid #9a6030;}
#counter::before{content:'';position:absolute;top:0;left:0;right:0;height:10px;
  background:linear-gradient(180deg,#c0803a,#7a4820);}

/* Shelf */
#shelf{position:absolute;top:35%;left:0;right:0;height:8px;
  background:linear-gradient(180deg,#a07040,#6a4020);
  box-shadow:0 4px 12px rgba(0,0,0,.5);}

/* Pots */
.pot{position:absolute;font-size:2.2rem;bottom:31%;animation:potBob ease-in-out infinite alternate;pointer-events:none;}
@keyframes potBob{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-5px) rotate(2deg)}}

/* Steam puffs */
.steam{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);
  animation:steamRise linear infinite;pointer-events:none;}
@keyframes steamRise{0%{transform:translateY(0) scale(1) translateX(0);opacity:.6}
  50%{transform:translateY(-40px) scale(1.6) translateX(8px);opacity:.35}
  100%{transform:translateY(-90px) scale(.4) translateX(-5px);opacity:0}}

/* Floating ingredients */
.flt{position:absolute;font-size:1.3rem;animation:floatItem ease-in-out infinite alternate;pointer-events:none;}
@keyframes floatItem{0%{transform:translateY(0) rotate(-5deg) scale(1)}100%{transform:translateY(-14px) rotate(5deg) scale(1.08)}}

/* Chef hats */
.chef{position:absolute;font-size:1.6rem;animation:chefSway ease-in-out infinite alternate;pointer-events:none;}
@keyframes chefSway{0%{transform:rotate(-6deg) translateY(0)}100%{transform:rotate(6deg) translateY(-8px)}}

/* Kitchen sparks */
.spark{position:absolute;width:5px;height:5px;border-radius:50%;animation:sparkPop ease-out forwards;pointer-events:none;}
@keyframes sparkPop{0%{transform:scale(0) translate(0,0);opacity:1}
  60%{opacity:.8}100%{transform:scale(1) translate(var(--tx),var(--ty));opacity:0}}

/* Spoon swings */
.spoon{position:absolute;font-size:1.4rem;animation:spoonSwing ease-in-out infinite alternate;pointer-events:none;}
@keyframes spoonSwing{0%{transform:rotate(-20deg) translateY(0)}100%{transform:rotate(20deg) translateY(-4px)}}

/* Bubbles in pots */
.potbub{position:absolute;border-radius:50%;background:rgba(255,200,100,.4);
  animation:bubUp ease-in-out infinite;pointer-events:none;}
@keyframes bubUp{0%{transform:scale(0) translateY(0);opacity:.8}100%{transform:scale(1.5) translateY(-30px);opacity:0}}

/* Ambient glow on counter */
#glow-left{position:absolute;bottom:25%;left:12%;width:120px;height:50px;border-radius:50%;
  background:rgba(255,120,0,.18);animation:glowPulse 3s ease-in-out infinite alternate;pointer-events:none;}
#glow-right{position:absolute;bottom:25%;right:12%;width:100px;height:40px;border-radius:50%;
  background:rgba(255,80,0,.14);animation:glowPulse 4s ease-in-out infinite alternate;pointer-events:none;}
@keyframes glowPulse{0%{opacity:.4;transform:scaleX(1)}100%{opacity:.9;transform:scaleX(1.15)}}

/* ══════════ APP SHELL ══════════ */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:7px 10px 5px;gap:4px;}

/* Header */
#hdr h1{font-family:'Fredoka One',cursive;font-size:clamp(.9rem,2.8vw,1.45rem);
  color:#FFD700;text-align:center;letter-spacing:2px;text-shadow:0 2px 12px rgba(255,120,0,.7),0 0 30px rgba(255,200,0,.3);}
#hdr .sub{font-family:'Nunito',sans-serif;font-size:clamp(.52rem,1.3vw,.64rem);
  color:rgba(255,200,120,.8);text-align:center;letter-spacing:3px;font-weight:700;margin-top:1px;}

/* Progress */
#prog{display:flex;gap:5px;align-items:center;}
.pdot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:.62rem;font-weight:700;
  border:2px solid rgba(255,200,100,.25);color:rgba(255,200,100,.3);
  background:rgba(255,120,0,.08);transition:all .4s;}
.pdot.active{background:radial-gradient(circle,#ff8c00,#c05000);color:#fff8e0;
  border-color:#FFD700;transform:scale(1.22);box-shadow:0 0 16px rgba(255,140,0,.7);}
.pdot.done{background:radial-gradient(circle,#2ecc71,#1a8a4a);color:#fff;
  border-color:#2ecc71;box-shadow:0 0 10px rgba(46,204,113,.4);}
.pcon{width:22px;height:2px;background:rgba(255,200,100,.18);border-radius:2px;position:relative;overflow:hidden;}
.pcon.done::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#ff8c00,#2ecc71);}

/* Activity card */
#card{background:rgba(20,8,2,.75);backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,160,40,.3);border-radius:18px;
  padding:10px 14px 8px;width:100%;max-width:800px;flex:1;
  display:flex;flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,200,100,.1);
  overflow:hidden;position:relative;}
#card::before{content:'';position:absolute;top:-1px;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,#FFD700,transparent);}
.act-title{font-family:'Fredoka One',cursive;font-size:clamp(.78rem,2.3vw,1rem);
  color:#FFD700;text-align:center;margin-bottom:2px;
  text-shadow:0 0 14px rgba(255,180,0,.5);}
.act-desc{font-size:clamp(.57rem,1.35vw,.69rem);color:rgba(255,210,150,.82);
  text-align:center;margin-bottom:7px;font-weight:700;line-height:1.4;}

/* DnD wrap */
.dw{flex:1;display:flex;gap:8px;min-height:0;}

/* Item bank */
.ibank{display:flex;flex-direction:column;gap:4px;width:145px;flex-shrink:0;}
.blbl{font-size:.5rem;font-weight:800;color:rgba(255,200,100,.55);
  text-align:center;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}

/* Drag items */
.di{padding:6px 8px;border-radius:11px;cursor:grab;user-select:none;
  font-size:.64rem;font-weight:700;display:flex;align-items:center;gap:5px;
  border:1.5px solid rgba(255,255,255,.15);color:#fff;
  transition:transform .2s,box-shadow .2s,opacity .3s;position:relative;}
.di:hover{transform:scale(1.05);box-shadow:0 4px 18px rgba(0,0,0,.55);}
.di.dragging{opacity:.3;cursor:grabbing;}
.di.placed{opacity:.28;pointer-events:none;}
.di .ico{font-size:1.1rem;flex-shrink:0;}
.di *{pointer-events:none;}

/* ── Activity 1 & 3: Category zones ── */
.zones-wrap{flex:1;display:flex;flex-direction:column;gap:5px;}
.dz{flex:1;border-radius:13px;border:2px dashed rgba(255,200,100,.3);
  padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:44px;transition:border-color .3s,background .3s;position:relative;overflow:hidden;}
.dz::after{content:'';position:absolute;inset:0;border-radius:13px;pointer-events:none;
  background:var(--zone-glow,transparent);opacity:.12;transition:opacity .3s;}
.dz.over{border-color:#FFD700;--zone-glow:#FFD700;}
.dz.ok{border-color:#2ecc71;--zone-glow:#2ecc71;background:rgba(46,204,113,.07);}
.dz.bad{border-color:#e74c3c;--zone-glow:#e74c3c;background:rgba(231,76,60,.07);}
.dz *{pointer-events:none;}
.dz-row{display:flex;align-items:center;gap:6px;width:100%;}
.dz-emoji{font-size:1.2rem;flex-shrink:0;}
.dz-lbl{font-family:'Fredoka One',cursive;font-size:.62rem;letter-spacing:.5px;}
.chip-row{display:flex;flex-wrap:wrap;gap:3px;width:100%;}
.chip{font-size:.57rem;font-weight:700;padding:2px 7px;border-radius:8px;
  color:#fff;animation:chipIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes chipIn{from{transform:scale(0) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}

/* ── Activity 2: Beaker lab ── */
.beaker-area{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;}
.beaker-slot{border-radius:13px;border:1.5px dashed rgba(255,200,100,.28);
  padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  min-height:90px;background:rgba(255,120,0,.04);transition:border-color .3s,background .3s;
  position:relative;overflow:hidden;}
.beaker-slot.over{border-color:#FFD700;background:rgba(255,200,0,.08);}
.beaker-slot *{pointer-events:none;}
.bk-title{font-family:'Fredoka One',cursive;font-size:.58rem;color:rgba(255,200,100,.65);
  text-transform:uppercase;letter-spacing:1px;text-align:center;}
.bk-body{width:52px;height:64px;position:relative;display:flex;align-items:flex-end;justify-content:center;}
.bk-glass{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:44px;height:56px;border:2.5px solid rgba(200,230,255,.5);
  border-top:none;border-radius:0 0 8px 8px;overflow:hidden;}
.bk-liquid{position:absolute;bottom:0;left:0;right:0;height:60%;
  transition:background 1.2s ease,height .8s ease;border-radius:0 0 6px 6px;}
.bk-bubbles{position:absolute;bottom:0;left:0;right:0;height:100%;}
.bkbub{position:absolute;border-radius:50%;animation:bkbubRise ease-out forwards;pointer-events:none;}
@keyframes bkbubRise{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
.bk-label{font-size:.62rem;font-weight:800;color:rgba(255,200,100,.9);text-align:center;}
.bk-result{font-family:'Fredoka One',cursive;font-size:.7rem;text-align:center;
  transition:all .6s;min-height:16px;}
.dropped-item{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:7px;
  color:#fff;animation:chipIn .35s cubic-bezier(.34,1.56,.64,1);}

/* ── Beaker ingredient hint ── */
.bk-hint{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:1px;animation:hintPulse 2s ease-in-out infinite alternate;}
@keyframes hintPulse{0%{opacity:.7;transform:translateY(0)}100%{opacity:1;transform:translateY(-3px)}}
.bk-hint-arrow{font-size:.7rem;color:rgba(255,210,100,.7);line-height:1;}
.bk-hint-badge{font-size:.58rem;font-weight:800;padding:3px 8px;border-radius:9px;
  color:#fff;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.5);
  box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;}

/* ── Sequence slots ── */
.sseq{flex:1;display:flex;flex-direction:column;gap:5px;}
.sslot{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:11px;
  border:1.5px dashed rgba(255,200,100,.28);min-height:40px;
  background:rgba(255,120,0,.04);transition:all .3s;}
.sslot.over{border-color:#FFD700;background:rgba(255,200,0,.08);}
.sslot.ok{border-color:#2ecc71;background:rgba(46,204,113,.07);}
.sslot *{pointer-events:none;}
.snum{font-family:'Fredoka One',cursive;font-size:.88rem;color:#FFD700;min-width:19px;text-align:center;}
.stxt{font-size:.62rem;font-weight:700;color:rgba(255,200,100,.45);}

/* ── Bottom buttons ── */
#chkbtn{margin:5px auto 0;padding:8px 26px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:.78rem;letter-spacing:1px;
  background:linear-gradient(135deg,#c05000,#ff8c00,#FFD700);color:#1a0802;
  box-shadow:0 3px 16px rgba(255,140,0,.55);transition:transform .2s;display:block;}
#chkbtn:hover{transform:scale(1.06);}
#chkbtn:active{transform:scale(.97);}
#rstbtn{margin:3px auto 0;padding:5px 17px;border-radius:50px;
  border:1.5px solid rgba(255,200,100,.3);cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:.64rem;font-weight:700;
  background:rgba(255,120,0,.1);color:rgba(255,200,100,.7);transition:all .2s;display:block;}
#rstbtn:hover{background:rgba(255,120,0,.22);color:#FFD700;}
#fb{text-align:center;font-size:.68rem;font-weight:700;min-height:13px;transition:all .3s;}

/* ── Popup ── */
#popup{position:fixed;inset:0;z-index:200;background:rgba(10,4,0,.82);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease;}
#popup.hidden{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pbox{background:linear-gradient(160deg,#1a0802 0%,#2d1208 50%,#0a1a08 100%);
  border:2px solid #FFD700;border-radius:22px;padding:22px 26px 18px;
  max-width:400px;width:90%;text-align:center;
  box-shadow:0 20px 80px rgba(0,0,0,.9),0 0 40px rgba(255,140,0,.2);
  animation:pboxIn .5s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;}
.pbox::before{content:'';position:absolute;top:-1px;left:15%;right:15%;height:2px;
  background:linear-gradient(90deg,transparent,#FFD700,transparent);}
.pico{font-size:2.8rem;display:block;margin-bottom:5px;animation:floatB 1.2s ease-in-out infinite alternate;}
@keyframes floatB{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.ptitle{font-family:'Fredoka One',cursive;font-size:1.3rem;color:#FFD700;margin-bottom:5px;
  text-shadow:0 0 20px rgba(255,200,0,.5);}
.pmsg{font-size:.79rem;color:rgba(255,220,170,.9);font-weight:600;line-height:1.55;margin-bottom:14px;}
.pbtn{padding:10px 30px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:.85rem;letter-spacing:1px;
  background:linear-gradient(135deg,#c05000,#FFD700);color:#1a0802;
  box-shadow:0 4px 20px rgba(255,140,0,.5);transition:transform .2s;}
.pbtn:hover{transform:scale(1.07);}

/* Confetti */
.cf{position:fixed;border-radius:2px;animation:cfFall linear forwards;z-index:999;pointer-events:none;}
@keyframes cfFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes colorBurst{0%{transform:scale(0);opacity:.9}100%{transform:scale(5);opacity:0}}
</style>
</head>
<body>
<div id="kitchen" aria-hidden="true"></div>
<div id="app">
  <div id="hdr">
    <h1>🧪 Acid or Base? — Kitchen Chemistry! 🍋</h1>
    <div class="sub">✦ Become a Kitchen Science Detective! ✦</div>
  </div>
  <div id="prog">
    <div class="pdot active" id="pd1">1</div><div class="pcon" id="pc1"></div>
    <div class="pdot" id="pd2">2</div><div class="pcon" id="pc2"></div>
    <div class="pdot" id="pd3">3</div><div class="pcon" id="pc3"></div>
    <div class="pdot" id="pd4">🏆</div>
  </div>
  <div id="card"></div>
  <div id="fb"></div>
  <button id="chkbtn" onclick="checkAct()">🔬 Test My Answers!</button>
  <button id="rstbtn" onclick="resetAct()">↺ Reset Experiment</button>
</div>
<div id="popup" class="hidden"><div class="pbox" id="pbox"></div></div>

<script>
/* ═══════════════════════════
   BUILD KITCHEN BACKGROUND
═══════════════════════════ */
(function(){
  const k=document.getElementById('kitchen');

  // Static elements
  k.innerHTML+=`<div id="wall"></div><div id="counter"></div><div id="shelf"></div>
    <div id="glow-left"></div><div id="glow-right"></div>`;

  // Pots
  [[8,'🍲'],[28,'🥘'],[68,'🫕'],[88,'🍳']].forEach(([l,e],i)=>{
    const p=document.createElement('div');p.className='pot';
    p.textContent=e;p.style.cssText=`left:${l}%;animation-duration:${2+i*.3}s;animation-delay:${i*.5}s;font-size:${2+Math.random()*.4}rem;`;
    k.appendChild(p);
    // Steam from pot
    for(let j=0;j<3;j++){
      const s=document.createElement('div');s.className='steam';
      s.style.cssText=`left:${l+1+j*1.5}%;bottom:${38+j*2}%;animation-duration:${1.5+j*.4}s;animation-delay:${j*.5+i*.3}s;`;
      k.appendChild(s);
    }
    // Bubbles above pot
    for(let j=0;j<2;j++){
      const b=document.createElement('div');b.className='potbub';
      const sz=4+Math.random()*8;
      b.style.cssText=`left:${l+2+j*3}%;bottom:${32+j*2}%;width:${sz}px;height:${sz}px;animation-duration:${1.2+j*.5}s;animation-delay:${j*.6+i*.4}s;`;
      k.appendChild(b);
    }
  });

  // Floating ingredients (shelves area)
  const fltItems=[['🍋','15%','42%',0],['🧄','35%','38%',.8],['🧅','55%','40%',1.5],['🍅','75%','39%',2.2],
    ['🥛','90%','42%',.4],['🫙','5%','39%',1.2],['🌶️','45%','37%',2.8],['🧂','62%','42%',3.2]];
  fltItems.forEach(([e,l,b,d])=>{
    const f=document.createElement('div');f.className='flt';
    f.textContent=e;f.style.cssText=`left:${l};bottom:${b};animation-delay:${d}s;animation-duration:${3+d*.3}s;`;
    k.appendChild(f);
  });

  // Chef hats
  [[22,'48%'],[78,'46%']].forEach(([l,b],i)=>{
    const c=document.createElement('div');c.className='chef';
    c.textContent='👨‍🍳';c.style.cssText=`left:${l}%;bottom:${b};animation-delay:${i*.9}s;animation-duration:${2.5+i*.5}s;`;
    k.appendChild(c);
  });

  // Spoons
  [[18,'32%'],[50,'30%'],[82,'32%']].forEach(([l,b],i)=>{
    const s=document.createElement('div');s.className='spoon';
    s.textContent=['🥄','🍴','🥄'][i];s.style.cssText=`left:${l}%;bottom:${b};animation-delay:${i*.7}s;`;
    k.appendChild(s);
  });

  // Sparks (periodic)
  function spawnSparks(){
    const colors=['#FFD700','#ff8c00','#ff4500','#fff176'];
    for(let i=0;i<6;i++){
      const s=document.createElement('div');s.className='spark';
      const tx=(Math.random()*40-20)+'px',ty=(-Math.random()*30-10)+'px';
      s.style.cssText=`left:${10+Math.random()*80}%;bottom:${28+Math.random()*8}%;background:${colors[~~(Math.random()*colors.length)]};--tx:${tx};--ty:${ty};animation-duration:${.4+Math.random()*.4}s;animation-delay:${Math.random()*.3}s;`;
      k.appendChild(s);
      setTimeout(()=>s.remove(),900);
    }
    setTimeout(spawnSparks, 2000+Math.random()*3000);
  }
  setTimeout(spawnSparks,1000);
})();

/* ═══════════════════════════
   CONFETTI
═══════════════════════════ */
function confetti(n=30){
  const cols=['#FFD700','#ff8c00','#2ecc71','#e74c3c','#3498db','#e91e63','#8bc34a'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;background:${cols[~~(Math.random()*cols.length)]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*1.2}s;width:${4+Math.random()*7}px;height:${4+Math.random()*7}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4500);
  }
}

/* ═══════════════════════════
   ACTIVITY DATA
═══════════════════════════ */
// Indicator colors:  acid=yellow stays, base=turns red, neutral=stays pale
const ACTS=[
  {
    id:1, logic:'sort3',
    title:'🧪 Activity 1 — Test with Turmeric Indicator!',
    desc:'Turmeric water is our magic detector! Drag each ingredient to the right zone and watch the color change!',
    items:[
      {id:'a1',ico:'🍋',lbl:'Lemon Juice',cat:'acid',color:'linear-gradient(135deg,#8a6000,#e8c000)'},
      {id:'a2',ico:'🍅',lbl:'Tomato Juice',cat:'acid',color:'linear-gradient(135deg,#8a1a00,#e03010)'},
      {id:'a3',ico:'🧼',lbl:'Soap Water',cat:'base',color:'linear-gradient(135deg,#004a8a,#2090e0)'},
      {id:'a4',ico:'🥛',lbl:'Curd (Yogurt)',cat:'acid',color:'linear-gradient(135deg,#5a4800,#b89000)'},
      {id:'a5',ico:'🧂',lbl:'Baking Soda',cat:'base',color:'linear-gradient(135deg,#4a0a7a,#9040e0)'},

    ],
    cats:[

      {id:'base',ico:'🧼',lbl:'Soapy Bases',desc:'Turmeric turns RED',color:'#b02000',bg:'rgba(180,40,0,.1)',ind:'🔴 Red'},
      {id:'neutral',ico:'💧',lbl:'Neutral',desc:'No big color change',color:'#0080c0',bg:'rgba(0,120,200,.08)',ind:'🔵 Pale'},

  {

    title:'🫧 Activity 2 — Pour & Watch the Magic!',
    desc:'Each beaker shows which ingredient belongs in it! Drag each ingredient to its matching beaker and watch the turmeric indicator change color!',
    items:[
      {id:'b1',ico:'🍋',lbl:'Lemon Juice',btype:'acid',color:'linear-gradient(135deg,#8a6000,#e8c000)'},
      {id:'b2',ico:'🧼',lbl:'Soap Water',btype:'base',color:'linear-gradient(135deg,#004a8a,#2090e0)'},
      {id:'b3',ico:'🥛',lbl:'Curd',btype:'acid',color:'linear-gradient(135deg,#5a4800,#b89000)'},
      {id:'b4',ico:'🧂',lbl:'Baking Soda',btype:'base',color:'linear-gradient(135deg,#4a0a7a,#9040e0)'},
    ],
    beakers:[
      {id:'bk1',lbl:'Beaker A',target:'acid',assignedItem:'b1'},
      {id:'bk2',lbl:'Beaker B',target:'base',assignedItem:'b2'},
      {id:'bk3',lbl:'Beaker C',target:'acid',assignedItem:'b3'},
      {id:'bk4',lbl:'Beaker D',target:'base',assignedItem:'b4'},
    ]
  },
  {
    id:3, logic:'sort3',
    title:'🏷️ Activity 3 — Big Kitchen Sort!',
    desc:'You are now a full Kitchen Chemistry Detective! Sort all these items correctly!',
    items:[
      {id:'c1',ico:'🍊',lbl:'Orange Juice',cat:'acid',color:'linear-gradient(135deg,#8a3000,#e07000)'},
      {id:'c2',ico:'🫧',lbl:'Detergent',cat:'base',color:'linear-gradient(135deg,#004a5a,#00a0c0)'},
      {id:'c3',ico:'🍏',lbl:'Raw Apple',cat:'acid',color:'linear-gradient(135deg,#2a5a00,#60b000)'},
      {id:'c4',ico:'🪥',lbl:'Toothpaste',cat:'base',color:'linear-gradient(135deg,#3a0060,#8020c0)'},
      {id:'c5',ico:'🍵',lbl:'Green Tea',cat:'acid',color:'linear-gradient(135deg,#1a4a00,#4a9000)'},
      {id:'c6',ico:'🧴',lbl:'Hand Wash',cat:'base',color:'linear-gradient(135deg,#5a0040,#c00080)'},
      {id:'c7',ico:'💧',lbl:'Rain Water',cat:'neutral',color:'linear-gradient(135deg,#003060,#0060a0)'},
      {id:'c8',ico:'🍇',lbl:'Grape Juice',cat:'acid',color:'linear-gradient(135deg,#4a0060,#9030c0)'},
    ],
    cats:[
      {id:'acid',ico:'🍋',lbl:'Sour Acids',desc:'Turmeric stays yellow',color:'#c8a000',bg:'rgba(200,160,0,.1)',ind:'🟡'},
      {id:'base',ico:'🧼',lbl:'Soapy Bases',desc:'Turmeric turns red',color:'#b02000',bg:'rgba(180,40,0,.1)',ind:'🔴'},
      {id:'neutral',ico:'💧',lbl:'Neutral',desc:'No big change',color:'#0080c0',bg:'rgba(0,120,200,.08)',ind:'🔵'},
    ]

];

let cur=0, placements={}, dragId=null;

/* ═══════════════════════════
   RENDER
═══════════════════════════ */
function render(){
  const act=ACTS[cur];
  placements={};
  const fb=document.getElementById('fb');
  fb.textContent='';fb.style.color='transparent';
  updDots();
  const card=document.getElementById('card');
  card.innerHTML=`<div class="act-title">${act.title}</div><div class="act-desc">${act.desc}</div><div class="dw" id="dw"></div>`;

  if(act.logic==='sort3') renderSort(act);
  else if(act.logic==='beaker') renderBeaker(act);
}

/* ── Activity 1 & 3: three-category sort ── */
function renderSort(act){
  const dw=document.getElementById('dw');
  const bank=mkBank();
  [...act.items].sort(()=>Math.random()-.5).forEach(it=>bank.appendChild(mkDi(it)));
  dw.appendChild(bank);

  const zw=document.createElement('div');zw.className='zones-wrap';
  act.cats.forEach(cat=>{
    placements[cat.id]=[];
    const z=document.createElement('div');z.className='dz';z.id='dz-'+cat.id;z.dataset.cat=cat.id;
    z.style.cssText=`background:${cat.bg};border-color:${cat.color}55;`;
    z.innerHTML=`<div class="dz-row"><div class="dz-emoji">${cat.ico}</div><div><div class="dz-lbl" style="color:${cat.color}">${cat.lbl}</div><div style="font-size:.52rem;font-weight:700;color:rgba(255,200,120,.55);margin-top:1px">${cat.desc} ${cat.ind}</div></div></div><div class="chip-row" id="chips-${cat.id}"></div>`;
    setupDrop(z,cat.id,'cat');
    zw.appendChild(z);
  });
  dw.appendChild(zw);
}

/* ── Activity 2: beaker lab ── */
function renderBeaker(act){
  const dw=document.getElementById('dw');
  const bank=mkBank();
  [...act.items].sort(()=>Math.random()-.5).forEach(it=>bank.appendChild(mkDi(it)));
  dw.appendChild(bank);

  act.beakers.forEach(bk=>{ placements[bk.id]=null; });

  const ba=document.createElement('div');ba.className='beaker-area';
  act.beakers.forEach((bk,i)=>{
    const assignedItem=act.items.find(it=>it.id===bk.assignedItem);
    const hintIco=assignedItem?assignedItem.ico:'?';
    const hintLbl=assignedItem?assignedItem.lbl:'Ingredient';
    const hintColor=assignedItem?assignedItem.color:'rgba(255,180,0,.25)';

    const slot=document.createElement('div');
    slot.className='beaker-slot';slot.id='bslot-'+bk.id;slot.dataset.bk=bk.id;slot.dataset.target=bk.target;
    slot.innerHTML=`
      <div class="bk-title">${bk.lbl}</div>
      <div class="bk-body">
        <div class="bk-glass" id="bkglass-${bk.id}">
          <div class="bk-liquid" id="bkliq-${bk.id}" style="background:rgba(255,200,0,.35);"></div>
          <div class="bk-bubbles" id="bkbub-${bk.id}"></div>
        </div>
      </div>
      <div class="bk-label" id="bklbl-${bk.id}">🟡 Turmeric Water</div>
      <div class="bk-hint" id="bkhint-${bk.id}">
        <span class="bk-hint-arrow">⬇</span>
        <span class="bk-hint-badge" style="background:${hintColor}">${hintIco} ${hintLbl}</span>
      </div>
      <div class="bk-result" id="bkres-${bk.id}"></div>`;
    setupDrop(slot,bk.id,'bk');
    ba.appendChild(slot);
  });
  dw.appendChild(ba);
}

/* helpers */
function mkBank(){
  const b=document.createElement('div');b.className='ibank';
  b.innerHTML='<div class="blbl">🧺 Ingredients</div>';
  return b;
}

/* ═══════════════════════════
   DRAG FACTORY
═══════════════════════════ */
function mkDi(item){
  const el=document.createElement('div');
  el.className='di';el.id='di-'+item.id;el.dataset.id=item.id;el.draggable=true;
  el.style.background=item.color;
  el.innerHTML=`<span class="ico">${item.ico}</span><span>${item.lbl}</span>`;
  el.addEventListener('dragstart',e=>{dragId=item.id;setTimeout(()=>el.classList.add('dragging'),10);e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.addEventListener('touchstart',tS,{passive:true});
  el.addEventListener('touchmove',tM,{passive:false});
  el.addEventListener('touchend',tE);
  return el;
}

/* ═══════════════════════════
   DROP ZONES
═══════════════════════════ */
function setupDrop(el,id,type){
  el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();el.classList.add('over');});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over');});
  el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('over');if(!dragId)return;doDrop(dragId,id,type,el);dragId=null;});
}

/* ═══════════════════════════
   PROCESS DROP
═══════════════════════════ */
function doDrop(itemId,targetId,type,targetEl){
  const act=ACTS[cur];
  const itemEl=document.getElementById('di-'+itemId);
  if(!itemEl)return;
  const item=act.items.find(i=>i.id===itemId);
  if(!item)return;

  if(type==='cat'){
    if((placements[targetId]||[]).includes(itemId))return;
    if(!placements[targetId])placements[targetId]=[];
    placements[targetId].push(itemId);
    itemEl.classList.add('placed');
    const row=document.getElementById('chips-'+targetId);
    if(row){
      const chip=document.createElement('div');
      chip.className='chip';chip.style.background=item.color;
      chip.innerHTML=item.ico+' '+item.lbl;
      row.appendChild(chip);
    }
  }
  else if(type==='bk'){
    if(placements[targetId])return;
    placements[targetId]=itemId;
    itemEl.classList.add('placed');
    const bk=act.beakers.find(b=>b.id===targetId);
    const liq=document.getElementById('bkliq-'+targetId);
    const res=document.getElementById('bkres-'+targetId);
    const bubDiv=document.getElementById('bkbub-'+targetId);
    const lbl=document.getElementById('bklbl-'+targetId);
    const hint=document.getElementById('bkhint-'+targetId);
    const isAcid=(item.btype==='acid');
    const isBase=(item.btype==='base');
    // Hide the "drop here" hint once ingredient is placed
    if(hint)hint.style.display='none';
    // Animate color change
    if(isAcid){
      if(liq){liq.style.background='rgba(255,220,0,.7)';liq.style.height='65%';}
      if(lbl)lbl.textContent='🟡 Still Yellow!';
      if(res){res.textContent='Acid detected!';res.style.color='#e8c000';}
    } else if(isBase){
      if(liq){liq.style.background='rgba(180,20,0,.75)';liq.style.height='65%';}
      if(lbl)lbl.textContent='🔴 Turned Red!';
      if(res){res.textContent='Base detected!';res.style.color='#e04000';}
    }
    // Spawn bubbles
    if(bubDiv){
      for(let i=0;i<8;i++){
        setTimeout(()=>{
          const b=document.createElement('div');b.className='bkbub';
          const sz=3+Math.random()*7;
          b.style.cssText=`left:${10+Math.random()*70}%;bottom:5%;width:${sz}px;height:${sz}px;background:rgba(255,${isAcid?220:100},${isAcid?100:60},.5);animation-duration:${.6+Math.random()*.5}s;`;
          bubDiv.appendChild(b);
          setTimeout(()=>b.remove(),1200);
        },i*80);
      }
    }
    // Color burst
    const burst=document.createElement('div');
    burst.style.cssText=`position:absolute;top:50%;left:50%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);background:${isBase?'rgba(180,20,0,.5)':'rgba(255,220,0,.5)'};animation:colorBurst .7s ease-out forwards;pointer-events:none;`;
    targetEl.appendChild(burst);
    setTimeout(()=>burst.remove(),800);
    // Add ingredient chip
    const chip=document.createElement('div');
    chip.className='dropped-item';chip.style.background=item.color;
    chip.textContent=item.ico+' '+item.lbl;
    targetEl.appendChild(chip);
  }
}

/* ═══════════════════════════
   TOUCH DnD
═══════════════════════════ */
let tEl=null,tClone=null,tX=0,tY=0;
function tS(e){tEl=e.currentTarget;dragId=tEl.dataset.id;const t=e.touches[0];tX=t.clientX;tY=t.clientY;tClone=tEl.cloneNode(true);const r=tEl.getBoundingClientRect();Object.assign(tClone.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',opacity:'.88',zIndex:'9999',pointerEvents:'none',transition:'none',transform:'scale(1.08)'});document.body.appendChild(tClone);}
function tM(e){e.preventDefault();if(!tClone)return;const t=e.touches[0];const dx=t.clientX-tX,dy=t.clientY-tY;const r=tEl.getBoundingClientRect();tClone.style.left=(r.left+dx)+'px';tClone.style.top=(r.top+dy)+'px';document.querySelectorAll('.dz,.beaker-slot').forEach(z=>{const zr=z.getBoundingClientRect();z.classList.toggle('over',t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom);});}
function tE(e){if(!tClone||!dragId)return;const t=e.changedTouches[0];tClone.remove();tClone=null;const zones=[...document.querySelectorAll('.dz,.beaker-slot')];for(const z of zones){const zr=z.getBoundingClientRect();if(t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom){z.classList.remove('over');let type='cat',id=z.dataset.cat;if(z.dataset.bk){type='bk';id=z.dataset.bk;}doDrop(dragId,id,type,z);break;}z.classList.remove('over');}dragId=null;}

/* ═══════════════════════════
   CHECK
═══════════════════════════ */
function checkAct(){
  const act=ACTS[cur];
  let ok=false;
  const fb=document.getElementById('fb');

  if(act.logic==='sort3'){
    let all=true;
    act.items.forEach(item=>{
      if(!(placements[item.cat]||[]).includes(item.id))all=false;
      else document.getElementById('dz-'+item.cat)?.classList.add('ok');
    });
    ok=all;
  }
  else if(act.logic==='beaker'){
    // Each beaker needs its assigned item placed
    let all=true;
    act.beakers.forEach(bk=>{
      const placed=placements[bk.id];
      if(!placed){all=false;}
      else if(placed!==bk.assignedItem){all=false;}
      else document.getElementById('bslot-'+bk.id)?.classList.add('over');
    });
    ok=all;
  }

  if(ok){
    fb.style.color='#FFD700';fb.textContent='✅ Outstanding Detective Work!';
    confetti(32);
    setTimeout(()=>showPopup(),650);
  } else {
    fb.style.color='#ff5722';fb.textContent='🤔 Check again — the indicators will guide you!';
    const c=document.getElementById('card');
    c.style.animation='none';
    setTimeout(()=>{c.style.animation='shake .4s ease';},10);
  }
}

/* ═══════════════════════════
   POPUPS
═══════════════════════════ */
const POPS=[
  {ico:'🟡',t:'Turmeric Test Passed!',m:'You matched the indicator colors perfectly! Lemon juice keeps turmeric yellow — that means ACID! Soap turns it red — that means BASE!',btn:'Pour Into Beakers! →'},
  {ico:'🫧',t:'Color Change Master!',m:'Watch those beakers! Yellow means sour acid. Red means soapy base. You can now read what the turmeric indicator is telling you!',btn:'Big Kitchen Sort! →'},
  {ico:'🏆',t:'Kitchen Detective!',m:'You sorted all the kitchen ingredients like a true scientist! Remember — sour things are acids, soapy things are bases, and turmeric tells us which is which!',btn:'Claim your Badge! 🎉'},
];
function showPopup(){
  const d=POPS[cur];
  const box=document.getElementById('pbox');
  box.innerHTML=`<span class="pico">${d.ico}</span><div class="ptitle">${d.t}</div><div class="pmsg">${d.m}</div><button class="pbtn" onclick="nextAct()">${d.btn}</button>`;
  document.getElementById('popup').classList.remove('hidden');
}
function nextAct(){
  document.getElementById('popup').classList.add('hidden');
  cur++;
  if(cur>=ACTS.length){showFinal();return;}
  render();
}
function showFinal(){
  confetti(90);
  const box=document.getElementById('pbox');
  box.innerHTML=`
    <span style="font-size:3rem;display:block;margin-bottom:6px;animation:floatB 1.2s infinite alternate">🏆</span>
    <div class="ptitle">Kitchen Detective!</div>
    <div style="font-family:'Fredoka One',cursive;font-size:.9rem;color:#ff8c00;font-weight:700;margin-bottom:8px;letter-spacing:2px">✦ BADGE UNLOCKED ✦</div>
    <div class="pmsg">
      You know acids, bases, and how turmeric reveals the truth!<br><br>
      <strong style="color:#FFD700">The Detective's Rule:</strong><br>
      🟡 Turmeric stays yellow → It's an ACID!<br>
      🔴 Turmeric turns red → It's a BASE!<br><br>
      <em style="color:rgba(255,200,120,.7)">⚠️ Never taste or touch unknown liquids — always ask a grown-up first!</em>
    </div>
    <div style="font-size:1.5rem;margin:8px 0">🍋⚗️🧼🟡🔴🎉</div>
    <button class="pbtn" onclick="restartAll()">↺ Play Again!</button>`;
  document.getElementById('popup').classList.remove('hidden');
  updDots();
}
function restartAll(){document.getElementById('popup').classList.add('hidden');cur=0;render();}
function resetAct(){render();}

/* ═══════════════════════════
   PROGRESS DOTS
═══════════════════════════ */
function updDots(){
  for(let i=1;i<=3;i++){
    const d=document.getElementById('pd'+i),c=document.getElementById('pc'+i);
    d.classList.remove('active','done');c?.classList.remove('done');
    if(i-1<cur){d.classList.add('done');c?.classList.add('done');}
    else if(i-1===cur)d.classList.add('active');
  }
  const last=document.getElementById('pd4');
  last.classList.remove('active','done');
  if(cur>=ACTS.length)last.classList.add('active');
}

render();
setTimeout(()=>confetti(10),500);
</script>
