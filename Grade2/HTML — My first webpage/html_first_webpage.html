<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTML — My First Webpage</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#FFF8F0;--yellow:#FFD93D;--orange:#FF6B35;--pink:#FF6B9D;--teal:#4ECDC4;
  --purple:#A855F7;--blue:#3B82F6;--green:#22C55E;--red:#EF4444;
  --canvas:#FFFAED;--border:#E8D5A3;--dark:#2D1B69;
}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--cream);}

/* ══ BACKGROUND ART STUDIO ══ */
#studio-bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(135deg,#FFF0DC 0%,#FFF8F0 30%,#F0FFF8 60%,#F8F0FF 100%);}

/* Colour wheel */
.cwheel{position:absolute;border-radius:50%;opacity:.13;animation:spin linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.cwheel::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#FF6B35,#FFD93D,#22C55E,#4ECDC4,#3B82F6,#A855F7,#FF6B9D,#FF6B35);}

/* Paint splashes */
.splash{position:absolute;border-radius:50% 60% 40% 70%/50% 40% 60% 50%;opacity:.18;animation:splashWobble ease-in-out infinite alternate;}
@keyframes splashWobble{0%{transform:scale(1) rotate(0deg)}100%{transform:scale(1.08) rotate(6deg)}}

/* Floating droplets */
.drop{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  opacity:.55;animation:dropFloat ease-in-out infinite alternate;}
@keyframes dropFloat{0%{transform:translateY(0) rotate(-10deg)}100%{transform:translateY(-18px) rotate(10deg)}}

/* Brush strokes */
.brush{position:absolute;border-radius:50%;opacity:.1;animation:brushSlide ease-in-out infinite alternate;}
@keyframes brushSlide{0%{transform:scaleX(1) rotate(-3deg)}100%{transform:scaleX(1.12) rotate(3deg)}}

/* Stars/sparkles */
.sparkle{position:absolute;font-size:1rem;opacity:.3;animation:sparkSpin ease-in-out infinite alternate;}
@keyframes sparkSpin{0%{transform:rotate(-15deg) scale(1);opacity:.25}100%{transform:rotate(15deg) scale(1.3);opacity:.5}}

/* ══ APP SHELL ══ */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  padding:6px 10px 4px;gap:4px;}

/* Header */
#hdr{text-align:center;}
#hdr h1{font-family:'Fredoka One',cursive;font-size:clamp(.95rem,2.8vw,1.5rem);
  background:linear-gradient(135deg,var(--orange),var(--pink),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:1px;line-height:1.1;}
#hdr .sub{font-size:clamp(.48rem,1.2vw,.6rem);color:rgba(45,27,105,.55);
  font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:1px;}

/* Progress */
#prog{display:flex;gap:6px;align-items:center;}
.pdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:.6rem;font-weight:700;
  border:2px solid rgba(168,85,247,.2);color:rgba(168,85,247,.35);
  background:rgba(168,85,247,.06);transition:all .4s;}
.pdot.active{background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;
  border-color:var(--orange);transform:scale(1.2);box-shadow:0 0 14px rgba(255,107,53,.5);}
.pdot.done{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff;
  border-color:var(--green);box-shadow:0 0 10px rgba(34,197,94,.4);}
.pline{width:20px;height:2px;background:rgba(168,85,247,.15);border-radius:2px;}
.pline.done{background:linear-gradient(90deg,var(--green),var(--teal));}

/* Activity card */
#card{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border:2px solid rgba(255,107,53,.2);border-radius:20px;
  padding:8px 12px 6px;width:100%;max-width:900px;flex:1;
  display:flex;flex-direction:column;
  box-shadow:0 8px 32px rgba(45,27,105,.1),0 2px 8px rgba(255,107,53,.1);
  overflow:hidden;position:relative;min-height:0;}
#card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;
  background:linear-gradient(90deg,transparent,var(--orange),var(--pink),transparent);}

.act-title{font-family:'Fredoka One',cursive;font-size:clamp(.8rem,2.2vw,1.05rem);
  color:var(--dark);text-align:center;margin-bottom:1px;}
.act-title span{background:linear-gradient(135deg,var(--orange),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.act-desc{font-size:clamp(.52rem,1.25vw,.66rem);color:rgba(45,27,105,.7);
  text-align:center;margin-bottom:6px;font-weight:700;line-height:1.4;}

/* DnD wrap */
.dw{flex:1;display:flex;gap:8px;min-height:0;}

/* Tag bank */
.tbank{display:flex;flex-direction:column;gap:4px;width:130px;flex-shrink:0;}
.tblbl{font-size:.48rem;font-weight:800;color:rgba(45,27,105,.45);
  text-align:center;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}

/* Drag tags */
.dtag{padding:5px 7px;border-radius:10px;cursor:grab;user-select:none;
  font-family:'Fredoka One',cursive;font-size:.72rem;display:flex;align-items:center;gap:4px;
  border:2px solid rgba(255,255,255,.6);color:#fff;
  transition:transform .2s,box-shadow .2s,opacity .3s;position:relative;white-space:nowrap;}
.dtag:hover{transform:scale(1.07);box-shadow:0 4px 16px rgba(0,0,0,.25);}
.dtag.dragging{opacity:.25;cursor:grabbing;}
.dtag.placed{opacity:.22;pointer-events:none;}
.dtag *{pointer-events:none;}
.tag-html {background:linear-gradient(135deg,#c05000,#FF6B35);}
.tag-head {background:linear-gradient(135deg,#7c3aed,#A855F7);}
.tag-body {background:linear-gradient(135deg,#0369a1,#3B82F6);}
.tag-h1   {background:linear-gradient(135deg,#be123c,#FF6B9D);}
.tag-p    {background:linear-gradient(135deg,#065f46,#22C55E);}
.tag-title{background:linear-gradient(135deg,#92400e,#F59E0B);}

/* ═══ ACTIVITY 1 — Structure Builder ═══ */
.struct-wrap{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.struct-row{display:flex;align-items:flex-start;gap:5px;}
.struct-indent{width:20px;flex-shrink:0;}
.struct-zone{flex:1;border:2px dashed rgba(168,85,247,.3);border-radius:10px;
  padding:5px 8px;min-height:36px;background:rgba(168,85,247,.04);
  transition:all .3s;display:flex;align-items:center;gap:6px;flex-wrap:wrap;position:relative;}
.struct-zone.over{border-color:var(--orange);background:rgba(255,107,53,.08);}
.struct-zone.ok {border-color:var(--green);background:rgba(34,197,94,.07);}
.struct-zone.bad{border-color:var(--red);background:rgba(239,68,68,.07);}
.struct-zone *{pointer-events:none;}
.zone-hint{font-size:.52rem;font-weight:700;color:rgba(45,27,105,.3);font-style:italic;}
.zone-label{font-family:'Fredoka One',cursive;font-size:.58rem;color:rgba(45,27,105,.4);
  text-transform:uppercase;letter-spacing:1px;min-width:60px;}
.placed-tag{font-family:'Fredoka One',cursive;font-size:.72rem;padding:3px 8px;
  border-radius:8px;color:#fff;animation:tagIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes tagIn{from{transform:scale(0) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}

/* ═══ ACTIVITY 2 — Order Builder ═══ */
.order-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seq-col{display:flex;flex-direction:column;gap:4px;}
.seq-title{font-family:'Fredoka One',cursive;font-size:.6rem;color:var(--dark);
  text-align:center;padding:3px 8px;border-radius:8px;margin-bottom:2px;}
.seq-slot{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:10px;
  border:2px dashed rgba(59,130,246,.3);min-height:36px;
  background:rgba(59,130,246,.03);transition:all .3s;}
.seq-slot.over{border-color:var(--orange);background:rgba(255,107,53,.08);}
.seq-slot.ok  {border-color:var(--green);background:rgba(34,197,94,.07);}
.seq-slot *   {pointer-events:none;}
.snum{font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--orange);min-width:18px;}
.shint{font-size:.52rem;font-weight:700;color:rgba(45,27,105,.3);font-style:italic;}

/* Preview panel */
.preview-panel{background:linear-gradient(160deg,#f0f4ff,#fff8f0);
  border:2px solid rgba(59,130,246,.2);border-radius:12px;padding:8px 10px;
  display:flex;flex-direction:column;gap:3px;}
.preview-bar{display:flex;align-items:center;gap:4px;margin-bottom:4px;}
.pbar-dot{width:8px;height:8px;border-radius:50%;}
.preview-content{flex:1;background:#fff;border-radius:8px;padding:8px;
  border:1px solid rgba(0,0,0,.06);font-size:.68rem;min-height:60px;
  display:flex;flex-direction:column;gap:3px;}
.prev-line{padding:2px 0;transition:all .4s;opacity:.3;color:rgba(45,27,105,.4);font-size:.6rem;}
.prev-line.lit{opacity:1;color:var(--dark);}
.prev-h1{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--dark);
  opacity:0;transition:all .5s;transform:translateY(4px);}
.prev-h1.show{opacity:1;transform:translateY(0);}
.prev-p{font-size:.62rem;color:rgba(45,27,105,.7);opacity:0;transition:all .5s .1s;transform:translateY(4px);}
.prev-p.show{opacity:1;transform:translateY(0);}

/* ═══ ACTIVITY 3 — Webpage Builder ═══ */
.page-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.content-bank{display:flex;flex-direction:column;gap:4px;}
.content-blbl{font-size:.48rem;font-weight:800;color:rgba(45,27,105,.45);
  text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}

/* Content blocks */
.cblock{padding:5px 8px;border-radius:10px;cursor:grab;user-select:none;
  font-size:.62rem;font-weight:700;display:flex;align-items:center;gap:4px;
  border:2px solid rgba(255,255,255,.5);color:#fff;
  transition:transform .2s,box-shadow .2s,opacity .3s;}
.cblock:hover{transform:scale(1.05);box-shadow:0 3px 14px rgba(0,0,0,.2);}
.cblock.dragging{opacity:.25;}
.cblock.placed{opacity:.22;pointer-events:none;}
.cblock *{pointer-events:none;}
.cb-head {background:linear-gradient(135deg,#7c3aed,#A855F7);}
.cb-body {background:linear-gradient(135deg,#0369a1,#3B82F6);}
.cb-h1   {background:linear-gradient(135deg,#be123c,#FF6B9D);}
.cb-p    {background:linear-gradient(135deg,#065f46,#22C55E);}
.cb-title{background:linear-gradient(135deg,#92400e,#F59E0B);}
.cb-close{background:linear-gradient(135deg,#374151,#6B7280);}

/* Page frame */
.page-frame{background:#fff;border:2px solid rgba(255,107,53,.25);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;}
.page-frame-hdr{background:linear-gradient(135deg,var(--orange),var(--pink));
  padding:5px 10px;display:flex;align-items:center;gap:5px;}
.pf-title{font-family:'Fredoka One',cursive;font-size:.6rem;color:#fff;flex:1;text-align:center;}
.frame-body{flex:1;display:flex;flex-direction:column;gap:3px;padding:6px;}

/* Section boxes */
.html-box{border:2px dashed var(--orange);border-radius:10px;padding:5px;flex:1;
  display:flex;flex-direction:column;gap:3px;position:relative;}
.html-box-lbl{position:absolute;top:-8px;left:8px;background:var(--orange);color:#fff;
  font-family:'Fredoka One',cursive;font-size:.5rem;padding:1px 6px;border-radius:6px;}
.head-box{border:2px dashed var(--purple);border-radius:8px;padding:4px;
  min-height:30px;position:relative;transition:all .3s;}
.head-box-lbl{position:absolute;top:-7px;left:6px;background:var(--purple);color:#fff;
  font-family:'Fredoka One',cursive;font-size:.48rem;padding:1px 5px;border-radius:5px;}
.body-box{border:2px dashed var(--blue);border-radius:8px;padding:4px;
  flex:1;position:relative;transition:all .3s;}
.body-box-lbl{position:absolute;top:-7px;left:6px;background:var(--blue);color:#fff;
  font-family:'Fredoka One',cursive;font-size:.48rem;padding:1px 5px;border-radius:5px;}

/* Section drop zones */
.sec-zone{min-height:22px;border-radius:6px;border:1.5px dashed rgba(168,85,247,.25);
  padding:3px 5px;transition:all .3s;display:flex;flex-direction:column;gap:2px;}
.sec-zone.over{border-color:var(--orange);background:rgba(255,107,53,.06);}
.sec-zone.filled{border-style:solid;border-color:var(--green);background:rgba(34,197,94,.06);}
.sec-zone *{pointer-events:none;}
.placed-block{font-size:.58rem;font-weight:700;padding:2px 6px;border-radius:6px;
  color:#fff;animation:tagIn .3s cubic-bezier(.34,1.56,.64,1);}

/* ══ BOTTOM CONTROLS ══ */
#controls{display:flex;align-items:center;gap:8px;}
#chkbtn{padding:7px 22px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:.76rem;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;
  box-shadow:0 3px 14px rgba(255,107,53,.45);transition:transform .2s;}
#chkbtn:hover{transform:scale(1.06);}
#rstbtn{padding:6px 14px;border-radius:50px;
  border:2px solid rgba(168,85,247,.3);cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:.62rem;font-weight:700;
  background:rgba(168,85,247,.08);color:rgba(45,27,105,.65);transition:all .2s;}
#rstbtn:hover{background:rgba(168,85,247,.18);color:var(--dark);}
#fb{text-align:center;font-size:.65rem;font-weight:700;min-height:12px;transition:all .3s;}

/* ══ POPUP ══ */
#popup{position:fixed;inset:0;z-index:200;background:rgba(45,27,105,.7);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease;}
#popup.hidden{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pbox{background:linear-gradient(160deg,#fff8f0,#f0f8ff);
  border:3px solid var(--orange);border-radius:24px;padding:20px 24px 18px;
  max-width:380px;width:88%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:pboxIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pboxIn{from{transform:scale(.6) rotate(-5deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.pico{font-size:2.6rem;display:block;margin-bottom:5px;animation:bounce 1s ease-in-out infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.ptitle{font-family:'Fredoka One',cursive;font-size:1.2rem;
  background:linear-gradient(135deg,var(--orange),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;}
.pmsg{font-size:.76rem;color:rgba(45,27,105,.8);font-weight:600;line-height:1.55;margin-bottom:12px;}
.pbtn{padding:9px 26px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:.82rem;
  background:linear-gradient(135deg,var(--orange),var(--pink));color:#fff;
  box-shadow:0 4px 18px rgba(255,107,53,.45);transition:transform .2s;}
.pbtn:hover{transform:scale(1.07);}

/* Confetti */
.cf{position:fixed;border-radius:2px;animation:cfFall linear forwards;z-index:999;pointer-events:none;}
@keyframes cfFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>

<!-- STUDIO BACKGROUND -->
<div id="studio-bg"></div>

<div id="app">
  <div id="hdr">
    <h1>🎨 HTML — My First Webpage</h1>
    <div class="sub">✦ Planrs Academy — Web Creator Studio ✦</div>
  </div>
  <div id="prog">
    <div class="pdot active" id="pd1">1</div>
    <div class="pline" id="pl1"></div>
    <div class="pdot" id="pd2">2</div>
    <div class="pline" id="pl2"></div>
    <div class="pdot" id="pd3">3</div>
    <div class="pline" id="pl3"></div>
    <div class="pdot" id="pd4">🏆</div>
  </div>
  <div id="card"></div>
  <div id="fb"></div>
  <div id="controls">
    <button id="chkbtn" onclick="checkAct()">🔍 Check My Work!</button>
    <button id="rstbtn" onclick="resetAct()">↺ Reset</button>
  </div>
</div>
<div id="popup" class="hidden"><div class="pbox" id="pbox"></div></div>

<script>
/* ══════════════════════════════
   BUILD STUDIO BACKGROUND
══════════════════════════════ */
(function(){
  const bg = document.getElementById('studio-bg');

  // Colour wheels
  [['-8%','5%',180,8],['88%','60%',120,12],['40%','-5%',100,10],['75%','85%',140,9]]
    .forEach(([l,t,sz,dur])=>{
      const w=document.createElement('div');w.className='cwheel';
      w.style.cssText=`left:${l};top:${t};width:${sz}px;height:${sz}px;animation-duration:${dur}s;`;
      bg.appendChild(w);
    });

  // Paint splashes
  const splashCols=['#FF6B35','#FFD93D','#4ECDC4','#A855F7','#FF6B9D','#22C55E','#3B82F6'];
  [[5,10,90,80],[80,15,70,60],[20,75,110,100],[70,70,80,70],[45,45,60,55],[90,40,75,65]].forEach(([l,t,w,h],i)=>{
    const s=document.createElement('div');s.className='splash';
    s.style.cssText=`left:${l}%;top:${t}%;width:${w}px;height:${h}px;background:${splashCols[i%splashCols.length]};animation-duration:${4+i*.7}s;animation-delay:${i*.5}s;`;
    bg.appendChild(s);
  });

  // Floating droplets
  const dropCols=['#FF6B35','#FFD93D','#4ECDC4','#A855F7','#FF6B9D'];
  for(let i=0;i<16;i++){
    const d=document.createElement('div');d.className='drop';
    d.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*90}%;background:${dropCols[i%dropCols.length]};animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*4}s;`;
    bg.appendChild(d);
  }

  // Brush strokes
  [[10,30,80,14,'#FF6B35'],[60,55,100,12,'#4ECDC4'],[30,80,70,10,'#FFD93D'],[75,20,90,16,'#A855F7']].forEach(([l,t,w,h,c])=>{
    const b=document.createElement('div');b.className='brush';
    b.style.cssText=`left:${l}%;top:${t}%;width:${w}px;height:${h}px;background:${c};border-radius:50%;animation-duration:5s;`;
    bg.appendChild(b);
  });

  // Sparkles
  ['✦','✧','★','✸','✺'].forEach((s,i)=>{
    const el=document.createElement('div');el.className='sparkle';
    el.textContent=s;el.style.cssText=`left:${15+i*17}%;top:${20+Math.sin(i)*30}%;color:${splashCols[i]};animation-duration:${3+i*.5}s;animation-delay:${i*.8}s;font-size:${.8+i*.15}rem;`;
    bg.appendChild(el);
  });
})();

/* ══════════════════════════════
   ACTIVITY DATA
══════════════════════════════ */
const ACTS = [
  {
    id:1, logic:'struct',
    title:'🏗️ Activity 1 — <span>Build the Tag Structure!</span>',
    desc:'Every webpage is like a tiffin box — tags nest inside each other! Drag the right tag into each zone to build the frame.',
    tags:[
      {id:'t_html', lbl:'&lt;html&gt;',    cls:'tag-html', ans:'z_html'},
      {id:'t_head', lbl:'&lt;head&gt;',    cls:'tag-head', ans:'z_head'},
      {id:'t_body', lbl:'&lt;body&gt;',    cls:'tag-body', ans:'z_body'},
      {id:'t_h1',   lbl:'&lt;h1&gt;',      cls:'tag-h1',   ans:'z_h1'},
      {id:'t_p',    lbl:'&lt;p&gt;',       cls:'tag-p',    ans:'z_p'},
      {id:'t_title',lbl:'&lt;title&gt;',   cls:'tag-title',ans:'z_title'},
    ],
    zones:[
      {id:'z_html',  hint:'The outer tiffin clip — wraps EVERYTHING',  label:'Outermost Tag', indent:0},
      {id:'z_head',  hint:'The small top compartment — holds the nameplate',label:'Nameplate section',indent:1},
      {id:'z_title', hint:'The title shown on the browser tab',          label:'Tab title tag',  indent:2},
      {id:'z_body',  hint:'The big compartment — all visible content!',  label:'Visible content', indent:1},
      {id:'z_h1',    hint:'Big bold heading — like a newspaper banner!', label:'Main heading',   indent:2},
      {id:'z_p',     hint:'A paragraph of text — like writing in your notebook!',label:'Paragraph text',indent:2},
    ]
  },
  {
    id:2, logic:'order',
    title:'🗂️ Activity 2 — <span>Put Tags in the Right Order!</span>',
    desc:'A webpage\'s tags must go in a special order, like chapters in a story book. Arrange them correctly and watch the preview come alive!',
    tags:[
      {id:'o_html',  lbl:'&lt;html&gt;',        cls:'tag-html'},
      {id:'o_head',  lbl:'&lt;head&gt;',        cls:'tag-head'},
      {id:'o_title', lbl:'&lt;title&gt;',       cls:'tag-title'},
      {id:'o_body',  lbl:'&lt;body&gt;',        cls:'tag-body'},

    ],

      {id:'s1', ans:'o_html',  hint:'First — the big outer wrapper'},
      {id:'s2', ans:'o_head',  hint:'Second — the nameplate section'},
      {id:'s3', ans:'o_title', hint:'Third — the tab title'},
      {id:'s4', ans:'o_body',  hint:'Fourth — all the visible stuff'},
      {id:'s5', ans:'o_h1',    hint:'Fifth — the big bold heading'},

    ]

    id:3, logic:'page',
    title:'🌟 Activity 3 — <span>Build My First Webpage!</span>',
    desc:'You are now a Web Creator! Drag the content blocks into their correct section to complete your very first webpage!',
    blocks:[
      {id:'cb_title', lbl:'My Webpage Title', ico:'🏷️', cls:'cb-title', section:'head'},
      {id:'cb_h1',    lbl:'Welcome Heading',  ico:'📢', cls:'cb-h1',    section:'body'},
      {id:'cb_p',     lbl:'Hello paragraph',  ico:'📝', cls:'cb-p',     section:'body'},
      {id:'cb_head',  lbl:'Head section',     ico:'🗂️', cls:'cb-head',   section:'html'},
      {id:'cb_body',  lbl:'Body section',     ico:'📦', cls:'cb-body',   section:'html'},
    ],
    sections:[
      {id:'sec_html', label:'html area'},
      {id:'sec_head', label:'head area'},
      {id:'sec_body', label:'body area'},
    ]
  }
];

let cur=0, placements={}, dragId=null;

/* ══════════════════════════════
   RENDER
══════════════════════════════ */
function render(){
  const act=ACTS[cur];
  placements={};
  const fb=document.getElementById('fb');
  fb.textContent='';
  updDots();
  const card=document.getElementById('card');
  card.innerHTML=`<div class="act-title">${act.title}</div><div class="act-desc">${act.desc}</div><div class="dw" id="dw"></div>`;

  if(act.logic==='struct') renderStruct(act);
  else if(act.logic==='order') renderOrder(act);
  else if(act.logic==='page')  renderPage(act);
}

/* ── Activity 1: Structure ── */
function renderStruct(act){
  const dw=document.getElementById('dw');

  // Tag bank
  const bank=document.createElement('div');bank.className='tbank';
  bank.innerHTML='<div class="tblbl">🎨 Tag Palette</div>';
  [...act.tags].sort(()=>Math.random()-.5).forEach(t=>{
    bank.appendChild(mkTag(t));
  });
  dw.appendChild(bank);

  // Structure zones
  const sw=document.createElement('div');sw.className='struct-wrap';
  act.zones.forEach(z=>{
    placements[z.id]=null;
    const row=document.createElement('div');row.className='struct-row';
    // indent spacer
    for(let i=0;i<z.indent;i++){
      const sp=document.createElement('div');sp.className='struct-indent';
      row.appendChild(sp);
    }
    const zone=document.createElement('div');zone.className='struct-zone';zone.id=z.id;zone.dataset.zid=z.id;
    zone.innerHTML=`<span class="zone-label">${z.label}:</span><span class="zone-hint">${z.hint}</span>`;
    setupDrop(zone,z.id,'struct');
    row.appendChild(zone);
    sw.appendChild(row);
  });
  dw.appendChild(sw);
}

/* ══════════════════════════════
   TAG / BLOCK FACTORIES
══════════════════════════════ */
function mkTag(t){
  const el=document.createElement('div');
  el.className='dtag '+t.cls;el.id='dt-'+t.id;el.dataset.id=t.id;el.draggable=true;
  el.innerHTML=t.lbl;
  bindDrag(el,t.id);
  return el;
}
function mkBlock(b){
  const el=document.createElement('div');
  el.className='cblock '+b.cls;el.id='cb-'+b.id;el.dataset.id=b.id;el.draggable=true;
  el.innerHTML=b.ico+' '+b.lbl;
  bindDrag(el,b.id);
  return el;
}
function bindDrag(el,id){
  el.addEventListener('dragstart',e=>{dragId=id;setTimeout(()=>el.classList.add('dragging'),10);e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.addEventListener('touchstart',tS,{passive:true});
  el.addEventListener('touchmove',tM,{passive:false});
  el.addEventListener('touchend',tE);
}

/* ══════════════════════════════
   DROP ZONE SETUP
══════════════════════════════ */
function setupDrop(el,id,type){
  el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();el.classList.add('over');});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over');});
  el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('over');if(!dragId)return;doDrop(dragId,id,type,el);dragId=null;});
}

/* ══════════════════════════════
   PROCESS DROP
══════════════════════════════ */
function doDrop(itemId,targetId,type,targetEl){
  const act=ACTS[cur];

  if(type==='struct'){
    if(placements[targetId])return;
    placements[targetId]=itemId;
    const itemEl=document.getElementById('dt-'+itemId);
    if(itemEl)itemEl.classList.add('placed');
    // Clear zone and add placed tag
    const tag=act.tags.find(t=>t.id===itemId);
    if(!tag)return;
    targetEl.innerHTML='';
    const chip=document.createElement('div');
    chip.className='placed-tag '+tag.cls;
    chip.innerHTML=tag.lbl;
    targetEl.appendChild(chip);
  }

  else if(type==='order'){
    if(placements[targetId])return;
    placements[targetId]=itemId;
    const itemEl=document.getElementById('dt-'+itemId);
    if(itemEl)itemEl.classList.add('placed');
    const tag=act.tags.find(t=>t.id===itemId);
    if(!tag)return;
    targetEl.querySelector('.shint').style.display='none';
    const chip=document.createElement('div');
    chip.className='placed-tag '+tag.cls;
    chip.innerHTML=tag.lbl;
    targetEl.appendChild(chip);
    // Update preview
    updatePreview(itemId,targetId,act);
  }

  else if(type==='page'){
    const block=act.blocks.find(b=>b.id===itemId);
    if(!block)return;
    const itemEl=document.getElementById('cb-'+itemId);
    const zoneEl=document.getElementById(targetId);
    if(!zoneEl)return;

    // Only allow correct section
    const correctZone = 'sec_'+block.section;
    if(targetId!==correctZone){
      // Wrong zone shake
      zoneEl.style.animation='none';
      setTimeout(()=>{zoneEl.style.animation='shake .4s ease';},10);
      setTimeout(()=>{zoneEl.style.animation='';},450);
      return;
    }

    if(placements['block_'+itemId])return;
    placements['block_'+itemId]=targetId;
    if(itemEl)itemEl.classList.add('placed');

    // Remove placeholder text
    const ph=zoneEl.querySelector('span');
    if(ph)ph.remove();

    const chip=document.createElement('div');
    chip.className='placed-block '+block.cls;
    chip.innerHTML=block.ico+' '+block.lbl;
    zoneEl.appendChild(chip);
    zoneEl.classList.add('filled');
  }
}

/* Preview updater for Activity 2 */
function updatePreview(itemId,slotId,act){
  const slot=act.slots.find(s=>s.id===slotId);
  if(!slot)return;
  const isCorrect=slot.ans===itemId;
  const previewMap={
    'o_html':'pl-html','o_head':'pl-head','o_title':'pl-title',
    'o_body':'pl-body','o_h1':'pl-h1','o_p':'pl-p'
  };
  const previewId=previewMap[itemId];
  if(!previewId)return;
  const el=document.getElementById(previewId);
  if(!el)return;
  if(isCorrect){
    el.classList.add(previewId==='pl-h1'||previewId==='pl-p'?'show':'lit');
  }
}

/* ══════════════════════════════
   TOUCH DnD
══════════════════════════════ */
let tEl=null,tClone=null,tX0=0,tY0=0;
function tS(e){
  tEl=e.currentTarget;dragId=tEl.dataset.id;
  const t=e.touches[0];tX0=t.clientX;tY0=t.clientY;
  tClone=tEl.cloneNode(true);
  const r=tEl.getBoundingClientRect();
  Object.assign(tClone.style,{position:'fixed',left:r.left+'px',top:r.top+'px',
    width:r.width+'px',opacity:'.9',zIndex:'9999',pointerEvents:'none',transition:'none',transform:'scale(1.1)'});
  document.body.appendChild(tClone);
}
function tM(e){
  e.preventDefault();if(!tClone)return;
  const t=e.touches[0];const dx=t.clientX-tX0,dy=t.clientY-tY0;
  const r=tEl.getBoundingClientRect();
  tClone.style.left=(r.left+dx)+'px';tClone.style.top=(r.top+dy)+'px';
  document.querySelectorAll('.struct-zone,.seq-slot,.sec-zone').forEach(z=>{
    const zr=z.getBoundingClientRect();
    z.classList.toggle('over',t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom);
  });
}
function tE(e){
  if(!tClone||!dragId)return;
  const t=e.changedTouches[0];
  tClone.remove();tClone=null;
  const zones=[...document.querySelectorAll('.struct-zone,.seq-slot,.sec-zone')];
  const act=ACTS[cur];
  for(const z of zones){
    const zr=z.getBoundingClientRect();
    if(t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom){
      z.classList.remove('over');
      const type=z.classList.contains('struct-zone')?'struct':z.classList.contains('seq-slot')?'order':'page';
      const id=z.dataset.zid||z.dataset.sid||z.id;
      doDrop(dragId,id,type,z);
      break;
    }
    z.classList.remove('over');
  }
  dragId=null;
}

/* ══════════════════════════════
   CHECK
══════════════════════════════ */
function checkAct(){
  const act=ACTS[cur];
  const fb=document.getElementById('fb');
  let ok=false;

  if(act.logic==='struct'){
    let all=true;
    act.zones.forEach(z=>{
      const tag=act.tags.find(t=>t.id===placements[z.id]);
      const zone=document.getElementById(z.id);
      const correct=(placements[z.id]===act.tags.find(t=>t.ans===z.id)?.id);
      if(!placements[z.id]||!correct){all=false;if(zone)zone.classList.add('bad');}
      else{if(zone){zone.classList.remove('bad');zone.classList.add('ok');}}
    });
    ok=all;
  }

  else if(act.logic==='order'){
    let all=true;
    act.slots.forEach(sl=>{
      const placed=placements[sl.id];
      const slotEl=document.getElementById('sl-'+sl.id);
      if(placed===sl.ans){if(slotEl)slotEl.classList.add('ok');}
      else{all=false;if(slotEl){slotEl.classList.remove('ok');}}
    });
    ok=all;
  }

  else if(act.logic==='page'){
    const needed=['cb_head','cb_body','cb_title','cb_h1','cb_p'];
    ok=needed.every(bid=>!!placements['block_'+bid]);
  }

  if(ok){
    fb.style.color='var(--green)';fb.textContent='✅ Brilliant work, Web Creator!';
    confetti(30);
    setTimeout(()=>showPopup(),600);
  } else {
    fb.style.color='var(--red)';fb.textContent='🤔 Not quite — check the hints and try again!';
    const c=document.getElementById('card');
    c.style.animation='none';setTimeout(()=>{c.style.animation='shake .4s ease';},10);
  }
}

/* ══════════════════════════════
   PROGRESS DOTS
══════════════════════════════ */
function updDots(){
  for(let i=1;i<=3;i++){
    const d=document.getElementById('pd'+i),l=document.getElementById('pl'+i);
    d.classList.remove('active','done');if(l)l.classList.remove('done');
    if(i-1<cur){d.classList.add('done');if(l)l.classList.add('done');}
    else if(i-1===cur)d.classList.add('active');
  }
  const last=document.getElementById('pd4');
  last.classList.remove('active','done');
  if(cur>=ACTS.length)last.classList.add('active');
}

/* ══════════════════════════════
   CONFETTI
══════════════════════════════ */
function confetti(n=25){
  const cols=['#FF6B35','#FFD93D','#4ECDC4','#A855F7','#FF6B9D','#22C55E','#3B82F6'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;background:${cols[~~(Math.random()*cols.length)]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*1}s;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}
