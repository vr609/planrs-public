<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTML — What is a Webpage?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --sand:#F5C842;--sand2:#E8A020;--dusk:#FF8C42;--sky:#1A1035;--sky2:#2D1B69;
  --star:#FFF8DC;--cactus:#2D7A3A;--teal:#4ECDC4;--pink:#FF6B9D;--cream:#FFF8F0;
  --rust:#C0440A;--amber:#F59E0B;--mint:#6EE7B7;--white:#FFFFFF;
}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;}

/* ══ DESERT BACKGROUND ══ */
#desert-bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:linear-gradient(180deg,#0D0820 0%,#1A1035 30%,#2D1B69 55%,#7B3F1A 72%,#C46A1A 82%,#E8A020 90%,#F5C842 100%);}

/* Stars layer */
#stars-layer{position:absolute;inset:0;}
.star{position:absolute;border-radius:50%;background:var(--star);animation:starTwinkle ease-in-out infinite alternate;}
@keyframes starTwinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:1;transform:scale(1.3)}}

/* Moon */
#moon{position:absolute;top:6%;right:10%;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFFDE0,#FFE066);
  box-shadow:0 0 30px 12px rgba(255,240,100,.25),0 0 60px 20px rgba(255,220,50,.12);
  animation:moonGlow 4s ease-in-out infinite alternate;}
@keyframes moonGlow{0%{box-shadow:0 0 30px 12px rgba(255,240,100,.25),0 0 60px 20px rgba(255,220,50,.12)}
  100%{box-shadow:0 0 40px 18px rgba(255,240,100,.4),0 0 80px 30px rgba(255,220,50,.2)}}

/* Shooting star */
.shooting{position:absolute;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9));
  animation:shoot linear infinite;}
@keyframes shoot{0%{opacity:0;transform:translateX(0) translateY(0)}
  10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(-200px) translateY(80px)}}

/* Dune silhouettes */
#dunes{position:absolute;bottom:0;left:0;right:0;height:32%;}
.dune{position:absolute;bottom:0;border-radius:50% 50% 0 0;animation:duneShimmer ease-in-out infinite alternate;}
@keyframes duneShimmer{0%{opacity:.9}100%{opacity:1;filter:brightness(1.06)}}

/* Sand ripples */
.ripple{position:absolute;border-radius:50%;border:1px solid rgba(245,200,66,.25);
  animation:rippleExpand ease-out infinite;}
@keyframes rippleExpand{0%{transform:scaleX(1);opacity:.5}100%{transform:scaleX(2.5);opacity:0}}

/* Drifting sand particles */
.sand-p{position:absolute;border-radius:50%;background:rgba(245,200,66,.6);
  animation:sandDrift linear infinite;}
@keyframes sandDrift{0%{transform:translateX(0) translateY(0);opacity:0}
  20%{opacity:.7}80%{opacity:.4}100%{transform:translateX(120px) translateY(-30px);opacity:0}}

/* Cactus */
.cactus{position:absolute;bottom:18%;pointer-events:none;animation:cactusWave ease-in-out infinite alternate;}
@keyframes cactusWave{0%{transform:rotate(-1deg)}100%{transform:rotate(1deg)}}

/* Camel */
.camel{position:absolute;bottom:18%;font-size:2.2rem;pointer-events:none;
  animation:camelWalk linear infinite;}
@keyframes camelWalk{0%{transform:translateX(0)}100%{transform:translateX(110vw)}}

/* ══ APP SHELL ══ */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;padding:6px 10px 4px;gap:3px;}

/* Header */
#hdr h1{font-family:'Fredoka One',cursive;font-size:clamp(.9rem,2.6vw,1.4rem);
  background:linear-gradient(135deg,var(--sand),var(--dusk),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-align:center;letter-spacing:1px;line-height:1.15;}
#hdr .sub{font-size:clamp(.47rem,1.15vw,.58rem);color:rgba(255,220,120,.65);
  font-weight:700;letter-spacing:3px;text-transform:uppercase;text-align:center;margin-top:1px;}

/* Progress */
#prog{display:flex;gap:5px;align-items:center;}
.pdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka One',cursive;font-size:.58rem;
  border:2px solid rgba(245,200,66,.2);color:rgba(245,200,66,.35);
  background:rgba(245,200,66,.06);transition:all .4s;}
.pdot.active{background:linear-gradient(135deg,var(--sand2),var(--dusk));color:#1A1035;
  border-color:var(--sand);transform:scale(1.2);box-shadow:0 0 14px rgba(245,200,66,.55);}
.pdot.done{background:linear-gradient(135deg,var(--teal),var(--mint));color:#1A1035;
  border-color:var(--teal);box-shadow:0 0 10px rgba(78,205,196,.4);}
.pline{width:18px;height:2px;background:rgba(245,200,66,.12);border-radius:2px;}
.pline.done{background:linear-gradient(90deg,var(--teal),var(--mint));}

/* Activity card */
#card{background:rgba(26,16,53,.82);backdrop-filter:blur(14px);
  border:1.5px solid rgba(245,200,66,.25);border-radius:20px;
  padding:8px 12px 6px;width:100%;max-width:920px;flex:1;
  display:flex;flex-direction:column;
  box-shadow:0 8px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(245,200,66,.1);
  overflow:hidden;position:relative;min-height:0;}
#card::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1.5px;
  background:linear-gradient(90deg,transparent,var(--sand),var(--dusk),transparent);}

.act-title{font-family:'Fredoka One',cursive;font-size:clamp(.78rem,2.1vw,1rem);
  color:var(--sand);text-align:center;margin-bottom:1px;
  text-shadow:0 0 16px rgba(245,200,66,.4);}
.act-title span{background:linear-gradient(135deg,var(--dusk),var(--pink));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.act-desc{font-size:clamp(.52rem,1.2vw,.64rem);color:rgba(255,220,150,.78);
  text-align:center;margin-bottom:5px;font-weight:700;line-height:1.4;}

.dw{flex:1;display:flex;gap:8px;min-height:0;}

/* ── Drag items base ── */
.ditem{padding:6px 9px;border-radius:11px;cursor:grab;user-select:none;
  font-size:.65rem;font-weight:700;display:flex;align-items:center;gap:5px;
  border:2px solid rgba(255,255,255,.15);color:#fff;
  transition:transform .2s,box-shadow .2s,opacity .3s;position:relative;}
.ditem:hover{transform:scale(1.06);box-shadow:0 4px 16px rgba(0,0,0,.4);}
.ditem.dragging{opacity:.2;cursor:grabbing;}
.ditem.placed{opacity:.2;pointer-events:none;}
.ditem *{pointer-events:none;}

/* ── Item bank panel ── */
.ibank{display:flex;flex-direction:column;gap:4px;width:138px;flex-shrink:0;}
.ibank-lbl{font-size:.47rem;font-weight:800;color:rgba(245,200,66,.5);
  text-align:center;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}

/* colour palette per element type */
.it-heading  {background:linear-gradient(135deg,#7c2d12,#ea580c);}
.it-para     {background:linear-gradient(135deg,#14532d,#16a34a);}
.it-image    {background:linear-gradient(135deg,#1e3a8a,#3b82f6);}
.it-address  {background:linear-gradient(135deg,#581c87,#a855f7);}
.it-title    {background:linear-gradient(135deg,#713f12,#d97706);}
.it-nav      {background:linear-gradient(135deg,#1e3a5a,#0ea5e9);}
.it-footer   {background:linear-gradient(135deg,#3b1f6e,#7c3aed);}
.it-canvas   {background:linear-gradient(135deg,#0f3030,#4ecdc4);}

/* ══ ACTIVITY 1 — Match to Preview ══ */
.a1-wrap{flex:1;display:flex;flex-direction:column;gap:5px;}
/* Preview pane of a webpage */
.page-preview{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(245,200,66,.2);
  border-radius:13px;overflow:hidden;display:flex;flex-direction:column;}
.pp-browser-bar{background:rgba(245,200,66,.15);padding:4px 8px;display:flex;align-items:center;gap:5px;}
.pp-dot{width:7px;height:7px;border-radius:50%;}
.pp-url{flex:1;background:rgba(255,255,255,.12);border-radius:6px;
  padding:2px 8px;font-size:.52rem;font-weight:700;color:rgba(255,220,130,.7);
  border:1px solid rgba(245,200,66,.2);}
.pp-body{flex:1;padding:6px;display:flex;flex-direction:column;gap:5px;}

/* Drop zones on preview */
.drop-zone{border:2px dashed rgba(245,200,66,.3);border-radius:9px;
  min-height:34px;padding:4px 7px;transition:all .3s;position:relative;
  display:flex;align-items:center;gap:5px;}
.drop-zone.over{border-color:var(--dusk);background:rgba(255,140,66,.1);}
.drop-zone.ok  {border-color:var(--teal);background:rgba(78,205,196,.08);}
.drop-zone.bad {border-color:#ef4444;background:rgba(239,68,68,.07);}
.drop-zone *{pointer-events:none;}
.dz-lbl{font-family:'Fredoka One',cursive;font-size:.54rem;color:rgba(245,200,66,.4);
  letter-spacing:.5px;text-transform:uppercase;}
.dz-hint{font-size:.5rem;color:rgba(255,220,150,.3);font-style:italic;}
.dz-placed{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:7px;
  color:#fff;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}
/* Fake rendered content preview */
.fake-h1{font-family:'Fredoka One',cursive;font-size:.95rem;color:var(--sand);line-height:1.2;}
.fake-p {font-size:.58rem;color:rgba(255,220,150,.7);line-height:1.4;}
.fake-img{width:100%;height:28px;background:linear-gradient(135deg,#1e3a8a44,#3b82f644);
  border-radius:6px;border:1px dashed rgba(59,130,246,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:.55rem;color:rgba(59,130,246,.6);font-weight:700;}

/* ══ ACTIVITY 2 — DevTools Inspector ══ */
.a2-wrap{flex:1;display:grid;grid-template-columns:1fr 1.1fr;gap:8px;}

/* Inspector panel */
.inspector{background:rgba(10,6,30,.9);border:1.5px solid rgba(78,205,196,.3);
  border-radius:13px;overflow:hidden;display:flex;flex-direction:column;}
.insp-header{background:linear-gradient(135deg,rgba(78,205,196,.2),rgba(78,205,196,.08));
  padding:5px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(78,205,196,.15);}
.insp-title{font-family:'Fredoka One',cursive;font-size:.62rem;color:var(--teal);}
.insp-blink{width:7px;height:7px;border-radius:50%;background:var(--teal);
  animation:blink 1s ease-in-out infinite alternate;}
@keyframes blink{0%{opacity:.3}100%{opacity:1}}
.insp-body{flex:1;padding:6px 8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.insp-slot{border:1.5px dashed rgba(78,205,196,.25);border-radius:8px;
  padding:5px 7px;min-height:32px;transition:all .3s;display:flex;align-items:center;gap:5px;}
.insp-slot.over{border-color:var(--dusk);background:rgba(255,140,66,.08);}
.insp-slot.ok  {border-color:var(--teal);background:rgba(78,205,196,.07);}
.insp-slot *{pointer-events:none;}
.insp-num{font-family:'Fredoka One',cursive;font-size:.75rem;color:var(--teal);min-width:16px;}
.insp-hint{font-size:.5rem;color:rgba(78,205,196,.4);font-style:italic;}

/* Live webpage pane */
.live-page{background:rgba(255,255,255,.06);border:1.5px solid rgba(245,200,66,.18);
  border-radius:13px;overflow:hidden;display:flex;flex-direction:column;}
.live-bar{background:rgba(245,200,66,.12);padding:4px 8px;display:flex;align-items:center;gap:5px;}
.live-content{flex:1;padding:8px;display:flex;flex-direction:column;gap:5px;}
.live-slot{border:1.5px dashed rgba(245,200,66,.2);border-radius:8px;
  min-height:32px;padding:4px 7px;display:flex;align-items:center;gap:5px;
  transition:all .4s;}
.live-slot.lit{border-color:rgba(245,200,66,.5);background:rgba(245,200,66,.06);}
.live-slot .ls-text{font-size:.6rem;color:rgba(255,220,150,.3);font-style:italic;transition:all .4s;}
.live-slot.lit .ls-text{color:rgba(255,220,150,.75);}

/* ══ ACTIVITY 3 — Browser Mockup Builder ══ */
.a3-wrap{flex:1;display:flex;gap:8px;}

/* Browser mockup */
.browser-mockup{flex:1;background:rgba(255,255,255,.06);border:2px solid rgba(245,200,66,.25);
  border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.bm-chrome{background:linear-gradient(135deg,rgba(245,200,66,.18),rgba(255,140,66,.12));
  padding:5px 10px;display:flex;align-items:center;gap:5px;}
.bm-dot{width:8px;height:8px;border-radius:50%;}
.bm-addr{flex:1;background:rgba(255,255,255,.1);border-radius:20px;padding:3px 10px;
  font-size:.52rem;font-weight:700;color:rgba(255,220,130,.8);
  border:1px solid rgba(245,200,66,.25);text-align:center;
  box-shadow:0 0 0 2px rgba(255,140,66,.3),0 0 12px rgba(255,140,66,.15);}
.bm-body{flex:1;display:flex;flex-direction:column;gap:4px;padding:7px;}

/* Layout drop zones */
.layout-zone{border:2px dashed rgba(245,200,66,.25);border-radius:10px;
  padding:5px 8px;transition:all .3s;display:flex;align-items:center;gap:6px;
  min-height:32px;position:relative;}
.layout-zone.zone-nav   {min-height:28px;background:rgba(14,165,233,.04);}
.layout-zone.zone-hero  {flex:1;background:rgba(234,88,12,.04);}
.layout-zone.zone-para  {background:rgba(22,163,74,.04);}
.layout-zone.zone-footer{background:rgba(124,58,237,.04);}
.layout-zone.over{border-color:var(--dusk);background:rgba(255,140,66,.1);}
.layout-zone.ok  {border-color:var(--teal);background:rgba(78,205,196,.08);}
.layout-zone *{pointer-events:none;}
.lz-tag{font-family:'Fredoka One',cursive;font-size:.48rem;
  color:rgba(245,200,66,.35);text-transform:uppercase;letter-spacing:.5px;position:absolute;top:2px;right:5px;}
.lz-hint{font-size:.52rem;color:rgba(255,220,150,.28);font-style:italic;padding-left:3px;}

/* Placed block in layout */
.placed-block{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:7px;
  color:#fff;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);}

/* ── Bottom controls ── */
#fb{text-align:center;font-size:.64rem;font-weight:700;min-height:12px;transition:all .3s;}
#controls{display:flex;align-items:center;gap:8px;}
#chkbtn{padding:7px 22px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:.75rem;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--sand2),var(--dusk));color:#1A1035;
  box-shadow:0 3px 14px rgba(245,200,66,.4);transition:transform .2s;}
#chkbtn:hover{transform:scale(1.06);}
#rstbtn{padding:5px 14px;border-radius:50px;
  border:1.5px solid rgba(245,200,66,.28);cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:.62rem;font-weight:700;
  background:rgba(245,200,66,.07);color:rgba(255,220,130,.7);transition:all .2s;}
#rstbtn:hover{background:rgba(245,200,66,.16);color:var(--sand);}

/* ── Popup ── */
#popup{position:fixed;inset:0;z-index:200;background:rgba(10,5,25,.82);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease;}
#popup.hidden{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.pbox{background:linear-gradient(160deg,#1A1035 0%,#2D1B69 50%,#3B1F0A 100%);
  border:2px solid var(--sand);border-radius:24px;padding:20px 24px 18px;
  max-width:390px;width:90%;text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.8),0 0 40px rgba(245,200,66,.15);
  animation:pboxIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes pboxIn{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.pico{font-size:2.8rem;display:block;margin-bottom:5px;animation:floatB 1.2s ease-in-out infinite alternate;}
@keyframes floatB{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.ptitle{font-family:'Fredoka One',cursive;font-size:1.2rem;
  background:linear-gradient(135deg,var(--sand),var(--dusk));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;}
.pmsg{font-size:.76rem;color:rgba(255,220,150,.85);font-weight:600;line-height:1.55;margin-bottom:12px;}
.pbtn{padding:9px 26px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:.82rem;
  background:linear-gradient(135deg,var(--sand2),var(--dusk));color:#1A1035;
  box-shadow:0 4px 18px rgba(245,200,66,.4);transition:transform .2s;}
.pbtn:hover{transform:scale(1.07);}

/* Confetti */
.cf{position:fixed;border-radius:2px;animation:cfFall linear forwards;z-index:999;pointer-events:none;}
@keyframes cfFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
/* Desert confetti — stars & sand shapes */
.cf-star{position:fixed;animation:cfFall linear forwards;z-index:999;pointer-events:none;font-size:1rem;}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>
<div id="desert-bg"></div>

<div id="app">
  <div id="hdr">
    <h1>🌵 HTML — What is a Webpage?</h1>
    <div class="sub">✦ Planrs Academy — Digital Explorer Studio ✦</div>
  </div>
  <div id="prog">
    <div class="pdot active" id="pd1">1</div><div class="pline" id="pl1"></div>
    <div class="pdot" id="pd2">2</div><div class="pline" id="pl2"></div>
    <div class="pdot" id="pd3">3</div><div class="pline" id="pl3"></div>
    <div class="pdot" id="pd4">🏆</div>
  </div>
  <div id="card"></div>
  <div id="fb"></div>
  <div id="controls">
    <button id="chkbtn" onclick="checkAct()">🔍 Check My Work!</button>
    <button id="rstbtn" onclick="resetAct()">↺ Reset</button>
  </div>
</div>
<div id="popup" class="hidden"><div class="pbox" id="pbox"></div></div>

<script>
/* ══════════════════════════════════════
   BUILD DESERT BACKGROUND
══════════════════════════════════════ */
(function(){
  const bg=document.getElementById('desert-bg');

  // Stars
  const sl=document.createElement('div');sl.id='stars-layer';
  for(let i=0;i<90;i++){
    const s=document.createElement('div');s.className='star';
    const sz=.5+Math.random()*2.2;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*65}%;
      width:${sz}px;height:${sz}px;
      animation-duration:${1.5+Math.random()*3}s;animation-delay:${Math.random()*5}s;`;
    sl.appendChild(s);
  }
  bg.appendChild(sl);

  // Moon
  const moon=document.createElement('div');moon.id='moon';bg.appendChild(moon);

  // Shooting stars
  for(let i=0;i<3;i++){
    const sh=document.createElement('div');sh.className='shooting';
    sh.style.cssText=`top:${8+i*10}%;left:${60+i*12}%;width:${60+i*20}px;
      animation-duration:${6+i*4}s;animation-delay:${i*7}s;transform:rotate(-30deg);`;
    bg.appendChild(sh);
  }

  // Dunes
  const dunes=document.createElement('div');dunes.id='dunes';
  const duneData=[
    ['-5%',0,'110%','28%','#C46A1A',3],
    ['10%',0,'90%','22%','#D4820A',4],
    ['30%',0,'80%','18%','#E8A020',5],
    ['-2%',0,'50%','14%','#C46A1A',6],
    ['55%',0,'55%','16%','#D4820A',3.5],
  ];
  duneData.forEach(([l,b,w,h,col,dur])=>{
    const d=document.createElement('div');d.className='dune';
    d.style.cssText=`left:${l};bottom:${b};width:${w};height:${h};
      background:${col};animation-duration:${dur}s;`;
    dunes.appendChild(d);
  });
  bg.appendChild(dunes);

  // Sand ripples
  for(let i=0;i<6;i++){
    const r=document.createElement('div');r.className='ripple';
    r.style.cssText=`left:${10+i*14}%;bottom:${4+i*3}%;width:${60+i*20}px;height:${8+i*3}px;
      animation-duration:${3+i*.8}s;animation-delay:${i*1.2}s;`;
    bg.appendChild(r);
  }

  // Drifting sand particles
  for(let i=0;i<20;i++){
    const p=document.createElement('div');p.className='sand-p';
    const sz=2+Math.random()*3;
    p.style.cssText=`left:${Math.random()*80}%;bottom:${5+Math.random()*20}%;
      width:${sz}px;height:${sz}px;
      animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*6}s;`;
    bg.appendChild(p);
  }

  // Cacti (SVG inline)
  const cactusShape=(big)=>`
    <svg viewBox="0 0 40 70" width="${big?38:28}" height="${big?70:52}" xmlns="http://www.w3.org/2000/svg">

/* ══════════════════════════════════════
   FACTORIES
══════════════════════════════════════ */
function mkBank(lbl){
  const b=document.createElement('div');b.className='ibank';
  b.innerHTML=`<div class="ibank-lbl">${lbl}</div>`;
  return b;
}
function mkItem(it){
  const el=document.createElement('div');
  el.className='ditem '+it.cls;el.id='di-'+it.id;el.dataset.id=it.id;el.draggable=true;
  el.innerHTML=`${it.ico} ${it.lbl}`;
  el.addEventListener('dragstart',e=>{dragId=it.id;setTimeout(()=>el.classList.add('dragging'),10);e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.addEventListener('touchstart',tS,{passive:true});
  el.addEventListener('touchmove',tM,{passive:false});
  el.addEventListener('touchend',tE);
  return el;
}

/* ══════════════════════════════════════
   DROP SETUP
══════════════════════════════════════ */
function setupDrop(el,id,type){
  el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();el.classList.add('over');});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over');});
  el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('over');if(!dragId)return;doDrop(dragId,id,type,el);dragId=null;});
}

/* ══════════════════════════════════════
   PROCESS DROP
══════════════════════════════════════ */
function doDrop(itemId,targetId,type,targetEl){
  const act=ACTS[cur];
  const itemEl=document.getElementById('di-'+itemId);
  const item=act.items.find(i=>i.id===itemId);
  if(!item||!itemEl)return;

  if(type==='match'){
    if(placements[targetId])return;
    // Check correct
    const zone=act.zones.find(z=>z.id===targetId);
    if(!zone)return;
    const correct=(item.zone===targetId);
    placements[targetId]=itemId;
    itemEl.classList.add('placed');
    // Clear hint, add chip
    targetEl.querySelector('.dz-hint')&&(targetEl.querySelector('.dz-hint').style.display='none');
    const chip=document.createElement('div');chip.className='dz-placed '+item.cls;
    chip.innerHTML=item.ico+' '+item.lbl;
    targetEl.appendChild(chip);
    if(correct){
      targetEl.classList.add('ok');
      // Reveal the fake preview element
      if(targetId==='z_address'){
        const url=document.querySelector('.pp-url');
        if(url){url.textContent='🔗 www.planrs.com';url.style.color='rgba(245,200,66,.95)';}
      } else {
        const fake=document.getElementById(
          targetId==='z_heading'?'prev-h1':targetId==='z_image'?'prev-img':'prev-p');
        if(fake)fake.style.opacity='1';
      }
    } else {
      targetEl.classList.add('bad');
    }
  }

  else if(type==='inspect'){
    const slot=act.slots.find(s=>s.id===targetId);
    if(!slot||placements[targetId])return;
    placements[targetId]=itemId;
    itemEl.classList.add('placed');
    const slotEl=document.getElementById('isl-'+targetId);
    if(slotEl){
      slotEl.querySelector('.insp-hint').style.display='none';
      const chip=document.createElement('div');chip.className='dz-placed '+item.cls;
      chip.innerHTML=item.ico+' '+item.lbl;
      slotEl.appendChild(chip);
      if(slot.ans===itemId){
        slotEl.classList.add('ok');
        // Light up live page
        const lv=document.getElementById(slot.liveId);
        if(lv)lv.classList.add('lit');
      }
    }
  }

  else if(type==='build'){
    const zone=act.zones.find(z=>z.id===targetId);
    if(!zone||placements[targetId])return;
    // Validate correct zone
    if(item.zone!==targetId){
      targetEl.style.animation='none';
      setTimeout(()=>{targetEl.style.animation='shake .4s ease';},10);
      setTimeout(()=>{targetEl.style.animation='';},450);
      return;
    }
    placements[targetId]=itemId;
    itemEl.classList.add('placed');
    targetEl.querySelector('.lz-hint')&&(targetEl.querySelector('.lz-hint').style.display='none');
    const chip=document.createElement('div');chip.className='placed-block '+item.cls;
    chip.innerHTML=item.ico+' '+item.lbl;
    targetEl.appendChild(chip);
    targetEl.classList.add('ok');
  }
}

/* ══════════════════════════════════════
   TOUCH DnD
══════════════════════════════════════ */
let tEl=null,tClone=null,tX0=0,tY0=0;
function tS(e){
  tEl=e.currentTarget;dragId=tEl.dataset.id;
  const t=e.touches[0];tX0=t.clientX;tY0=t.clientY;
  tClone=tEl.cloneNode(true);
  const r=tEl.getBoundingClientRect();
  Object.assign(tClone.style,{position:'fixed',left:r.left+'px',top:r.top+'px',
    width:r.width+'px',opacity:'.9',zIndex:'9999',pointerEvents:'none',
    transition:'none',transform:'scale(1.1)'});
  document.body.appendChild(tClone);
}
function tM(e){
  e.preventDefault();if(!tClone)return;
  const t=e.touches[0];const dx=t.clientX-tX0,dy=t.clientY-tY0;
  const r=tEl.getBoundingClientRect();
  tClone.style.left=(r.left+dx)+'px';tClone.style.top=(r.top+dy)+'px';
  document.querySelectorAll('.drop-zone,.insp-slot,.layout-zone').forEach(z=>{
    const zr=z.getBoundingClientRect();
    z.classList.toggle('over',t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom);
  });
}
function tE(e){
  if(!tClone||!dragId)return;
  const t=e.changedTouches[0];
  tClone.remove();tClone=null;
  const zones=[...document.querySelectorAll('.drop-zone,.insp-slot,.layout-zone')];
  for(const z of zones){
    const zr=z.getBoundingClientRect();
    if(t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom){
      z.classList.remove('over');
      const type=z.classList.contains('insp-slot')?'inspect':
                 z.classList.contains('layout-zone')?'build':'match';
      const id=z.dataset.zid||z.dataset.sid||z.id;
      doDrop(dragId,id,type,z);break;
    }
    z.classList.remove('over');
  }
  dragId=null;
}

══════════════════════════════════════ */
function checkAct(){
  const act=ACTS[cur];
  const fb=document.getElementById('fb');

  if(act.logic==='match'){
    ok=act.zones.every(z=>{
      const placed=placements[z.id];
      const item=act.items.find(i=>i.id===placed);
      return item&&item.zone===z.id;
    });
  }
  else if(act.logic==='inspect'){
    ok=act.slots.every(sl=>placements[sl.id]===sl.ans);
  }
  else if(act.logic==='build'){
    ok=act.zones.every(z=>!!placements[z.id]);
  }

  if(ok){
    fb.style.color='#4ECDC4';fb.textContent='✅ Excellent Explorer work!';
    confetti(28);
    setTimeout(()=>showPopup(),600);
  } else {
    fb.style.color='#ef4444';fb.textContent='🤔 Not quite! Check the hints and try again!';
    const c=document.getElementById('card');
    c.style.animation='none';setTimeout(()=>{c.style.animation='shake .4s ease';},10);
  }
}

function confetti(n=22){

  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;background:${cols[~~(Math.random()*cols.length)]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*1.2}s;width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4200);
  }
}
function desertCelebration(){
  // Stars raining down
  const items=['⭐','🌟','✨','🌵','🐪','🏆','🌙','⚡'];
  for(let i=0;i<22;i++){
    const el=document.createElement('div');el.className='cf-star';
    el.textContent=items[~~(Math.random()*items.length)];
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()*1.5}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5000);
  }
  confetti(20);
}

render();
setTimeout(()=>confetti(6),500);
</script>
