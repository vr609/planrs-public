<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LED CIRCUIT — MAKE A BUZZER BEEP!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap');

:root {
  --sky1:#1a6fa3; --sky2:#1e8fc7; --sky3:#5bb4d8;
  --rain:#7ecef0; --puddle:#4a9fc4; --leaf:#2e8b57;
  --rainbow1:#e74c3c; --rainbow2:#e67e22; --rainbow3:#f1c40f; --rainbow4:#2ecc71; --rainbow5:#3498db; --rainbow6:#9b59b6;
  --card:#ffffffdd; --dark:#0d2d4a;
  --gold:#FFD700; --green:#27ae60; --red:#e74c3c; --purple:#8e44ad;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--sky1);}

/* ===== SKY BACKGROUND ===== */
#sky{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#0d2d4a 0%,#1a5c8a 30%,#2a8fb5 55%,#4ab5d4 70%,#7ecef0 82%,#b0e0e6 88%,#8fbc8f 92%,#5d8a5d 100%);
  overflow:hidden;}

/* Ground */
#ground{position:absolute;bottom:0;left:0;right:0;height:14%;background:linear-gradient(180deg,#5d8a5d,#3d6b3d);border-radius:40% 40% 0 0 / 10% 10% 0 0;}

/* Clouds */
.cloud{position:absolute;background:#c8e8f0;border-radius:50px;opacity:.85;animation:cloudDrift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:inherit;border-radius:50%;}
@keyframes cloudDrift{0%{transform:translateX(-200px)}100%{transform:translateX(110vw)}}

/* Rainbow */
#rainbow{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);width:700px;height:350px;pointer-events:none;}
.rbow-arc{position:absolute;border-radius:50% 50% 0 0 / 100% 100% 0 0;border-style:solid;border-bottom:none;bottom:0;left:50%;transform:translateX(-50%);animation:rainbowGlow 4s ease-in-out infinite alternate;}
@keyframes rainbowGlow{0%{opacity:.5}100%{opacity:.85}}

/* Raindrops */
.raindrop{position:absolute;width:2px;border-radius:0 0 4px 4px;background:linear-gradient(180deg,transparent,var(--rain));animation:rainFall linear infinite;opacity:.7;}
@keyframes rainFall{0%{transform:translateY(-20px);opacity:.7}100%{transform:translateY(110vh);opacity:.2}}

/* Puddles */
.puddle{position:absolute;bottom:11%;border-radius:50%;background:rgba(78,165,210,.35);animation:puddle-ripple 2s ease-in-out infinite alternate;}
@keyframes puddle-ripple{0%{transform:scaleX(1) scaleY(1);opacity:.5}100%{transform:scaleX(1.1) scaleY(1.2);opacity:.8}}
.ripple-ring{position:absolute;border-radius:50%;border:2px solid rgba(126,206,240,.5);animation:rippleOut 2s linear infinite;pointer-events:none;}
@keyframes rippleOut{0%{transform:scale(0);opacity:.8}100%{transform:scale(3);opacity:0}}

/* Frogs */
.frog{position:absolute;bottom:12%;font-size:1.8rem;animation:frogHop 3s ease-in-out infinite;}
@keyframes frogHop{0%,40%,100%{transform:translateY(0) scaleX(1)}20%{transform:translateY(-25px) scaleX(.9)}60%{transform:translateY(-12px) scaleX(1.05)}}

/* Umbrellas */
.umbrella{position:absolute;font-size:2.2rem;animation:umbrellaSwing 4s ease-in-out infinite alternate;}
@keyframes umbrellaSwing{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}

/* Leaves */
.leaf{position:absolute;font-size:1.2rem;animation:leafFloat linear infinite;}
@keyframes leafFloat{0%{transform:translateX(0) rotate(0deg) translateY(0);opacity:.9}50%{transform:translateX(30px) rotate(180deg) translateY(10px);opacity:.7}100%{transform:translateX(-10px) rotate(360deg) translateY(-5px);opacity:.9}}

/* ===== APP SHELL ===== */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 12px 6px;}

/* Header */
#header{text-align:center;margin-bottom:6px;}
#header h1{font-family:'Baloo 2',cursive;font-size:clamp(1rem,3vw,1.6rem);font-weight:800;color:#FFD700;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.4);text-transform:uppercase;}
#header .sub{font-size:clamp(.6rem,1.5vw,.75rem);color:#b0e0e6;font-weight:700;letter-spacing:3px;margin-top:1px;}

/* Progress */
#progress{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
.pdot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;border:2.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.4);background:rgba(255,255,255,.07);transition:all .4s;font-family:'Baloo 2',cursive;}
.pdot.active{background:var(--gold);color:#0d2d4a;border-color:var(--gold);transform:scale(1.2);box-shadow:0 0 12px var(--gold);}
.pdot.done{background:var(--green);color:#fff;border-color:var(--green);}
.pline{width:28px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;position:relative;overflow:hidden;}
.pline.done::after{content:'';position:absolute;inset:0;background:var(--green);border-radius:2px;}

/* Activity Card */
#act-card{background:rgba(255,255,255,.16);backdrop-filter:blur(14px);border:2px solid rgba(255,215,0,.3);border-radius:20px;padding:12px 16px 10px;width:100%;max-width:780px;flex:1;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);overflow:hidden;}
.act-title{font-family:'Baloo 2',cursive;font-size:clamp(.8rem,2.5vw,1.05rem);font-weight:800;color:#FFD700;text-align:center;margin-bottom:3px;}
.act-desc{font-size:clamp(.6rem,1.5vw,.72rem);color:rgba(255,255,255,.85);text-align:center;margin-bottom:8px;font-weight:600;}

/* DnD container */
.dnd-wrap{flex:1;display:flex;gap:8px;min-height:0;}

/* Item bank */
.item-bank{display:flex;flex-direction:column;gap:5px;width:155px;flex-shrink:0;}
.bank-title{font-size:.6rem;font-weight:800;color:rgba(255,255,255,.55);text-align:center;text-transform:uppercase;letter-spacing:2px;margin-bottom:2px;}

/* Drag items */
.ditem{padding:7px 9px;border-radius:12px;cursor:grab;user-select:none;font-size:.68rem;font-weight:700;text-align:center;display:flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.25);transition:transform .2s,box-shadow .2s,opacity .3s;color:#fff;}
.ditem:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(0,0,0,.4);}
.ditem.dragging{opacity:.35;cursor:grabbing;}
.ditem.placed{opacity:.35;pointer-events:none;}
.ditem .dicon{font-size:1.1rem;}

/* Drop zones */
.dzone{flex:1;border-radius:14px;border:2px dashed rgba(255,255,255,.3);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-height:50px;background:rgba(255,255,255,.05);transition:border-color .3s,background .3s;}
.dzone.over{border-color:var(--gold);background:rgba(255,215,0,.12);box-shadow:0 0 16px rgba(255,215,0,.2);}
.dzone.correct{border-color:var(--green);background:rgba(39,174,96,.15);}
.dzone.wrong{border-color:var(--red);background:rgba(231,76,60,.12);}
.dzone *{pointer-events:none;}
.zone-label{font-size:.58rem;font-weight:800;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:1px;text-align:center;width:100%;margin-bottom:2px;}
.zone-emoji{font-size:1.3rem;margin-bottom:2px;}
.dropped-chip{font-size:.6rem;font-weight:700;padding:3px 7px;border-radius:8px;color:#fff;text-align:center;width:100%;animation:chipIn .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes chipIn{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1);opacity:1}}

/* Sequence slots */
.seq-area{flex:1;display:flex;flex-direction:column;gap:5px;overflow-y:auto;}
.seq-slot{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;border:2px dashed rgba(255,255,255,.25);min-height:42px;background:rgba(255,255,255,.05);transition:all .3s;}
.seq-slot.over{border-color:var(--rain);background:rgba(126,206,240,.12);}
.seq-slot.correct{border-color:var(--green);background:rgba(39,174,96,.15);}
.seq-slot *{pointer-events:none;}
.slot-num{font-family:'Baloo 2',cursive;font-size:1rem;font-weight:800;color:var(--gold);min-width:22px;text-align:center;}
.slot-text{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.45);}

/* Circuit builder (act 2) */
.circuit-area{flex:1;display:flex;flex-direction:column;gap:6px;}
.circuit-board{flex:1;border-radius:14px;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05);position:relative;overflow:hidden;min-height:140px;}
.circuit-board.over{border-color:var(--rain);background:rgba(126,206,240,.1);}
.circuit-board *{pointer-events:none;}
.board-label{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:.55rem;font-weight:800;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:2px;}
.placed-comp{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .4s cubic-bezier(.34,1.56,.64,1);}
.placed-comp .comp-icon{font-size:1.8rem;}
.placed-comp .comp-label{font-size:.55rem;font-weight:800;color:#fff;background:rgba(0,0,0,.4);padding:1px 5px;border-radius:5px;}
.wire{position:absolute;background:rgba(255,100,60,.8);border-radius:4px;transform-origin:left center;transition:all .5s ease;}
.wire.anim{animation:wireFlow 1s linear infinite;}
@keyframes wireFlow{0%{box-shadow:0 0 0 1px rgba(255,200,50,0)}50%{box-shadow:0 0 6px 2px rgba(255,200,50,.6)}100%{box-shadow:0 0 0 1px rgba(255,200,50,0)}}
.beep-bubble{position:absolute;background:#FFD700;color:#0d2d4a;font-weight:800;font-size:.85rem;border-radius:16px;padding:4px 10px;animation:beepPop .4s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;}
@keyframes beepPop{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.sound-wave{position:absolute;border-radius:50%;border:2px solid rgba(255,215,0,.5);animation:waveOut 1s ease-out forwards;pointer-events:none;}
@keyframes waveOut{0%{transform:scale(0);opacity:.8}100%{transform:scale(4);opacity:0}}

/* Buttons */
#check-btn{margin:7px auto 0;padding:9px 28px;border-radius:50px;border:none;cursor:pointer;font-family:'Baloo 2',cursive;font-size:.85rem;font-weight:800;background:linear-gradient(135deg,#e67e22,#FFD700);color:#0d2d4a;box-shadow:0 3px 16px rgba(255,107,0,.4);transition:transform .2s;display:block;}
#check-btn:hover{transform:scale(1.06);}
#check-btn:active{transform:scale(.97);}
#reset-btn{margin:5px auto 0;padding:6px 20px;border-radius:50px;border:2px solid rgba(255,255,255,.3);cursor:pointer;font-family:'Baloo 2',cursive;font-size:.72rem;font-weight:700;background:rgba(255,255,255,.09);color:rgba(255,255,255,.75);transition:all .2s;display:block;}
#reset-btn:hover{background:rgba(255,255,255,.18);color:#fff;}
#feedback{text-align:center;font-size:.7rem;font-weight:700;margin-top:3px;min-height:16px;transition:all .3s;}

/* Popup */
#popup{position:fixed;inset:0;z-index:200;background:rgba(13,45,74,.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;animation:fadeIn .4s ease;}
#popup.hidden{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.popup-box{background:linear-gradient(135deg,#0d2d4a,#1a5c8a 50%,#2e8b57 100%);border:3px solid var(--gold);border-radius:24px;padding:24px 28px 20px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:popIn .5s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;}
@keyframes popIn{from{transform:scale(.6) rotate(-5deg);opacity:0}to{transform:scale(1);opacity:1}}
.popup-emoji{font-size:2.8rem;display:block;margin-bottom:6px;animation:bounce 1s ease infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.popup-title{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;color:var(--gold);margin-bottom:6px;}
.popup-msg{font-size:.82rem;color:rgba(255,255,255,.9);font-weight:600;line-height:1.5;margin-bottom:14px;}
.popup-btn{padding:10px 32px;border-radius:50px;border:none;cursor:pointer;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:800;background:linear-gradient(135deg,#e67e22,#FFD700);color:#0d2d4a;box-shadow:0 4px 18px rgba(255,107,0,.5);transition:transform .2s;}
.popup-btn:hover{transform:scale(1.07);}

/* Confetti */
.cpiece{position:fixed;width:7px;height:7px;border-radius:2px;animation:cfall linear forwards;z-index:999;pointer-events:none;}
@keyframes cfall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>
<body>

<div id="sky" aria-hidden="true"></div>
<div id="app">
  <div id="header">
    <h1>⚡ LED Circuit — Make a Buzzer Beep! 🔔</h1>
    <div class="sub">✨ Build • Connect • Celebrate! ✨</div>
  </div>
  <div id="progress">
    <div class="pdot active" id="pd1">1</div>
    <div class="pline" id="pl1"></div>
    <div class="pdot" id="pd2">2</div>
    <div class="pline" id="pl2"></div>
    <div class="pdot" id="pd3">3</div>
    <div class="pline" id="pl3"></div>
    <div class="pdot" id="pd4">🏆</div>
  </div>
  <div id="act-card"></div>
  <div id="feedback"></div>
  <button id="check-btn" onclick="checkAct()">✅ Check My Answers!</button>
  <button id="reset-btn" onclick="resetAct()">🔄 Reset Activity</button>
</div>

<div id="popup" class="hidden">
  <div class="popup-box" id="popup-box"></div>
</div>

<script>
// =====================================================================
//  BACKGROUND BUILDER
// =====================================================================
(function buildBg(){
  const sky=document.getElementById('sky');

  // Ground
  const g=document.createElement('div');g.id='ground';sky.appendChild(g);

  // Rainbow arcs
  const rb=document.createElement('div');rb.id='rainbow';
  const rbColors=[
    {c:'#e74c3c',w:700,h:350},{c:'#e67e22',w:650,h:325},{c:'#f1c40f',w:600,h:300},
    {c:'#2ecc71',w:550,h:275},{c:'#3498db',w:500,h:250},{c:'#9b59b6',w:450,h:225}
  ];
  rbColors.forEach(r=>{
    const a=document.createElement('div');
    a.className='rbow-arc';
    Object.assign(a.style,{
      width:r.w+'px',height:r.h+'px',
      borderColor:r.c,borderWidth:'18px',
      animationDelay:(Math.random()*2)+'s'
    });
    rb.appendChild(a);
  });
  sky.appendChild(rb);

  // Clouds
  const cloudDefs=[
    {top:'5%',w:120,h:40,delay:0,dur:40},{top:'10%',w:90,h:30,delay:8,dur:55},
    {top:'3%',w:160,h:50,delay:15,dur:35},{top:'15%',w:80,h:28,delay:22,dur:65},
  ];
  cloudDefs.forEach(c=>{
    const el=document.createElement('div');el.className='cloud';
    Object.assign(el.style,{top:c.top,width:c.w+'px',height:c.h+'px',left:'-200px',
      animationDelay:c.delay+'s',animationDuration:c.dur+'s'});
    el.style.setProperty('--before-w',(c.w*.6)+'px');
    const b=document.createElement('style');
    sky.appendChild(el);
  });

  // Raindrops
  for(let i=0;i<60;i++){
    const r=document.createElement('div');r.className='raindrop';
    const h=8+Math.random()*14;
    Object.assign(r.style,{
      left:Math.random()*100+'%',
      height:h+'px',
      animationDuration:(0.6+Math.random()*.8)+'s',
      animationDelay:(Math.random()*2)+'s',
      opacity:0.4+Math.random()*.4
    });
    sky.appendChild(r);
  }

  // Puddles
  const pudPos=[10,25,40,55,70,85];
  pudPos.forEach((lp,i)=>{
    const p=document.createElement('div');p.className='puddle';
    const w=30+Math.random()*50;
    Object.assign(p.style,{left:lp+'%',width:w+'px',height:(w*.35)+'px',
      animationDelay:(i*.4)+'s'});
    sky.appendChild(p);
    // ripple inside puddle
    const rr=document.createElement('div');rr.className='ripple-ring';
    Object.assign(rr.style,{width:'20px',height:'8px',left:'40%',top:'20%',
      animationDelay:(i*.7)+'s'});
    p.appendChild(rr);
  });

  // Frogs
  const frogPos=[8,22,65,80];
  frogPos.forEach((lp,i)=>{
    const f=document.createElement('div');f.className='frog';
    f.textContent='🐸';
    Object.assign(f.style,{left:lp+'%',animationDelay:(i*.8)+'s',animationDuration:(2.5+i*.4)+'s'});
    sky.appendChild(f);
  });

  // Umbrellas
  [[15,60],[45,55],[75,58]].forEach(([l,b],i)=>{
    const u=document.createElement('div');u.className='umbrella';
    u.textContent='☂️';
    Object.assign(u.style,{left:l+'%',bottom:b+'%',animationDelay:(i*.9)+'s',
      fontSize:(1.8+Math.random()*.6)+'rem'});
    sky.appendChild(u);
  });

  // Leaves floating
  for(let i=0;i<8;i++){
    const l=document.createElement('div');l.className='leaf';
    l.textContent=['🍃','🌿','🍀'][i%3];
    Object.assign(l.style,{
      left:Math.random()*90+'%',bottom:(12+Math.random()*15)+'%',
      animationDuration:(4+Math.random()*5)+'s',
      animationDelay:(Math.random()*4)+'s'
    });
    sky.appendChild(l);
  }
})();

// =====================================================================
//  CONFETTI
// =====================================================================
function confetti(n=30){
  const cols=['#FFD700','#2ecc71','#3498db','#e74c3c','#9b59b6','#e67e22','#1abc9c'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='cpiece';
    Object.assign(c.style,{
      left:Math.random()*100+'vw',
      background:cols[Math.floor(Math.random()*cols.length)],
      animationDuration:(2+Math.random()*3)+'s',
      animationDelay:(Math.random()*1.5)+'s',
      width:(5+Math.random()*7)+'px',height:(5+Math.random()*7)+'px',
      borderRadius:Math.random()>.5?'50%':'2px'
    });
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

// =====================================================================
//  ACTIVITY DATA
// =====================================================================
const acts=[
  // Activity 1 — Sequence: correct order of circuit components
  {
    id:1,checkLogic:'sequence',
    title:'⚡ Activity 1 — Put the Circuit in Order!',
    desc:'Drag the circuit parts into the right order — from power to output!',
    items:[
      {id:'bat',emoji:'🔋',label:'Battery (Power)',color:'linear-gradient(135deg,#c0392b,#8e44ad)',pos:1},
      {id:'wire1',emoji:'🔴',label:'Red Wire (+)',color:'linear-gradient(135deg,#e74c3c,#c0392b)',pos:2},
      {id:'led',emoji:'💡',label:'LED (Light)',color:'linear-gradient(135deg,#f39c12,#e67e22)',pos:3},
      {id:'buz',emoji:'🔔',label:'Buzzer (Sound)',color:'linear-gradient(135deg,#1abc9c,#16a085)',pos:4},
      {id:'wire2',emoji:'⚫',label:'Black Wire (−)',color:'linear-gradient(135deg,#2c3e50,#34495e)',pos:5},
    ],
    slots:5
  },
  // Activity 2 — Circuit builder
  {
    id:2,checkLogic:'circuit',
    title:'🔧 Activity 2 — Build the Circuit!',
    desc:'Drag each part into the circuit board to complete the loop!',
    items:[
      {id:'cb',emoji:'🔋',label:'3V Battery',color:'linear-gradient(135deg,#8e44ad,#6c3483)',ctype:'battery'},
      {id:'cl',emoji:'💡',label:'LED',color:'linear-gradient(135deg,#f39c12,#d68910)',ctype:'led'},
      {id:'cz',emoji:'🔔',label:'Buzzer',color:'linear-gradient(135deg,#1abc9c,#148f77)',ctype:'buzzer'},
      {id:'cwr',emoji:'🔴',label:'Red Wire',color:'linear-gradient(135deg,#e74c3c,#c0392b)',ctype:'redwire'},
      {id:'cwb',emoji:'⚫',label:'Black Wire',color:'linear-gradient(135deg,#2c3e50,#1a252f)',ctype:'blackwire'},
    ],
    required:['battery','led','buzzer','redwire','blackwire']
  },
  // Activity 3 — Tap-to-pick quiz
  {
    id:3,checkLogic:'tapquiz',
    title:'🎯 Activity 3 — Why Does the Buzzer Beep?',
    desc:'Tap the correct reason for each buzzer situation!',
    questions:[
      {id:'q1',emoji:'🔥',situation:'Smoke is filling the kitchen!',choices:['To play music','To warn about danger!','To turn on the TV'],correct:1},
      {id:'q2',emoji:'🚪',situation:'Someone rings your doorbell.',choices:['To tell you a visitor is here!','To charge your phone','To start the microwave'],correct:0},
      {id:'q3',emoji:'⏰',situation:'Your alarm clock goes off at 7 AM.',choices:['To make breakfast','To wake you up!','To open the curtains'],correct:1},
      {id:'q4',emoji:'🏫',situation:'The school bell rings at the end of class.',choices:['To call the teacher','To say class is over!','To start lunch'],correct:1},
      {id:'q5',emoji:'🏥',situation:'A patient presses the nurse call button.',choices:['To order food','To change the channel','To call the nurse for help!'],correct:2},
    ]
  }
];

let cur=0, placements={}, draggedId=null;

// =====================================================================
//  RENDER
// =====================================================================
function render(){
  const act=acts[cur];
  const card=document.getElementById('act-card');
  placements={};
  document.getElementById('feedback').textContent='';
  updateDots();

  card.innerHTML=`<div class="act-title">${act.title}</div><div class="act-desc">${act.desc}</div><div class="dnd-wrap" id="dnd-wrap"></div>`;

  if(act.checkLogic==='sequence') renderSeq(act);
  else if(act.checkLogic==='circuit') renderCircuit(act);
  else if(act.checkLogic==='tapquiz') renderTapQuiz(act);
}

// ─── Activity 1: Sequence ───
function renderSeq(act){
  const wrap=document.getElementById('dnd-wrap');
  // Bank
  const bank=document.createElement('div');bank.className='item-bank';
  bank.innerHTML='<div class="bank-title">Circuit Parts</div>';
  const shuffled=[...act.items].sort(()=>Math.random()-.5);
  shuffled.forEach(item=>{
    bank.appendChild(makeDrag(item));
  });
  wrap.appendChild(bank);
  // Slots
  const seqArea=document.createElement('div');seqArea.className='seq-area';
  for(let i=1;i<=act.slots;i++){
    placements['s'+i]=null;
    const sl=document.createElement('div');
    sl.className='seq-slot';sl.id='sl'+i;sl.dataset.slot=i;
    sl.innerHTML=`<div class="slot-num">${i}</div><div class="slot-text" id="slt${i}">Drop a part here…</div>`;
    setupDrop(sl,'s'+i,'slot');
    seqArea.appendChild(sl);
  }
  wrap.appendChild(seqArea);
}

// ─── Activity 2: Circuit Builder ───
function renderCircuit(act){
  const wrap=document.getElementById('dnd-wrap');
  const bank=document.createElement('div');bank.className='item-bank';
  bank.innerHTML='<div class="bank-title">Components</div>';
  act.items.forEach(item=>bank.appendChild(makeDrag(item)));
  wrap.appendChild(bank);

  act.required.forEach(r=>{ placements[r]=false; });

  const cArea=document.createElement('div');cArea.className='circuit-area';
  const board=document.createElement('div');
  board.className='circuit-board';board.id='cboard';board.dataset.board='1';
  board.innerHTML='<div class="board-label">Circuit Board — Drop parts here!</div>';
  setupDrop(board,'cboard','board');
  cArea.appendChild(board);
  wrap.appendChild(cArea);
}

// ─── Activity 3: Tap Quiz ───
function renderTapQuiz(act){
  const wrap=document.getElementById('dnd-wrap');
  wrap.style.flexDirection='column';
  wrap.style.overflowY='auto';
  wrap.style.gap='8px';

  act.questions.forEach((q,qi)=>{
    placements[q.id]=null;

    const qCard=document.createElement('div');
    qCard.style.cssText='background:rgba(255,255,255,.1);border-radius:14px;padding:8px 10px;border:2px solid rgba(255,255,255,.2);flex-shrink:0;';

    const sitRow=document.createElement('div');
    sitRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;';
    sitRow.innerHTML=`<span style="font-size:1.5rem">${q.emoji}</span><span style="font-size:.7rem;font-weight:700;color:#fff;">${q.situation}</span>`;
    qCard.appendChild(sitRow);

    const choicesRow=document.createElement('div');
    choicesRow.style.cssText='display:flex;flex-direction:column;gap:4px;';
    q.choices.forEach((ch,ci)=>{
      const btn=document.createElement('button');
      btn.style.cssText='padding:5px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:rgba(255,255,255,.9);font-family:Nunito,sans-serif;font-size:.65rem;font-weight:700;cursor:pointer;text-align:left;transition:all .2s;';
      btn.textContent=ch;
      btn.dataset.qi=qi;btn.dataset.ci=ci;
      btn.addEventListener('click',()=>{
        if(placements[q.id]!==null)return; // already answered
        placements[q.id]=ci;
        const correct=(ci===q.correct);
        // Style all buttons in this group
        choicesRow.querySelectorAll('button').forEach((b,i)=>{
          b.disabled=true;
          if(i===q.correct){
            b.style.background='rgba(39,174,96,.5)';b.style.borderColor='#27ae60';b.style.color='#fff';
          } else if(i===ci&&!correct){
            b.style.background='rgba(231,76,60,.5)';b.style.borderColor='#e74c3c';b.style.color='#fff';
          } else {
            b.style.opacity='.4';
          }
        });
        // Badge
        const badge=document.createElement('span');
        badge.style.cssText='font-size:.75rem;margin-left:6px;';
        badge.textContent=correct?'✅':'❌';
        sitRow.appendChild(badge);
      });
      choicesRow.appendChild(btn);
    });
    qCard.appendChild(choicesRow);
    wrap.appendChild(qCard);
  });
}

// =====================================================================
//  DRAG ITEM FACTORY
// =====================================================================
function makeDrag(item){
  const el=document.createElement('div');
  el.className='ditem';el.id='di-'+item.id;el.dataset.id=item.id;el.draggable=true;
  el.style.background=item.color;
  el.innerHTML=`<span class="dicon">${item.emoji}</span><span>${item.label}</span>`;
  el.addEventListener('dragstart',e=>{
    draggedId=item.id;
    setTimeout(()=>el.classList.add('dragging'),10);
    e.dataTransfer.effectAllowed='move';
  });
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.addEventListener('touchstart',tStart,{passive:true});
  el.addEventListener('touchmove',tMove,{passive:false});
  el.addEventListener('touchend',tEnd);
  return el;
}

// =====================================================================
//  DROP ZONE SETUP
// =====================================================================
function setupDrop(el,id,type){
  el.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();el.classList.add('over');});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over');});
  el.addEventListener('drop',e=>{
    e.preventDefault();e.stopPropagation();el.classList.remove('over');
    if(!draggedId)return;
    doDrop(draggedId,id,type,el);
    draggedId=null;
  });
}

// =====================================================================
//  HANDLE DROP
// =====================================================================
function doDrop(itemId,targetId,type,targetEl){
  const act=acts[cur];
  const itemEl=document.getElementById('di-'+itemId);
  if(!itemEl)return;
  const item=act.items.find(i=>i.id===itemId);
  if(!item)return;

  if(type==='slot'){
    const slotN=targetEl.dataset.slot;
    const key='s'+slotN;
    if(placements[key])return;
    placements[key]=itemId;
    itemEl.classList.add('placed');
    const txt=document.getElementById('slt'+slotN);
    if(txt){txt.textContent=item.emoji+' '+item.label;txt.style.color='#fff';txt.style.fontWeight='700';}
  }
  else if(type==='board'){
    const ctype=item.ctype;
    if(placements[ctype])return;
    placements[ctype]=true;
    itemEl.classList.add('placed');
    placeOnBoard(ctype,item);
  }
  else if(type==='cat'){
    if(placements[targetId]&&placements[targetId].includes(itemId))return;
    if(!placements[targetId])placements[targetId]=[];
    placements[targetId].push(itemId);
    itemEl.classList.add('placed');
    const chip=document.createElement('div');
    chip.className='dropped-chip';chip.style.background=item.color;
    chip.innerHTML=item.emoji+' '+item.label;
    targetEl.appendChild(chip);
  }
}

// ─── Place component visually on circuit board ───
const boardPositions={
  battery:{x:'12%',y:'35%'},
  redwire:{x:'28%',y:'28%'},
  led:{x:'44%',y:'30%'},
  buzzer:{x:'62%',y:'32%'},
  blackwire:{x:'78%',y:'38%'},
};
function placeOnBoard(ctype,item){
  const board=document.getElementById('cboard');
  if(!board)return;
  const pos=boardPositions[ctype]||{x:'50%',y:'50%'};
  const el=document.createElement('div');el.className='placed-comp';
  el.style.cssText=`left:${pos.x};top:${pos.y};transform:translate(-50%,-50%);`;
  el.innerHTML=`<div class="comp-icon">${item.emoji}</div><div class="comp-label">${item.label}</div>`;
  board.appendChild(el);

  // Draw wire from prev component
  drawWires();

  // If all placed, trigger beep animation
  const allPlaced=Object.values(placements).every(v=>v===true);
  if(allPlaced) setTimeout(()=>triggerBeep(board),400);
}

function drawWires(){
  const board=document.getElementById('cboard');
  if(!board)return;
  // Remove old wires
  board.querySelectorAll('.wire').forEach(w=>w.remove());
  const order=['battery','redwire','led','buzzer','blackwire'];
  const placed=order.filter(k=>placements[k]);
  if(placed.length<2)return;
  // Simple visual wires between placed positions
  for(let i=0;i<placed.length-1;i++){
    const from=boardPositions[placed[i]];
    const to=boardPositions[placed[i+1]];
    const board=document.getElementById('cboard');
    const bRect=board.getBoundingClientRect();
    const fw=bRect.width,fh=bRect.height;
    const fx=parseFloat(from.x)/100*fw, fy=parseFloat(from.y)/100*fh;
    const tx=parseFloat(to.x)/100*fw, ty=parseFloat(to.y)/100*fh;
    const len=Math.hypot(tx-fx,ty-fy);
    const angle=Math.atan2(ty-fy,tx-fx)*180/Math.PI;
    const w=document.createElement('div');w.className='wire';
    const allPlaced=Object.values(placements).every(v=>v===true);
    if(allPlaced)w.classList.add('anim');
    Object.assign(w.style,{
      left:fx+'px',top:fy+'px',width:len+'px',height:'5px',
      transform:`rotate(${angle}deg)`,
      background:placed[i]==='redwire'||i===0?'rgba(231,76,60,.8)':'rgba(52,73,94,.8)'
    });
    board.appendChild(w);
  }
}

function triggerBeep(board){
  // Sound wave circles
  const comps=board.querySelectorAll('.placed-comp');
  comps.forEach(c=>{
    const rect=c.getBoundingClientRect();
    const brect=board.getBoundingClientRect();
    for(let i=0;i<3;i++){
      const sw=document.createElement('div');sw.className='sound-wave';
      Object.assign(sw.style,{
        left:(rect.left-brect.left+rect.width/2-15)+'px',
        top:(rect.top-brect.top+rect.height/2-15)+'px',
        width:'30px',height:'30px',
        animationDelay:(i*.3)+'s'
      });
      board.appendChild(sw);
      setTimeout(()=>sw.remove(),1500);
    }
  });
  // BEEP! bubble
  const bubble=document.createElement('div');bubble.className='beep-bubble';
  bubble.textContent='🔔 BEEP!';
  bubble.style.cssText='top:10px;right:10px;';
  board.appendChild(bubble);
  setTimeout(()=>bubble.remove(),2000);
  // Make board glow
  board.style.borderColor=var_gold;board.style.background='rgba(255,215,0,.1)';
  setTimeout(()=>{board.style.borderColor='';board.style.background='';},2000);
  // Update wires with animation
  drawWires();
}
const var_gold='#FFD700';

// =====================================================================
//  TOUCH SUPPORT
// =====================================================================
let tItem=null,tClone=null,tSX=0,tSY=0;
function tStart(e){
  tItem=e.currentTarget;draggedId=tItem.dataset.id;
  const t=e.touches[0];tSX=t.clientX;tSY=t.clientY;
  tClone=tItem.cloneNode(true);
  const r=tItem.getBoundingClientRect();
  Object.assign(tClone.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',opacity:'.85',zIndex:'9999',pointerEvents:'none',transition:'none',transform:'scale(1.05)'});
  document.body.appendChild(tClone);
}
function tMove(e){
  e.preventDefault();if(!tClone)return;
  const t=e.touches[0];
  const dx=t.clientX-tSX,dy=t.clientY-tSY;
  const r=tItem.getBoundingClientRect();
  tClone.style.left=(r.left+dx)+'px';tClone.style.top=(r.top+dy)+'px';
  document.querySelectorAll('.seq-slot,.dzone,.circuit-board').forEach(z=>{
    const zr=z.getBoundingClientRect();
    const over=t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom;
    z.classList.toggle('over',over);
  });
}
function tEnd(e){
  if(!tClone||!draggedId)return;
  const t=e.changedTouches[0];
  tClone.remove();tClone=null;
  const zones=[...document.querySelectorAll('.seq-slot,.dzone,.circuit-board')];
  for(const z of zones){
    const zr=z.getBoundingClientRect();
    if(t.clientX>zr.left&&t.clientX<zr.right&&t.clientY>zr.top&&t.clientY<zr.bottom){
      z.classList.remove('over');
      let type='cat',id=z.dataset.cat;
      if(z.dataset.slot){type='slot';id='s'+z.dataset.slot;}
      if(z.dataset.board){type='board';id='cboard';}
      doDrop(draggedId,id,type,z);break;
    }
    z.classList.remove('over');
  }
  draggedId=null;
}

// =====================================================================
//  CHECK LOGIC
// =====================================================================
function checkAct(){
  const act=acts[cur];
  let ok=false;

  if(act.checkLogic==='sequence'){
    let all=true;
    act.items.forEach(item=>{
      const key='s'+item.pos;
      if(placements[key]!==item.id)all=false;
      else document.getElementById('sl'+item.pos)?.classList.add('correct');
    });
    ok=all;
  }
  else if(act.checkLogic==='circuit'){
    ok=act.required.every(r=>placements[r]===true);
    if(ok){
      document.getElementById('cboard')?.classList.add('correct');
      triggerBeep(document.getElementById('cboard'));
    }
  }
  else if(act.checkLogic==='tapquiz'){
    const allAnswered=act.questions.every(q=>placements[q.id]!==null);
    if(!allAnswered){
      const fb=document.getElementById('feedback');
      fb.style.color='#FFD700';fb.textContent='👆 Please answer all 5 questions first!';
      return;
    }
    ok=act.questions.every(q=>placements[q.id]===q.correct);
  }

  const fb=document.getElementById('feedback');
  if(ok){
    fb.style.color='#FFD700';fb.textContent='✅ Amazing! You got it!';
    confetti(30);
    setTimeout(()=>showPopup(),700);
  } else {
    fb.style.color='#ff6b6b';fb.textContent='🤔 Almost! Try again — you can do it!';
    const card=document.getElementById('act-card');
    card.style.animation='none';
    setTimeout(()=>{card.style.animation='shake .4s ease';},10);
  }
}

// =====================================================================
//  POPUPS
// =====================================================================
const popData=[
  {e:'⚡',t:'Circuit Champion!',m:'You know the order! Battery → Wires → LED → Buzzer — that\'s how electricity flows in a complete loop!',btn:'Build the Circuit! →'},
  {e:'🔔',t:'Circuit Builder!',m:'You assembled the full circuit! The LED glows and the Buzzer beeps — electricity is flowing around the loop!',btn:'Match Real Uses! →'},
  {e:'🏆',t:'Buzzer Expert!',m:'You matched every situation perfectly! You now know exactly when and why buzzers help us every day!',btn:'See Your Trophy! 🎊'},
];

function showPopup(){
  const d=popData[cur];
  const box=document.getElementById('popup-box');
  box.innerHTML=`<span class="popup-emoji">${d.e}</span><div class="popup-title">${d.t}</div><div class="popup-msg">${d.m}</div><button class="popup-btn" onclick="nextAct()">${d.btn}</button>`;
  document.getElementById('popup').classList.remove('hidden');
}

function nextAct(){
  document.getElementById('popup').classList.add('hidden');
  cur++;
  if(cur>=acts.length){showFinal();return;}
  render();
}

function showFinal(){
  confetti(80);
  const box=document.getElementById('popup-box');
  box.innerHTML=`
    <span style="font-size:3rem;display:block;margin-bottom:8px;animation:bounce 1s ease infinite alternate">🏆</span>
    <div class="popup-title" style="font-size:1.5rem">YOU DID IT!</div>
    <div style="font-size:1rem;color:#FFD700;font-weight:800;margin-bottom:6px">⚡ Circuit Champion ⚡</div>
    <div class="popup-msg">You built circuits, connected wires, and matched buzzers to real life!<br><br>
    <strong style="color:#FFD700">You are an Electrical Engineer now! 🌟</strong><br><br>
    <em style="color:#b0e0e6">Remember: Always ask a grown-up before touching any wall sockets!</em></div>
    <div style="font-size:1.4rem;margin-bottom:12px">⚡💡🔔🎉🌈🐸</div>
    <button class="popup-btn" onclick="restartAll()">🔄 Play Again!</button>`;
  document.getElementById('popup').classList.remove('hidden');
  updateDots();
}

function restartAll(){
  document.getElementById('popup').classList.add('hidden');
  cur=0;render();
}

function resetAct(){render();}

// =====================================================================
//  PROGRESS DOTS
// =====================================================================
function updateDots(){
  for(let i=1;i<=3;i++){
    const d=document.getElementById('pd'+i);
    const l=document.getElementById('pl'+i);
    d.classList.remove('active','done');l?.classList.remove('done');
    if(i-1<cur){d.classList.add('done');l?.classList.add('done');}
    else if(i-1===cur)d.classList.add('active');
  }
  const df=document.getElementById('pd4');
  df.classList.remove('active','done');
  if(cur>=acts.length)df.classList.add('active');
}

// =====================================================================
//  INIT
// =====================================================================
render();
setTimeout(()=>confetti(15),600);
</script>
