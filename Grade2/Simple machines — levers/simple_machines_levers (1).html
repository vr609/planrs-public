<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMPLE MACHINES — LEVERS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Fredoka',sans-serif;}

:root{
  --ice1:#A8DCEF;--ice2:#D6F3FB;
  --deepblue:#0E3A5F;--midblue:#1B5C8C;
  --aurora1:#7BFFB0;--aurora2:#7FD8FF;--aurora3:#C99CFF;
  --gold:#FFD54F;
  --panel:rgba(10,30,50,0.96);
  --txt:#EAF7FF;--txt-dim:#BFE3F5;
  --red:#FF6B6B;--blue:#4FC3F7;--green:#66FFB0;
  --border-ice:rgba(168,220,239,0.6);
}

/* ─── SCENE ─────────────────────────────────────────────────── */
#scene{position:fixed;inset:0;overflow:hidden;}

#sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0A1F33 0%,#123B5C 35%,#1E5C82 65%,#3A8CB0 100%);
}

/* Aurora */
.aurora{
  position:absolute;top:-10%;left:-10%;width:120%;height:60%;
  filter:blur(30px);opacity:.55;mix-blend-mode:screen;
  animation:auroraMove ease-in-out infinite;
}
@keyframes auroraMove{
  0%,100%{transform:translateX(0) translateY(0) scaleY(1);}
  50%{transform:translateX(6%) translateY(-3%) scaleY(1.15);}
}

/* Stars */
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2;}50%{opacity:1;}}

/* Snowflakes */
.snow{position:absolute;top:-5%;border-radius:50%;background:#fff;pointer-events:none;animation:snowFall linear infinite;}
@keyframes snowFall{
  0%{transform:translateY(-5vh) translateX(0) rotate(0deg);opacity:0;}
  8%{opacity:.9;}
  100%{transform:translateY(105vh) translateX(var(--dx)) rotate(360deg);opacity:.5;}
}

/* Drifting ice particles */
.icep{position:absolute;pointer-events:none;animation:iceDrift linear infinite;opacity:.5;}
@keyframes iceDrift{
  0%{transform:translateX(-10vw) translateY(0);}
  100%{transform:translateX(110vw) translateY(-20px);}
}

/* Icebergs */
.iceberg{position:absolute;bottom:0;pointer-events:none;animation:bergBob ease-in-out infinite;}
@keyframes bergBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* Water / horizon */
#water{
  position:absolute;bottom:0;left:0;right:0;height:30%;
  background:linear-gradient(180deg,rgba(60,140,180,0.55),rgba(15,60,95,0.9));
}
#water::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,0.07) 0 40px,transparent 40px 90px);
  animation:waterMove 10s linear infinite;
}
@keyframes waterMove{0%{transform:translateX(0);}100%{transform:translateX(-90px);}}

/* Swimming penguins */
.penguin{position:absolute;animation:penguinSwim linear infinite;}
@keyframes penguinSwim{
  0%{transform:translateX(-15vw) translateY(0) scaleX(1);}
  48%{transform:translateX(58vw) translateY(-6px) scaleX(1);}
  50%{transform:translateX(60vw) translateY(-6px) scaleX(-1);}
  100%{transform:translateX(-15vw) translateY(0) scaleX(-1);}
}
.penguin-svg{animation:penguinBob ease-in-out infinite;}
@keyframes penguinBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-3deg);}}

/* Polar bear (foreground, gentle sway) */
.polarbear{position:absolute;bottom:0;pointer-events:none;animation:bearSway ease-in-out infinite;transform-origin:bottom center;}
@keyframes bearSway{0%,100%{transform:rotate(-1deg);}50%{transform:rotate(1deg);}}

/* Sparkles on ice */
.spark{position:absolute;border-radius:50%;background:#E0FFFF;animation:sparkle ease-in-out infinite;pointer-events:none;}
@keyframes sparkle{0%,100%{opacity:.15;transform:scale(.7);}50%{opacity:1;transform:scale(1.3);}}

/* ─── TITLE BAR ──────────────────────────────────────────────── */
#titleBar{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:8px 20px;
  background:linear-gradient(90deg,rgba(10,30,50,0.95) 0%,rgba(25,75,110,0.95) 50%,rgba(10,30,50,0.95) 100%);
  border-bottom:2px solid var(--border-ice);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
#titleBar h1{
  font-family:'Baloo 2',sans-serif;font-weight:800;
  font-size:clamp(13px,1.9vw,20px);
  color:var(--ice1);letter-spacing:1.5px;
  text-shadow:0 0 12px rgba(168,220,239,0.6);
  white-space:nowrap;
}
#questTrack{display:flex;align-items:center;gap:6px;}
.q-dot{
  width:11px;height:11px;border-radius:50%;
  border:2px solid var(--gold);background:transparent;
  transition:all .4s;
}
.q-dot.done{background:var(--gold);}
.q-dot.active{background:#fff;box-shadow:0 0 8px var(--gold);transform:scale(1.3);}

/* ─── SCORE BADGE ────────────────────────────────────────────── */
#scoreBadge{
  position:absolute;top:50px;right:14px;z-index:30;
  display:flex;align-items:center;gap:5px;
  background:rgba(10,30,50,0.9);
  border:1.5px solid var(--gold);border-radius:20px;
  padding:4px 12px;
}
#scoreBadge span{font-family:'Baloo 2',sans-serif;font-weight:700;color:var(--gold);font-size:13px;}

/* ─── MAIN PANEL ─────────────────────────────────────────────── */
#actPanel{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(94vw,920px);
  max-height:calc(100vh - 110px);
  background:var(--panel);
  border-radius:18px;
  border:2px solid var(--border-ice);
  box-shadow:0 0 60px rgba(70,160,220,0.3),0 0 120px rgba(40,100,160,0.2);
  z-index:20;
  overflow:hidden;
  display:flex;flex-direction:column;
  animation:panelIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes panelIn{from{transform:translate(-50%,-50%) scale(.7);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}

.p-header{
  background:linear-gradient(90deg,#0B2A45,#1E5C82,#0B2A45);
  border-bottom:2px solid var(--border-ice);
  padding:10px 18px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.p-num{
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:var(--gold);
  background:rgba(255,213,79,0.1);border:1.5px solid var(--gold);
  border-radius:50%;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.p-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:clamp(14px,2vw,19px);color:var(--ice1);text-shadow:0 0 8px rgba(168,220,239,0.4);}
.p-sub{font-size:12px;color:var(--txt-dim);margin-top:2px;}

.p-body{padding:14px 18px;overflow-y:auto;flex:1;}

/* ─── DRAG CARDS / LABELS ────────────────────────────────────── */
.card{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:88px;height:64px;
  border-radius:12px;
  border:2px solid rgba(168,220,239,0.35);
  background:rgba(30,80,120,0.6);
  cursor:grab;user-select:none;
  font-size:11px;color:var(--txt-dim);font-weight:700;text-align:center;
  transition:transform .15s,box-shadow .15s,opacity .2s;
  box-shadow:0 4px 14px rgba(0,0,0,0.35);
  position:relative;flex-shrink:0;padding:4px;
}
.card:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(168,220,239,0.4);}
.card.dragging{opacity:.35;transform:scale(.92);}
.card .card-icon{font-size:24px;line-height:1;margin-bottom:2px;}
.card .card-lbl{font-size:10px;color:rgba(235,250,255,0.85);text-align:center;line-height:1.2;}

/* Label tags for Activity 1 */
.tag{
  width:120px;height:48px;border-radius:10px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;user-select:none;flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:transform .15s,box-shadow .15s,opacity .2s;
  border:2px solid rgba(255,255,255,0.25);
}
.tag:hover{transform:scale(1.06);}
.tag.dragging{opacity:.35;transform:scale(.92);}
.tag.load{background:rgba(255,107,107,0.25);color:#FFB3B3;border-color:#FF6B6B;}
.tag.effort{background:rgba(79,195,247,0.25);color:#B3E5FC;border-color:#4FC3F7;}
.tag.fulcrum{background:rgba(102,255,176,0.22);color:#B3FFD9;border-color:#66FFB0;}

/* Object cards for Act2 / Act3 */
.obj-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:80px;height:80px;border-radius:12px;
  border:2px solid rgba(168,220,239,0.35);
  background:rgba(30,80,120,0.6);
  cursor:grab;user-select:none;flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:transform .15s,box-shadow .15s,opacity .2s;
}
.obj-card:hover{transform:scale(1.07);box-shadow:0 6px 20px rgba(168,220,239,0.4);}
.obj-card.dragging{opacity:.35;transform:scale(.92);}
.obj-card .oc-icon{font-size:30px;}
.obj-card .oc-lbl{font-size:9px;color:rgba(235,250,255,0.8);margin-top:2px;text-align:center;}

/* ─── POOLS / DROP ZONES ─────────────────────────────────────── */
.pool{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:10px;
  background:rgba(168,220,239,0.05);
  border:2px dashed rgba(168,220,239,0.25);
  border-radius:12px;
  min-height:60px;
  align-items:center;
}
.pool .empty-hint{font-size:11px;color:rgba(200,235,250,0.4);font-style:italic;pointer-events:none;}

.dz{
  border:2px dashed rgba(168,220,239,0.3);
  border-radius:12px;transition:all .2s;position:relative;
}
.dz.hover{border-color:var(--gold);background:rgba(255,213,79,0.08);transform:scale(1.02);}
.dz.correct{border-color:#66FFB0;background:rgba(102,255,176,0.08);}
.dz.wrong{border-color:#FF6B6B;background:rgba(255,107,107,0.08);}

/* ─── ACTIVITY 1: LEVER DIAGRAM ──────────────────────────────── */
#a1diagram{
  position:relative;height:170px;margin-top:6px;
  display:flex;align-items:flex-end;justify-content:center;
}
.lever-bar{
  position:absolute;bottom:62px;left:10%;right:10%;height:14px;
  background:linear-gradient(180deg,#CFE9F7,#8FBFD9);
  border-radius:8px;border:2px solid #5C99B5;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.lever-tri{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:40px solid transparent;border-right:40px solid transparent;
  border-bottom:62px solid #5C99B5;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
}
.lever-tri::after{content:'❄';position:absolute;bottom:8px;left:-9px;font-size:18px;color:#E0F7FF;}
.diagram-drop{
  position:absolute;width:130px;min-height:54px;
  border:2px dashed rgba(168,220,239,0.35);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;background:rgba(255,255,255,0.03);
}
.diagram-drop.hover{border-color:var(--gold);background:rgba(255,213,79,0.08);}
.diagram-drop .dz-hint{font-size:10px;color:rgba(200,235,250,0.4);font-style:italic;}
#dropLoad{bottom:90px;left:6%;}
#dropEffort{bottom:90px;right:6%;}
#dropFulcrum{bottom:0;left:50%;transform:translateX(-50%);}

/* ─── ACTIVITY 2: SEE-SAW ─────────────────────────────────────── */
#seesawWrap{position:relative;height:230px;margin-top:8px;}
#seesawPlank{
  position:absolute;top:90px;left:50%;width:340px;height:16px;
  background:linear-gradient(180deg,#CFE9F7,#8FBFD9);
  border:2px solid #5C99B5;border-radius:8px;
  transform-origin:center center;
  transform:translateX(-50%) rotate(0deg);
  transition:transform 1s cubic-bezier(.34,1.2,.64,1);
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
#seesawTri{
  position:absolute;top:106px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:36px solid transparent;border-right:36px solid transparent;
  border-bottom:58px solid #5C99B5;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));
}
.seesaw-pan{
  position:absolute;top:0;width:130px;min-height:80px;
  border:2px dashed rgba(168,220,239,0.35);border-radius:12px;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;
  transition:all .25s;background:rgba(255,255,255,0.03);padding:4px;
}
.seesaw-pan.hover{border-color:var(--gold);background:rgba(255,213,79,0.08);}
.seesaw-pan .dz-hint{font-size:10px;color:rgba(200,235,250,0.4);font-style:italic;width:100%;text-align:center;}
#pan-left{left:6%;}
#pan-right{right:6%;}
#seesawMsg{
  text-align:center;font-size:12px;color:var(--txt-dim);min-height:18px;margin-top:6px;
  font-family:'Baloo 2',sans-serif;font-weight:600;
}

/* ─── ACTIVITY 3 ─────────────────────────────────────────────── */
.seq-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.seq-slot{
  flex:1;min-width:90px;max-width:170px;min-height:70px;
  border:2px dashed rgba(168,220,239,0.35);border-radius:12px;
  background:rgba(168,220,239,0.04);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;position:relative;
}
.seq-slot .slot-n{position:absolute;top:4px;left:7px;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:10px;color:rgba(255,213,79,0.4);}
.seq-slot.hover{border-color:var(--gold);background:rgba(255,213,79,0.08);}
.seq-slot.filled{border-color:rgba(255,213,79,0.5);background:rgba(255,213,79,0.06);}
.seq-arrow{font-size:18px;color:var(--gold);flex-shrink:0;}

#ruler-area{position:relative;height:120px;margin-top:10px;}
#ruler{
  position:absolute;top:50%;left:5%;right:5%;height:22px;transform:translateY(-50%);
  background:repeating-linear-gradient(90deg,#E8D9B0 0 18px,#D8C490 18px 20px);
  border:2px solid #B8A06C;border-radius:4px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  transform-origin:50% 50%;
  transition:transform 1s cubic-bezier(.34,1.2,.64,1);
}
.eraser-zone{
  position:absolute;bottom:8px;width:100px;min-height:46px;
  border:2px dashed rgba(168,220,239,0.35);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;background:rgba(255,255,255,0.03);
}
.eraser-zone.hover{border-color:var(--gold);background:rgba(255,213,79,0.08);}
.eraser-zone .dz-hint{font-size:9px;color:rgba(200,235,250,0.4);font-style:italic;}
#eraserNear{left:42%;}
#eraserFar{left:74%;}
#coinZone{
  position:absolute;top:2px;left:2%;width:90px;min-height:46px;
  border:2px dashed rgba(255,107,107,0.35);border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:2px;
  transition:all .2s;background:rgba(255,107,107,0.04);
}
#coinZone.hover{border-color:var(--gold);background:rgba(255,213,79,0.08);}
#liftMsg{text-align:center;font-size:12px;color:var(--txt-dim);min-height:18px;margin-top:6px;font-family:'Baloo 2',sans-serif;font-weight:600;}

/* ─── BUTTONS ────────────────────────────────────────────────── */
.act-btn{
  padding:9px 26px;
  background:linear-gradient(135deg,#1B5C8C,#4FC3F7,#FFD54F);
  border:none;border-radius:30px;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;color:#0A1F33;
  cursor:pointer;box-shadow:0 4px 18px rgba(79,195,247,0.35);
  transition:transform .15s,box-shadow .15s;
}
.act-btn:hover{transform:scale(1.05);box-shadow:0 6px 24px rgba(79,195,247,0.5);}
.act-btn:active{transform:scale(.97);}
.act-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.reset-btn{
  padding:6px 16px;background:transparent;
  border:1.5px solid rgba(255,213,79,0.4);border-radius:20px;
  font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;color:var(--txt-dim);
  cursor:pointer;transition:all .2s;
}
.reset-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(255,213,79,0.07);}

.btn-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}

/* ─── FEEDBACK FLASH ─────────────────────────────────────────── */
.fflash{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:12px 28px;border-radius:30px;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;
  z-index:500;pointer-events:none;animation:flashAnim 1.4s ease forwards;
}
.fflash.ok{background:#0E3A2E;color:#9CFFD0;box-shadow:0 0 20px rgba(102,255,176,.5);}
.fflash.no{background:#5E1B1B;color:#FFADAD;box-shadow:0 0 20px rgba(255,107,107,.5);}
@keyframes flashAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}70%{opacity:1;}100%{opacity:0;}}

/* ─── POPUP ──────────────────────────────────────────────────── */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.popup{
  background:linear-gradient(160deg,#0B2A45,#1E5C82);
  border:2px solid var(--border-ice);border-radius:22px;
  padding:28px 32px;max-width:480px;width:90%;text-align:center;
  box-shadow:0 0 60px rgba(70,160,220,.4),0 0 120px rgba(40,100,160,.3);
  animation:panelIn .4s cubic-bezier(.34,1.56,.64,1);
}
.popup .pi{font-size:60px;display:block;margin-bottom:10px;animation:iconBounce .6s ease;}
@keyframes iconBounce{0%{transform:scale(0);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
.popup h3{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--ice1);margin-bottom:8px;}
.popup p{font-size:13px;color:var(--txt-dim);line-height:1.65;margin-bottom:14px;}
.popup .pts{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:var(--gold);margin:6px 0;}
.popup-btn{
  padding:10px 30px;
  background:linear-gradient(135deg,#1E5C82,#0B2A45);
  border:1.5px solid var(--gold);border-radius:30px;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;color:var(--gold);
  cursor:pointer;transition:transform .15s;box-shadow:0 4px 15px rgba(0,0,0,.4);
}
.popup-btn:hover{transform:scale(1.05);}

/* ─── CONFETTI ───────────────────────────────────────────────── */
.cpiece{position:fixed;pointer-events:none;z-index:700;animation:cFall linear forwards;}
@keyframes cFall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ─── DRAG GHOST ─────────────────────────────────────────────── */
#ghost{position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);display:none;}

/* ─── MISC ───────────────────────────────────────────────────── */
.info-box{
  background:rgba(168,220,239,0.06);border:1px solid rgba(168,220,239,0.2);
  border-radius:10px;padding:8px 12px;font-size:12px;color:var(--txt-dim);
  line-height:1.6;margin-bottom:10px;
}
.info-box strong{color:var(--ice1);}
.zone-title{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;color:var(--ice1);margin-bottom:5px;display:flex;align-items:center;gap:6px;}

@media(max-width:560px){
  .seq-slot{min-width:70px;}
  #seesawPlank{width:260px;}
  .seesaw-pan{width:100px;}
  .diagram-drop{width:100px;}
}
</style>
</head>
<body>
<div id="scene">
  <div id="sky"></div>
  <div class="aurora" style="background:linear-gradient(180deg,var(--aurora1),transparent);left:-5%;top:2%;width:70%;height:50%;animation-duration:9s;"></div>
  <div class="aurora" style="background:linear-gradient(180deg,var(--aurora2),transparent);left:25%;top:0%;width:75%;height:55%;animation-duration:12s;animation-delay:1.5s;"></div>
  <div class="aurora" style="background:linear-gradient(180deg,var(--aurora3),transparent);left:10%;top:5%;width:60%;height:45%;animation-duration:10s;animation-delay:3s;"></div>
  <div id="stars"></div>
  <div id="sparkles"></div>
  <div id="snowflakes"></div>
  <div id="iceparticles"></div>
  <div id="water"></div>
  <div id="icebergs"></div>
  <div id="penguins"></div>
  <div id="polarbears"></div>

  <!-- Title -->
  <div id="titleBar">

<script>
// ══════════════════════════════════════════

// ══════════════════════════════════════════
// SHARED STATE & HELPERS
// ══════════════════════════════════════════
let score=0;
let actNum=1;
let a2Tested=false;

function addScore(n){
  score+=n;
  document.getElementById('scoreVal').textContent=score;
  const badge=document.getElementById('scoreBadge');
  badge.style.transform='scale(1.18)';
  setTimeout(()=>badge.style.transform='scale(1)',220);
}

function flash(ok,msg){
  const f=document.createElement('div');
  f.className='fflash '+(ok?'ok':'no');
  f.textContent=(ok?'❄️ ':'🧊 ')+msg;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1400);
}

function confetti(){
  const colors=['#A8DCEF','#FFD54F','#4FC3F7','#7BFFB0','#C99CFF','#FFFFFF'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');
    c.className='cpiece';
    const size=rnd(6,12);
    c.style.width=size+'px';c.style.height=size+'px';
    c.style.left=rnd(0,100)+'vw';
    c.style.background=colors[Math.floor(rnd(0,colors.length))];
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.style.animationDuration=rnd(1.6,3.2)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3300);
  }
}

function showPopup({icon,title,body,pts,btn,action}){
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML=`<div class="popup">
    <span class="pi">${icon}</span>
    <h3>${title}</h3>
    <p>${body}</p>
    ${pts?`<div class="pts">${pts}</div>`:''}
    <button class="popup-btn" onclick="${action}">${btn}</button>
  </div>`;
}
function closePopup(){document.getElementById('overlay').style.display='none';}

// ══════════════════════════════════════════
// DRAG & DROP CORE
// ══════════════════════════════════════════
let dragEl=null,sourceParent=null;
const ghost=document.getElementById('ghost');

function makeDraggable(el){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    dragEl=el;
    sourceParent=el.parentElement;
    el.classList.add('dragging');
    ghost.innerHTML=el.innerHTML;
    ghost.className=el.className.replace('dragging','')+' ';
    ghost.style.display='flex';
    ghost.style.width=el.offsetWidth+'px';
    ghost.style.height=el.offsetHeight+'px';
    moveGhost(e);
    document.body.style.cursor='grabbing';
  });
}

function moveGhost(e){
  ghost.style.left=e.clientX+'px';
  ghost.style.top=e.clientY+'px';
}

const ZONE_SEL='.dz, .pool, .seq-slot, .diagram-drop, .seesaw-pan, .eraser-zone, #coinZone';

document.addEventListener('pointermove',e=>{
  if(!dragEl)return;
  moveGhost(e);
  ghost.style.pointerEvents='none';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  document.querySelectorAll(ZONE_SEL).forEach(z=>z.classList.remove('hover'));
  const zone=el?el.closest(ZONE_SEL):null;
  if(zone)zone.classList.add('hover');
});

document.addEventListener('pointerup',e=>{
  if(!dragEl)return;
  ghost.style.display='none';
  document.body.style.cursor='';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const zone=el?el.closest(ZONE_SEL):null;
  document.querySelectorAll(ZONE_SEL).forEach(z=>z.classList.remove('hover'));

  dragEl.classList.remove('dragging');

  if(zone){
    // single-item zones
    const singleZone = zone.classList.contains('diagram-drop')
                     || zone.classList.contains('seq-slot')
                     || zone.classList.contains('eraser-zone');
    if(singleZone){
      const existing=zone.querySelector('.card,.tag,.obj-card');
      if(existing && existing!==dragEl){
        sourceParent.appendChild(existing);
        existing.classList.remove('filled');
      }
      zone.appendChild(dragEl);
      zone.classList.add('filled');
    } else {
      zone.appendChild(dragEl);
    }
    if(sourceParent && (sourceParent.classList.contains('diagram-drop')||sourceParent.classList.contains('seq-slot')||sourceParent.classList.contains('eraser-zone'))){
      if(!sourceParent.querySelector('.card,.tag,.obj-card'))sourceParent.classList.remove('filled');
    }
    updateHints();
    if(typeof onDropCallback==='function')onDropCallback(zone);
  } else {
    sourceParent.appendChild(dragEl);
  }
  dragEl=null;sourceParent=null;
});

function updateHints(){
  document.querySelectorAll('.pool, .diagram-drop, .seq-slot, .seesaw-pan, .eraser-zone, #coinZone').forEach(z=>{
    const hint=z.querySelector('.empty-hint, .dz-hint');
    if(hint){
      hint.style.display=z.querySelector('.card,.tag,.obj-card')?'none':'';
    }
  });
}

let onDropCallback=null;

// ══════════════════════════════════════════
// CARD FACTORIES
// ══════════════════════════════════════════
function makeTag(cls,label){
  const t=document.createElement('div');
  t.className='tag '+cls;
  t.dataset.type=cls;
  t.textContent=label;
  makeDraggable(t);
  return t;
}
function makeCard({icon,label,pos}){
  const c=document.createElement('div');
  c.className='card';
  if(pos!==undefined)c.dataset.pos=pos;
  c.innerHTML=`<div class="card-icon">${icon}</div><div class="card-lbl">${label}</div>`;
  makeDraggable(c);
  return c;
}
function makeObj({icon,label,weight,id}){
  const c=document.createElement('div');
  c.className='obj-card';
  c.dataset.weight=weight;
  c.dataset.id=id;
  c.innerHTML=`<div class="oc-icon">${icon}</div><div class="oc-lbl">${label}</div>`;
  makeDraggable(c);
  return c;
}

// ══════════════════════════════════════════
// ACTIVITY 1 — Label the Lever (Load / Effort / Fulcrum)
// ══════════════════════════════════════════
function buildAct1(){
  const panel=document.getElementById('actPanel');
  panel.innerHTML=`
    <div class="p-header">
      <div class="p-num">I</div>
      <div>
        <div class="p-title">Label the Lever</div>
        <div class="p-sub">Drag each label onto the correct part of the lever diagram</div>
      </div>
    </div>
    <div class="p-body">
      <div class="info-box">
        ❄️ A lever is a helper stick with three important parts: the <strong style="color:#FFB3B3;">Load</strong> (the heavy thing to lift), the <strong style="color:#B3E5FC;">Effort</strong> (your push or pull), and the <strong style="color:#B3FFD9;">Fulcrum</strong> (the fixed pivot point in the middle). Drag each label to its correct spot below!
      </div>
      <div class="zone-title">🏷️ Labels — drag onto the diagram</div>
      <div class="pool" id="a1pool"><span class="empty-hint">Drag labels back here to remove them</span></div>

      <div id="a1diagram">
        <div class="lever-bar"></div>
        <div class="lever-tri"></div>
        <div class="diagram-drop" id="dropLoad"><span class="dz-hint">heavy side of the bar</span></div>
        <div class="diagram-drop" id="dropEffort"><span class="dz-hint">push/pull side of the bar</span></div>
        <div class="diagram-drop" id="dropFulcrum"><span class="dz-hint">fixed pivot point</span></div>
      </div>

      <div class="btn-row">
        <button class="act-btn" onclick="checkAct1()">Check Labels! ❄️</button>
        <button class="reset-btn" onclick="resetAct1()">↺ Reset</button>
      </div>
    </div>`;

  const pool=document.getElementById('a1pool');
  const tags=[
    makeTag('load','LOAD 🐧'),
    makeTag('effort','EFFORT 💪'),
    makeTag('fulcrum','FULCRUM ⛓️')
  ].sort(()=>Math.random()-.5);
  tags.forEach(t=>pool.appendChild(t));
  updateHints();
}

function checkAct1(){
  const map={dropLoad:'load',dropEffort:'effort',dropFulcrum:'fulcrum'};
  let correct=0,filled=0;
  Object.keys(map).forEach(id=>{
    const zone=document.getElementById(id);
    const tag=zone.querySelector('.tag');
    zone.classList.remove('correct','wrong');
    if(tag){
      filled++;
      if(tag.dataset.type===map[id]){correct++;zone.classList.add('correct');}
      else zone.classList.add('wrong');
    }
  });

  if(filled<3){flash(false,'Place all three labels first!');return;}

  if(correct===3){
    flash(true,'Perfectly labeled lever!');
    addScore(20);
    confetti();
    setTimeout(()=>{
      showPopup({
        icon:'⚖️',
        title:'Lever Parts Mastered!',
        body:`Wonderful! Every lever — from a see-saw to a bottle opener — has these same three parts. The Fulcrum stays still in the middle, the Load is the heavy side, and the Effort is where you push or pull. Now let's build a real see-saw and test it!`,
        pts:`+20 ❄️ — Total: ${score} pts`,
        btn:'Next Activity ➜',action:'nextAct(2)'
      });
    },900);
  } else {
    flash(false,`${correct}/3 labels correct — try again!`);
    setTimeout(()=>{
      Object.keys(map).forEach(id=>document.getElementById(id).classList.remove('wrong','correct'));
    },1100);
    if(correct>=1)addScore(5);
  }
}

function resetAct1(){buildAct1();}

// ══════════════════════════════════════════
// ACTIVITY 2 — Build the See-Saw (Balancing)
// ══════════════════════════════════════════
const a2Objects=[
  {icon:'🐧',label:'Big Penguin',weight:3,id:'p1'},
  {icon:'🐟',label:'Small Fish',weight:1,id:'f1'},
  {icon:'🧊',label:'Ice Block',weight:2,id:'i1'},
  {icon:'🐧',label:'Small Penguin',weight:1,id:'p2'}
];

function buildAct2(){
  const panel=document.getElementById('actPanel');
  panel.innerHTML=`
    <div class="p-header">
      <div class="p-num">II</div>
      <div>
        <div class="p-title">Build a Working See-Saw</div>
        <div class="p-sub">Drag objects onto each side and watch the lever balance or tip</div>
      </div>
    </div>
    <div class="p-body">
      <div class="info-box">
        🐧 A see-saw is a lever with the Fulcrum in the middle. The heavier side always tips down! Drag the arctic friends and objects onto the left and right pans, then press "Test the See-Saw" to watch what happens.
      </div>
      <div class="zone-title">🧩 Objects — drag onto either pan below</div>
      <div class="pool" id="a2pool"><span class="empty-hint">Drag objects back here to remove them</span></div>

      <div id="seesawWrap">
        <div class="seesaw-pan" id="pan-left"><span class="dz-hint">Left pan</span></div>
        <div id="seesawTri"></div>
        <div id="seesawPlank"></div>
        <div class="seesaw-pan" id="pan-right"><span class="dz-hint">Right pan</span></div>
      </div>
      <div id="seesawMsg"></div>

      <div class="btn-row">
        <button class="act-btn" onclick="testSeesaw()">Test the See-Saw! ⚖️</button>
        <button class="reset-btn" onclick="resetAct2()">↺ Reset</button>
      </div>
    </div>`;

  const pool=document.getElementById('a2pool');
  [...a2Objects].sort(()=>Math.random()-.5).forEach(o=>pool.appendChild(makeObj(o)));
  updateHints();
  a2Tested=false;
  document.getElementById('seesawPlank').style.transform='translateX(-50%) rotate(0deg)';
}

function totalWeight(panId){
  const pan=document.getElementById(panId);
  let total=0;
  pan.querySelectorAll('.obj-card').forEach(c=>total+=parseInt(c.dataset.weight));
  return total;
}

function testSeesaw(){
  const left=totalWeight('pan-left');
  const right=totalWeight('pan-right');
  const plank=document.getElementById('seesawPlank');
  const msg=document.getElementById('seesawMsg');

  if(left===0&&right===0){flash(false,'Add some objects to the see-saw first!');return;}

  let angle=0;
  if(left>right)angle=12;
  else if(right>left)angle=-12;

  plank.style.transform=`translateX(-50%) rotate(${angle}deg)`;

  setTimeout(()=>{
    if(left===right){
      msg.textContent=`⚖️ Perfectly balanced! Both sides weigh ${left} units — the see-saw stays level.`;
      msg.style.color='#7BFFB0';
      if(left>0){
        flash(true,'Balanced see-saw!');
        if(!a2Tested){addScore(25);a2Tested=true;}else{addScore(0);}
        confetti();
        setTimeout(()=>{
          showPopup({
            icon:'⚖️',
            title:'Balance Achieved!',
            body:`When both sides of a lever carry equal weight, the Fulcrum holds everything level — just like two friends of the same size sitting on a see-saw. Now let's explore how moving the Fulcrum itself can change how easy lifting feels!`,
            pts:`+25 ❄️ — Total: ${score} pts`,
            btn:'Next Activity ➜',action:'nextAct(3)'
          });
        },1000);
      }
    } else {
      const heavy=left>right?'left':'right';
      msg.textContent=`📉 The ${heavy} side is heavier (${Math.max(left,right)} vs ${Math.min(left,right)} units) — that side tips down!`;
      msg.style.color='#FFD54F';
      flash(true,'See-saw tips toward the heavier side!');
      if(!a2Tested){addScore(10);a2Tested=true;}
      // Show next-activity popup after first unbalanced test
      setTimeout(()=>{
        showPopup({
          icon:'📉',
          title:'Great Experiment!',
          body:`The heavier side always tips down — that's how levers work! Try balancing both sides equally for extra points, or move on to explore how moving the fulcrum changes lifting power!`,
          pts:`+10 ❄️ — Total: ${score} pts`,
          btn:'Next Activity ➜',action:'nextAct(3)'
        });
      },1000);
    }
  },300);
}

function resetAct2(){buildAct2();document.getElementById('seesawMsg').textContent='';}

// ══════════════════════════════════════════
// ACTIVITY 3 — Ruler & Eraser Experiment
// ══════════════════════════════════════════
// Step 1: sequence the experiment steps
const a3Steps=[
  {icon:'📏',label:'1. Place the ruler flat on the table',pos:0},
  {icon:'🧊',label:'2. Place the eraser under the ruler as fulcrum',pos:1},
  {icon:'🪙',label:'3. Place coins on one end as the load',pos:2},
  {icon:'👇',label:'4. Press down on the other end as effort',pos:3}
];

let a3Stage=1; // 1 = sequence steps, 2 = position experiment
let rulerAngle=0;

function buildAct3(){
  a3Stage=1;
  const panel=document.getElementById('actPanel');
  panel.innerHTML=`
    <div class="p-header">
      <div class="p-num">III</div>
      <div>
        <div class="p-title">The Ruler & Eraser Lever Experiment</div>
        <div class="p-sub">Step 1: Arrange the experiment steps in the correct order</div>
      </div>
    </div>
    <div class="p-body" id="a3body">
      <div class="info-box">
        🧊 Scientists set up experiments step by step! Drag each <strong>step card</strong> into the numbered slot to put the ruler-and-eraser experiment in the correct order.
      </div>
      <div class="zone-title">🃏 Experiment Steps — drag into numbered slots</div>
      <div class="pool" id="a3pool"><span class="empty-hint">Drag cards back here to remove them</span></div>
      <div style="margin-top:10px;">
        <div class="seq-row">
          ${[0,1,2,3].map(i=>`
            <div class="seq-slot" id="a3slot${i}" data-pos="${i}"><span class="slot-n">${i+1}</span></div>
            ${i<3?'<div class="seq-arrow">→</div>':''}
          `).join('')}
        </div>
      </div>
      <div class="btn-row">
        <button class="act-btn" onclick="checkAct3Steps()">Check the Order! 🧊</button>
        <button class="reset-btn" onclick="resetAct3()">↺ Reset</button>
      </div>
    </div>`;

  const pool=document.getElementById('a3pool');
  [...a3Steps].sort(()=>Math.random()-.5).forEach(item=>pool.appendChild(makeCard(item)));
  updateHints();
}

function checkAct3Steps(){
  let correct=0;
  for(let i=0;i<4;i++){
    const slot=document.getElementById('a3slot'+i);
    const card=slot?slot.querySelector('.card'):null;
    if(card&&parseInt(card.dataset.pos)===i)correct++;
  }
  const allPlaced=document.querySelectorAll('.seq-slot .card').length===4;
  if(!allPlaced){flash(false,'Place all 4 steps in the slots first!');return;}

  if(correct===4){
    for(let i=0;i<4;i++)document.getElementById('a3slot'+i).classList.add('correct');
    flash(true,'Experiment steps in order!');
    addScore(20);
    setTimeout(()=>buildAct3Stage2(),900);
  } else {
    for(let i=0;i<4;i++){
      const slot=document.getElementById('a3slot'+i);
      const card=slot?slot.querySelector('.card'):null;
      if(card&&parseInt(card.dataset.pos)!==i)slot.classList.add('wrong');
    }
    flash(false,`${correct}/4 steps correct — try again!`);
    setTimeout(()=>document.querySelectorAll('.seq-slot').forEach(s=>s.classList.remove('wrong')),1100);
    if(correct>=1)addScore(5);
  }
}

function buildAct3Stage2(){
  a3Stage=2;
  rulerAngle=0;
  const body=document.getElementById('a3body');
  body.innerHTML=`
    <div class="info-box">
      📏 Place the <strong>coins (load)</strong> on the left end, the <strong>eraser (fulcrum)</strong> under the middle, and your <strong>finger (effort)</strong> on the right end — then press "Press Down &amp; Lift!" to see the lever in action!
    </div>
    <div class="zone-title">🧩 Drag all 3 items into their correct places</div>
    <div class="pool" id="a3pool2"><span class="empty-hint">Drag items back here to remove them</span></div>

    <div id="ruler-area">
      <div id="coinZone"><span class="dz-hint">🪙 coins (load) here</span></div>
      <div id="ruler"></div>
      <div class="eraser-zone" id="eraserNear"><span class="dz-hint">🧊 eraser (fulcrum) here</span></div>
      <div class="eraser-zone" id="eraserFar"><span class="dz-hint">👆 finger (effort) here</span></div>
    </div>
    <div id="liftMsg"></div>

    <div class="btn-row">
      <button class="act-btn" onclick="pressRuler()">Press Down &amp; Lift! 👇</button>
      <button class="reset-btn" onclick="resetAct3()">↺ Reset</button>
    </div>`;

  const pool=document.getElementById('a3pool2');
  pool.appendChild(makeObj({icon:'🧊',label:'Eraser (Fulcrum)',weight:0,id:'eraser'}));
  pool.appendChild(makeObj({icon:'🪙🪙🪙',label:'Coins (Load)',weight:0,id:'coins'}));
  pool.appendChild(makeObj({icon:'👆',label:'Finger (Effort)',weight:0,id:'finger'}));
  updateHints();

  onDropCallback=(zone)=>{
    if(a3Stage!==2)return;
    // ensure eraser only in one zone, coins only in coinZone
    document.getElementById('liftMsg').textContent='';
  };
}

function pressRuler(){
  const coinZone=document.getElementById('coinZone');
  const eraserFar=document.getElementById('eraserFar');
  const eraserNear=document.getElementById('eraserNear');
  const ruler=document.getElementById('ruler');
  const msg=document.getElementById('liftMsg');

  const coinsPlaced=coinZone.querySelector('.obj-card[data-id="coins"]');
  const eraserPlaced=eraserNear.querySelector('.obj-card[data-id="eraser"]');
  const fingerPlaced=eraserFar.querySelector('.obj-card[data-id="finger"]');

  // Check all 3 placed
  if(!coinsPlaced||!eraserPlaced||!fingerPlaced){
    const missing=[];
    if(!coinsPlaced)missing.push('Coins (Load)');
    if(!eraserPlaced)missing.push('Eraser (Fulcrum)');
    if(!fingerPlaced)missing.push('Finger (Effort)');
    flash(false,'Still need to place: '+missing.join(', ')+'!');
    return;
  }

  // All 3 correctly placed — animate and complete!
  ruler.style.transform='rotate(-18deg)';
  msg.textContent='✨ The lever works! Coins (Load) on one end, Eraser (Fulcrum) in the middle, and Finger (Effort) presses the other end — the load lifts easily!';
  msg.style.color='#7BFFB0';
  addScore(25);
  flash(true,'All 3 lever parts in place — it works!');
  confetti();
  setTimeout(()=>{
    showPopup({
      icon:'🌟',
      title:'Lever Scientist Champion!',
      body:`You placed all 3 parts correctly! The Coins (Load) on one end, the Eraser (Fulcrum) in the middle, and your Finger (Effort) on the other end — pressing down lifts the load. That's exactly how every lever works!`,
      pts:`+25 ❄️ — Total: ${score} pts`,
      btn:'Celebrate! 🎉',action:'showFinal()'
    });
  },1000);
}

function resetAct3(){buildAct3();}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
function nextAct(n){
  closePopup();actNum=n;
  if(n===2){
    document.getElementById('d1').className='q-dot done';
    document.getElementById('d2').className='q-dot active';
    buildAct2();
  } else if(n===3){
    document.getElementById('d2').className='q-dot done';
    document.getElementById('d3').className='q-dot active';
    buildAct3();
  }
}

function showFinal(){
  closePopup();
  document.getElementById('d3').className='q-dot done';
  confetti();setTimeout(confetti,600);setTimeout(confetti,1200);
  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML=`<div class="popup" style="max-width:480px;">
    <span class="pi" style="font-size:72px;">🏔️</span>
    <h3 style="font-size:24px;">Arctic Lever Champion!</h3>
    <p style="font-size:14px;line-height:1.7;">
      You explored levers from every angle in the frozen north!<br><br>
      <span style="color:#FFB3B3;">🐧 Load</span> — the heavy thing being lifted<br>
      <span style="color:#B3E5FC;">💪 Effort</span> — your push or pull force<br>
      <span style="color:#B3FFD9;">⛓️ Fulcrum</span> — the fixed balancing point<br>
      <span style="color:#FFD54F;">✨ Magic Secret</span> — moving the fulcrum closer to the load makes lifting easier!
    </p>
    <div class="pts">🏆 Final Score: ${score} ❄️</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
      <button class="popup-btn" onclick="restartAll()">🔄 Play Again</button>
      <button class="popup-btn" style="background:linear-gradient(135deg,#0B2A45,#1E5C82);" onclick="closePopup()">✅ Done</button>
    </div>
  </div>`;
}

function restartAll(){
  closePopup();score=0;actNum=1;
  document.getElementById('scoreVal').textContent='0';
  ['d1','d2','d3'].forEach((id,i)=>{document.getElementById(id).className='q-dot'+(i===0?' active':'');});
  onDropCallback=null;
  buildAct1();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
buildAct1();
</script>
</body>
</html>
