<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadboard Basics — Build Your First LED Circuit</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --space-dark: #0f0a1c;
  --violet-deep: #1e1233;
  --violet-mid: #3b2263;
  --violet-light: #623fa2;
  --neon-pink: #ff5e97;
  --neon-cyan: #4deeea;
  --electric-gold: #ffe66d;
  --text-bright: #f3f0f7;
  --text-dim: #bdaec6;
  --success: #4eed7a;
  --danger: #ff6b6b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Quicksand', sans-serif; color: var(--text-bright); background-color: var(--space-dark); }

/* ── VISUALLY RICH ANIME BACKGROUND ── */
#cosmic-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: linear-gradient(180deg, #0f0a1c 0%, #1e1233 40%, #2d124d 80%, #170926 100%); }

/* Twinkling and Moving Cosmic Stars */
.star { position: absolute; background: #fff; border-radius: 50%; animation: blink linear infinite alternate; }
@keyframes blink { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.3); } }

.shooting-star { position: absolute; height: 2px; background: linear-gradient(-45deg, #5f53ff, rgba(0,0,0,0)); filter: drop-shadow(0 0 6px #7a9fe9); animation: shoot linear infinite; opacity: 0; }
@keyframes shoot { 0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; } 100% { transform: translateX(-400px) translateY(400px) rotate(-45deg); opacity: 0; } }

/* Animated Cyber Birds Floating */
.bird { position: absolute; animation: fly linear infinite; }
@keyframes fly {
  0% { transform: translate(-10%, 20vh) scale(0.6); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translate(110%, 5vh) scale(1.1); opacity: 0; }
}
.bird-wing { fill: var(--neon-cyan); opacity: 0.7; animation: flap 0.25s ease-in-out infinite alternate; transform-origin: 20px 20px; }
@keyframes flap { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1.1); } }

/* Neon Chain Reaction Currents */
.circuit-line { position: absolute; background: linear-gradient(90deg, transparent, var(--neon-pink), transparent); height: 2px; width: 250px; opacity: 0.3; animation: flow linear infinite; }
@keyframes flow { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

/* ── MAIN WORKSPACE APPLICATION ── */
#workspace { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; pointer-events: none; }

#heading-title { text-align: center; pointer-events: auto; margin-bottom: 20px; }
#heading-title h1 { font-family: 'Fredoka', sans-serif; font-size: 38px; font-weight: 700; color: var(--electric-gold); letter-spacing: 1px; text-shadow: 0 0 15px rgba(255, 230, 109, 0.4); }

#main-card { background: rgba(30, 18, 51, 0.85); backdrop-filter: blur(14px); border: 2px solid var(--violet-light); border-radius: 24px; width: 960px; max-width: 98vw; padding: 25px 30px; pointer-events: auto; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 40px rgba(98, 63, 162, 0.2); }

/* Progress Flow Rails */
#progression { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; align-items: center; }
.node { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--violet-light); display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 700; color: var(--text-dim); transition: all 0.4s; background: rgba(15, 10, 28, 0.6); }
.node.active { border-color: var(--neon-pink); color: var(--space-dark); background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
.node.done { border-color: var(--success); color: var(--space-dark); background: var(--success); box-shadow: 0 0 12px rgba(78, 237, 122, 0.4); }
.rail-line { flex: 1; height: 3px; background: rgba(98, 63, 162, 0.4); max-width: 90px; border-radius: 2px; transition: background 0.4s; }
.rail-line.done { background: var(--success); }

#mission-title { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: var(--neon-cyan); margin-bottom: 6px; text-align: center; text-shadow: 0 0 10px rgba(77, 238, 234, 0.3); }
#mission-brief { font-size: 13.5px; color: var(--text-dim); text-align: center; margin-bottom: 20px; line-height: 1.5; max-width: 760px; margin-inline:auto; }

/* ── CANVAS & DESKTOP DESIGNS ── */
.panel-grid { display: flex; gap: 24px; align-items: center; justify-content: center; min-height: 280px; }

/* Drag components & chips */
.rack { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 170px; background: rgba(15, 10, 28, 0.4); padding: 12px; border-radius: 16px; border: 1px solid rgba(98, 63, 162, 0.3); }
.rack h3 { font-family: 'Fredoka', sans-serif; font-size: 12px; color: var(--electric-gold); margin-bottom: 4px; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
.item-chip { padding: 10px 15px; border-radius: 12px; border: 1.5px solid var(--violet-light); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; cursor: grab; color: var(--text-bright); transition: all 0.2s; user-select: none; background: rgba(60, 34, 99, 0.5); text-align: center; width: 100%; }
.item-chip:hover { border-color: var(--neon-cyan); background: var(--violet-mid); transform: scale(1.04); box-shadow: 0 0 10px rgba(77, 238, 234, 0.2); }
.item-chip.dragging { opacity: 0.3; }

/* Activity 1: Terminal Matrix */
.matrix-container { display: flex; flex-direction: column; gap: 15px; background: #e8e5ed; border-radius: 16px; padding: 25px; border: 4px solid #b5afbe; box-shadow: 0 8px 0 #8d8597, inset 0 0 20px rgba(0,0,0,0.15); width: 460px; color: #221a30; }
.breadboard-graphic-row { display: flex; gap: 14px; justify-content: center; align-items: center; background: #fff; padding: 12px 18px; border-radius: 8px; border: 1px solid #d0cad6; }
.bb-label { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px; color: #625772; }
.bb-terminal-strip { display: flex; gap: 7px; background: #f1eff4; padding: 6px; border-radius: 6px; border: 1px solid #c2bbc9; }
.bb-pinhole { width: 14px; height: 14px; background: #2f253d; border-radius: 2px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.8); position: relative; }
.bb-pinhole::after { content: ''; position: absolute; inset: 3px; background: #564c63; border-radius: 1px; }

.rail-dropzone { border: 2px dashed rgba(60, 34, 99, 0.4); border-radius: 10px; padding: 12px; min-height: 54px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #564c63; font-weight: 600; text-align: center; background: rgba(255,255,255,0.7); width: 100%; transition: all 0.25s; }
.rail-dropzone.drag-over { border-color: var(--neon-pink); background: rgba(255, 94, 151, 0.1); }
.rail-dropzone.filled { border-style: solid; border-color: var(--violet-deep); background: var(--violet-deep); color: var(--neon-cyan); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; }

/* Activity 2: LED Hardware Alignment */
.hw-showcase { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 340px; background: rgba(15, 10, 28, 0.3); padding: 15px; border-radius: 18px; border: 1px solid rgba(98, 63, 162, 0.2); }
.led-vector { width: 100px; height: 120px; transition: filter 0.4s; }
.hw-slots-stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.hw-bar { background: rgba(30, 18, 51, 0.6); border: 1.5px dashed rgba(98, 63, 162, 0.5); border-radius: 12px; padding: 10px; min-height: 56px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: all 0.25s; }
.hw-bar .bar-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px; font-weight: 600; }
.hw-bar .bar-slot { width: 100%; font-size: 13px; color: rgba(243, 240, 247, 0.4); font-weight: 500; min-height: 24px; display: flex; align-items: center; justify-content: center; text-align: center; }
.hw-bar.drag-over { border-color: var(--neon-cyan); background: rgba(77, 238, 234, 0.08); }
.hw-bar.filled { border-style: solid; border-color: var(--success); background: rgba(78, 237, 122, 0.08); }
.hw-bar.filled .bar-slot { color: var(--success); font-weight: 700; font-family: 'Space Mono', monospace; }

/* Activity 3: Circuit Schematic Architecture */
.wire-canvas { background: #161129; border: 2px solid #3c2263; border-radius: 16px; padding: 20px; width: 440px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
.wire-row { display: flex; align-items: center; gap: 12px; background: rgba(30, 18, 51, 0.4); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(98, 63, 162, 0.2); min-height: 52px; }
.wire-index { font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 700; color: var(--electric-gold); width: 22px; }
.wire-drop-zone { flex: 1; min-height: 36px; border: 1.5px dashed rgba(255, 94, 151, 0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--text-dim); transition: all 0.25s; padding: 4px 8px; text-align: center; }
.wire-row.drag-over .wire-drop-zone { border-color: #fff; background: rgba(255,255,255,0.08); }
.wire-row.matched { border-color: var(--success); background: rgba(78, 237, 122, 0.05); }
.wire-row.matched .wire-drop-zone { border-style: solid; border-color: var(--success); color: var(--success); font-weight: 700; font-family: 'Space Mono', monospace; }

/* Interactive Triggers */
.action-button { padding: 12px 28px; border-radius: 12px; border: 1.5px solid var(--electric-gold); background: rgba(255, 230, 109, 0.1); color: var(--electric-gold); font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; display: block; margin: 15px auto 0; }
.action-button:hover:not(:disabled) { background: rgba(255, 230, 109, 0.22); transform: scale(1.04); box-shadow: 0 0 15px rgba(255, 230, 109, 0.3); }
.action-button:active:not(:disabled) { transform: scale(0.97); }
.action-button.success-theme { border-color: var(--success); background: rgba(78, 237, 122, 0.12); color: var(--success); }
.action-button.success-theme:hover:not(:disabled) { background: rgba(78, 237, 122, 0.25); box-shadow: 0 0 15px rgba(78, 237, 122, 0.3); }
.action-button:disabled { opacity: 0.3; cursor: not-allowed; }

.sub-controls { display: flex; gap: 12px; justify-content: center; margin-top: 15px; }
.sub-controls .action-button { margin: 0; }
.reset-link { border-color: rgba(243, 240, 247, 0.25); background: transparent; color: var(--text-dim); font-size: 12px; padding: 8px 18px; }
.reset-link:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }

/* ── INTERACTIVE DIALOGUE POPUP ── */
#modal-curtain { position: fixed; inset: 0; z-index: 100; background: rgba(15, 10, 28, 0.8); display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
#modal-curtain.pop-open { display: flex; }
#dialogue-box { background: linear-gradient(145deg, var(--violet-deep) 0%, var(--space-dark) 100%); border: 2px solid var(--electric-gold); border-radius: 24px; padding: 35px 40px; max-width: 460px; text-align: center; box-shadow: 0 0 45px rgba(255, 230, 109, 0.25); animation: springUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes springUp { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
#dialogue-box h2 { font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: var(--electric-gold); margin-bottom: 12px; }
#dialogue-box p { font-size: 14px; color: var(--text-dim); line-height: 1.6; margin-bottom: 22px; }
.avatar-icon { font-size: 46px; margin-bottom: 8px; display: block; }

/* Toast Notifications */
#toast-messenger { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--success); color: #0f0a1c; padding: 10px 24px; border-radius: 30px; font-size: 13px; font-weight: 700; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
#toast-messenger.activated { opacity: 1; }
#toast-messenger.fault-mode { background: var(--danger); color: #fff; }

/* Confetti Burst Sparkles */
.sparkle-dot { position: fixed; border-radius: 50%; animation: dropDown linear forwards; z-index: 200; }
@keyframes dropDown { 0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg) scale(0.5); opacity: 0; } }

@media (max-width: 780px) {
  #main-card { padding: 15px; }
  .panel-grid { flex-direction: column; align-items: center; }
  .matrix-container, .wire-canvas, .hw-showcase { width: 100%; }
}
</style>
</head>
<body>

<div id="cosmic-bg"></div>

<div id="workspace">
  <div id="heading-title">
    <h1>Breadboard basics — build your first LED circuit</h1>
  </div>

  <div id="main-card">
    <div id="progression">
      <div class="node active" id="nd1">1</div>
      <div class="rail-line" id="rl1"></div>
      <div class="node" id="nd2">2</div>
      <div class="rail-line" id="rl2"></div>
      <div class="node" id="nd3">3</div>
    </div>

    <div id="mission-title"></div>
    <div id="mission-brief"></div>

    <div id="act1" class="panel-grid"></div>
    <div id="act2" class="panel-grid" style="display:none"></div>
    <div id="act3" class="panel-grid" style="display:none"></div>
  </div>
</div>

<div id="modal-curtain">
  <div id="dialogue-box">
    <span class="avatar-icon" id="modal-avatar"></span>
    <h2 id="modal-headline"></h2>
    <p id="modal-paragraph"></p>
    <button class="action-button" id="modal-trigger"></button>
  </div>
</div>

<div id="toast-messenger"></div>

<script>
// ══════════════════════════ COSMIC ANIMATED ENGINE BACKGROUND ══════════════════════════
(function initializeCosmicAtmosphere(){
  const container = document.getElementById('cosmic-bg');

  // Sparkly Stars Creation
  for(let i=0; i<50; i++){
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 1;
    Object.assign(star.style, {
      width: size + 'px',
      height: size + 'px',
      left: Math.random() * 100 + '%',
      top: Math.random() * 100 + '%',
      animationDelay: Math.random() * 3 + 's',
      animationDuration: (1.5 + Math.random() * 2.5) + 's'
    });
    container.appendChild(star);
  }

  // Shooting Star Launchers
  for(let i=0; i<3; i++){
    const launcher = document.createElement('div');
    launcher.className = 'shooting-star';
    Object.assign(launcher.style, {
      top: Math.random() * 40 + '%',
      left: (70 + Math.random() * 25) + '%',
      width: (80 + Math.random() * 100) + 'px',
      animationDuration: (4 + Math.random() * 5) + 's',
      animationDelay: (Math.random() * 4) + 's'
    });
    container.appendChild(launcher);
  }

  // Cyber Birds System
  for(let i=0; i<2; i++){
    const bird = document.createElement('div');
    bird.className = 'bird';
    Object.assign(bird.style, {
      animationDuration: (14 + Math.random() * 8) + 's',
      animationDelay: (i * 6) + 's'
    });
    
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '40');
    svg.setAttribute('height', '40');
    svg.setAttribute('viewBox', '0 0 40 40');
    svg.innerHTML = `
      <path class="bird-wing" d="M20 20 L5 10 L20 16 Z" />
      <path class="bird-wing" d="M20 20 L35 10 L20 16 Z" />
      <circle cx="20" cy="18" r="3" fill="var(--neon-pink)" />
    `;
    bird.appendChild(svg);
    container.appendChild(bird);
  }

  // Chain Reaction Electric Currents
  for(let i=0; i<4; i++){
    const line = document.createElement('div');
    line.className = 'circuit-line';
    Object.assign(line.style, {
      top: (15 + i * 22) + 'vh',
      left: '0px',
      animationDuration: (6 + Math.random() * 5) + 's',
      animationDelay: (Math.random() * 3) + 's'
    });
    container.appendChild(line);
  }
})();

// ══════════════════════════ CORE APPLICATION STATE ══════════════════════════
let currentStep = 1;
let payloadData = null;

const missions = {
  1: 'Mission 1: Decoding the Breadboard Rails',
  2: 'Mission 2: Orienting the Hardware Polarities',
  3: 'Mission 3: Wire up the Schematic Loop'
};

const briefs = {
  1: 'Inside a breadboard, pinholes are linked in secret patterns! Columns are bound together as vertical nodes, while outer power rails run horizontally. Drop the correct conceptual description into each terminal zone.',
  2: 'Light Emitting Diodes (LEDs) are directional valves for electricity. One leg is longer (Positive Anode) and the other is shorter (Negative Cathode). Match the vital polarity descriptions to their physical terminal targets.',
  3: 'Time to forge the entire circuit track from start to end! Connect the electronic modules into a complete, safe loop so that current flows smoothly without burning the hardware.'
};

function launchStep(stepIndex){
  currentStep = stepIndex;
  document.getElementById('mission-title').textContent = missions[stepIndex];
  document.getElementById('mission-brief').textContent = briefs[stepIndex];
  
  [1, 2, 3].forEach(i => {
    document.getElementById('act' + i).style.display = (i === stepIndex) ? 'flex' : 'none';
  });
  refreshProgressTracker();
}

function refreshProgressTracker(){
  [1, 2, 3].forEach(i => {
    const node = document.getElementById('nd' + i);
    node.className = 'node' + (i < currentStep ? ' done' : i === currentStep ? ' active' : '');
    if(i < 3){
      const rail = document.getElementById('rl' + i);
      rail.className = 'rail-line' + (i < currentStep ? ' done' : '');
    }
  });
}

function arrayScramble(inputArray){
  const copy = inputArray.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const target = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[target]] = [copy[target], copy[i]];
  }
  return copy;
}

// ══════════════════════════ ACTIVITY 1: TERMINAL ARCHITECTURE ══════════════════════════
const Act1 = {
  targets: [
    { id: 'vertical', label: 'Terminal Row Node', desc: '5 pinholes wired in a short vertical line. Ideal for linking components together.' },
    { id: 'horizontal', label: 'Power Rail Bus', desc: 'Runs all the way along the horizontal borders. Used to carry (+) and (-) juice everywhere.' }
  ],
  userLayout: { vertical: null, horizontal: null },
  pool: []
};

Act1.initialize = function(){
  this.userLayout = { vertical: null, horizontal: null };
  this.pool = arrayScramble(this.targets.map(t => ({ id: t.id, text: t.label })));
};

Act1.draw = function(){
  const wrapper = document.getElementById('act1');
  wrapper.innerHTML = '';

  // Asset Supply Rack
  const rack = document.createElement('div');
  rack.className = 'rack';
  rack.innerHTML = '<h3>Descriptions</h3>';
  
  this.pool.forEach(item => {
    if(Object.values(this.userLayout).includes(item.id)) return;
    const chip = document.createElement('div');
    chip.className = 'item-chip';
    chip.textContent = item.text;
    chip.draggable = true;
    chip.addEventListener('dragstart', e => { payloadData = { type: 'act1', id: item.id }; chip.classList.add('dragging'); });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    rack.appendChild(chip);
  });
  if(rack.children.length === 1) {
    const okMsg = document.createElement('div');
    okMsg.style.cssText = 'font-size:11px; color:var(--success); padding:6px; font-weight:600;';
    okMsg.textContent = 'All rows defined! ✓';
    rack.appendChild(okMsg);
  }
  wrapper.appendChild(rack);

  // Breadboard Graphic Representation Area
  const boardLayout = document.createElement('div');
  boardLayout.className = 'matrix-container';

  // Draw Horizontal Power Bus Representation
  const topBus = document.createElement('div');
  topBus.className = 'breadboard-graphic-row';
  topBus.innerHTML = '<span class="bb-label">+ [Bus]</span>';
  const stripH = document.createElement('div');
  stripH.className = 'bb-terminal-strip';
  for(let i=0; i<6; i++) stripH.innerHTML += '<div class="bb-pinhole"></div>';
  topBus.appendChild(stripH);
  boardLayout.appendChild(topBus);

  const horizontalZone = document.createElement('div');
  horizontalZone.className = 'rail-dropzone' + (this.userLayout.horizontal ? ' filled' : '');
  horizontalZone.textContent = this.userLayout.horizontal ? '✓ Power Rail Bus: Horizontal power delivery line' : 'Drop matching name for long power strips here';
  this.bindDropSystem(horizontalZone, 'horizontal');
  boardLayout.appendChild(horizontalZone);

  // Draw Vertical Row Strip Representation
  const midRow = document.createElement('div');
  midRow.className = 'breadboard-graphic-row';
  midRow.innerHTML = '<span class="bb-label">Row A</span>';
  const stripV = document.createElement('div');
  stripV.className = 'bb-terminal-strip';
  stripV.style.flexDirection = 'column';
  for(let i=0; i<3; i++) stripV.innerHTML += '<div class="bb-pinhole"></div>';
  midRow.appendChild(stripV);
  boardLayout.appendChild(midRow);

  const verticalZone = document.createElement('div');
  verticalZone.className = 'rail-dropzone' + (this.userLayout.vertical ? ' filled' : '');
  verticalZone.textContent = this.userLayout.vertical ? '✓ Terminal Row Node: Vertical 5-pin component link' : 'Drop matching name for short 5-pin nodes here';
  this.bindDropSystem(verticalZone, 'vertical');
  boardLayout.appendChild(verticalZone);

  wrapper.appendChild(boardLayout);

  // Configuration Action Layout
  const controlPanel = document.createElement('div');
  controlPanel.className = 'sub-controls';
  controlPanel.style.flexDirection = 'column';

  const action = document.createElement('button');
  action.className = 'action-button success-theme';
  action.textContent = 'Validate Matrix ⚡';
  action.disabled = !(this.userLayout.vertical && this.userLayout.horizontal);
  action.addEventListener('click', () => this.evaluateData());
  
  const resetBtn = document.createElement('button');
  resetBtn.className = 'action-button reset-link';
  resetBtn.textContent = 'Reset ↺';
  resetBtn.addEventListener('click', () => { Act1.initialize(); Act1.draw(); });

  controlPanel.appendChild(action);
  controlPanel.appendChild(resetBtn);
  wrapper.appendChild(controlPanel);
};

Act1.bindDropSystem = function(element, dropKey){
  element.addEventListener('dragover', e => { e.preventDefault(); element.classList.add('drag-over'); });
  element.addEventListener('dragleave', () => element.classList.remove('drag-over'));
  element.addEventListener('drop', e => {
    e.preventDefault(); element.classList.remove('drag-over');
    if(payloadData && payloadData.type === 'act1') {
      if(payloadData.id === dropKey) {
        this.userLayout[dropKey] = payloadData.id;
        this.draw();
      } else {
        triggerToast('Look closer at the alignment! Horizontal vs Vertical paths.', true);
      }
    }
  });
};

Act1.evaluateData = function(){
  if(this.userLayout.vertical === 'vertical' && this.userLayout.horizontal === 'horizontal') {
    triggerPopup('🔋', 'Grid Decoded!', 'You successfully verified the core layout of a breadboard grid. Horizontal buses distribute power, while vertical nodes connect matching components.', 'Proceed to Polarity Check', () => {
      launchStep(2); Act2.initialize(); Act2.draw();
    });
  }
};

// ══════════════════════════ ACTIVITY 2: POLARITY HARDWARE ALIGNMENT ══════════════════════════
const Act2 = {
  slots: [
    { id: 'anode', title: 'Longer Pin (+)', correct: 'Anode' },
    { id: 'cathode', title: 'Shorter Flat Pin (-)', correct: 'Cathode' }
  ],
  assigned: { anode: null, cathode: null },
  chips: []
};

Act2.initialize = function(){
  this.assigned = { anode: null, cathode: null };
  this.chips = arrayScramble(['Anode', 'Cathode']);
};

Act2.draw = function(){
  const wrapper = document.getElementById('act2');
  wrapper.innerHTML = '';

  const rack = document.createElement('div');
  rack.className = 'rack';
  rack.innerHTML = '<h3>Polarity Labels</h3>';

  this.chips.forEach(label => {
    if(Object.values(this.assigned).includes(label)) return;
    const chip = document.createElement('div');
    chip.className = 'item-chip';
    chip.textContent = label;
    chip.draggable = true;
    chip.addEventListener('dragstart', e => { payloadData = { type: 'act2', data: label }; chip.classList.add('dragging'); });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    rack.appendChild(chip);
  });
  wrapper.appendChild(rack);

  // LED Graphical Module Center
  const centerDisplay = document.createElement('div');
  centerDisplay.className = 'hw-showcase';
  centerDisplay.innerHTML = '<h3>LED Component</h3>';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.className = 'led-vector';
  svg.setAttribute('viewBox', '0 0 100 120');
  svg.id = 'led-light-bulb';
  // Render clean vector of LED housing
  svg.innerHTML = `
    <rect x="46" y="60" width="3" height="55" fill="#a1a1b3" />
    <rect x="51" y="60" width="3" height="42" fill="#888899" />
    <path d="M35 60 C35 25, 65 25, 65 60 Z" fill="var(--neon-pink)" opacity="0.85" />
    <rect x="33" y="56" width="34" height="5" fill="var(--neon-pink)" rx="1" />
  `;
  centerDisplay.appendChild(svg);

  const slotStack = document.createElement('div');
  slotStack.className = 'hw-slots-stack';

  this.slots.forEach(slot => {
    const isFilled = this.assigned[slot.id] !== null;
    const bar = document.createElement('div');
    bar.className = 'hw-bar' + (isFilled ? ' filled' : '');
    
    const labelTitle = document.createElement('span');
    labelTitle.className = 'bar-title';
    labelTitle.textContent = slot.title;
    bar.appendChild(labelTitle);

    const slotDrop = document.createElement('div');
    slotDrop.className = 'bar-slot';
    slotDrop.textContent = isFilled ? `[ ${this.assigned[slot.id]} ]` : 'Drop Leg Label';
    bar.appendChild(slotDrop);

    bar.addEventListener('dragover', e => { e.preventDefault(); bar.classList.add('drag-over'); });
    bar.addEventListener('dragleave', () => bar.classList.remove('drag-over'));
    bar.addEventListener('drop', e => {
      e.preventDefault(); bar.classList.remove('drag-over');
      if(payloadData && payloadData.type === 'act2') {
        if(payloadData.data === slot.correct) {
          this.assigned[slot.id] = payloadData.data;
          this.draw();
          this.verifyInstantCompletion();
        } else {
          triggerToast('Incorrect node! Think about which leg takes positive power.', true);
        }
      }
    });

    slotStack.appendChild(bar);
  });

  centerDisplay.appendChild(slotStack);
  wrapper.appendChild(centerDisplay);

  // Side reset link container
  const side = document.createElement('div');
  side.className = 'sub-controls';
  const rst = document.createElement('button');
  rst.className = 'action-button reset-link';
  rst.textContent = 'Reset ↺';
  rst.addEventListener('click', () => { Act2.initialize(); Act2.draw(); });
  side.appendChild(rst);
  wrapper.appendChild(side);
};

Act2.verifyInstantCompletion = function() {
  if(this.assigned.anode && this.assigned.cathode) {
    document.getElementById('led-light-bulb').style.filter = 'drop-shadow(0 0 15px var(--neon-pink))';
    setTimeout(() => {
      triggerPopup('💡', 'Polarities Locked!', 'Excellent setup! Anode is always the longer positive leg. Cathode is the shorter negative leg. Forward to wiring the loop!', 'Start Loop Wiring', () => {
        launchStep(3); Act3.initialize(); Act3.draw();
      });
    }, 600);
  }
};

// ══════════════════════════ ACTIVITY 3: CIRCUIT LOOP ARCHITECTURE ══════════════════════════
const Act3 = {
  correctLoop: [
    { stage: 'source', label: '1. Power Pin (5V)', info: 'Connects to the positive breadboard power rail line' },
    { stage: 'limiting', label: '2. Resistor Block', info: 'Protects the LED by limiting dangerous current overflow' },
    { stage: 'emission', label: '3. LED Component Anode', info: 'Accepts controlled current to spark bright light safely' },
    { stage: 'ground', label: '4. Ground Pin (GND)', info: 'Returns energy loop back to complete the active system track' }
  ],
  userSequence: [null, null, null, null],
  scrambledIDs: []
};

Act3.initialize = function(){
  this.userSequence = [null, null, null, null];
  this.scrambledIDs = arrayScramble(this.correctLoop.map(c => c.stage));
};

Act3.draw = function(){
  const wrapper = document.getElementById('act3');
  wrapper.innerHTML = '';

  const rack = document.createElement('div');
  rack.className = 'rack';
  rack.innerHTML = '<h3>Loop Modules</h3>';

  this.scrambledIDs.forEach(sid => {
    if(this.userSequence.includes(sid)) return;
    const targetObj = this.correctLoop.find(c => c.stage === sid);
    const chip = document.createElement('div');
    chip.className = 'item-chip';
    chip.textContent = targetObj.label;
    chip.draggable = true;
    chip.addEventListener('dragstart', e => { payloadData = { type: 'act3', id: sid }; chip.classList.add('dragging'); });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    rack.appendChild(chip);
  });
  wrapper.appendChild(rack);

  // Wire Diagram Workspace Panel
  const canvas = document.createElement('div');
  canvas.className = 'wire-canvas';

  this.correctLoop.forEach((slot, index) => {
    const isMatched = this.userSequence[index] !== null;
    const row = document.createElement('div');
    row.className = 'wire-row' + (isMatched ? ' matched' : '');

    const num = document.createElement('div');
    num.className = 'wire-index';
    num.textContent = (index + 1) + '➔';
    row.appendChild(num);

    const zone = document.createElement('div');
    zone.className = 'wire-drop-zone';
    zone.textContent = isMatched ? this.correctLoop.find(c => c.stage === this.userSequence[index]).label : slot.info;
    row.appendChild(zone);

    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault(); row.classList.remove('drag-over');
      if(payloadData && payloadData.type === 'act3') {
        if(payloadData.id === slot.stage) {
          this.userSequence[index] = payloadData.id;
          this.draw();
          this.checkTerminalSuccess();
        } else {
          triggerToast('Sequence fault! Electricity will short circuit or open up if placed here.', true);
        }
      }
    });

    canvas.appendChild(row);
  });

  wrapper.appendChild(canvas);

  const resetCol = document.createElement('div');
  resetCol.className = 'sub-controls';
  const rst = document.createElement('button');
  rst.className = 'action-button reset-link';
  rst.textContent = 'Reset ↺';
  rst.addEventListener('click', () => { Act3.initialize(); Act3.draw(); });
  resetCol.appendChild(rst);
  wrapper.appendChild(resetCol);
};

Act3.checkTerminalSuccess = function(){
  if(this.userSequence.every(s => s !== null)) {
    setTimeout(() => {
      triggerPopup('⚡', 'Chain Reaction Activated!', 'Every link is connected in sequence! Current starts at 5V, crosses the safety resistor, energizes the LED, and terminates at Ground.', 'Trigger Celebration 🎉', this.runCelebrationSequence);
    }, 500);
  }
};

Act3.runCelebrationSequence = function(){
  closePopup();
  triggerConfettiBurst();
  setTimeout(() => {
    triggerFinalVictoryScreen();
  }, 400);
};

// ══════════════════════════ WINDOW MODAL POPUPS & MESSENGERS ══════════════════════════
function triggerPopup(avatar, title, paragraph, buttonText, callbackAction){
  document.getElementById('modal-avatar').textContent = avatar;
  document.getElementById('modal-headline').textContent = title;
  document.getElementById('modal-paragraph').textContent = paragraph;
  
  const btn = document.getElementById('modal-trigger');
  btn.textContent = buttonText;
  btn.onclick = () => {
    if(callbackAction) callbackAction();
  };
  document.getElementById('modal-curtain').classList.add('pop-open');
}

function closePopup(){
  document.getElementById('modal-curtain').classList.remove('pop-open');
}

function triggerToast(text, isFault = false){
  const box = document.getElementById('toast-messenger');
  box.textContent = text;
  box.className = 'activated' + (isFault ? ' fault-mode' : '');
  setTimeout(() => box.className = '', 2600);
}

function triggerFinalVictoryScreen(){
  triggerConfettiBurst();
  document.getElementById('modal-avatar').textContent = '🌟';
  document.getElementById('modal-headline').textContent = 'Circuit Fully Functional!';
  
  const desc = document.getElementById('modal-paragraph');
  desc.innerHTML = `
    <strong style="color:var(--electric-gold)">You built your very first circuit!</strong><br><br>
    You mastered the inner breadboard paths, verified correct LED polarities, and connected an energy-efficient current protection loop.<br><br>
    <em style="color:var(--neon-cyan)">The system sparks up, the lights bloom, and the cyber-birds sing for your engineer success! ✨</em>
  `;
  
  const actionBtn = document.getElementById('modal-trigger');
  actionBtn.textContent = 'Rebuild System ↺';
  actionBtn.className = 'action-button success-theme';
  actionBtn.onclick = () => {
    closePopup();
    Act1.initialize();
    Act2.initialize();
    Act3.initialize();
    launchStep(1);
    Act1.draw();
  };
  document.getElementById('modal-curtain').classList.add('pop-open');
}

function triggerConfettiBurst(){
  const palette = ['#ff5e97', '#4deeea', '#ffe66d', '#4eed7a', '#a370f7'];
  for(let i=0; i<60; i++){
    setTimeout(() => {
      const burst = document.createElement('div');
      burst.className = 'sparkle-dot';
      const diameter = Math.random() * 8 + 5;
      burst.style.cssText = `
        left: ${Math.random() * 100}%;
        top: -10px;
        background: ${palette[Math.floor(Math.random() * palette.length)]};
        animation-duration: ${1.5 + Math.random() * 2}s;
        width: ${diameter}px;
        height: ${diameter}px;
        box-shadow: 0 0 8px currentColor;
      `;
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 3500);
    }, i * 35);
  }
}

// Initialize Application Lifecycles on Boot
Act1.initialize();
Act2.initialize();
Act3.initialize();
launchStep(1);
Act1.draw();
</script>
</body>
</html>
