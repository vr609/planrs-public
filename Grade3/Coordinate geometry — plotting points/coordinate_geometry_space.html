<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COORDINATE GEOMETRY — PLOTTING POINTS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap');

  :root {
    --navy: #030b1a;
    --deep-space: #050d20;
    --panel-bg: rgba(5,20,50,0.85);
    --panel-border: rgba(0,220,255,0.3);
    --gold: #ffd700;
    --gold-glow: rgba(255,215,0,0.6);
    --cyan: #00dcff;
    --cyan-dim: rgba(0,220,255,0.15);
    --emerald: #00ff88;
    --emerald-dim: rgba(0,255,136,0.15);
    --alert: #ff4757;
    --white: #e8f4ff;
    --axis-x: #ff6b35;
    --axis-y: #7c4dff;
    --grid-line: rgba(0,220,255,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Exo 2', sans-serif;
    background: var(--navy);
    color: var(--white);
  }

  /* ── SPACE BACKGROUND ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── EARTH ── */
  .earth {
    position: fixed;
    bottom: -180px; right: -120px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      #1a6b9a 0%, #0d4f7a 30%, #0a2a4a 60%, #061520 100%);
    box-shadow:
      0 0 0 6px rgba(100,180,255,0.12),
      0 0 60px rgba(30,100,200,0.4),
      inset -30px -30px 60px rgba(0,0,0,0.5);
    animation: earthSpin 120s linear infinite;
    z-index: 1;
    overflow: hidden;
  }
  .earth::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(ellipse 60px 30px at 30% 40%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(ellipse 80px 20px at 65% 25%, rgba(255,255,255,0.06) 0%, transparent 100%),
      radial-gradient(ellipse 40px 15px at 50% 60%, rgba(255,255,255,0.05) 0%, transparent 100%);
  }
  .earth-glow {
    position: fixed; bottom: -140px; right: -80px;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(30,100,200,0.15) 0%, transparent 70%);
    z-index: 1; pointer-events: none;
  }
  @keyframes earthSpin { to { filter: hue-rotate(5deg); } }

  /* ── SATELLITES ── */
  .satellite {
    position: fixed; z-index: 2; pointer-events: none;
    font-size: 28px;
    animation: orbitSat linear infinite;
    transform-origin: 200px 200px;
  }
  .satellite.s1 { top: 10%; left: 5%; animation-duration: 30s; font-size: 22px; }
  .satellite.s2 { top: 20%; right: 10%; animation-duration: 45s; font-size: 18px; animation-direction: reverse; }
  .satellite.s3 { bottom: 30%; left: 8%; animation-duration: 55s; font-size: 20px; }
  @keyframes orbitSat {
    0%   { transform: translateX(0) translateY(0) rotate(0deg); }
    25%  { transform: translateX(30px) translateY(-20px) rotate(90deg); }
    50%  { transform: translateX(0) translateY(-40px) rotate(180deg); }
    75%  { transform: translateX(-30px) translateY(-20px) rotate(270deg); }
    100% { transform: translateX(0) translateY(0) rotate(360deg); }
  }

  /* ── ASTRONAUTS ── */
  .astronaut {
    position: fixed; z-index: 2; pointer-events: none;
    font-size: 36px;
    filter: drop-shadow(0 0 8px rgba(0,220,255,0.6));
  }
  .astronaut.a1 {
    top: 12%; left: 15%;
    animation: float1 7s ease-in-out infinite;
  }
  .astronaut.a2 {
    top: 55%; right: 5%;
    animation: float2 9s ease-in-out infinite;
    font-size: 28px;
  }
  @keyframes float1 {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-20px) rotate(5deg); }
  }
  @keyframes float2 {
    0%,100% { transform: translateY(0) rotate(5deg); }
    50%      { transform: translateY(-30px) rotate(-8deg); }
  }

  /* ── NEBULA BLOBS ── */
  .nebula {
    position: fixed; border-radius: 50%; filter: blur(80px);
    pointer-events: none; z-index: 0; opacity: 0.25;
    animation: nebulaPulse 8s ease-in-out infinite;
  }
  .nebula.n1 { width: 350px; height: 350px; background: radial-gradient(#7c4dff, transparent); top: -80px; left: -80px; }
  .nebula.n2 { width: 280px; height: 280px; background: radial-gradient(#ff6b35, transparent); top: 30%; left: 40%; animation-delay: 3s; }
  .nebula.n3 { width: 320px; height: 320px; background: radial-gradient(#00dcff, transparent); bottom: -50px; left: 20%; animation-delay: 5s; }
  @keyframes nebulaPulse { 0%,100%{opacity:0.18;} 50%{opacity:0.32;} }

  /* ── MAIN LAYOUT ── */
  #app {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center; margin-bottom: 10px; position: relative;
  }
  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 2.2vw, 22px);
    font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, var(--gold), var(--cyan), var(--emerald));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 10px rgba(0,220,255,0.5));
    animation: titleGlow 3s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    from { filter: drop-shadow(0 0 6px rgba(0,220,255,0.4)); }
    to   { filter: drop-shadow(0 0 18px rgba(255,215,0,0.7)); }
  }
  .header .subtitle {
    font-size: 10px; letter-spacing: 4px; color: var(--cyan);
    opacity: 0.7; margin-top: 2px; font-family: 'Orbitron', monospace;
  }

  /* ── PROGRESS BAR ── */
  .progress-strip {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 8px;
  }
  .prog-dot {
    width: 28px; height: 6px; border-radius: 3px;
    background: rgba(0,220,255,0.2); border: 1px solid var(--panel-border);
    transition: all 0.5s;
  }
  .prog-dot.active { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .prog-dot.done   { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }

  /* ── ACTIVITY PANEL ── */
  .activity-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(0,220,255,0.08),
      0 0 40px rgba(0,220,255,0.1),
      inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 14px 18px 80px 18px;
    width: 100%; max-width: 980px;
    position: relative; overflow: visible;
    backdrop-filter: blur(12px);
  }
  .activity-panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), var(--cyan), transparent);
    animation: scanline 3s linear infinite;
  }
  @keyframes scanline {
    0%   { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .act-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(11px, 1.5vw, 15px);
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .act-badge {
    background: rgba(255,215,0,0.15);
    border: 1px solid var(--gold);
    border-radius: 4px; padding: 2px 6px;
    font-size: 9px; letter-spacing: 1px;
    color: var(--gold);
  }
  .act-instruction {
    font-size: clamp(10px, 1.2vw, 13px);
    color: rgba(200,230,255,0.8);
    line-height: 1.4;
    margin-bottom: 10px;
  }

  /* ── ACTIVITY CONTENT ── */
  .act-body {
    display: flex; gap: 14px; align-items: flex-start;
  }

  /* ── COORDINATE GRID ── */
  .grid-container {
    position: relative; flex-shrink: 0;
  }
  .coord-grid {
    display: grid;
    border: 2px solid rgba(0,220,255,0.4);
    border-radius: 4px;
    position: relative;
    background: rgba(0,10,30,0.8);
    box-shadow: 0 0 20px rgba(0,220,255,0.15), inset 0 0 30px rgba(0,10,30,0.5);
  }

  /* grid cells */
  .grid-cell {
    border-right: 1px solid var(--grid-line);
    border-top: 1px solid var(--grid-line);
    position: relative;
    transition: background 0.2s;
  }
  .grid-cell:hover { background: rgba(0,220,255,0.05); }
  .grid-cell.highlight-cell {
    background: rgba(255,215,0,0.12) !important;
    box-shadow: inset 0 0 10px rgba(255,215,0,0.3);
  }
  .grid-cell.correct-cell {
    background: rgba(0,255,136,0.18) !important;
    box-shadow: inset 0 0 10px rgba(0,255,136,0.5);
    animation: cellPop 0.4s ease;
  }
  @keyframes cellPop { 0%{transform:scale(1.1);} 100%{transform:scale(1);} }

  /* axis labels */
  .x-labels, .y-labels {
    display: flex; position: absolute;
    font-family: 'Orbitron', monospace;
    font-size: clamp(8px, 1vw, 11px);
    font-weight: 600;
  }
  .x-labels { bottom: -22px; left: 0; gap: 0; }
  .y-labels { left: -22px; top: 0; flex-direction: column-reverse; gap: 0; }
  .x-labels span, .y-labels span {
    display: flex; align-items: center; justify-content: center;
    color: rgba(200,230,255,0.7);
  }

  /* axis lines */
  .axis-x-line, .axis-y-line {
    position: absolute; border-radius: 2px; pointer-events: none;
  }
  .axis-x-line {
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--axis-x), rgba(255,107,53,0.3));
    box-shadow: 0 0 8px rgba(255,107,53,0.6);
  }
  .axis-y-line {
    top: 0; bottom: 0; left: 0; width: 3px;
    background: linear-gradient(0deg, var(--axis-y), rgba(124,77,255,0.3));
    box-shadow: 0 0 8px rgba(124,77,255,0.6);
  }

  /* plotted point */
  .plotted-point {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px var(--gold-glow), 0 0 24px rgba(255,215,0,0.3);
    transform: translate(-50%, 50%);
    z-index: 5;
    animation: pointPulse 1.5s ease-in-out infinite;
    pointer-events: none;
  }
  .plotted-point.emerald {
    background: var(--emerald);
    box-shadow: 0 0 12px rgba(0,255,136,0.8), 0 0 24px rgba(0,255,136,0.3);
  }
  @keyframes pointPulse {
    0%,100% { box-shadow: 0 0 12px var(--gold-glow); }
    50%      { box-shadow: 0 0 24px var(--gold-glow), 0 0 40px rgba(255,215,0,0.2); }
  }

  /* origin dot */
  .origin-dot {
    position: absolute; bottom: 0; left: 0;
    width: 10px; height: 10px; border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px white;
    transform: translate(-50%, 50%);
    z-index: 6; pointer-events: none;
  }

  /* ── DRAG LABELS (Act 1) ── */
  .label-bank {
    display: flex; flex-direction: column; gap: 8px;
    justify-content: center; min-width: 110px;
  }
  .drag-label {
    background: rgba(0,30,60,0.9);
    border: 1.5px solid var(--cyan);
    border-radius: 8px; padding: 7px 12px;
    font-family: 'Orbitron', monospace;
    font-size: 11px; font-weight: 600;
    color: var(--cyan);
    cursor: grab; user-select: none;
    text-align: center;
    box-shadow: 0 0 10px rgba(0,220,255,0.2);
    transition: all 0.2s;
    position: relative;
  }
  .drag-label:active { cursor: grabbing; transform: scale(1.05); }
  .drag-label.placed { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .drag-label.gold-label {
    border-color: var(--gold); color: var(--gold);
    box-shadow: 0 0 10px rgba(255,215,0,0.2);
  }

  .axis-drop-zone {
    position: absolute; z-index: 10;
    border: 2px dashed rgba(0,220,255,0.4);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace; font-size: 10px;
    color: rgba(0,220,255,0.5); letter-spacing: 1px;
    transition: all 0.3s;
    cursor: pointer; background: rgba(0,220,255,0.03);
  }
  .axis-drop-zone.over  { border-color: var(--gold); background: rgba(255,215,0,0.1); color: var(--gold); }
  .axis-drop-zone.filled {
    border-style: solid; border-color: var(--emerald);
    background: rgba(0,255,136,0.1); color: var(--emerald);
    box-shadow: 0 0 12px rgba(0,255,136,0.3);
  }

  /* ── COORDINATE CARDS (Act 2) ── */
  .coord-cards {
    display: flex; flex-wrap: wrap; gap: 7px;
    max-width: 200px; align-content: flex-start;
  }
  .coord-card {
    background: rgba(0,15,40,0.9);
    border: 1.5px solid rgba(124,77,255,0.6);
    border-radius: 8px; padding: 6px 10px;
    font-family: 'Orbitron', monospace; font-size: 11px;
    color: #bf9fff;
    cursor: grab; user-select: none;
    transition: all 0.2s;
    box-shadow: 0 0 8px rgba(124,77,255,0.2);
  }
  .coord-card:active { cursor: grabbing; transform: scale(1.08); box-shadow: 0 0 20px rgba(124,77,255,0.5); }
  .coord-card.placed { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* ── INFO PANEL ── */
  .info-panel {
    background: rgba(0,10,30,0.9);
    border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 12px;
    font-size: clamp(10px, 1.1vw, 12px);
    color: rgba(200,230,255,0.8);
    max-width: 180px; min-width: 150px;
    line-height: 1.6;
  }
  .info-panel .rule {
    font-family: 'Orbitron', monospace;
    font-size: 10px; color: var(--gold); letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .info-panel .step {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
  }
  .step-icon {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .step-icon.x { background: rgba(255,107,53,0.25); color: var(--axis-x); border: 1px solid var(--axis-x); }
  .step-icon.y { background: rgba(124,77,255,0.25); color: var(--axis-y); border: 1px solid var(--axis-y); }

  /* feedback toast */
  .feedback-toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(0,30,60,0.95);
    border: 1.5px solid var(--emerald);
    border-radius: 10px; padding: 10px 20px;
    font-family: 'Orbitron', monospace; font-size: 12px;
    color: var(--emerald); letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
    transition: transform 0.4s cubic-bezier(.34,1.56,.64,1), opacity 0.4s;
    z-index: 200; opacity: 0;
    white-space: nowrap;
  }
  .feedback-toast.show {
    transform: translateX(-50%) translateY(0); opacity: 1;
  }
  .feedback-toast.error {
    border-color: var(--alert); color: var(--alert);
    box-shadow: 0 0 20px rgba(255,71,87,0.3);
  }

  /* ── POPUP OVERLAY ── */
  .popup-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(3,11,26,0.92);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  .popup-overlay.show { opacity: 1; pointer-events: all; }

  .popup-box {
    background: linear-gradient(135deg, rgba(5,20,60,0.98), rgba(10,30,70,0.98));
    border: 2px solid var(--cyan);
    border-radius: 20px; padding: 30px 36px;
    text-align: center; max-width: 420px; width: 90%;
    box-shadow: 0 0 0 1px rgba(0,220,255,0.1), 0 0 80px rgba(0,220,255,0.2);
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  .popup-box::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--cyan), var(--emerald));
  }
  @keyframes popIn {
    from { transform: scale(0.7) translateY(20px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  .popup-icon { font-size: 52px; margin-bottom: 12px; animation: iconFloat 2s ease-in-out infinite; }
  @keyframes iconFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .popup-title {
    font-family: 'Orbitron', monospace;
    font-size: 18px; font-weight: 900;
    color: var(--gold); letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }
  .popup-msg {
    font-size: 13px; color: rgba(200,230,255,0.85);
    line-height: 1.6; margin-bottom: 20px;
  }
  .popup-btn {
    background: linear-gradient(135deg, rgba(0,220,255,0.2), rgba(0,220,255,0.05));
    border: 2px solid var(--cyan);
    border-radius: 10px; padding: 10px 28px;
    font-family: 'Orbitron', monospace; font-size: 12px;
    color: var(--cyan); letter-spacing: 2px;
    cursor: pointer; transition: all 0.3s;
    box-shadow: 0 0 15px rgba(0,220,255,0.2);
  }
  .popup-btn:hover {
    background: linear-gradient(135deg, rgba(0,220,255,0.35), rgba(0,220,255,0.1));
    box-shadow: 0 0 30px rgba(0,220,255,0.5);
    transform: translateY(-2px);
  }
  .popup-score {
    margin: 12px 0; padding: 10px;
    background: rgba(0,220,255,0.07);
    border: 1px solid rgba(0,220,255,0.2);
    border-radius: 8px;
    font-family: 'Orbitron', monospace; font-size: 12px;
    color: var(--cyan);
  }

  /* ── ACT 3 CANVAS ── */
  #act3-canvas {
    border-radius: 4px;
    cursor: pointer;
    display: block;
  }

  /* ── STAR POINTS LIST (Act3) ── */
  .points-list {
    display: flex; flex-direction: column; gap: 5px;
    max-height: 220px; overflow-y: auto;
  }
  .point-item {
    background: rgba(0,10,30,0.9);
    border: 1px solid rgba(0,220,255,0.25);
    border-radius: 6px; padding: 5px 10px;
    font-family: 'Orbitron', monospace; font-size: 10px;
    color: rgba(200,230,255,0.6);
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; transition: all 0.2s;
  }
  .point-item:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0,220,255,0.05); }
  .point-item.connected {
    border-color: var(--emerald); color: var(--emerald);
    background: rgba(0,255,136,0.07);
  }
  .point-num {
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(255,215,0,0.2); border: 1px solid var(--gold);
    color: var(--gold); display: flex; align-items: center; justify-content: center;
    font-size: 8px; flex-shrink: 0;
  }

  /* Scrollbar styling */
  .points-list::-webkit-scrollbar { width: 4px; }
  .points-list::-webkit-scrollbar-track { background: rgba(0,10,30,0.5); }
  .points-list::-webkit-scrollbar-thumb { background: rgba(0,220,255,0.3); border-radius: 2px; }

  /* ── PARTICLES ── */
  .particle {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 3;
    animation: particleDrift linear infinite;
    opacity: 0;
  }
  @keyframes particleDrift {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-120vh) translateX(var(--dx, 0)); opacity: 0; }
  }

  /* Act1 score tracker */
  .score-bar {
    display: flex; gap: 6px; align-items: center;
    font-family: 'Orbitron', monospace; font-size: 10px;
    color: var(--cyan); margin-bottom: 8px;
  }
  .score-pip {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid rgba(0,220,255,0.4);
    transition: all 0.3s;
  }
  .score-pip.filled {
    background: var(--emerald); border-color: var(--emerald);
    box-shadow: 0 0 6px rgba(0,255,136,0.6);
  }

  /* holographic grid decoration */
  .holo-decor {
    position: fixed; pointer-events: none; z-index: 1;
    opacity: 0.06;
    animation: holoFloat 15s ease-in-out infinite;
  }
  @keyframes holoFloat {
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-15px) rotate(3deg);}
  }

  /* Glowing lines for Act3 success */
  @keyframes lineGlow {
    0%,100% { filter: drop-shadow(0 0 4px var(--emerald)); }
    50%      { filter: drop-shadow(0 0 12px var(--emerald)); }
  }
</style>
</head>
<body>

<!-- BACKGROUND -->
<canvas id="bg-canvas"></canvas>

<!-- NEBULA -->
<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>

<!-- EARTH -->
<div class="earth"></div>

//  BACKGROUND STAR CANVAS
// ═══════════════════════════════════════════════════════
(function initCanvas() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.4 + 0.2,
        speed: Math.random() * 0.12 + 0.02,
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.04 + 0.01
      });
    }
  }
  function drawStars() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.twinkle += s.twinkleSpeed;
      const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${alpha})`;
      ctx.fill();
      s.y -= s.speed;
      if (s.y < 0) { s.y = H; s.x = Math.random() * W; }
    });
    requestAnimationFrame(drawStars);
  }
  resize();
  initStars();
  drawStars();
  window.addEventListener('resize', () => { resize(); initStars(); });
})();

//  TOAST

let toastTimer;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'feedback-toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);

function showPopup(icon, title, msg, scoreText, btnText) {
  document.getElementById('popup-icon').textContent = icon;
  document.getElementById('popup-title').textContent = title;
  document.getElementById('popup-msg').textContent = msg;
  const sc = document.getElementById('popup-score');
  if (scoreText) { sc.style.display = ''; sc.textContent = scoreText; }
  else sc.style.display = 'none';
  document.getElementById('popup-btn').textContent = btnText;
  document.getElementById('popup').classList.add('show');
}
function hidePopup() {
  document.getElementById('popup').classList.remove('show');
}

function nextActivity() {
  hidePopup();
  currentActivity++;
  updateProgress();
  if (currentActivity === 2) renderActivity2();
  else if (currentActivity === 3) renderActivity3();
  else if (currentActivity === 4) showFinalPopup();
}

function updateProgress() {
  for (let i = 0; i < 3; i++) {
    const d = document.getElementById('prog-' + i);
    d.className = 'prog-dot';
    if (i < currentActivity - 1) d.classList.add('done');
    else if (i === currentActivity - 1) d.classList.add('active');
  }
  const lbl = document.getElementById('prog-label');
  if (currentActivity <= 3) lbl.textContent = `MISSION ${currentActivity} / 3`;
  else lbl.textContent = 'ALL MISSIONS COMPLETE!';
}

function showFinalPopup() {
  const total = scores[0] + scores[1] + scores[2];

    `MISSION SCORES: ${scores[0]}/4 • ${scores[1]}/5 • ${scores[2]}/8  |  TOTAL: ${total}/17`,
    ''
  );
}

function resetGame() {
  hidePopup();
  currentActivity = 1;
  scores[0] = 0; scores[1] = 0; scores[2] = 0;
  act2Placed = 0; act2DragId = null;
  act3Connected = 0; act3CanvasCtx = null; act3DrawnPoints = [];

  document.getElementById('play-again-btn').style.display = 'none';

// ═══════════════════════════════════════════════════════
//  CONFETTI BURST
// ═══════════════════════════════════════════════════════
function burstParticles() {
  const colors = ['#ffd700','#00dcff','#00ff88','#ff6b35','#7c4dff'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 5 + 3;
    const x = Math.random() * 100;
    const dx = (Math.random() - 0.5) * 100;
    p.style.cssText = `
      left:${x}%;bottom:-10px;
      width:${size}px;height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dx:${dx}px;
      animation-duration:${Math.random()*2+2}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

// ═══════════════════════════════════════════════════════
//  GRID BUILDER
// ═══════════════════════════════════════════════════════
const GRID_SIZE = 5; // 5x5 grid (0..5 labels), cells = 5
const CELL = 44;     // px per cell

function buildGrid(containerId, opts = {}) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const total = GRID_SIZE;
  const px = total * CELL;

  container.style.cssText = `position:relative;width:${px}px;height:${px}px;`;

  // Grid HTML
  container.innerHTML = `
    <div class="coord-grid" style="width:${px}px;height:${px}px;
      grid-template-columns:repeat(${total},${CELL}px);
      grid-template-rows:repeat(${total},${CELL}px);"
      id="${containerId}-grid">
    </div>
    <div class="axis-x-line"></div>
    <div class="axis-y-line"></div>
    <div class="origin-dot"></div>
  `;

  // Cells
  const grid = container.querySelector('.coord-grid');
  for (let row = total; row >= 1; row--) {
    for (let col = 1; col <= total; col++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.dataset.x = col - 1; // coordinate value 0-indexed: col=1 → x=0? No:
      // cell col 1 is between x=0 and x=1, so clicking gives x=col, y=row
      cell.dataset.cx = col;
      cell.dataset.cy = row;
      cell.style.cssText = `width:${CELL}px;height:${CELL}px;`;
      if (opts.onCellClick) cell.addEventListener('click', () => opts.onCellClick(col, row, cell));
      if (opts.onCellDrop) {
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.style.background = 'rgba(255,215,0,0.12)'; });
        cell.addEventListener('dragleave', () => cell.style.background = '');
        cell.addEventListener('drop', e => { e.preventDefault(); cell.style.background = ''; opts.onCellDrop(col, row, cell, e); });
      }
      grid.appendChild(cell);
    }
  }

  // X labels
  const xl = document.createElement('div');
  xl.className = 'x-labels';
  for (let i = 0; i <= total; i++) {
    const s = document.createElement('span');
    s.textContent = i;
    s.style.width = CELL + 'px';
    xl.appendChild(s);
  }
  xl.style.left = `-${CELL}px`;
  container.appendChild(xl);

  // Y labels
  const yl = document.createElement('div');
  yl.className = 'y-labels';
  for (let i = 0; i <= total; i++) {
    const s = document.createElement('span');
    s.textContent = i;
    s.style.height = CELL + 'px';
    yl.appendChild(s);
  }
  yl.style.left = `-${CELL + 18}px`;
  container.appendChild(yl);

  return container;
}

// Pixel position for a coordinate (x,y) on the grid
function coordToPixel(x, y, containerEl) {
  // x goes right from left edge, y goes up from bottom edge
  const rect = containerEl.getBoundingClientRect();
  const px = x * CELL;
  const py = GRID_SIZE * CELL - y * CELL;
  return { px, py };
}

function placePoint(x, y, containerEl, cls = '') {
  const { px, py } = coordToPixel(x, y, containerEl);
  const dot = document.createElement('div');
  dot.className = 'plotted-point' + (cls ? ' ' + cls : '');
  dot.style.left = px + 'px';
  dot.style.top = py + 'px';
  dot.dataset.px = x; dot.dataset.py = y;
  containerEl.appendChild(dot);
  return dot;
}

            📐 X-AXIS (HORIZONTAL)

          <div class="drag-label gold-label" draggable="true" data-id="yaxis" data-label="Y-AXIS (VERTICAL)">
            📏 Y-AXIS (VERTICAL)
          </div>
          <div class="drag-label" draggable="true" data-id="origin" data-label="ORIGIN (0,0)">
            🎯 ORIGIN (0,0)
          </div>

  `;

  const labels = panel.querySelectorAll('.drag-label');

        zone.classList.add('over');
        setTimeout(() => zone.classList.remove('over'), 500);
      }
    });
  });

    <div class="act-body" style="align-items:flex-start;">
      <div style="position:relative;margin-left:36px;margin-bottom:36px;flex-shrink:0;">
        <!-- Canvas layered over grid for drawing lines -->
        <div id="act3-grid-wrap" style="position:relative;"></div>
        <canvas id="act3-canvas" width="${CANVAS_PX}" height="${CANVAS_PX}"
          style="position:absolute;top:0;left:0;pointer-events:none;z-index:20;"></canvas>
        <div style="position:absolute;bottom:-32px;left:0;width:${CANVAS_PX}px;
          text-align:center;font-family:Orbitron,monospace;font-size:9px;
          color:var(--axis-x);letter-spacing:2px;">← X-AXIS →</div>
        <div style="position:absolute;left:-68px;top:0;height:${CANVAS_PX}px;
          display:flex;align-items:center;
          font-family:Orbitron,monospace;font-size:9px;color:var(--axis-y);
          letter-spacing:1px;writing-mode:vertical-rl;transform:rotate(180deg);">↑ Y-AXIS ↑</div>
      </div>

      <div style="padding-left:20px;display:flex;flex-direction:column;gap:8px;">
        <div style="font-family:Orbitron,monospace;font-size:10px;color:var(--gold);
          letter-spacing:1px;">🗂 CONNECT IN ORDER</div>
        <div class="points-list" id="act3-points-list">
          ${rocketPoints.slice(0, -1).map((p, i) => `
            <div class="point-item" id="pt-item-${i}" data-idx="${i}" onclick="act3ClickPoint(${i})">
              <div class="point-num">${i+1}</div>
              <span>${p.label}</span>
              <span style="margin-left:auto;font-size:9px;opacity:0.5;">CLICK TO SELECT</span>
            </div>
          `).join('')}
        </div>
        <div class="info-panel" style="margin-top:4px;">
          <div class="rule">🔗 MISSION BRIEF</div>
          <div style="font-size:10px;color:rgba(200,230,255,0.7);line-height:1.7;">
            Plot each point using (Over, Up) then connect them in numbered order to reveal the secret rocket!
          </div>
          <div style="margin-top:6px;font-family:Orbitron,monospace;font-size:10px;color:var(--cyan);">
            POINTS CONNECTED: <span id="act3-counter">0</span> / ${rocketPoints.length - 1}
          </div>
        </div>
      </div>
    </div>
  `;

  buildGrid('act3-grid-wrap', {
    onCellClick: (cx, cy, cell) => act3HandleCellClick(cx, cy, cell)
  });

  // Place numbered dots for each rocket point (except last which repeats first)
  const wrap = document.getElementById('act3-grid-wrap');
  rocketPoints.slice(0, -1).forEach((pt, i) => {
    const { px, py } = coordToPixel(pt.x, pt.y, wrap);
    const dot = document.createElement('div');
    dot.style.cssText = `
      position:absolute;
      left:${px}px;top:${py}px;
      width:22px;height:22px;border-radius:50%;
      background:rgba(255,215,0,0.2);
      border:2px solid var(--gold);
      color:var(--gold);
      font-family:Orbitron,monospace;font-size:8px;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      transform:translate(-50%,50%);
      z-index:15;cursor:pointer;
      transition:all 0.2s;
      box-shadow:0 0 8px rgba(255,215,0,0.3);
    `;
    dot.textContent = i + 1;
    dot.id = `dot-${i}`;
    dot.title = `Point ${i+1}: ${pt.label}`;
    dot.addEventListener('click', () => act3HandleCellClick(pt.x, pt.y, null, i));
    wrap.appendChild(dot);
  });

  // Init canvas
  const c = document.getElementById('act3-canvas');
  act3CanvasCtx = c.getContext('2d');
}

function act3ClickPoint(idx) {
  const pt = rocketPoints[idx];
  act3HandleCellClick(pt.x, pt.y, null, idx);
}

function act3HandleCellClick(cx, cy, cell, knownIdx) {
  const expected = act3Connected;
  if (expected >= rocketPoints.length - 1) return;
  const target = rocketPoints[expected];

  if (cx === target.x && cy === target.y) {
    // Mark the dot
    const dot = document.getElementById(`dot-${expected}`);
    if (dot) {
      dot.style.background = 'var(--emerald)';
      dot.style.borderColor = 'var(--emerald)';
      dot.style.color = '#000';
      dot.style.boxShadow = '0 0 16px rgba(0,255,136,0.7)';
    }
    // Update list item
    const item = document.getElementById(`pt-item-${expected}`);
    if (item) item.classList.add('connected');

    // Draw line from previous
    const wrap = document.getElementById('act3-grid-wrap');
    const curr = coordToPixel(cx, cy, wrap);
    act3DrawnPoints.push({ px: curr.px, py: curr.py });

    if (act3DrawnPoints.length > 1) {
      const prev = act3DrawnPoints[act3DrawnPoints.length - 2];
      drawGlowLine(prev.px, prev.py, curr.px, curr.py);
    }

    act3Connected++;
    document.getElementById('act3-counter').textContent = act3Connected;
    scores[2] = act3Connected;
    showToast(`✅ Point ${expected + 1} connected! (${cx}, ${cy})`);

    if (act3Connected === rocketPoints.length - 1) {
      // Connect back to first
      const first = act3DrawnPoints[0];
      const last = act3DrawnPoints[act3DrawnPoints.length - 1];
      drawGlowLine(last.px, last.py, first.px, first.py);
      // Draw rocket label
      setTimeout(() => drawRocketLabel(), 300);
      burstParticles();
      setTimeout(() => {
        showPopup('🚀', 'ROCKET REVEALED!',
          'Mission accomplished, Navigator! You connected all coordinate points in the correct order and revealed the hidden rocket ship! You are now a certified Space Coordinate Navigator!',
          'MISSION SCORE: 8/8 POINTS CONNECTED',
          'VIEW FINAL RESULTS ›');
      }, 1000);
    }
  } else {
    showToast(`❌ Not quite! Next point is ${target.label} — Over ${target.x}, Up ${target.y}`, true);
    if (cell) {
      cell.style.background = 'rgba(255,71,87,0.12)';
      setTimeout(() => cell.style.background = '', 500);
    }
  }
}

function drawGlowLine(x1, y1, x2, y2) {
  const ctx = act3CanvasCtx;
  if (!ctx) return;
  // Draw the line with glow
  ctx.save();
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawRocketLabel() {
  const ctx = act3CanvasCtx;
  if (!ctx) return;
  const cx = GRID_SIZE * CELL / 2;
  const cy = GRID_SIZE * CELL / 2;
  ctx.save();
  ctx.font = '28px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#00dcff';
  ctx.shadowBlur = 20;
  ctx.fillText('🚀', cx, cy);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  renderActivity1();

  // Verify drop setup for act1 after render
  document.addEventListener('dragover', e => e.preventDefault());
});
</script>
