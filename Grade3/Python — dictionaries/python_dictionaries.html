<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PYTHON — DICTIONARIES</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#1a1538;
  --night2:#241c4a;
  --violet:#3a2a66;
  --glow-gold:#ffd166;
  --glow-pink:#ff8fb1;
  --glow-teal:#5eead4;
  --parchment:#f7f0de;
  --parchment-dim:#cfc6ae;
  --leaf:#7bd389;
  --ok:#5eead4;
  --err:#ff8fb1;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;color:var(--parchment)}

/* ── ENCHANTED FOREST BACKGROUND ── */
#forest{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,209,102,.10) 0%, transparent 35%),
    radial-gradient(ellipse at 80% 75%, rgba(94,234,212,.08) 0%, transparent 40%),
    linear-gradient(180deg,#100d28 0%,#1a1538 30%,#241c4a 60%,#2d2150 85%,#1d1640 100%);
}

/* Stars */
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 2.4s infinite alternate}
@keyframes twinkle{0%{opacity:.15;transform:scale(1)}100%{opacity:.9;transform:scale(1.5)}}

/* Fireflies */
.firefly{position:absolute;border-radius:50%;background:var(--glow-gold);box-shadow:0 0 6px 2px var(--glow-gold);animation:firefly-float linear infinite}
@keyframes firefly-float{
  0%{transform:translate(0,0);opacity:.2}
  25%{opacity:1}
  50%{transform:translate(40px,-60px);opacity:.5}
  75%{opacity:1}
  100%{transform:translate(-30px,-120px);opacity:.1}
}

/* Magic dust drifting */
.dust{position:absolute;border-radius:50%;background:rgba(247,240,222,.55);animation:dust-drift linear infinite}
@keyframes dust-drift{
  0%{transform:translate(0,0) scale(1);opacity:0}
  10%{opacity:.7}
  90%{opacity:.5}
  100%{transform:translate(60px,-200px) scale(1.4);opacity:0}
}

/* Enchanted trees / silhouettes */
.tree{position:absolute;bottom:0;opacity:.85}

/* Swaying plants */
.plant{position:absolute;bottom:0;transform-origin:bottom center;animation:sway ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}

/* Glowing mushrooms */
.mushroom{position:absolute;bottom:0;animation:mush-glow 2.6s ease-in-out infinite alternate}
@keyframes mush-glow{0%{filter:drop-shadow(0 0 4px currentColor)}100%{filter:drop-shadow(0 0 14px currentColor)}}

/* Fluttering fairies */
.fairy{position:absolute;animation:fairy-flutter ease-in-out infinite alternate}
@keyframes fairy-flutter{
  0%{transform:translate(0,0) rotate(-4deg)}
  50%{transform:translate(18px,-26px) rotate(4deg)}
  100%{transform:translate(-14px,-10px) rotate(-2deg)}
}
.fairy-wing{animation:wing-flap .2s ease-in-out infinite alternate}
@keyframes wing-flap{0%{transform:scaleX(1)}100%{transform:scaleX(.55)}}

/* ── MAIN APP ── */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:10px}

#titlebar{background:rgba(26,21,56,.78);backdrop-filter:blur(8px);border:1.5px solid rgba(255,209,102,.35);border-radius:16px;padding:10px 28px;text-align:center;pointer-events:auto;margin-bottom:10px;box-shadow:0 0 24px rgba(94,234,212,.08)}
#titlebar h1{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:var(--glow-gold);letter-spacing:2px;text-shadow:0 0 12px rgba(255,209,102,.5)}
#titlebar p{font-size:11px;color:var(--glow-teal);margin-top:3px;font-weight:500}

#panel{background:rgba(20,16,46,.82);backdrop-filter:blur(10px);border:1.5px solid rgba(255,209,102,.28);border-radius:22px;width:920px;max-width:97vw;padding:20px 26px;pointer-events:auto;position:relative;box-shadow:0 0 40px rgba(123,211,137,.06), inset 0 0 60px rgba(94,234,212,.03)}

/* Step indicator — mushroom markers */
#steps{display:flex;gap:10px;justify-content:center;margin-bottom:14px;align-items:center}
.step-dot{width:32px;height:32px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;border:2px solid rgba(255,209,102,.35);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:13px;font-weight:700;color:rgba(255,209,102,.5);transition:all .4s;background:rgba(255,209,102,.04)}
.step-dot.active{border-color:var(--glow-gold);color:var(--night1);background:var(--glow-gold);box-shadow:0 0 14px rgba(255,209,102,.6)}
.step-dot.done{border-color:var(--leaf);color:var(--night1);background:var(--leaf);box-shadow:0 0 10px rgba(123,211,137,.5)}
.step-line{flex:1;height:2px;background:rgba(255,209,102,.18);align-self:center;max-width:70px;border-radius:2px;transition:background .4s}
.step-line.done{background:var(--leaf)}

#act-title{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;color:var(--glow-gold);margin-bottom:4px;text-align:center;text-shadow:0 0 10px rgba(255,209,102,.35)}
#act-desc{font-size:12px;color:var(--parchment-dim);text-align:center;margin-bottom:14px;line-height:1.5;max-width:680px;margin-inline:auto}

/* ── ACTIVITY 1: Key-Value Mushroom Pairing ── */
#act1{display:flex;gap:22px;align-items:flex-start;justify-content:center}
.bank{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:130px}
.bank h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--glow-teal);margin-bottom:2px;text-align:center;letter-spacing:1px}
.drag-chip{padding:9px 14px;border-radius:12px;border:1.5px solid rgba(255,209,102,.4);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:grab;color:var(--glow-gold);transition:all .2s;user-select:none;background:rgba(255,209,102,.06);min-width:90px;text-align:center}
.drag-chip:hover{border-color:var(--glow-gold);background:rgba(255,209,102,.18);transform:scale(1.06)}
.drag-chip.dragging{opacity:.35}
.drag-chip.key-chip{border-color:rgba(123,211,137,.45);color:var(--leaf);background:rgba(123,211,137,.07)}
.drag-chip.key-chip:hover{border-color:var(--leaf);background:rgba(123,211,137,.18)}

.pairing-area{display:flex;flex-direction:column;align-items:center;gap:10px}
.dict-frame{font-family:'Space Mono',monospace;font-size:14px;color:var(--parchment);background:rgba(10,8,26,.55);border:1.5px solid rgba(255,209,102,.25);border-radius:14px;padding:16px 20px;min-width:340px}
.dict-frame .brace{color:var(--glow-gold);font-weight:700}
.pair-row{display:flex;align-items:center;gap:6px;margin:6px 0;padding-left:14px}
.slot{min-width:78px;height:32px;border:1.5px dashed rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .25s;color:#778}
.slot.filled{border-style:solid;color:var(--parchment)}
.slot.key-slot.filled{border-color:var(--leaf);background:rgba(123,211,137,.1);color:var(--leaf)}
.slot.val-slot.filled{border-color:var(--glow-gold);background:rgba(255,209,102,.1);color:var(--glow-gold)}
.slot.drag-over{border-color:#fff;background:rgba(255,255,255,.12);transform:scale(1.05)}
.slot.correct-flash{animation:correct-flash .5s ease}
@keyframes correct-flash{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.colon{color:var(--parchment-dim);font-weight:700}
.comma{color:var(--parchment-dim)}

.mushroom-preview{width:160px;display:flex;flex-direction:column;align-items:center;gap:8px}
.mushroom-preview h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--glow-teal);letter-spacing:1px}
#mushroom-canvas{width:140px;height:140px}

/* ── ACTIVITY 2: Operation Cards → Use Cases ── */
#act2{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.op-bank{display:flex;flex-direction:column;gap:8px;min-width:110px}
.op-bank h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--glow-teal);text-align:center;letter-spacing:1px;margin-bottom:2px}
.op-card{padding:10px 8px;border-radius:12px;border:1.5px solid rgba(255,143,177,.45);color:var(--glow-pink);font-family:'Space Mono',monospace;font-size:13px;font-weight:700;cursor:grab;text-align:center;transition:all .2s;user-select:none;background:rgba(255,143,177,.07)}
.op-card:hover{border-color:var(--glow-pink);background:rgba(255,143,177,.16);transform:scale(1.05)}
.op-card.dragging{opacity:.35}

.usecase-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;max-width:560px}
.usecase-card{border:1.5px dashed rgba(255,255,255,.25);border-radius:14px;padding:12px;min-height:90px;display:flex;flex-direction:column;gap:8px;transition:all .25s;background:rgba(10,8,26,.35)}
.usecase-card .uc-desc{font-size:11px;color:var(--parchment-dim);line-height:1.4}
.usecase-card .uc-slot{min-height:34px;border:1.5px dashed rgba(255,209,102,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:12px;color:rgba(255,209,102,.4);transition:all .25s}
.usecase-card .uc-slot.filled{border-style:solid;border-color:var(--leaf);background:rgba(123,211,137,.12);color:var(--leaf);font-weight:700}
.usecase-card.drag-over .uc-slot{border-color:#fff;background:rgba(255,255,255,.1)}
.usecase-card.matched{border-color:var(--leaf);border-style:solid;background:rgba(123,211,137,.08)}

/* ── ACTIVITY 3: Phonebook Workflow Sequence ── */
#act3{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.seq-bank{display:flex;flex-direction:column;gap:7px;min-width:200px}
.seq-bank h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--glow-teal);text-align:center;letter-spacing:1px;margin-bottom:2px}
.seq-card{padding:9px 12px;border-radius:10px;border:1.5px solid rgba(94,234,212,.4);color:var(--glow-teal);font-family:'Space Mono',monospace;font-size:11px;font-weight:600;cursor:grab;text-align:left;transition:all .2s;user-select:none;background:rgba(94,234,212,.06)}
.seq-card:hover{border-color:var(--glow-teal);background:rgba(94,234,212,.15);transform:translateX(3px)}
.seq-card.dragging{opacity:.35}

.workflow-frame{flex:1;max-width:480px;display:flex;flex-direction:column;gap:8px}
.workflow-step{display:flex;align-items:center;gap:10px;border:1.5px dashed rgba(255,255,255,.22);border-radius:12px;padding:8px 12px;min-height:46px;transition:all .25s;background:rgba(10,8,26,.35)}
.workflow-step .wf-num{font-family:'Fredoka',sans-serif;font-size:13px;font-weight:700;color:var(--glow-gold);min-width:20px}
.workflow-step .wf-slot{flex:1;min-height:32px;border:1.5px dashed rgba(255,209,102,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;color:rgba(255,209,102,.4);transition:all .25s;text-align:center;padding:0 6px}
.workflow-step .wf-slot.filled{border-style:solid;border-color:var(--leaf);background:rgba(123,211,137,.12);color:var(--leaf);font-weight:700}
.workflow-step.drag-over .wf-slot{border-color:#fff;background:rgba(255,255,255,.1)}
.workflow-step.matched{border-color:var(--leaf);border-style:solid}

/* Buttons */
.btn{padding:10px 24px;border-radius:10px;border:1.5px solid var(--glow-gold);background:rgba(255,209,102,.12);color:var(--glow-gold);font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;display:block;margin:10px auto 0}
.btn:hover{background:rgba(255,209,102,.25);transform:scale(1.04)}
.btn:active{transform:scale(.97)}
.btn.green{border-color:var(--leaf);background:rgba(123,211,137,.15);color:var(--leaf)}
.btn.green:hover{background:rgba(123,211,137,.28)}
.btn.ghost{border-color:rgba(255,255,255,.25);background:transparent;color:var(--parchment-dim);font-size:11px;padding:7px 16px}
.btn.ghost:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.06)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:10px}
.btn-row .btn{margin:0}

/* ── POPUP ── */
#popup-overlay{position:fixed;inset:0;z-index:100;background:rgba(10,8,26,.72);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#popup-overlay.show{display:flex}
#popup{background:linear-gradient(160deg,#241c4a 0%,#1a1538 100%);border:2px solid var(--glow-gold);border-radius:20px;padding:30px 38px;max-width:440px;text-align:center;animation:pop-in .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 50px rgba(255,209,102,.25)}
@keyframes pop-in{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#popup h2{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:700;color:var(--glow-gold);margin-bottom:10px;text-shadow:0 0 10px rgba(255,209,102,.4)}
#popup p{font-size:13px;color:var(--parchment-dim);line-height:1.65;margin-bottom:18px}
.popup-icon{font-size:42px;margin-bottom:10px;display:block}

/* Sparkle confetti */
.confetti-piece{position:fixed;border-radius:50%;animation:confetti-fall linear forwards;z-index:200}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(540deg) scale(.6);opacity:0}}

/* Feedback toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(123,211,137,.92);color:#15301c;padding:9px 22px;border-radius:22px;font-size:12px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;font-family:'Quicksand',sans-serif}
#toast.show{opacity:1}
#toast.error{background:rgba(255,143,177,.92);color:#3a1020}

@media (max-width:760px){
  #panel{padding:14px 14px}
  #act1,#act3{flex-direction:column;align-items:center}
  .usecase-grid{grid-template-columns:1fr;max-width:100%}
  .dict-frame{min-width:0;width:100%}
  .mushroom-preview{width:120px}
}
</style>
</head>
<body>

<div id="forest"></div>

<div id="app">
  <div id="titlebar">
    <h1>🍄 PYTHON — DICTIONARIES ✨</h1>
    <p>Drag, match, and unlock the magic of Key-Value pairs!</p>
  </div>

  <div id="panel">
    <div id="steps">
      <div class="step-dot active" id="s1">1</div>
      <div class="step-line" id="l1"></div>
      <div class="step-dot" id="s2">2</div>
      <div class="step-line" id="l2"></div>
      <div class="step-dot" id="s3">3</div>
    </div>

    <div id="act-title"></div>
    <div id="act-desc"></div>

    <div id="act1"></div>
    <div id="act2" style="display:none"></div>
    <div id="act3" style="display:none"></div>
  </div>
</div>

<div id="popup-overlay">
  <div id="popup">
    <span class="popup-icon" id="popup-icon"></span>
    <h2 id="popup-title"></h2>
    <p id="popup-body"></p>
    <button class="btn" id="popup-btn"></button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════ ENCHANTED FOREST BUILDER ══════════════════════════
(function buildForest(){
  const f=document.getElementById('forest');

  // Stars
  for(let i=0;i<60;i++){
    const d=document.createElement('div');
    d.className='star';
    const sz=Math.random()*2+1;
    Object.assign(d.style,{width:sz+'px',height:sz+'px',left:Math.random()*100+'%',top:Math.random()*45+'%',animationDelay:Math.random()*3+'s',animationDuration:(1.8+Math.random()*2)+'s'});
    f.appendChild(d);
  }

  // Fireflies
  for(let i=0;i<22;i++){
    const d=document.createElement('div');
    d.className='firefly';
    const sz=Math.random()*3+2;
    Object.assign(d.style,{width:sz+'px',height:sz+'px',left:Math.random()*100+'%',top:(40+Math.random()*55)+'%',animationDelay:Math.random()*6+'s',animationDuration:(5+Math.random()*5)+'s'});
    f.appendChild(d);
  }

  // Magic dust
  for(let i=0;i<35;i++){
    const d=document.createElement('div');
    d.className='dust';
    const sz=Math.random()*3+1.5;
    Object.assign(d.style,{width:sz+'px',height:sz+'px',left:Math.random()*100+'%',top:(50+Math.random()*50)+'%',animationDelay:Math.random()*8+'s',animationDuration:(6+Math.random()*6)+'s'});
    f.appendChild(d);
  }

  // Enchanted tree silhouettes (left & right edges)
  function makeTree(x,scale,flip){
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',180*scale);svg.setAttribute('height',360*scale);svg.setAttribute('viewBox','0 0 180 360');
    svg.innerHTML=`<path d="M90 360 C70 280 60 240 70 180 C50 170 30 140 35 100 C45 110 60 125 70 150 C65 100 55 60 75 10 C85 50 85 90 85 140 C100 110 115 90 135 80 C125 110 105 135 95 165 C115 165 140 180 150 210 C125 200 105 200 90 220 C100 270 95 320 105 360 Z" fill="#120e26" opacity="0.9"/>`;
    Object.assign(svg.style,{position:'absolute',bottom:'0',left:x+'%',transform:flip?'scaleX(-1)':'none',zIndex:'1'});
    f.appendChild(svg);
  }
  makeTree(-4,1.5,false);
  makeTree(86,1.6,true);
  makeTree(-2,1.0,true);

  // Swaying ferns / plants along the bottom
  const plantColors=['#3a5a3a','#4a6b3a','#355245','#2f4a3f'];
  for(let i=0;i<14;i++){
    const x=Math.random()*100;
    const sz=24+Math.random()*30;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',sz);svg.setAttribute('height',sz*1.6);svg.setAttribute('viewBox','0 0 40 64');
    const c=plantColors[Math.floor(Math.random()*plantColors.length)];
    svg.innerHTML=`<path d="M20 64 C20 40 10 30 4 14 M20 64 C20 38 30 28 36 12 M20 64 C20 30 20 18 20 2" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="4" cy="12" rx="6" ry="3" fill="${c}"/><ellipse cx="36" cy="10" rx="6" ry="3" fill="${c}"/><ellipse cx="20" cy="2" rx="5" ry="3" fill="${c}"/>`;
    svg.className='plant';
    Object.assign(svg.style,{left:x+'%',bottom:'0',animationDuration:(3+Math.random()*2)+'s',animationDelay:(Math.random()*2)+'s',zIndex:'2',opacity:'.75'});
    f.appendChild(svg);
  }

  // Glowing mushrooms scattered near bottom
  const mushColors=['#ff8fb1','#ffd166','#5eead4','#c792ea'];
  for(let i=0;i<9;i++){
    const x=4+Math.random()*92;
    const sz=18+Math.random()*22;
    const col=mushColors[i%mushColors.length];
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',sz);svg.setAttribute('height',sz*1.1);svg.setAttribute('viewBox','0 0 40 44');
    svg.innerHTML=`<rect x="16" y="22" width="8" height="20" rx="3" fill="#f7f0de" opacity="0.85"/>
    <path d="M2 22 C2 8 12 2 20 2 C28 2 38 8 38 22 C38 26 34 28 20 28 C6 28 2 26 2 22 Z" fill="${col}"/>
    <circle cx="12" cy="14" r="2.5" fill="#fff" opacity=".6"/><circle cx="24" cy="10" r="2" fill="#fff" opacity=".6"/><circle cx="29" cy="17" r="1.8" fill="#fff" opacity=".6"/>`;
    svg.className='mushroom';
    Object.assign(svg.style,{left:x+'%',bottom:(Math.random()*4)+'%',color:col,animationDelay:(Math.random()*2.6)+'s',animationDuration:(2.2+Math.random()*1.6)+'s',zIndex:'2'});
    f.appendChild(svg);
  }

  // Fluttering fairies
  for(let i=0;i<5;i++){
    const x=8+Math.random()*84;
    const y=10+Math.random()*45;
    const sz=14+Math.random()*8;
    const col=mushColors[i%mushColors.length];
    const wrap=document.createElement('div');
    wrap.className='fairy';
    Object.assign(wrap.style,{left:x+'%',top:y+'%',animationDuration:(4+Math.random()*3)+'s',animationDelay:(Math.random()*3)+'s',zIndex:'3'});
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',sz*2.2);svg.setAttribute('height',sz*1.6);svg.setAttribute('viewBox','0 0 50 36');
    svg.innerHTML=`<g class="fairy-wing" style="transform-origin:25px 14px">
      <ellipse cx="14" cy="12" rx="12" ry="9" fill="${col}" opacity="0.45"/>
      <ellipse cx="36" cy="12" rx="12" ry="9" fill="${col}" opacity="0.45"/>
    </g>
    <circle cx="25" cy="18" r="3.5" fill="#fff" opacity="0.95"/>
    <circle cx="25" cy="18" r="6" fill="${col}" opacity="0.3"/>`;
    Object.assign(svg.style,{filter:`drop-shadow(0 0 6px ${col})`});
    wrap.appendChild(svg);
    f.appendChild(wrap);
  }
})();

// ══════════════════════════ ACTIVITY ENGINE ══════════════════════════
let currentActivity=1;
let dragData=null;

const titles={
  1:'Activity 1 — The Magic Pair-Up Mushrooms',
  2:'Activity 2 — Match the Dictionary Spell Cards',
  3:'Activity 3 — Build the Enchanted Phonebook'
};
const descs={
  1:'A dictionary stores information as Key → Value pairs inside curly brackets. Drag each green Key chip and gold Value chip into the matching slots to build the dictionary correctly.',
  2:'Every dictionary spell has its own special use. Drag each operation card — get(), update(), keys(), and values() — into the scene that describes exactly what it does.',
  3:'Help build a tiny phonebook program! Drag the code pieces into the correct order to create an entry, look it up, and update it — then watch the forest celebrate.'
};

function setActivity(n){
  currentActivity=n;
  document.getElementById('act-title').textContent=titles[n];
  document.getElementById('act-desc').textContent=descs[n];
  [1,2,3].forEach(i=>{
    document.getElementById('act'+i).style.display=(i===n)?'flex':'none';
  });
  updateSteps();
}

function updateSteps(){
  [1,2,3].forEach(i=>{
    const d=document.getElementById('s'+i);
    d.className='step-dot'+(i<currentActivity?' done':i===currentActivity?' active':'');
    if(i<3){
      const l=document.getElementById('l'+i);
      l.className='step-line'+(i<currentActivity?' done':'');
    }
  });
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ══════════════════════════ ACTIVITY 1: KEY-VALUE PAIRING ══════════════════════════
const A1={};
A1.pairs=[
  {key:'name', value:'Arjun'},
  {key:'score', value:'95'},
  {key:'place', value:'Mysore'}
];
A1.state={key:[null,null,null], value:[null,null,null]};
A1.keyChips=[];
A1.valChips=[];

A1.init=function(){
  A1.state={key:[null,null,null], value:[null,null,null]};
  A1.keyChips=shuffle(A1.pairs.map(p=>p.key));
  A1.valChips=shuffle(A1.pairs.map(p=>p.value));
};

A1.render=function(){
  const a1=document.getElementById('act1');
  a1.innerHTML='';

  // Key bank
  const keyBank=document.createElement('div');
  keyBank.className='bank';
  keyBank.innerHTML='<h3>KEYS 🔑</h3>';
  A1.keyChips.forEach(k=>{
    if(A1.state.key.includes(k))return; // already placed
    const d=document.createElement('div');
    d.className='drag-chip key-chip';
    d.textContent=`"${k}"`;
    d.draggable=true;
    d.addEventListener('dragstart',e=>{dragData={type:'key',value:k};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');dragData=null;});
    keyBank.appendChild(d);
  });
  if(keyBank.children.length===1){
    const done=document.createElement('div');
    done.style.cssText='font-size:10px;color:var(--leaf);text-align:center;padding:8px';
    done.textContent='All keys placed! ✓';
    keyBank.appendChild(done);
  }
  a1.appendChild(keyBank);

  // Dict frame with slots
  const pairing=document.createElement('div');
  pairing.className='pairing-area';
  const frame=document.createElement('div');
  frame.className='dict-frame';
  const open=document.createElement('span');open.className='brace';open.textContent='student = {';
  frame.appendChild(open);
  A1.pairs.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='pair-row';

    const keySlot=document.createElement('div');
    keySlot.className='slot key-slot'+(A1.state.key[i]!==null?' filled':'');
    keySlot.textContent=A1.state.key[i]!==null?`"${A1.state.key[i]}"`:'key';
    attachSlotEvents(keySlot,'key',i);
    row.appendChild(keySlot);

    const colon=document.createElement('span');colon.className='colon';colon.textContent=':';
    row.appendChild(colon);

    const valSlot=document.createElement('div');
    valSlot.className='slot val-slot'+(A1.state.value[i]!==null?' filled':'');
    valSlot.textContent=A1.state.value[i]!==null?formatVal(A1.state.value[i]):'value';
    attachSlotEvents(valSlot,'value',i);
    row.appendChild(valSlot);

    if(i<A1.pairs.length-1){const comma=document.createElement('span');comma.className='comma';comma.textContent=',';row.appendChild(comma);}
    frame.appendChild(row);
  });
  const close=document.createElement('span');close.className='brace';close.textContent='}';
  frame.appendChild(close);

  pairing.appendChild(frame);
  a1.appendChild(pairing);

  // Value bank
  const valBank=document.createElement('div');
  valBank.className='bank';
  valBank.innerHTML='<h3>VALUES ✨</h3>';
  A1.valChips.forEach(v=>{
    if(A1.state.value.includes(v))return;
    const d=document.createElement('div');
    d.className='drag-chip';
    d.textContent=formatVal(v);
    d.draggable=true;
    d.addEventListener('dragstart',e=>{dragData={type:'value',value:v};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');dragData=null;});
    valBank.appendChild(d);
  });
  if(valBank.children.length===1){
    const done=document.createElement('div');
    done.style.cssText='font-size:10px;color:var(--leaf);text-align:center;padding:8px';
    done.textContent='All values placed! ✓';
    valBank.appendChild(done);
  }
  a1.appendChild(valBank);

  // Preview + buttons (in its own column)
  const preview=document.createElement('div');
  preview.className='mushroom-preview';
  preview.innerHTML='<h3>GROWING SPELL BOOK</h3>';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='mushroom-canvas';
  svg.setAttribute('viewBox','0 0 140 140');
  renderMushroomPreview(svg, A1.state);
  preview.appendChild(svg);

  const btnRow=document.createElement('div');btnRow.className='btn-row';
  const checkBtn=document.createElement('button');checkBtn.className='btn green';checkBtn.id='a1btn';checkBtn.textContent='Cast Spell ▶';
  const allFilled=A1.state.key.every(v=>v!==null)&&A1.state.value.every(v=>v!==null);
  checkBtn.disabled=!allFilled;
  checkBtn.addEventListener('click',A1.checkAndAdvance);
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.addEventListener('click',()=>{A1.init();A1.render();});
  btnRow.appendChild(checkBtn);btnRow.appendChild(resetBtn);
  preview.appendChild(btnRow);

  a1.appendChild(preview);
};

function formatVal(v){
  return /^\d+$/.test(v)?v:`"${v}"`;
}

function attachSlotEvents(slot,kind,idx){
  slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over');});
  slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
  slot.addEventListener('drop',e=>{
    e.preventDefault();slot.classList.remove('drag-over');
    if(dragData&&dragData.type===kind){
      // Remove this value from any other slot of the same kind first
      A1.state[kind]=A1.state[kind].map((v,j)=>j===idx?null:(v===dragData.value?null:v));
      A1.state[kind][idx]=dragData.value;
      dragData=null;
      A1.render();
    } else if(dragData){
      showToast('That piece doesn\'t belong there — match the right type!',true);
      dragData=null;
    }
  });
  slot.addEventListener('click',()=>{
    if(A1.state[kind][idx]!==null){
      A1.state[kind][idx]=null;
      A1.render();
    }
  });
}

function renderMushroomPreview(svg,state){
  svg.innerHTML='';
  const filledCount=state.key.filter(v=>v!==null).length+state.value.filter(v=>v!==null).length;
  const stages=Math.min(3,Math.floor(filledCount/2));
  const colors=['#ff8fb1','#ffd166','#5eead4'];
  // ground
  svg.innerHTML+=`<ellipse cx="70" cy="128" rx="55" ry="10" fill="#241c4a"/>`;
  // stem
  svg.innerHTML+=`<rect x="60" y="60" width="20" height="68" rx="8" fill="#f7f0de" opacity="0.9"/>`;
  for(let i=0;i<3;i++){
    const grown=i<stages || (i===stages && filledCount>=6);
    const cx=70 + (i-1)*0;
    const cy=60-i*22;
    const r=24-i*2;
    const col=grown?colors[i]:'#33304a';
    svg.innerHTML+=`<g style="${grown?`filter:drop-shadow(0 0 8px ${col})`:''}">
      <ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.7}" fill="${col}" opacity="${grown?1:0.35}"/>
      <circle cx="${cx-8}" cy="${cy-4}" r="2.5" fill="#fff" opacity="${grown?0.7:0.15}"/>
      <circle cx="${cx+6}" cy="${cy-7}" r="2" fill="#fff" opacity="${grown?0.7:0.15}"/>
    </g>`;
  }
}

A1.checkAndAdvance=function(){
  let correct=0;
  for(let i=0;i<A1.pairs.length;i++){
    if(A1.state.key[i]===A1.pairs[i].key && A1.state.value[i]===A1.pairs[i].value)correct++;
  }
  if(correct===A1.pairs.length){
    showPopup('🍄','Spell Cast Successfully!',`You built the dictionary perfectly! All ${correct} key-value pairs are glowing in the right place. The mushroom spell book is fully grown. Onward to the operation spell cards!`,'Next: Operation Cards →',()=>{setActivity(2);A2.init();A2.render();});
  } else {
    showToast(`${correct}/${A1.pairs.length} pairs correct — check that each key matches its glowing value!`,true);
  }
};

// ══════════════════════════ ACTIVITY 2: OPERATION USE-CASE MATCHING ══════════════════════════
const A2={};
A2.ops=[
  {id:'get', label:'.get()'},
  {id:'update', label:'.update()'},
  {id:'keys', label:'.keys()'},
  {id:'values', label:'.values()'}
];
A2.usecases=[
  {op:'get', desc:'A fairy wants to safely peek at "Mango"\'s price without causing a KeyError if it isn\'t there.'},
  {op:'update', desc:'Chulbul changes the "Ladoo" count after eating five of them from the sweet jar.'},
  {op:'keys', desc:'The forest guardian wants to see only the labels — every item name in the locker, without the numbers.'},
  {op:'values', desc:'The shopkeeper wants to list out only the prices, ignoring what each item is called.'}
];
A2.matched={};
A2.opChips=[];

A2.init=function(){
  A2.matched={};
  A2.opChips=shuffle(A2.ops.map(o=>o.id));
};

A2.render=function(){
  const a2=document.getElementById('act2');
  a2.innerHTML='';

  // Op bank
  const bank=document.createElement('div');
  bank.className='op-bank';
  bank.innerHTML='<h3>SPELL CARDS</h3>';
  A2.opChips.forEach(opId=>{
    if(A2.matched[opId])return;
    const op=A2.ops.find(o=>o.id===opId);
    const d=document.createElement('div');
    d.className='op-card';
    d.textContent=op.label;
    d.draggable=true;
    d.addEventListener('dragstart',e=>{dragData={type:'op',value:opId};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');dragData=null;});
    bank.appendChild(d);
  });
  if(bank.children.length===1){
    const done=document.createElement('div');
    done.style.cssText='font-size:10px;color:var(--leaf);text-align:center;padding:8px';
    done.textContent='All matched! ✓';
    bank.appendChild(done);
  }
  a2.appendChild(bank);

  // Usecase grid
  const grid=document.createElement('div');
  grid.className='usecase-grid';
  shuffleOrder(A2.usecases).forEach(uc=>{
    const card=document.createElement('div');
    card.className='usecase-card'+(A2.matched[uc.op]?' matched':'');
    const descEl=document.createElement('div');descEl.className='uc-desc';descEl.textContent=uc.desc;
    card.appendChild(descEl);
    const slot=document.createElement('div');
    slot.className='uc-slot'+(A2.matched[uc.op]?' filled':'');
    slot.textContent=A2.matched[uc.op]?A2.ops.find(o=>o.id===A2.matched[uc.op]).label:'drop spell card here';
    card.appendChild(slot);

    card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drag-over');
      if(dragData&&dragData.type==='op'){
        if(dragData.value===uc.op){
          A2.matched[uc.op]=dragData.value;
          dragData=null;
          A2.render();
          if(Object.keys(A2.matched).length===A2.ops.length){
            setTimeout(()=>showPopup('🪄','All Spells Matched!','Every dictionary spell card found its true purpose! .get() peeks safely, .update() changes a value, .keys() reveals labels, and .values() reveals contents. Time to build the enchanted phonebook!','Next: Phonebook →',()=>{setActivity(3);A3.init();A3.render();}),500);
          }
        } else {
          showToast('Hmm, that spell card doesn\'t match this scene. Try another!',true);
          dragData=null;
        }
      }
    });
    grid.appendChild(card);
  });
  a2.appendChild(grid);

  // Reset button (own column for layout consistency)
  const sideCol=document.createElement('div');
  sideCol.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:60px';
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.style.marginTop='0';
  resetBtn.addEventListener('click',()=>{A2.init();A2.render();});
  sideCol.appendChild(resetBtn);
  a2.appendChild(sideCol);
};

// stable shuffle per render call but consistent ordering source
let _a2order=null;
function shuffleOrder(arr){
  if(!_a2order||_a2order.length!==arr.length){
    _a2order=shuffle(arr.map((_,i)=>i));
  }
  return _a2order.map(i=>arr[i]);
}

// ══════════════════════════ ACTIVITY 3: PHONEBOOK WORKFLOW ══════════════════════════
const A3={};
A3.correctOrder=[
  {id:'create', label:'phonebook = {"Asha": "98765"}', desc:'Create the phonebook dictionary with one entry'},
  {id:'add', label:'phonebook["Vikram"] = "91234"', desc:'Add a new contact entry'},
  {id:'lookup', label:'print(phonebook["Asha"])', desc:'Look up a number using its name as the key'},
  {id:'update', label:'phonebook["Asha"] = "99999"', desc:'Update Asha\'s number to a new one'}
];
A3.placed=[null,null,null,null]; // card id placed at each step index
A3.cardOrder=[];

A3.init=function(){
  A3.placed=[null,null,null,null];
  A3.cardOrder=shuffle(A3.correctOrder.map(c=>c.id));
};

A3.render=function(){
  const a3=document.getElementById('act3');
  a3.innerHTML='';

  // Card bank
  const bank=document.createElement('div');
  bank.className='seq-bank';
  bank.innerHTML='<h3>CODE PIECES</h3>';
  A3.cardOrder.forEach(cid=>{
    if(A3.placed.includes(cid))return;
    const c=A3.correctOrder.find(c=>c.id===cid);
    const d=document.createElement('div');
    d.className='seq-card';
    d.textContent=c.label;
    d.draggable=true;
    d.addEventListener('dragstart',e=>{dragData={type:'seq',value:cid};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>{d.classList.remove('dragging');dragData=null;});
    bank.appendChild(d);
  });
  if(bank.children.length===1){
    const done=document.createElement('div');
    done.style.cssText='font-size:10px;color:var(--leaf);text-align:center;padding:8px';
    done.textContent='All pieces placed! ✓';
    bank.appendChild(done);
  }
  a3.appendChild(bank);

  // Workflow frame
  const wf=document.createElement('div');
  wf.className='workflow-frame';
  A3.correctOrder.forEach((step,i)=>{
    const row=document.createElement('div');
    row.className='workflow-step'+(A3.placed[i]?' matched':'');
    const num=document.createElement('div');num.className='wf-num';num.textContent=(i+1)+'.';
    row.appendChild(num);
    const slot=document.createElement('div');
    slot.className='wf-slot'+(A3.placed[i]?' filled':'');
    slot.textContent=A3.placed[i]?A3.correctOrder.find(c=>c.id===A3.placed[i]).label:step.desc;
    row.appendChild(slot);

    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();row.classList.remove('drag-over');
      if(dragData&&dragData.type==='seq'){
        if(dragData.value===step.id){
          A3.placed[i]=dragData.value;
          dragData=null;
          A3.render();
          if(A3.placed.every(p=>p!==null)){
            setTimeout(()=>showPopup('📖','Phonebook Complete!','Every line is in the right order! First create the phonebook, add a new friend, look someone up, then update a number. The forest creatures cheer as the magic phonebook glows to life!','Celebrate! 🎉',A3.celebrate),500);
          }
        } else {
          showToast('That piece fits a different step — check the order of the program!',true);
          dragData=null;
        }
      }
    });
    wf.appendChild(row);
  });
  a3.appendChild(wf);

  // Reset
  const sideCol=document.createElement('div');
  sideCol.style.cssText='display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:60px';
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.addEventListener('click',()=>{A3.init();A3.render();});
  sideCol.appendChild(resetBtn);
  a3.appendChild(sideCol);
};

A3.celebrate=function(){
  closePopup();
  setTimeout(()=>{
    showFinalPopup();
  },300);
};

// ══════════════════════════ POPUPS ══════════════════════════
function showPopup(icon,title,body,btnText,cb){
  document.getElementById('popup-icon').textContent=icon;
  document.getElementById('popup-title').textContent=title;
  document.getElementById('popup-body').textContent=body;
  const btn=document.getElementById('popup-btn');
  btn.textContent=btnText;
  btn.className='btn';
  btn.onclick=()=>{closePopup();if(cb)cb();};
  document.getElementById('popup-overlay').classList.add('show');
}
function closePopup(){document.getElementById('popup-overlay').classList.remove('show');}

function showFinalPopup(){
  spawnConfetti();
  document.getElementById('popup-icon').textContent='🌟';
  document.getElementById('popup-title').textContent='Enchanted Forest Celebration!';
  const body=document.getElementById('popup-body');
  body.innerHTML='';
  body.style.fontSize='12px';
  body.style.lineHeight='1.7';
  body.style.color='var(--parchment-dim)';
  body.innerHTML=`<strong style="color:var(--glow-gold)">You mastered Python Dictionaries!</strong><br><br>
  <b style="color:#fff">Keys</b> are the magic labels, <b style="color:#fff">Values</b> are what they unlock.<br>
  <b style="color:#fff">.get()</b>, <b style="color:#fff">.update()</b>, <b style="color:#fff">.keys()</b> and <b style="color:#fff">.values()</b> are your spell cards.<br>
  You even built a working phonebook program, step by step!<br><br>
  <em style="color:var(--glow-teal)">The fireflies dance, the mushrooms glow brighter, and the forest celebrates your dictionary magic! ✨</em>`;
  const btn=document.getElementById('popup-btn');
  btn.textContent='Play Again ↺';
  btn.className='btn green';
  btn.style.fontSize='14px';
  btn.style.padding='12px 30px';
  btn.onclick=()=>{closePopup();resetAll();};
  document.getElementById('popup-overlay').classList.add('show');
}

function resetAll(){
  A1.init();
  A2.init();
  A3.init();
  _a2order=null;
  setActivity(1);
  A1.render();
}

function showToast(msg,isError=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='show'+(isError?' error':'');
  setTimeout(()=>t.className='',2800);
}

function spawnConfetti(){
  const colors=['#ffd166','#ff8fb1','#5eead4','#7bd389','#c792ea','#f7f0de'];
  for(let i=0;i<70;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='confetti-piece';
      const sz=5+Math.random()*8;
      c.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.6+Math.random()*2}s;animation-delay:0s;width:${sz}px;height:${sz}px;box-shadow:0 0 6px currentColor`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4200);
    },i*40);
  }
}

// ══════════════════════════ INIT ══════════════════════════
A1.init();
A2.init();
A3.init();
setActivity(1);
A1.render();
</script>
