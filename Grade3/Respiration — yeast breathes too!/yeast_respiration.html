<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respiration — Yeast Breathes Too!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  :root {
    --soil-dark: #5C3A1E;
    --soil-mid: #7A4F2D;
    --soil-light: #A0694A;
    --grass: #4CAF50;
    --grass-light: #81C784;
    --sky: #E8F5E9;
    --sky2: #C8E6C9;
    --leaf: #2E7D32;
    --leaf2: #43A047;
    --flower1: #FF8F00;
    --flower2: #E91E63;
    --flower3: #9C27B0;
    --sun: #FDD835;
    --water: #29B6F6;
    --bubble: rgba(41,182,246,0.5);
    --card-bg: rgba(255,255,255,0.88);
    --accent: #FF8F00;
    --text: #2E3A1F;
    --success: #43A047;
    --error: #E53935;
    --shadow: 0 8px 32px rgba(46,61,31,0.18);
  }

  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }

  html, body {
    width:100vw; height:100vh; overflow:hidden;
    font-family:'Nunito', sans-serif;
    background: linear-gradient(180deg, #b8f0c8 0%, #e8f5e9 40%, #c8e6c9 70%, #a5d6a7 100%);
  }

  /* ===== BACKGROUND SCENE ===== */
  #scene {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    overflow:hidden;
  }

  /* Sky gradient */
  .sky-layer {
    position:absolute; top:0; left:0; right:0; height:60%;
    background: linear-gradient(180deg, #b3e5fc 0%, #c8e6c9 100%);
  }

  /* Sun */
  .sun {
    position:absolute; top:18px; right:80px;
    width:72px; height:72px;
    background: radial-gradient(circle, #fff9c4 30%, #fdd835 70%, #ffb300 100%);
    border-radius:50%;
    box-shadow: 0 0 40px 20px rgba(253,216,53,0.35);
    animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%,100%{box-shadow:0 0 40px 20px rgba(253,216,53,0.35);}
    50%{box-shadow:0 0 60px 35px rgba(253,216,53,0.55);}
  }

  /* Sun rays */
  .sun-ray {
    position:absolute; top:54px; right:116px;
    width:3px; height:30px;
    background:linear-gradient(180deg,rgba(253,216,53,0.7),transparent);
    border-radius:2px;
    transform-origin: bottom center;
    animation: rayFloat 3s ease-in-out infinite;
  }
  .sun-ray:nth-child(2){right:144px;top:40px;height:22px;transform:rotate(-35deg);animation-delay:.4s;}
  .sun-ray:nth-child(3){right:80px;top:40px;height:22px;transform:rotate(35deg);animation-delay:.8s;}
  .sun-ray:nth-child(4){right:62px;top:55px;height:22px;transform:rotate(70deg);animation-delay:1.2s;}
  .sun-ray:nth-child(5){right:100px;top:28px;height:18px;transform:rotate(0deg);animation-delay:1.6s;}
  @keyframes rayFloat{0%,100%{opacity:.6;}50%{opacity:1;}}

  /* Clouds */
  .cloud {
    position:absolute; border-radius:50px;
    background:rgba(255,255,255,0.82);
    filter: blur(2px);
    animation: cloudDrift linear infinite;
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute; background:inherit; border-radius:50%;
  }
  .cloud-1{width:90px;height:30px;top:35px;left:-110px;animation-duration:28s;}
  .cloud-1::before{width:50px;height:40px;top:-18px;left:12px;}
  .cloud-1::after{width:35px;height:30px;top:-14px;left:40px;}
  .cloud-2{width:120px;height:36px;top:70px;left:-150px;animation-duration:38s;animation-delay:-12s;}
  .cloud-2::before{width:60px;height:50px;top:-22px;left:18px;}
  .cloud-2::after{width:45px;height:38px;top:-16px;left:58px;}
  .cloud-3{width:70px;height:24px;top:20px;left:-90px;animation-duration:22s;animation-delay:-5s;}
  .cloud-3::before{width:38px;height:34px;top:-16px;left:10px;}
  .cloud-3::after{width:28px;height:26px;top:-12px;left:34px;}
  @keyframes cloudDrift{from{left:-160px;}to{left:110vw;}}

  /* Soil / ground layers */
  .ground {
    position:absolute; bottom:0; left:0; right:0;
  }
  .grass-strip {
    position:absolute; bottom:90px; left:0; right:0; height:22px;
    background: linear-gradient(180deg,#66BB6A,#388E3C);
    border-radius:12px 12px 0 0;
  }
  .soil-1 {
    position:absolute; bottom:20px; left:0; right:0; height:72px;
    background: linear-gradient(180deg, #7A4F2D, #5C3A1E);
  }
  .soil-2 {
    position:absolute; bottom:0; left:0; right:0; height:22px;
    background:#3E2310;
  }

  /* Grass blades */
  .blade {
    position:absolute; bottom:106px;
    width:4px; border-radius:4px 4px 0 0;
    background: linear-gradient(180deg,#81C784,#388E3C);
    transform-origin: bottom center;
    animation: sway 2.5s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100%{transform:rotate(-8deg);}
    50%{transform:rotate(8deg);}
  }

  /* Flowers */
  .flower {
    position:absolute; bottom:108px;
    animation: flowerSway 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes flowerSway {
    0%,100%{transform:rotate(-5deg);}
    50%{transform:rotate(5deg);}
  }
  .stem {
    width:3px; margin:0 auto;
    background:linear-gradient(180deg,#4CAF50,#2E7D32);
    border-radius:2px;
  }
  .petal-ring { position:relative; }
  .petal {
    position:absolute; width:11px; height:11px;
    border-radius:50%;
    transform-origin: bottom center;
  }
  .center { width:9px;height:9px;border-radius:50%;margin:0 auto;position:relative;z-index:2; }

  /* Roots */
  .root {
    position:absolute; bottom:20px;
    animation: rootGlow 4s ease-in-out infinite;
  }
  @keyframes rootGlow {
    0%,100%{opacity:.55;}50%{opacity:.85;}
  }

  /* Pollen dots */
  .pollen {
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(253,216,53,0.75);
    animation: pollenDrift linear infinite;
    filter:blur(0.5px);
  }
  @keyframes pollenDrift {
    0%{transform:translateY(0) translateX(0) scale(1);}
    33%{transform:translateY(-40px) translateX(18px) scale(0.8);}
    66%{transform:translateY(-70px) translateX(-10px) scale(1.1);}
    100%{transform:translateY(-120px) translateX(8px) scale(0.6);opacity:0;}
  }

  /* Floating leaves */
  .leaf-float {
    position:absolute;
    animation: leafFall linear infinite;
  }
  @keyframes leafFall {
    0%{transform:translateY(-20px) rotate(0deg);opacity:.9;}
    100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
  }

  /* ===== MAIN UI ===== */
  #app {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  /* Header */
  #header {
    position:fixed; top:0; left:0; right:0;
    padding:10px 28px 8px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,rgba(187,237,209,0.97) 80%,transparent);
    z-index:20;
  }
  #title-text {
    font-family:'Fredoka One', cursive;
    font-size:clamp(1.1rem,2.8vw,1.7rem);
    color:#1B5E20;
    letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  #progress-dots {
    display:flex; gap:10px; align-items:center;
  }
  .dot {
    width:14px; height:14px; border-radius:50%;
    background:#A5D6A7; border:2px solid #4CAF50;
    transition:all .4s;
  }
  .dot.active{background:#FF8F00;border-color:#E65100;transform:scale(1.3);}
  .dot.done{background:#43A047;border-color:#1B5E20;}

  /* Activity card */
  #activity-card {
    background:rgba(255,255,255,0.93);
    border-radius:22px;
    box-shadow: 0 12px 48px rgba(46,61,31,0.18), 0 2px 8px rgba(0,0,0,0.08);
    padding:20px 28px 18px;
    width:min(96vw, 820px);
    max-height:calc(100vh - 120px);
    overflow:hidden;
    position:relative;
    border:2.5px solid #A5D6A7;
    margin-top:64px;
    display:flex; flex-direction:column; gap:12px;
  }

  .act-title {
    font-family:'Fredoka One', cursive;
    font-size:clamp(1rem,2.5vw,1.45rem);
    color:#1B5E20;
    text-align:center;
  }
  .act-subtitle {
    font-size:clamp(.78rem,1.6vw,.95rem);
    color:#33691E;
    text-align:center;
    font-weight:600;
    margin-top:-6px;
  }

  /* Drop zones row */
  .zones-row {
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
  }
  .drop-zone {
    min-width:140px; min-height:90px;
    border:2.5px dashed #81C784;
    border-radius:16px;
    background:rgba(232,245,233,0.7);
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:10px 8px 8px;
    gap:6px;
    transition:border-color .3s, background .3s, transform .2s;
    position:relative;
    flex:1; max-width:220px;
  }
  .drop-zone.drag-over {
    border-color:#FF8F00; background:rgba(255,224,130,0.25);
    transform:scale(1.04);
  }
  .drop-zone.correct { border-color:#43A047; background:rgba(200,230,201,0.6); }
  .drop-zone.incorrect { border-color:#E53935; background:rgba(255,235,238,0.6); }

  .zone-label {
    font-size:.78rem; font-weight:800; color:#2E7D32;
    text-transform:uppercase; letter-spacing:.5px; text-align:center;
    padding-bottom:4px; border-bottom:1px dashed #A5D6A7; width:100%;
  }

  /* Drag items bank */
  .items-bank {
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    padding:8px 4px;
  }
  .drag-item {
    background:white;
    border:2px solid #A5D6A7;
    border-radius:12px;
    padding:7px 12px;
    font-size:.82rem; font-weight:700;
    color:#33691E;
    cursor:grab;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    box-shadow:0 3px 10px rgba(0,0,0,0.10);
    transition:transform .2s, box-shadow .2s, opacity .3s;
    min-width:72px; text-align:center;
  }
  .drag-item:hover { transform:scale(1.07) rotate(-1deg); box-shadow:0 6px 18px rgba(0,0,0,0.15); }
  .drag-item.dragging { opacity:.45; transform:scale(0.95); }
  .drag-item.placed { opacity:.35; pointer-events:none; }
  .drag-item .icon { font-size:1.5rem; }

  .placed-item {
    background:white;
    border:2px solid #81C784;
    border-radius:10px;
    padding:5px 8px;
    font-size:.74rem; font-weight:700;
    color:#1B5E20;
    display:flex; align-items:center; gap:4px;
    animation:popIn .3s ease;
  }
  @keyframes popIn{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* Check button */
  .check-btn {
    font-family:'Fredoka One', cursive;
    font-size:1rem;
    padding:10px 32px;
    border:none; border-radius:30px;
    background:linear-gradient(135deg,#FF8F00,#FFB300);
    color:white; cursor:pointer;
    box-shadow:0 4px 16px rgba(255,143,0,0.35);
    transition:transform .2s, box-shadow .2s;
    align-self:center;
    margin-top:4px;
    letter-spacing:.5px;
  }
  .check-btn:hover{transform:scale(1.06);box-shadow:0 6px 22px rgba(255,143,0,0.5);}
  .check-btn:disabled{opacity:.5;pointer-events:none;}

  .feedback-msg {
    text-align:center; font-weight:700; font-size:.9rem;
    min-height:22px;
    transition:all .3s;
  }
  .feedback-msg.ok{color:#2E7D32;}
  .feedback-msg.err{color:#C62828;}

  /* ===== ACTIVITY 2: YEAST EXPERIMENT ===== */
  .experiment-area {
    display:flex; gap:20px; align-items:flex-end; justify-content:center;
    flex-wrap:wrap;
  }
  .exp-setup {
    position:relative; width:160px; height:200px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  }
  .bottle-svg { position:absolute; bottom:0; }
  .balloon-svg {
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    transition:none;
  }
  .drop-targets-row {
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
  }
  .exp-drop {
    width:90px; min-height:80px;
    border:2.5px dashed #81C784; border-radius:14px;
    background:rgba(232,245,233,0.7);
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px;
    font-size:.72rem; font-weight:700; color:#33691E;
    text-align:center; padding:6px 4px;
    transition:all .3s;
  }
  .exp-drop.drag-over{border-color:#FF8F00;background:rgba(255,224,130,0.25);}
  .exp-drop.filled{border-color:#43A047;background:rgba(200,230,201,0.6);}

  /* Liquid fill animation */
  .liquid-fill {
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
    width:54px; border-radius:0 0 10px 10px;
    overflow:hidden; height:0; transition:height 1.2s ease;
  }
  .liquid-inner {
    width:100%; height:100%;
    background:linear-gradient(180deg,rgba(41,182,246,0.7),rgba(41,182,246,0.4));
    position:relative;
  }
  /* Bubble animation */
  .bubble-wrap { position:absolute;inset:0;overflow:hidden;pointer-events:none; }
  .bub {
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.6);
    animation:bubRise linear infinite;
    bottom:-10px;
  }
  @keyframes bubRise {
    0%{transform:translateY(0) scale(1);opacity:.8;}
    100%{transform:translateY(-120px) scale(.5);opacity:0;}
  }

  /* ===== ACTIVITY 3: SEQUENCE ===== */
  .sequence-area {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center;
  }
  .seq-drop {
    width:130px; min-height:80px;
    border:2.5px dashed #81C784; border-radius:14px;
    background:rgba(232,245,233,0.7);
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:4px; padding:6px;
    font-size:.72rem; font-weight:700; color:#33691E;
    text-align:center; transition:all .3s;
  }
  .seq-drop.drag-over{border-color:#FF8F00;background:rgba(255,224,130,.25);}
  .seq-drop.filled{border-color:#43A047;background:rgba(200,230,201,.6);}
  .seq-arrow { font-size:1.4rem; color:#81C784; flex-shrink:0; }

  /* Gas movement animation */
  .gas-particle {
    position:absolute; border-radius:50%;
    background:rgba(165,214,167,0.7);
    animation:gasFloat ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes gasFloat {
    0%{transform:translateY(0) scale(1);opacity:.8;}
    100%{transform:translateY(-90px) scale(.3);opacity:0;}
  }

  /* ===== POPUPS ===== */
  .popup-overlay {
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    animation:fadeIn .4s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .popup {
    background:white;
    border-radius:24px;
    padding:32px 36px;
    max-width:480px; width:90%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    animation:popIn .4s ease;
    border:3px solid #A5D6A7;
    position:relative;
  }
  .popup .big-icon { font-size:3rem; }
  .popup h2 {
    font-family:'Fredoka One', cursive;
    color:#1B5E20; font-size:1.6rem;
    margin:10px 0 6px;
  }
  .popup p { color:#33691E; font-size:.95rem; line-height:1.55; margin-bottom:14px; }
  .popup-btn {
    font-family:'Fredoka One', cursive;
    font-size:1.1rem;
    padding:11px 36px;
    border:none; border-radius:30px;
    background:linear-gradient(135deg,#43A047,#66BB6A);
    color:white; cursor:pointer;
    box-shadow:0 4px 16px rgba(67,160,71,0.4);
    transition:transform .2s;
  }
  .popup-btn:hover{transform:scale(1.07);}
  .confetti-burst { font-size:1.5rem; letter-spacing:8px; }

  /* Final popup special */
  .final-popup h2 { font-size:2rem; color:#E65100; }
  .final-popup .big-icon { font-size:4rem; }

  /* ===== HINT TEXT ===== */
  .hint {
    font-size:.78rem; color:#558B2F;
    text-align:center; font-style:italic;
    margin-top:-4px;
  }
</style>
</head>
<body>

<!-- ===== BACKGROUND SCENE ===== -->
<div id="scene">
  <div class="sky-layer"></div>
  <div class="sun"></div>
  <div class="sun-ray"></div>
  <div class="sun-ray"></div>
  <div class="sun-ray"></div>
  <div class="sun-ray"></div>
  <div class="sun-ray"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="ground">
    <div class="grass-strip"></div>
    <div class="soil-1"></div>
    <div class="soil-2"></div>
  </div>
  <!-- Dynamic elements generated by JS -->
  <div id="blades-container"></div>
  <div id="flowers-container"></div>
  <div id="roots-container"></div>
  <div id="pollen-container"></div>
  <div id="leaves-container"></div>
</div>

<!-- ===== HEADER ===== -->
<div id="header">
  <div id="title-text">🌱 Respiration — Yeast Breathes Too!</div>
  <div id="progress-dots">
    <div class="dot active" id="dot-1"></div>
    <div class="dot" id="dot-2"></div>
    <div class="dot" id="dot-3"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div id="activity-card">
    <!-- Content injected by JS -->
  </div>
</div>

<!-- Popup container -->
<div id="popup-container"></div>

<script>
/* ============================================================
   BACKGROUND SCENE GENERATION
   ============================================================ */
const bladesC = document.getElementById('blades-container');
const flowersC = document.getElementById('flowers-container');
const rootsC = document.getElementById('roots-container');
const pollenC = document.getElementById('pollen-container');
const leavesC = document.getElementById('leaves-container');

// Grass blades
for(let i=0;i<28;i++){
  const b=document.createElement('div');
  b.className='blade';
  const h=18+Math.random()*22;
  b.style.cssText=`height:${h}px;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*2}s;opacity:${0.7+Math.random()*0.3}`;
  bladesC.appendChild(b);
}

// Flowers
const flowerColors=[['#FF8F00','#FFF9C4'],['#E91E63','#FCE4EC'],['#9C27B0','#F3E5F5'],['#0288D1','#E1F5FE'],['#FF7043','#FBE9E7']];
const flowerPositions=[8,18,28,38,52,64,74,82,92];
flowerPositions.forEach(pos=>{
  const [pCol,cCol]=flowerColors[Math.floor(Math.random()*flowerColors.length)];
  const h=22+Math.random()*28;
  const f=document.createElement('div');
  f.className='flower';
  f.style.cssText=`left:${pos+Math.random()*5}%;animation-delay:${Math.random()*3}s;animation-duration:${2.5+Math.random()*2}s`;
  f.innerHTML=`
    <div class="petal-ring" style="width:22px;height:22px;position:relative;margin:0 auto;">
      ${[0,45,90,135,180,225,270,315].map(a=>`<div class="petal" style="background:${pCol};top:50%;left:50%;transform:translate(-50%,-50%) rotate(${a}deg) translateY(-9px);"></div>`).join('')}
      <div class="center" style="background:${cCol};width:10px;height:10px;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    </div>
    <div class="stem" style="height:${h}px;"></div>
  `;
  f.style.bottom='108px';
  flowersC.appendChild(f);
});

// Roots (SVG paths in soil)
const rootSVGs=[
  `<svg width="80" height="55" viewBox="0 0 80 55"><path d="M40,0 Q20,20 10,40 Q5,50 15,55" stroke="#A0694A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M40,10 Q55,25 65,35 Q72,43 68,55" stroke="#7A4F2D" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M40,5 Q35,30 30,50" stroke="#8D6040" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`,
  `<svg width="70" height="50" viewBox="0 0 70 50"><path d="M35,0 Q15,18 8,38 Q3,48 12,50" stroke="#A0694A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M35,8 Q50,22 58,38 Q63,46 55,50" stroke="#7A4F2D" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  `<svg width="60" height="45" viewBox="0 0 60 45"><path d="M30,0 Q10,15 5,35 Q2,44 12,45" stroke="#A0694A" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M30,6 Q48,20 54,36 Q57,43 50,45" stroke="#7A4F2D" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`
];
[10,32,58,80].forEach((pos,i)=>{
  const r=document.createElement('div');
  r.className='root';
  r.style.cssText=`left:${pos}%;bottom:20px;animation-delay:${i*1.1}s;opacity:.6`;
  r.innerHTML=rootSVGs[i%rootSVGs.length];
  rootsC.appendChild(r);
});

// Pollen

/* ---- SHARED DRAG HELPERS ---- */
function makeDraggable(el, data){
  el.setAttribute('draggable','true');
  el.addEventListener('dragstart',e=>{
    dragSrc=data;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
}

function makeDropZone(el, accepts, onDrop){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
  el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault(); el.classList.remove('drag-over');
    if(dragSrc) onDrop(dragSrc, el);
  });
}

function buildAct1(){
  card.innerHTML=`
    <div class="act-title">🌬️ Activity 1: Who Breathes?</div>

      </div>
      <div class="drop-zone" id="zone-material">
        <div class="zone-label">🧪 Yeast Needs These</div>
        <div id="placed-material" style="display:flex;flex-wrap:wrap;gap:5px;"></div>
      </div>
    </div>
    <div class="items-bank" id="bank1"></div>
    <div class="feedback-msg" id="fb1"></div>
    <button class="check-btn" id="check1">Check My Answers 🌿</button>
  `;

  const bank = document.getElementById('bank1');
  const placed = {living:[], material:[]};

  act1Items.forEach(item=>{
    const el=document.createElement('div');
    el.className='drag-item';
    el.id='item-'+item.id;
    el.innerHTML=`<span class="icon">${item.icon}</span><span>${item.label}</span>`;
    makeDraggable(el, item);
    bank.appendChild(el);
  });

  ['living','material'].forEach(cat=>{
    const zone=document.getElementById('zone-'+cat);
    const placedDiv=document.getElementById('placed-'+cat);
    makeDropZone(zone, cat, (data)=>{
      if(data.cat===cat||data.cat==='none'){
        // mark as placed
        const srcEl=document.getElementById('item-'+data.id);
        if(srcEl && !srcEl.classList.contains('placed')){
          srcEl.classList.add('placed');
          placed[cat].push(data.id);
          const pi=document.createElement('div');
          pi.className='placed-item';
          pi.innerHTML=`${data.icon} ${data.label}`;
          pi.dataset.id=data.id;
          pi.dataset.cat=cat;
          placedDiv.appendChild(pi);
        }
      }
    });
  });

  document.getElementById('check1').addEventListener('click',()=>{
    let allCorrect=true;
    // Check placed-living
    const placedLiving=document.getElementById('placed-living').querySelectorAll('.placed-item');
    const placedMaterial=document.getElementById('placed-material').querySelectorAll('.placed-item');
    placedLiving.forEach(pi=>{
      const item=act1Items.find(i=>i.id===pi.dataset.id);
      if(item.cat!=='living') allCorrect=false;
    });
    placedMaterial.forEach(pi=>{
      const item=act1Items.find(i=>i.id===pi.dataset.id);
      if(item.cat!=='material') allCorrect=false;
    });
    // Check all living and material items are placed
    const livingIds=act1Items.filter(i=>i.cat==='living').map(i=>i.id);
    const matIds=act1Items.filter(i=>i.cat==='material').map(i=>i.id);
    const placedLivingIds=[...placedLiving].map(p=>p.dataset.id);
    const placedMatIds=[...placedMaterial].map(p=>p.dataset.id);
    const missingLiving=livingIds.filter(id=>!placedLivingIds.includes(id));
    const missingMat=matIds.filter(id=>!placedMatIds.includes(id));
    if(missingLiving.length||missingMat.length) allCorrect=false;
    // Check no 'none' items placed
    const noneItems=act1Items.filter(i=>i.cat==='none').map(i=>i.id);
    [...placedLiving,...placedMaterial].forEach(pi=>{
      if(noneItems.includes(pi.dataset.id)) allCorrect=false;
    });

    const fb=document.getElementById('fb1');
    if(allCorrect){
      fb.textContent='🎉 Brilliant! All correct!'; fb.className='feedback-msg ok';
      document.getElementById('check1').disabled=true;
      setTimeout(()=>showPopup1(),900);
    } else {
      fb.textContent='🌱 Not quite! Make sure all living things and yeast needs are sorted correctly.';
      fb.className='feedback-msg err';
    }
  });
}

    onNext:()=>{ currentActivity=2; updateDots(); buildAct2(); }

}
