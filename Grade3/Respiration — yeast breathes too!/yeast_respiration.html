<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respiration — Yeast Breathes Too!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --soil-dark: #3d2b1f;
    --soil-mid: #6b4226;
    --soil-light: #8b5e3c;
    --grass: #4caf50;
    --grass-dark: #2e7d32;
    --leaf: #66bb6a;
    --leaf-light: #a5d6a7;
    --sky: #e8f5e9;
    --sky2: #c8e6c9;
    --sun: #fff176;
    --petal: #f48fb1;
    --petal2: #ffcc80;
    --petal3: #b39ddb;
    --water: #81d4fa;
    --bubble: rgba(129,212,250,0.6);
    --accent: #ff7043;
    --card: rgba(255,255,255,0.92);
    --drop-bg: rgba(200,230,201,0.5);
    --drop-border: #66bb6a;
    --success: #43a047;
    --wrong: #e53935;
    --shadow: 0 4px 24px rgba(60,80,40,0.13);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }
  #app {
    width: 100vw; height: 100vh;
    background: linear-gradient(180deg, #b2dfdb 0%, #c8e6c9 30%, #a5d6a7 60%, #6b4226 80%, #3d2b1f 100%);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }

  /* ===== GARDEN BACKGROUND ===== */
  .bg-layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

  /* Sun rays */
  .sun {
    position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
    width: 160px; height: 160px;
    background: radial-gradient(circle, #fffde7 30%, #fff176 60%, transparent 80%);
    border-radius: 50%;
    animation: sunPulse 4s ease-in-out infinite;
  }
  .sun-ray {
    position: absolute; top: -30px; left: 50%;
    width: 4px; height: 80px;
    background: linear-gradient(to bottom, rgba(255,241,118,0.7), transparent);
    transform-origin: bottom center;
    border-radius: 4px;
  }
  @keyframes sunPulse { 0%,100%{opacity:.7;transform:translateX(-50%) scale(1)} 50%{opacity:1;transform:translateX(-50%) scale(1.08)} }

  /* Soil layers */
  .soil-layer {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 22%; background: linear-gradient(180deg, #8b5e3c 0%, #6b4226 40%, #3d2b1f 100%);
    border-radius: 60% 60% 0 0 / 20px;
  }
  .soil-layer::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: repeating-linear-gradient(90deg, #4caf50 0px, #4caf50 12px, #66bb6a 12px, #66bb6a 20px, #4caf50 20px, #4caf50 32px);
    border-radius: 8px 8px 0 0;
  }

  /* Roots */
  .root { position: absolute; bottom: 18%; pointer-events: none; }
  .root svg { width: 70px; height: 90px; }
  @keyframes rootGrow { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
  @keyframes rootWave { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(1.04)} }

  /* Flowers */
  .flower {
    position: absolute; bottom: 18%;
    animation: sway 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .flower:nth-child(2n) { animation-duration: 3.7s; animation-delay: 0.4s; }
  .flower:nth-child(3n) { animation-duration: 4.2s; animation-delay: 1s; }
  @keyframes sway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }

  /* Floating leaves */
  .leaf-float {
    position: absolute;
    width: 18px; height: 28px;
    background: radial-gradient(ellipse at 30% 40%, #a5d6a7, #388e3c);
    border-radius: 50% 10% 50% 10%;
    opacity: 0.7;
    animation: leafDrift linear infinite;
  }
  @keyframes leafDrift {
    0%   { transform: translate(0,0) rotate(0deg); opacity:.7; }
    25%  { transform: translate(30px,-40px) rotate(45deg); opacity:.6; }
    50%  { transform: translate(10px,-80px) rotate(90deg); opacity:.5; }
    75%  { transform: translate(-20px,-120px) rotate(135deg); opacity:.3; }
    100% { transform: translate(0,-170px) rotate(180deg); opacity:0; }
  }

  /* Pollen dots */
  .pollen {
    position: absolute;
    width: 6px; height: 6px;
    background: #fff176; border-radius: 50%; opacity: 0;
    animation: pollenFloat linear infinite;
  }
  @keyframes pollenFloat {
    0%   { opacity:0; transform: translate(0,0) scale(.5); }
    20%  { opacity:.9; }
    80%  { opacity:.5; }
    100% { opacity:0; transform: translate(var(--px,40px), var(--py,-120px)) scale(1.2); }
  }

  /* Bubbles (liquid) */
  .bubble-bg {
    position: absolute;
    border-radius: 50%;
    background: rgba(129,212,250,0.35);
    animation: bubbleRise linear infinite;
  }
  @keyframes bubbleRise {
    0%   { opacity:0; transform: translateY(0) scale(.6); }
    30%  { opacity:.8; }
    100% { opacity:0; transform: translateY(-180px) scale(1.2); }
  }

  /* Watering cans decoration */
  .wc-deco { position: absolute; bottom: 20%; opacity: .55; }

  /* ===== MAIN CARD ===== */
  #main-card {
    position: relative; z-index: 10;
    width: min(820px, 96vw);
    max-height: 88vh;
    background: rgba(255,255,255,0.93);
    border-radius: 28px;
    box-shadow: 0 8px 48px rgba(40,80,30,0.18), 0 0 0 3px #a5d6a7;
    display: flex; flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }

  /* Header */
  #card-header {
    background: linear-gradient(135deg, #2e7d32 0%, #43a047 50%, #66bb6a 100%);
    padding: 14px 24px 10px;
    display: flex; align-items: center; gap: 12px;
    position: relative; overflow: hidden;
  }
  #card-header::after {
    content: '';
    position: absolute; bottom: -10px; left: 0; right: 0; height: 20px;
    background: rgba(255,255,255,0.93);
    border-radius: 50% 50% 0 0 / 100%;
  }
  .header-icon { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
  #card-header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(15px, 2.5vw, 22px);
    color: #fff;
    letter-spacing: .5px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.2);
    line-height: 1.2;
  }
  .progress-dots {
    margin-left: auto; display: flex; gap: 8px; align-items: center; z-index:1;
  }
  .pdot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.7);
    transition: all .3s;
  }
  .pdot.active { background: #fff176; border-color: #fff; transform: scale(1.2); }
  .pdot.done   { background: #fff; }

  /* Body */
  #card-body {
    flex: 1; padding: 18px 22px 14px;
    display: flex; flex-direction: column; gap: 12px;
    overflow: hidden;
  }
  .activity-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(14px, 2vw, 18px);
    color: #2e7d32;
    display: flex; align-items: center; gap: 8px;
  }
  .activity-badge {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: #fff; border-radius: 20px;
    padding: 2px 12px; font-size: 12px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
  }
  .instruction {
    font-size: clamp(11px, 1.4vw, 13px);
    color: #4a5568; line-height: 1.5;
    background: #f0fdf4; border-left: 3px solid #66bb6a;
    padding: 8px 12px; border-radius: 0 10px 10px 0;
  }

  /* ===== DRAG ITEMS ===== */
  .drag-bank {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 10px; background: #f9fbe7;
    border-radius: 14px; border: 2px dashed #aed581;
    min-height: 52px;
  }
  .drag-item {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: 20px;
    font-weight: 700; font-size: clamp(10px, 1.3vw, 12px);
    cursor: grab; user-select: none;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    transition: transform .15s, box-shadow .15s;
    border: 2px solid transparent;
  }
  .drag-item:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
  .drag-item.dragging { opacity: .5; transform: scale(0.95); }
  .drag-item.placed { opacity: .35; pointer-events: none; }

  /* ===== DROP ZONES ===== */
  .drop-zones { display: flex; gap: 12px; }
  .drop-zone {
    flex: 1; min-height: 80px;
    border: 2.5px dashed #66bb6a; border-radius: 16px;
    background: rgba(232,245,233,0.6);
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .2s, background .2s;
  }
  .drop-zone.over { border-color: #43a047; background: rgba(200,230,201,0.8); }
  .drop-zone-title {
    font-size: 11px; font-weight: 800; color: #388e3c;
    text-align: center; text-transform: uppercase; letter-spacing: .5px;
  }
  .drop-zone-items { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }

  .placed-chip {
    display: flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 16px;
    font-size: 11px; font-weight: 700;
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  .placed-chip.correct { background: #e8f5e9; border: 2px solid #43a047; color: #2e7d32; }
  .placed-chip.wrong   { background: #ffebee; border: 2px solid #e53935; color: #c62828; animation: shake .4s; }
  @keyframes popIn { 0%{transform:scale(0)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* ===== FEEDBACK BAR ===== */
  #feedback-bar {
    padding: 7px 14px; border-radius: 12px;
    font-weight: 700; font-size: 12px; text-align: center;
    transition: all .3s;
    min-height: 34px; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #feedback-bar.idle { background: transparent; color: transparent; }
  #feedback-bar.ok   { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #a5d6a7; }
  #feedback-bar.err  { background: #ffebee; color: #c62828; border: 1.5px solid #ef9a9a; }

  /* ===== NEXT BTN / BUTTON ROW ===== */
  .btn-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  #next-btn {
    padding: 9px 24px; border-radius: 20px;
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: #fff; border: none; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px;
    box-shadow: 0 4px 12px rgba(67,160,71,0.4);
    transition: transform .15s, box-shadow .15s;
    display: none;
    margin-left: auto;
  }
  #next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(67,160,71,0.5); }
  #reset-btn {
    padding: 9px 20px; border-radius: 20px;
    background: #fff; color: #43a047; border: 2px solid #43a047; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px;
    transition: transform .15s, box-shadow .15s;
  }
  #reset-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(67,160,71,0.25); }
  .zone-shake { animation: shake .4s; }

  /* ===== ACTIVITY 2 EXPERIMENT ===== */
  #act2-layout { display: flex; gap: 14px; align-items: stretch; }
  #act2-bench {
    flex: 1; background: linear-gradient(180deg, #fff8e1 0%, #fff3e0 100%);
    border-radius: 16px; border: 2px solid #ffe082;
    padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-height: 160px;
  }
  #act2-bench-title { font-size: 11px; font-weight: 800; color: #e65100; text-transform: uppercase; letter-spacing: .5px; }
  #bottle-container {
    position: relative; width: 70px; height: 130px;
    display: flex; flex-direction: column; align-items: center;
  }
  #balloon-el {
    width: 40px; height: 20px;
    background: radial-gradient(ellipse at 40% 35%, #ce93d8, #9c27b0);
    border-radius: 50%; margin-bottom: -2px; z-index: 2;
    transition: all 1.2s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.2);
  }
  #balloon-el::after {
    content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 10px;
    background: #7b1fa2; border-radius: 0 0 4px 4px;
  }
  #bottle-el {
    width: 56px; height: 100px;
    background: linear-gradient(180deg, rgba(129,212,250,0.3) 0%, rgba(129,212,250,0.6) 100%);
    border-radius: 6px 6px 10px 10px;
    border: 2.5px solid #81d4fa;
    position: relative; overflow: hidden;
  }
  #bottle-el::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 15px;
    background: rgba(255,255,255,0.3); border-bottom: 1.5px solid rgba(129,212,250,0.4);
  }
  .bottle-bubble {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.7);
    animation: bottleBubbleRise 2s ease-in infinite;
  }
  @keyframes bottleBubbleRise {
    0%   { opacity:0; transform: translateY(0) scale(.5); }
    40%  { opacity:.9; }
    100% { opacity:0; transform: translateY(-80px) scale(1.1); }
  }
  #act2-slots {
    flex: 0 0 200px; display: flex; flex-direction: column; gap: 6px;
  }
  .exp-slot {
    min-height: 40px; border: 2px dashed #66bb6a; border-radius: 12px;
    background: rgba(232,245,233,0.5); padding: 4px 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #888; font-style: italic;
    transition: border-color .2s, background .2s;
  }
  .exp-slot.filled { border-style: solid; border-color: #43a047; background: rgba(200,230,201,0.7); color: #2e7d32; font-style: normal; font-weight: 700; }
  .exp-slot.over { border-color: #1b5e20; background: rgba(165,214,167,0.6); }

  /* Gas particles */
  .gas-particle {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: rgba(206,147,216,0.7);
    animation: gasRise 1.5s ease-in forwards;
    pointer-events: none;
  }
  @keyframes gasRise {
    0%   { opacity:1; transform: translateY(0) scale(1); }
    100% { opacity:0; transform: translateY(-60px) scale(.4); }
  }

  /* ===== ACTIVITY 3 SEQUENCE ===== */
  #act3-layout { display: flex; flex-direction: column; gap: 8px; }
  .seq-row { display: flex; align-items: center; gap: 6px; }
  .seq-slot {
    min-width: 130px; min-height: 46px;
    border: 2.5px dashed #66bb6a; border-radius: 14px;
    background: rgba(240,253,244,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #aaa; font-style: italic;
    transition: all .2s; padding: 4px 8px; text-align: center;
  }
  .seq-slot.filled { border-style: solid; border-color: #43a047; color: #1b5e20; font-style: normal; font-weight: 800; background: rgba(200,230,201,0.7); }
  .seq-slot.over { border-color: #1b5e20; background: rgba(165,214,167,0.7); }
  .seq-arrow { font-size: 18px; color: #66bb6a; flex-shrink: 0; }
  #act3-visual {
    height: 48px; border-radius: 14px;
    background: linear-gradient(90deg, #e8f5e9, #c8e6c9, #a5d6a7);
    border: 2px solid #a5d6a7;
    position: relative; overflow: hidden; display: flex; align-items: center;
    padding: 0 12px;
  }
  .flow-particle {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: rgba(67,160,71,0.6);
    animation: flowMove 3s linear infinite;
  }
  @keyframes flowMove {
    0%   { left: -10px; opacity:0; }
    10%  { opacity:.8; }
    90%  { opacity:.8; }
    100% { left: 105%; opacity:0; }
  }

  /* ===== POPUPS ===== */
  .popup-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(30,60,20,0.55); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn .3s;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .popup-box {
    background: linear-gradient(160deg, #f1f8e9, #fff);
    border-radius: 24px; padding: 28px 32px;
    max-width: 420px; width: 90%;
    box-shadow: 0 16px 64px rgba(40,80,30,0.3), 0 0 0 3px #a5d6a7;
    text-align: center;
    animation: popupIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popupIn { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
  .popup-icon { font-size: 52px; margin-bottom: 10px; }
  .popup-title {
    font-family: 'Fredoka One', cursive;
    font-size: 22px; color: #2e7d32; margin-bottom: 8px;
  }
  .popup-body { font-size: 14px; color: #4a5568; line-height: 1.6; margin-bottom: 18px; }
  .popup-fact {
    background: #e8f5e9; border-radius: 12px; padding: 10px 14px;
    font-size: 12px; color: #2e7d32; font-weight: 700; margin-bottom: 16px;
    border-left: 4px solid #43a047;
    text-align: left;
  }
  .popup-btn {
    padding: 10px 28px; border-radius: 20px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: #fff; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px;
    box-shadow: 0 4px 14px rgba(67,160,71,0.4);
    transition: transform .15s;
  }
  .popup-btn:hover { transform: scale(1.05); }
  .confetti-piece {
    position: fixed; top: -10px; pointer-events: none; z-index: 200;
    width: 10px; height: 10px; border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-10px) rotate(0deg); opacity:1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
  }

  /* ===== ITEM COLORS ===== */
  .c-green  { background: #e8f5e9; border-color: #66bb6a !important; color: #2e7d32; }
  .c-blue   { background: #e3f2fd; border-color: #64b5f6 !important; color: #1565c0; }
  .c-yellow { background: #fffde7; border-color: #ffd54f !important; color: #e65100; }
  .c-pink   { background: #fce4ec; border-color: #f48fb1 !important; color: #880e4f; }
  .c-purple { background: #f3e5f5; border-color: #ce93d8 !important; color: #6a1b9a; }
  .c-orange { background: #fff3e0; border-color: #ffcc80 !important; color: #bf360c; }
  .c-teal   { background: #e0f7fa; border-color: #80deea !important; color: #00695c; }
  .c-brown  { background: #efebe9; border-color: #bcaaa4 !important; color: #4e342e; }

</style>
</head>
<body>
<div id="app">

  <!-- ===== BACKGROUND ===== -->
  <div class="bg-layer" id="bg-layer">
    <!-- Sun -->
    <div class="sun" id="sun"></div>
    <!-- Soil -->
    <div class="soil-layer"></div>
    <!-- Flowers rendered by JS -->
  </div>

  <!-- ===== MAIN CARD ===== -->
  <div id="main-card">
    <div id="card-header">
      <span class="header-icon">🌱</span>
      <h1>RESPIRATION — YEAST BREATHES TOO!</h1>
      <div class="progress-dots">
        <div class="pdot active" id="pd1"></div>
        <div class="pdot" id="pd2"></div>
        <div class="pdot" id="pd3"></div>
      </div>
    </div>
    <div id="card-body">
      <!-- Activities injected here -->
    </div>
  </div>

  <!-- Popups rendered by JS -->
</div>

<script>
// =====================================================
// BACKGROUND ANIMATIONS
// =====================================================
const bgLayer = document.getElementById('bg-layer');
const sun = document.getElementById('sun');

// Sun rays
for(let i=0;i<12;i++){
  const r = document.createElement('div');
  r.className='sun-ray';
  r.style.cssText=`left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(${i*30}deg);top:-${30+i*2}px;opacity:${0.4+Math.random()*0.3}`;
  r.style.animation=`sunPulse ${3+Math.random()*2}s ease-in-out infinite`;
  r.style.animationDelay=`${Math.random()}s`;
  sun.appendChild(r);
}

// Flowers
const flowerData = [
  {x:'8%', color:'#f48fb1', petals:6, stemH:60},
  {x:'16%', color:'#ffcc80', petals:5, stemH:45},
  {x:'25%', color:'#b39ddb', petals:8, stemH:70},
  {x:'75%', color:'#ef9a9a', petals:6, stemH:55},
  {x:'85%', color:'#80deea', petals:5, stemH:65},
  {x:'93%', color:'#f48fb1', petals:7, stemH:48},
];
flowerData.forEach(f=>{
  const div = document.createElement('div');
  div.className = 'flower';
  div.style.left = f.x;
  const svg = `<svg width="42" height="${f.stemH+36}" viewBox="0 0 42 ${f.stemH+36}" xmlns="http://www.w3.org/2000/svg">
    <line x1="21" y1="${f.stemH+32}" x2="21" y2="20" stroke="#4caf50" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="12" cy="${f.stemH/2+10}" rx="10" ry="6" fill="#66bb6a" transform="rotate(-20,12,${f.stemH/2+10})"/>
    ${Array.from({length:f.petals},(_,i)=>{

// =====================================================
let touchDragEl=null, touchClone=null;
function setupTouch(){
  document.addEventListener('touchstart', e=>{
    const el=e.target.closest('.drag-item');
    if(!el||el.classList.contains('placed')) return;
    touchDragEl=el;
    dragItem=el.dataset.id;
    touchClone=el.cloneNode(true);
    touchClone.style.cssText=`position:fixed;opacity:.8;pointer-events:none;z-index:9999;transform:scale(1.05);font-size:12px;padding:6px 12px;border-radius:20px;background:${getComputedStyle(el).background}`;
    document.body.appendChild(touchClone);
  },{passive:true});
  document.addEventListener('touchmove', e=>{
    if(!touchClone) return;
    e.preventDefault();
    const t=e.touches[0];
    touchClone.style.left=(t.clientX-40)+'px';
    touchClone.style.top=(t.clientY-20)+'px';
  },{passive:false});
  document.addEventListener('touchend', e=>{
    if(!touchClone||!touchDragEl) return;
    const t=e.changedTouches[0];
    touchClone.remove(); touchClone=null;
    const el=document.elementFromPoint(t.clientX, t.clientY);
    if(!el) { touchDragEl=null; dragItem=null; return; }
    const zone=el.closest('.drop-zone,.exp-slot,.seq-slot');
    if(zone){
      const fakeEvent={preventDefault:()=>{}, stopPropagation:()=>{}};
      zone.dispatchEvent(Object.assign(new Event('drop'), fakeEvent));
    }
    touchDragEl=null; dragItem=null;
  });
}
setupTouch();

// =====================================================
// INIT
// =====================================================
render();
</script>
</body>
</html>
