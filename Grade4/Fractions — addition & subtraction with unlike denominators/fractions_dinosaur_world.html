<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRACTIONS — ADDITION & SUBTRACTION WITH UNLIKE DENOMINATORS</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --soil:#1b1208;
  --soil2:#241608;
  --clay:#3a2615;
  --clay2:#4d3019;
  --amber:#d4a017;
  --amber-bright:#f4c430;
  --lava:#e8542e;
  --lava-bright:#ff7a45;
  --fern:#6b8f3f;
  --fern-bright:#8fc153;
  --teal:#2a9d8f;
  --teal-bright:#3dd6c4;
  --bone:#f4ead4;
  --bone-dim:#cdbf9e;
  --err:#e8542e;
  --ok:#3dd6c4;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;color:var(--bone)}

/* ══════════ PREHISTORIC BACKGROUND ══════════ */
#world{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 50% 35% at 18% 8%, rgba(232,84,46,.18) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 85% 90%, rgba(107,143,63,.14) 0%, transparent 70%),
    linear-gradient(180deg,#0e0a05 0%, #1b1208 22%, #241608 48%, #2e1a0a 72%, #1b1208 100%);
}

/* distant sky stars / meteor sparkle layer */
.spark{position:absolute;border-radius:50%;background:var(--amber-bright);box-shadow:0 0 6px 2px rgba(244,196,48,.7);animation:spark-twinkle 2.6s infinite alternate}
@keyframes spark-twinkle{0%{opacity:.1;transform:scale(.8)}100%{opacity:.95;transform:scale(1.4)}}

.meteor{position:absolute;width:46px;height:2px;background:linear-gradient(90deg,rgba(244,196,48,0),var(--amber-bright));border-radius:2px;filter:drop-shadow(0 0 4px var(--amber-bright));animation:meteor-streak linear infinite}
@keyframes meteor-streak{
  0%{transform:translate(0,0) rotate(38deg);opacity:0}
  6%{opacity:1}
  35%{opacity:.85}
  45%{transform:translate(-340px,260px) rotate(38deg);opacity:0}
  100%{transform:translate(-340px,260px) rotate(38deg);opacity:0}
}

/* volcano silhouette + smoke + lava */
#volcano{position:absolute;bottom:0;right:-2%;width:46%;max-width:640px;height:62%;pointer-events:none}
.smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(180,170,160,.32) 0%,rgba(180,170,160,0) 75%);animation:smoke-rise linear infinite}
@keyframes smoke-rise{
  0%{transform:translate(0,0) scale(.6);opacity:0}
  15%{opacity:.55}
  60%{opacity:.4}
  100%{transform:translate(28px,-180px) scale(1.7);opacity:0}
}
.lava-glow{position:absolute;border-radius:50%;filter:blur(2px);animation:lava-pulse 2.2s ease-in-out infinite alternate}
@keyframes lava-pulse{0%{opacity:.55;filter:blur(2px) brightness(1)}100%{opacity:1;filter:blur(3px) brightness(1.4)}}
.lava-drip{position:absolute;background:linear-gradient(180deg,var(--lava-bright),var(--lava));border-radius:0 0 6px 6px;filter:drop-shadow(0 0 6px var(--lava-bright));animation:lava-flow 3.5s ease-in-out infinite alternate}
@keyframes lava-flow{0%{height:18px;opacity:.7}100%{height:34px;opacity:1}}

/* swaying ferns / prehistoric plants */
.fern-plant{position:absolute;bottom:0;transform-origin:bottom center;animation:fern-sway ease-in-out infinite alternate}
@keyframes fern-sway{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}

/* walking dino silhouette */
.dino-walk{position:absolute;bottom:6%;opacity:.5;animation:dino-march linear infinite}
@keyframes dino-march{0%{transform:translateX(-10vw) scaleX(1)}48%{transform:translateX(58vw) scaleX(1)}50%{transform:translateX(58vw) scaleX(-1)}98%{transform:translateX(-10vw) scaleX(-1)}100%{transform:translateX(-10vw) scaleX(1)}}
.dino-walk .leg{animation:leg-step .55s ease-in-out infinite alternate}
@keyframes leg-step{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}

/* floating fossil particles */
.fossil-bit{position:absolute;opacity:0;animation:fossil-drift linear infinite}
@keyframes fossil-drift{
  0%{transform:translate(0,0) rotate(0deg);opacity:0}
  12%{opacity:.6}
  88%{opacity:.45}
  100%{transform:translate(50px,-220px) rotate(140deg);opacity:0}
}

/* ground / fern silhouette strip */
#ground-strip{position:absolute;bottom:0;left:0;width:100%;height:14px;background:linear-gradient(180deg,rgba(58,38,21,0),var(--soil));z-index:1}

/* ══════════ APP SHELL ══════════ */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:8px 14px}

#titlebar{background:rgba(27,18,8,.8);backdrop-filter:blur(8px);border:1.5px solid rgba(212,160,23,.4);border-radius:16px;padding:9px 26px;text-align:center;pointer-events:auto;margin-bottom:8px;box-shadow:0 0 28px rgba(232,84,46,.1)}
#titlebar h1{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:var(--amber-bright);letter-spacing:1.2px;text-shadow:0 0 14px rgba(244,196,48,.45)}
#titlebar p{font-size:11px;color:var(--teal-bright);margin-top:2px;font-weight:600}

#panel{background:rgba(20,13,6,.85);backdrop-filter:blur(10px);border:1.5px solid rgba(212,160,23,.32);border-radius:22px;width:960px;max-width:97vw;padding:16px 24px;pointer-events:auto;position:relative;box-shadow:0 0 44px rgba(232,84,46,.08), inset 0 0 60px rgba(107,143,63,.04);max-height:92vh;display:flex;flex-direction:column}

/* progress: volcano-rise tracker */
#progress-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:10px}
.peg{width:30px;height:30px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;border:2px solid rgba(212,160,23,.4);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:700;color:rgba(212,160,23,.55);transition:all .4s;background:rgba(212,160,23,.05)}
.peg.active{border-color:var(--amber-bright);color:var(--soil);background:var(--amber-bright);box-shadow:0 0 14px rgba(244,196,48,.65)}
.peg.done{border-color:var(--fern-bright);color:var(--soil);background:var(--fern-bright);box-shadow:0 0 10px rgba(143,193,83,.5)}
.peg-line{flex:1;height:4px;background:rgba(212,160,23,.16);align-self:center;max-width:90px;border-radius:3px;transition:background .4s;position:relative;overflow:hidden}
.peg-line.done{background:var(--fern-bright)}
.peg-line::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--lava-bright),var(--amber-bright));width:0;transition:width .5s}
.peg-line.done::after{width:100%}

#act-title{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:700;color:var(--amber-bright);margin-bottom:3px;text-align:center;text-shadow:0 0 10px rgba(212,160,23,.3)}
#act-desc{font-size:11.5px;color:var(--bone-dim);text-align:center;margin-bottom:12px;line-height:1.45;max-width:720px;margin-inline:auto}

#activity-host{flex:1;display:flex;align-items:stretch;justify-content:center;min-height:0;overflow-y:auto;padding-right:2px}
#activity-host::-webkit-scrollbar{width:6px}
#activity-host::-webkit-scrollbar-thumb{background:rgba(212,160,23,.4);border-radius:3px}

/* shared chip + slot styling */
.drag-chip{padding:8px 13px;border-radius:12px;border:1.5px solid rgba(212,160,23,.45);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:grab;color:var(--amber-bright);transition:transform .15s, background .15s, border-color .15s;user-select:none;background:rgba(212,160,23,.07);min-width:64px;text-align:center;gap:2px}
.drag-chip:hover{border-color:var(--amber-bright);background:rgba(212,160,23,.2);transform:scale(1.06)}
.drag-chip.dragging{opacity:.3}
.drag-chip.fern-chip{border-color:rgba(107,143,63,.5);color:var(--fern-bright);background:rgba(107,143,63,.08)}
.drag-chip.fern-chip:hover{border-color:var(--fern-bright);background:rgba(107,143,63,.2)}
.drag-chip.teal-chip{border-color:rgba(42,157,143,.5);color:var(--teal-bright);background:rgba(42,157,143,.08)}
.drag-chip.teal-chip:hover{border-color:var(--teal-bright);background:rgba(42,157,143,.2)}

.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-size:12px}
.frac .num{padding-bottom:1px;border-bottom:1.4px solid currentColor}
.frac .den{padding-top:1px}

.slot{min-width:62px;height:34px;border:1.5px dashed rgba(244,234,212,.3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .25s;color:#9a8f78}
.slot.filled{border-style:solid;color:var(--bone)}
.slot.drag-over{border-color:#fff;background:rgba(255,255,255,.12);transform:scale(1.07)}
.slot.flash-ok{animation:flash-ok .55s ease}
.slot.flash-bad{animation:flash-bad .4s ease}
@keyframes flash-ok{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes flash-bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.btn-row{display:flex;gap:8px;margin-top:10px;justify-content:center}
.btn{font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:700;border-radius:11px;padding:9px 18px;cursor:pointer;border:1.5px solid transparent;transition:all .2s}
.btn.green{background:var(--fern-bright);color:#10240a;box-shadow:0 0 14px rgba(143,193,83,.35)}
.btn.green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 18px rgba(143,193,83,.45)}
.btn.green:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:rgba(244,234,212,.06);color:var(--bone-dim);border-color:rgba(244,234,212,.25)}
.btn.ghost:hover{background:rgba(244,234,212,.14);color:var(--bone)}

/* ══════════ POPUP ══════════ */
#popup-overlay{position:fixed;inset:0;background:rgba(10,6,2,.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
#popup-overlay.show{opacity:1;pointer-events:auto}
#popup-card{background:linear-gradient(160deg,#241608,#1b1208);border:2px solid var(--amber);border-radius:22px;padding:30px 34px;max-width:440px;text-align:center;box-shadow:0 0 50px rgba(232,84,46,.25);transform:scale(.85);transition:transform .3s}
#popup-overlay.show #popup-card{transform:scale(1)}
#popup-icon{font-size:46px;margin-bottom:10px;filter:drop-shadow(0 0 12px rgba(244,196,48,.5))}
#popup-title{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:800;color:var(--amber-bright);margin-bottom:10px}
#popup-body{font-size:13px;color:var(--bone-dim);line-height:1.6;margin-bottom:18px}
#popup-btn{font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:700;background:var(--lava-bright);color:#2a0d04;border:none;border-radius:13px;padding:11px 26px;cursor:pointer;box-shadow:0 0 18px rgba(255,122,69,.4);transition:all .2s}
#popup-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 22px rgba(255,122,69,.5)}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(27,18,8,.95);border:1.5px solid var(--ok);color:var(--bone);padding:10px 20px;border-radius:12px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--err)}

/* confetti */
.confetti-piece{position:fixed;top:-10px;border-radius:2px;animation:confetti-fall linear forwards;z-index:300}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(108vh) rotate(540deg);opacity:0}}

@media (max-width:760px){
  #panel{padding:12px 14px;max-height:94vh}
  #titlebar{padding:7px 16px;margin-bottom:6px}
  #titlebar h1{font-size:13px;letter-spacing:.6px}
  #titlebar p{font-size:9.5px}
  #act-title{font-size:13px}
  #act-desc{font-size:10.5px;margin-bottom:8px}
  .peg{width:24px;height:24px;font-size:11px}
  #volcano{width:34%}
}
</style>
</head>
<body>

<div id="world">
  <div id="bg-decor"></div>
  <div id="ground-strip"></div>
</div>

<div id="app">
  <div id="titlebar">
    <h1>🦕 FRACTIONS — ADDITION &amp; SUBTRACTION WITH UNLIKE DENOMINATORS 🌋</h1>
    <p>Match, build, and conquer the Prehistoric Fraction Valley!</p>
  </div>

  <div id="panel">
    <div id="progress-row">
      <div class="peg" id="p0">1</div>
      <div class="peg-line" id="l0"></div>
      <div class="peg" id="p1">2</div>
      <div class="peg-line" id="l1"></div>
      <div class="peg" id="p2">3</div>
    </div>
    <div id="act-title"></div>
    <div id="act-desc"></div>
    <div id="activity-host"></div>
  </div>
</div>

<div id="popup-overlay">
  <div id="popup-card">
    <div id="popup-icon">🦴</div>
    <div id="popup-title"></div>
    <div id="popup-body"></div>
    <button id="popup-btn"></button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════ BACKGROUND SCENE ══════════════════════════
const bgDecor = document.getElementById('bg-decor');

function rand(min,max){return Math.random()*(max-min)+min;}

// Stars / sparkles
for(let i=0;i<26;i++){
  const s=document.createElement('div');
  s.className='spark';
  const sz=rand(1.5,3.2);
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${rand(0,100)}%;top:${rand(0,55)}%;animation-delay:${rand(0,2.4)}s;animation-duration:${rand(1.8,3.2)}s`;
  bgDecor.appendChild(s);
}

// Meteors
for(let i=0;i<4;i++){
  const m=document.createElement('div');
  m.className='meteor';
  m.style.cssText=`left:${rand(40,95)}%;top:${rand(0,28)}%;animation-delay:${rand(0,9)}s;animation-duration:${rand(4.5,8)}s`;
  bgDecor.appendChild(m);
}

// Volcano
const volcano=document.createElement('div');
volcano.id='volcano';
volcano.innerHTML=`
<svg viewBox="0 0 300 320" style="position:absolute;bottom:0;width:100%;height:100%">
  <path d="M40 320 L120 70 L150 30 L180 70 L260 320 Z" fill="#2e1c0e" opacity="0.92"/>
  <path d="M70 320 L130 130 L150 100 L170 130 L230 320 Z" fill="#3a2615" opacity="0.85"/>
  <ellipse cx="150" cy="32" rx="22" ry="9" fill="#e8542e" opacity="0.9"/>
</svg>`;
for(let i=0;i<5;i++){
  const sm=document.createElement('div');
  sm.className='smoke';
  const sz=rand(30,60);
  sm.style.cssText=`width:${sz}px;height:${sz}px;left:${44+rand(-4,4)}%;bottom:${72+rand(-2,2)}%;animation-delay:${rand(0,5)}s;animation-duration:${rand(5,8)}s`;
  volcano.appendChild(sm);
}
for(let i=0;i<3;i++){
  const lg=document.createElement('div');
  lg.className='lava-glow';
  const sz=rand(14,22);
  lg.style.cssText=`width:${sz}px;height:${sz}px;left:${46+i*3}%;bottom:${68+rand(-1,1)}%;background:radial-gradient(circle,#ff7a45,#e8542e);animation-delay:${rand(0,2)}s`;
  volcano.appendChild(lg);
}
for(let i=0;i<2;i++){
  const ld=document.createElement('div');
  ld.className='lava-drip';
  ld.style.cssText=`width:5px;left:${48+i*5}%;bottom:${42+i*8}%;animation-delay:${rand(0,2)}s`;
  volcano.appendChild(ld);
}
bgDecor.appendChild(volcano);

// Ferns / prehistoric plants scattered along bottom
const fernSvg=(color)=>`<svg viewBox="0 0 40 70" width="100%" height="100%"><path d="M20 70 Q20 40 8 18 M20 70 Q20 40 32 18 M20 70 Q20 35 20 5" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M8 18 Q2 14 0 8 M8 18 Q14 14 16 9" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M32 18 Q38 14 40 8 M32 18 Q26 14 24 9" stroke="${color}" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const fernPositions=[2,12,33,67,90,97];
fernPositions.forEach((pos,i)=>{
  const f=document.createElement('div');
  f.className='fern-plant';
  const h=rand(46,78);
  const colors=['#6b8f3f','#577a32','#8fc153'];
  f.style.cssText=`left:${pos}%;width:${h*0.55}px;height:${h}px;animation-duration:${rand(3.4,5)}s;animation-delay:${rand(0,2)}s;opacity:.8;z-index:1`;
  f.innerHTML=fernSvg(colors[i%colors.length]);
  bgDecor.appendChild(f);
});

// Walking dinosaur silhouette (simple long-neck + t-rex shapes)
function makeDino(svgInner,bottom,scale,duration,delay,opacity){
  const d=document.createElement('div');
  d.className='dino-walk';
  d.style.cssText=`bottom:${bottom}%;width:${90*scale}px;height:${60*scale}px;animation-duration:${duration}s;animation-delay:${delay}s;opacity:${opacity};z-index:1`;
  d.innerHTML=svgInner;
  return d;
}
const trexSvg=`<svg viewBox="0 0 90 60" width="100%" height="100%">
  <path d="M10 50 Q5 30 20 22 Q18 10 30 8 Q40 6 44 14 Q60 12 68 24 Q72 30 66 36 L70 50 L62 50 L60 40 Q50 44 38 42 L36 50 L28 50 L30 40 Q16 38 10 50 Z" fill="#3a2615"/>
  <circle cx="62" cy="18" r="2" fill="#f4ead4"/>
  <g class="leg"><path d="M30 42 L26 56 L34 56 Z" fill="#3a2615"/></g>
  <g class="leg" style="animation-delay:.27s"><path d="M50 42 L46 56 L54 56 Z" fill="#3a2615"/></g>
</svg>`;
const longneckSvg=`<svg viewBox="0 0 90 60" width="100%" height="100%">
  <path d="M14 50 Q10 34 22 30 Q26 14 38 6 Q44 2 46 8 Q40 12 38 18 Q48 16 56 26 Q66 30 70 40 Q72 46 64 48 L66 50 L58 50 L56 44 Q44 46 30 44 L28 50 L20 50 L22 42 Q12 40 14 50 Z" fill="#577a32" opacity="0.55"/>
  <g class="leg"><path d="M30 44 L27 56 L34 56 Z" fill="#577a32" opacity="0.55"/></g>
  <g class="leg" style="animation-delay:.3s"><path d="M52 44 L49 56 L56 56 Z" fill="#577a32" opacity="0.55"/></g>
</svg>`;
bgDecor.appendChild(makeDino(trexSvg,4,1.5,26,0,0.5));
bgDecor.appendChild(makeDino(longneckSvg,7,1.1,34,4,0.4));

// Floating fossil particles
const fossilEmojis=['🦴','🐚','🦖','🌿'];
for(let i=0;i<10;i++){
  const fb=document.createElement('div');
  fb.className='fossil-bit';
  fb.textContent=fossilEmojis[i%fossilEmojis.length];
  fb.style.cssText=`left:${rand(0,100)}%;bottom:${rand(0,30)}%;font-size:${rand(11,18)}px;animation-duration:${rand(9,16)}s;animation-delay:${rand(0,10)}s`;
  bgDecor.appendChild(fb);
}

// ══════════════════════════ UTILITIES ══════════════════════════
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let dragData=null;

function showToast(msg,isError=false){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='show'+(isError?' error':'');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.className='',2600);
}

function showPopup(icon,title,body,btnText,cb){
  document.getElementById('popup-icon').textContent=icon;
  document.getElementById('popup-title').textContent=title;
  const bodyEl=document.getElementById('popup-body');
  bodyEl.style.cssText='';
  bodyEl.textContent=body;
  const btn=document.getElementById('popup-btn');
  btn.style.cssText='';
  btn.textContent=btnText;
  btn.onclick=()=>{closePopup();if(cb)cb();};
  document.getElementById('popup-overlay').classList.add('show');
}
function closePopup(){document.getElementById('popup-overlay').classList.remove('show');}

function spawnConfetti(){
  const colors=['#f4c430','#ff7a45','#3dd6c4','#8fc153','#e8542e','#f4ead4'];
  for(let i=0;i<70;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='confetti-piece';
      const sz=5+Math.random()*8;
      c.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.6+Math.random()*2}s;width:${sz}px;height:${sz}px;box-shadow:0 0 6px currentColor`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4200);
    },i*38);
  }
}

let currentActivity=1;
function setActivity(n){
  currentActivity=n;
  for(let i=0;i<3;i++){
    const peg=document.getElementById('p'+i);
    peg.className='peg'+(i<n-1?' done':i===n-1?' active':'');
    if(i<2){
      document.getElementById('l'+i).className='peg-line'+(i<n-1?' done':'');
    }
  }
}

// ══════════════════════════ ACTIVITY 1: COMMON DENOMINATOR MATCH ══════════════════════════
const A1={};
A1.pairData=[
  {id:'p1', fracA:[2,3], fracB:[3,4], correctDenom:12},
  {id:'p2', fracA:[1,2], fracB:[1,3], correctDenom:6},
  {id:'p3', fracA:[3,5], fracB:[1,2], correctDenom:10},
  {id:'p4', fracA:[1,4], fracB:[2,3], correctDenom:12}
];

function miniPizza(numerator,denominator,color){
  // draws a circular pizza divided into `denominator` wedges, `numerator` wedges highlighted
  const r=26,cx=30,cy=30;
  let paths='';
  for(let i=0;i<denominator;i++){
    const a0=(i/denominator)*2*Math.PI - Math.PI/2;
    const a1=((i+1)/denominator)*2*Math.PI - Math.PI/2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const fill=i<numerator?color:'rgba(244,234,212,.12)';
    paths+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0,1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="rgba(27,18,8,.6)" stroke-width="1"/>`;
  }
  return `<svg viewBox="0 0 60 60" width="46" height="46">${paths}</svg>`;
}

function makeA2Slot(q,role){
  const slot=document.createElement('div');
  slot.className='slot'+(A2.state[q.id][role]!==null?' filled':'');
  const filledKey=A2.state[q.id][role];
  if(filledKey){
    const [n,d]=filledKey.split('/').map(Number);
    slot.innerHTML=fracHTML(n,d);
  } else {
    slot.textContent='?';
  }
  slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over');});
  slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
  slot.addEventListener('drop',e=>{
    e.preventDefault();slot.classList.remove('drag-over');
    if(!dragData){return;}
    const expectedType=role==='answer'?'answer':'equiv';
    if(dragData.type!==expectedType){
      showToast('That piece belongs in a different spot — check equivalent fractions vs. final answers!',true);
      dragData=null;
      return;
    }
    const droppedKey=dragData.value;
    dragData=null;
    const correctKey=role==='answer'?q.answer.join('/'):(role==='equivA'?q.equivA.join('/'):q.equivB.join('/'));
    if(droppedKey===correctKey){
      A2.state[q.id][role]=droppedKey;
      A2.render();
      showToast('Yum — that piece fits perfectly!',false);
      A2.checkComplete();
    } else {
      slot.classList.add('flash-bad');
      setTimeout(()=>slot.classList.remove('flash-bad'),400);
      showToast('Not quite the right piece for this spot — try again!',true);
    }
  });
  slot.addEventListener('click',()=>{
    if(A2.state[q.id][role]!==null){
      A2.state[q.id][role]=null;
      A2.render();
    }
  });
  return slot;
}

  host.appendChild(wrap);

  const btnRow=document.createElement('div');btnRow.className='btn-row';
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.addEventListener('click',()=>{A3.init();A3.render();});
  btnRow.appendChild(resetBtn);
  host.appendChild(btnRow);
};

A3.checkComplete=function(){
  const allDone=A3.problems.every(p=>
    p.steps.every((step,i)=>A3.placed[p.id][i]===step.id)
  );
  if(allDone){
    setTimeout(()=>{
      setActivity(3);
      document.getElementById('p2').classList.add('done');
      showFinalPopup();
    },650);
  }
};

function showFinalPopup(){
  spawnConfetti();
  document.getElementById('popup-icon').textContent='🦕';
  document.getElementById('popup-title').textContent='Valley Champion!';
  const body=document.getElementById('popup-body');
  body.style.fontSize='12.5px';
  body.style.lineHeight='1.7';
  body.style.color='var(--bone-dim)';
  body.innerHTML=`<strong style="color:var(--amber-bright)">You mastered fractions with unlike denominators!</strong><br><br>
  You matched common denominators, built equivalent fractions, solved real sharing problems, and arranged the full strategy from start to finish.<br><br>
  <em style="color:var(--teal-bright)">The volcano glows bright, the dinosaurs roar with pride, and the fossil valley celebrates your fraction mastery!</em>`;
  const btn=document.getElementById('popup-btn');
  btn.textContent='Play Again ↺';
  btn.className='';
  btn.style.cssText='font-family:\'Baloo 2\',sans-serif;font-size:15px;font-weight:700;background:var(--fern-bright);color:#10240a;border:none;border-radius:14px;padding:13px 32px;cursor:pointer;box-shadow:0 0 20px rgba(143,193,83,.45);transition:all .2s';
  btn.onclick=()=>{closePopup();resetAll();};
  document.getElementById('popup-overlay').classList.add('show');
}

function resetAll(){
  A1.init();A2.init();A3.init();
  setActivity(1);
  document.getElementById('act-title').textContent='Activity 1 — The Slice-Matching Dino Dig';
  document.getElementById('act-desc').textContent='A fraction tells you how many equal slices make a whole. To compare or combine two fractions, their slices must be the SAME size. Drag each fraction pair to the common denominator that turns both into matching slices.';
  A1.render();
}
