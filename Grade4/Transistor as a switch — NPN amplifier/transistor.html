<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRANSISTOR AS A SWITCH — NPN AMPLIFIER</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060b14;
  --deep:#0a0f1e;
  --panel-bg:rgba(8,14,30,0.88);
  --blue:#00d4ff;
  --green:#39ff14;
  --violet:#9b5cf6;
  --magenta:#ff0090;
  --matrix:#00ff41;
  --amber:#ffc107;
  --ink:#e0f0ff;
  --ink-dim:#7090b0;
  --ok:#39ff14;
  --err:#ff0090;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Quicksand',sans-serif;color:var(--ink);background:var(--void)}

/* ── VR BACKGROUND ── */
#vr-bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 25% 30%,rgba(0,212,255,.07) 0%,transparent 45%),radial-gradient(ellipse at 75% 70%,rgba(155,92,246,.08) 0%,transparent 45%),linear-gradient(180deg,#060b14 0%,#0a0f1e 100%)}

/* Matrix rain */
#matrix-canvas{position:fixed;inset:0;z-index:1;opacity:.18}

/* Floating particles */
.vr-particle{position:absolute;border-radius:50%;animation:particle-drift linear infinite}
@keyframes particle-drift{
  0%{transform:translate(0,0) scale(1);opacity:0}
  10%{opacity:1}90%{opacity:.6}
  100%{transform:translate(var(--dx),var(--dy)) scale(1.6);opacity:0}
}

/* Portal rings */
.portal{position:absolute;border-radius:50%;border:2px solid;animation:portal-spin linear infinite}
@keyframes portal-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.portal-inner{position:absolute;border-radius:50%;border:1px solid;animation:portal-spin linear infinite reverse}

/* Circuit grid lines */
.grid-line{position:absolute;background:linear-gradient(90deg,transparent,rgba(0,212,255,.08),transparent);animation:grid-pulse 4s ease-in-out infinite alternate}
@keyframes grid-pulse{0%{opacity:.2}100%{opacity:.7}}

/* Energy wave */
.energy-wave{position:absolute;border-radius:50%;border:1.5px solid var(--blue);animation:wave-expand ease-out infinite;opacity:0}
@keyframes wave-expand{0%{transform:scale(.2);opacity:.8}100%{transform:scale(3);opacity:0}}

/* Data stream lines */
.data-stream{position:absolute;width:1.5px;animation:stream-fall linear infinite}
@keyframes stream-fall{0%{transform:translateY(-120px);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(100vh);opacity:0}}

/* ── MAIN APP ── */
#app{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding:8px}

#titlebar{background:rgba(0,20,40,.82);backdrop-filter:blur(10px);border:1.5px solid rgba(0,212,255,.4);border-radius:16px;padding:9px 28px;text-align:center;pointer-events:auto;margin-bottom:8px;box-shadow:0 0 30px rgba(0,212,255,.15),inset 0 0 30px rgba(0,212,255,.04)}
#titlebar h1{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:var(--blue);letter-spacing:2.5px;text-shadow:0 0 14px rgba(0,212,255,.7)}
#titlebar p{font-size:11px;color:var(--ink-dim);margin-top:2px;font-weight:500;letter-spacing:.5px}

#panel{background:var(--panel-bg);backdrop-filter:blur(12px);border:1.5px solid rgba(0,212,255,.2);border-radius:22px;width:940px;max-width:97vw;padding:18px 24px;pointer-events:auto;position:relative;box-shadow:0 0 50px rgba(0,212,255,.08),inset 0 0 60px rgba(155,92,246,.04)}

/* Step indicator */
#steps{display:flex;gap:10px;justify-content:center;margin-bottom:12px;align-items:center}
.step-dot{width:32px;height:32px;border-radius:8px;border:1.5px solid rgba(0,212,255,.25);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:13px;font-weight:700;color:rgba(0,212,255,.4);transition:all .4s;background:rgba(0,212,255,.03)}
.step-dot.active{border-color:var(--blue);color:var(--void);background:var(--blue);box-shadow:0 0 16px rgba(0,212,255,.7)}
.step-dot.done{border-color:var(--green);color:var(--void);background:var(--green);box-shadow:0 0 12px rgba(57,255,20,.6)}
.step-line{flex:1;height:1.5px;background:rgba(0,212,255,.15);align-self:center;max-width:70px;border-radius:2px;transition:background .4s}
.step-line.done{background:var(--green);box-shadow:0 0 6px rgba(57,255,20,.5)}

#act-title{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;color:var(--blue);margin-bottom:3px;text-align:center;text-shadow:0 0 10px rgba(0,212,255,.4);letter-spacing:.5px}
#act-desc{font-size:11.5px;color:var(--ink-dim);text-align:center;margin-bottom:12px;line-height:1.5;max-width:700px;margin-inline:auto}

/* ── SHARED CHIP STYLES ── */
.drag-chip{padding:8px 13px;border-radius:10px;border:1.5px solid rgba(0,212,255,.45);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:grab;color:var(--blue);transition:all .2s;user-select:none;background:rgba(0,212,255,.06);text-align:center;line-height:1.35}
.drag-chip:hover{border-color:var(--blue);background:rgba(0,212,255,.16);transform:scale(1.05);box-shadow:0 0 12px rgba(0,212,255,.35)}
.drag-chip.dragging{opacity:.3}
.drag-chip.violet{border-color:rgba(155,92,246,.5);color:var(--violet);background:rgba(155,92,246,.07)}
.drag-chip.violet:hover{border-color:var(--violet);background:rgba(155,92,246,.18);box-shadow:0 0 12px rgba(155,92,246,.4)}
.drag-chip.green{border-color:rgba(57,255,20,.45);color:var(--green);background:rgba(57,255,20,.06)}
.drag-chip.green:hover{border-color:var(--green);background:rgba(57,255,20,.16);box-shadow:0 0 12px rgba(57,255,20,.35)}

.bank{display:flex;flex-direction:column;gap:7px;align-items:stretch;min-width:165px}
.bank h3{font-family:'Fredoka',sans-serif;font-size:10.5px;color:var(--ink-dim);margin-bottom:2px;text-align:center;letter-spacing:1.5px}

/* Slots */
.slot{min-height:34px;border:1.5px dashed rgba(0,212,255,.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;color:rgba(0,212,255,.3);transition:all .25s;text-align:center;padding:0 6px;cursor:default}
.slot.filled{border-style:solid;border-color:var(--green);background:rgba(57,255,20,.08);color:var(--green);font-weight:700;text-shadow:0 0 8px rgba(57,255,20,.5)}
.slot.drag-over{border-color:var(--blue);background:rgba(0,212,255,.1);transform:scale(1.04)}

/* Buttons */
.btn{padding:9px 22px;border-radius:9px;border:1.5px solid var(--blue);background:rgba(0,212,255,.1);color:var(--blue);font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.5px;display:block;margin:8px auto 0}
.btn:hover{background:rgba(0,212,255,.22);transform:scale(1.04);box-shadow:0 0 14px rgba(0,212,255,.35)}
.btn:active{transform:scale(.97)}
.btn.green{border-color:var(--green);background:rgba(57,255,20,.12);color:var(--green)}
.btn.green:hover{background:rgba(57,255,20,.24);box-shadow:0 0 14px rgba(57,255,20,.4)}
.btn.ghost{border-color:rgba(0,212,255,.2);background:transparent;color:var(--ink-dim);font-size:11px;padding:6px 14px}
.btn.ghost:hover{border-color:var(--blue);color:var(--ink);background:rgba(0,212,255,.07)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:9px}
.btn-row .btn{margin:0}

/* ── ACTIVITY 1: CIRCUIT BUILDER ── */
#act1{display:flex;gap:18px;align-items:flex-start;justify-content:center}

.circuit-board{flex:1;max-width:500px;background:rgba(0,10,25,.6);border:1.5px solid rgba(0,212,255,.2);border-radius:16px;padding:14px 16px;position:relative}
.circuit-board h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--blue);text-align:center;letter-spacing:1.5px;margin-bottom:10px;text-shadow:0 0 8px rgba(0,212,255,.5)}
.circuit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.circuit-slot{display:flex;flex-direction:column;align-items:center;gap:5px}
.circuit-slot .slot-label{font-family:'Fredoka',sans-serif;font-size:9.5px;color:var(--ink-dim);letter-spacing:.5px;text-align:center}
.circuit-slot .slot{min-width:110px;min-height:38px;width:100%}

/* NPN symbol SVG in the center */
.npn-center{grid-column:2;display:flex;flex-direction:column;align-items:center;gap:4px}

/* Circuit path lines that light up */
.circuit-path{position:absolute;pointer-events:none}

/* ── ACTIVITY 2: PROCESS SEQUENCE ── */
#act2{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.process-bank{display:flex;flex-direction:column;gap:8px;min-width:200px}
.process-bank h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--ink-dim);text-align:center;letter-spacing:1.5px;margin-bottom:2px}
.process-card{padding:10px 12px;border-radius:10px;border:1.5px solid rgba(155,92,246,.45);color:var(--violet);font-family:'Quicksand',sans-serif;font-size:11.5px;font-weight:700;cursor:grab;text-align:center;transition:all .2s;user-select:none;background:rgba(155,92,246,.07);line-height:1.4}
.process-card:hover{border-color:var(--violet);background:rgba(155,92,246,.18);transform:scale(1.04);box-shadow:0 0 12px rgba(155,92,246,.4)}
.process-card.dragging{opacity:.3}

.sequence-frame{flex:1;max-width:480px;display:flex;flex-direction:column;gap:8px}
.seq-step{display:flex;align-items:center;gap:10px;border:1.5px dashed rgba(0,212,255,.2);border-radius:12px;padding:8px 12px;min-height:48px;transition:all .25s;background:rgba(0,10,25,.45)}
.seq-step .step-num{font-family:'Fredoka',sans-serif;font-size:13px;font-weight:700;color:var(--amber);min-width:22px}
.seq-step .step-slot{flex:1;min-height:32px;border:1.5px dashed rgba(155,92,246,.35);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Quicksand',monospace;font-size:11px;color:rgba(155,92,246,.4);transition:all .25s;text-align:center;padding:0 6px;font-weight:600}
.seq-step .step-slot.filled{border-style:solid;border-color:var(--green);background:rgba(57,255,20,.08);color:var(--green);font-weight:700;font-size:10.5px}
.seq-step.drag-over .step-slot{border-color:var(--blue);background:rgba(0,212,255,.08)}
.seq-step.matched{border-color:var(--green);border-style:solid;box-shadow:0 0 10px rgba(57,255,20,.2)}

/* motor preview SVG */
.motor-preview{width:150px;display:flex;flex-direction:column;align-items:center;gap:8px}
.motor-preview h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--ink-dim);letter-spacing:1.5px}
#motor-svg{width:140px;height:140px}

/* ── ACTIVITY 3: WORKFLOW ── */
#act3{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.workflow-bank{display:flex;flex-direction:column;gap:7px;min-width:220px}
.workflow-bank h3{font-family:'Fredoka',sans-serif;font-size:11px;color:var(--ink-dim);text-align:center;letter-spacing:1.5px;margin-bottom:2px}
.workflow-card{padding:9px 12px;border-radius:10px;border:1.5px solid rgba(57,255,20,.4);color:var(--green);font-family:'Space Mono',monospace;font-size:10.5px;font-weight:600;cursor:grab;text-align:left;transition:all .2s;user-select:none;background:rgba(57,255,20,.06);line-height:1.45}
.workflow-card:hover{border-color:var(--green);background:rgba(57,255,20,.15);transform:translateX(3px);box-shadow:0 0 10px rgba(57,255,20,.3)}
.workflow-card.dragging{opacity:.3}

.workflow-steps{flex:1;max-width:500px;display:flex;flex-direction:column;gap:8px}
.wf-step{display:flex;align-items:center;gap:10px;border:1.5px dashed rgba(57,255,20,.2);border-radius:12px;padding:8px 12px;min-height:46px;transition:all .25s;background:rgba(0,10,25,.45)}
.wf-step .wf-num{font-family:'Fredoka',sans-serif;font-size:13px;font-weight:700;color:var(--blue);min-width:22px}
.wf-step .wf-slot{flex:1;min-height:32px;border:1.5px dashed rgba(57,255,20,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10.5px;color:rgba(57,255,20,.4);transition:all .25s;text-align:center;padding:0 6px}
.wf-step .wf-slot.filled{border-style:solid;border-color:var(--green);background:rgba(57,255,20,.1);color:var(--green);font-weight:700}
.wf-step.drag-over .wf-slot{border-color:var(--blue);background:rgba(0,212,255,.08)}
.wf-step.matched{border-color:var(--green);border-style:solid;box-shadow:0 0 10px rgba(57,255,20,.2)}

/* ── POPUP ── */
#popup-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,5,15,.78);display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#popup-overlay.show{display:flex}
#popup{background:linear-gradient(160deg,#050d1f 0%,#0a1428 100%);border:2px solid var(--blue);border-radius:20px;padding:28px 36px;max-width:440px;text-align:center;animation:pop-in .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 60px rgba(0,212,255,.3),inset 0 0 40px rgba(0,212,255,.04)}
@keyframes pop-in{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#popup h2{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;color:var(--blue);margin-bottom:8px;text-shadow:0 0 14px rgba(0,212,255,.6)}
#popup p{font-size:12.5px;color:var(--ink-dim);line-height:1.65;margin-bottom:16px}
.popup-icon{font-size:40px;margin-bottom:8px;display:block}

.confetti-piece{position:fixed;border-radius:2px;animation:confetti-fall linear forwards;z-index:200}
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.92);color:#040d1e;padding:8px 20px;border-radius:20px;font-size:12px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;font-family:'Quicksand',sans-serif;box-shadow:0 0 20px rgba(0,212,255,.5)}
#toast.show{opacity:1}
#toast.error{background:rgba(255,0,144,.92);color:#fff;box-shadow:0 0 20px rgba(255,0,144,.5)}

@media(max-width:760px){
  #panel{padding:12px 12px}
  #act1,#act3{flex-direction:column;align-items:center}
  .circuit-grid{grid-template-columns:1fr 1fr}
  .motor-preview{width:120px}
}
</style>
</head>
<body>
<div id="vr-bg"></div>
<canvas id="matrix-canvas"></canvas>

<div id="app">
  <div id="titlebar">
    <h1>⚡ TRANSISTOR AS A SWITCH — NPN AMPLIFIER ⚡</h1>
    <p>Explore how a tiny Base signal unlocks a massive Collector current — the magic of electronic switching!</p>
  </div>
  <div id="panel">
    <div id="steps">
      <div class="step-dot active" id="s1">1</div>
      <div class="step-line" id="l1"></div>
      <div class="step-dot" id="s2">2</div>
      <div class="step-line" id="l2"></div>
      <div class="step-dot" id="s3">3</div>
    </div>
    <div id="act-title"></div>
    <div id="act-desc"></div>
    <div id="act1"></div>
    <div id="act2" style="display:none"></div>
    <div id="act3" style="display:none"></div>
  </div>
</div>

<div id="popup-overlay">
  <div id="popup">
    <span class="popup-icon" id="popup-icon"></span>
    <h2 id="popup-title"></h2>
    <p id="popup-body"></p>
    <button class="btn" id="popup-btn"></button>
  </div>
</div>
<div id="toast"></div>

<script>
// ══════════════════════ MATRIX RAIN ══════════════════════
(function initMatrix(){
  const canvas=document.getElementById('matrix-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,cols,drops;
  const chars='01NPN BCETRANSISTORCOLLECTORBASEEMITTER10101'.split('');
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    cols=Math.floor(W/18);
    drops=Array(cols).fill(1);
  }
  resize();window.addEventListener('resize',resize);
  setInterval(()=>{
    ctx.fillStyle='rgba(6,11,20,.18)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00ff4122';
    ctx.font='13px Space Mono,monospace';
    drops.forEach((y,i)=>{
      const ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle=`rgba(0,255,65,${Math.random()*0.28+0.06})`;
      ctx.fillText(ch,i*18,y*18);
      if(y*18>H&&Math.random()>.96)drops[i]=0;
      drops[i]++;
    });
  },80);
})();

// ══════════════════════ VR BACKGROUND DECORATIONS ══════════════════════
(function buildVR(){
  const bg=document.getElementById('vr-bg');

  // Floating particles
  const pCols=['#00d4ff','#9b5cf6','#39ff14','#ff0090','#ffc107'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');p.className='vr-particle';
    const sz=Math.random()*4+2;
    const dx=(Math.random()-0.5)*200,dy=-(80+Math.random()*200);
    p.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${pCols[i%pCols.length]};box-shadow:0 0 6px currentColor;animation-duration:${6+Math.random()*6}s;animation-delay:${Math.random()*8}s;--dx:${dx}px;--dy:${dy}px`;
    bg.appendChild(p);
  }

  // Portals
  const portalSpecs=[
    {x:5,y:15,sz:120,col:'#00d4ff',dur:14},
    {x:82,y:60,sz:90,col:'#9b5cf6',dur:18},
    {x:45,y:72,sz:70,col:'#39ff14',dur:22}
  ];
  portalSpecs.forEach(ps=>{
    const wrap=document.createElement('div');
    wrap.style.cssText=`position:absolute;left:${ps.x}%;top:${ps.y}%;width:${ps.sz}px;height:${ps.sz}px`;
    const ring=document.createElement('div');ring.className='portal';
    ring.style.cssText=`inset:0;border-color:${ps.col};opacity:0.3;animation-duration:${ps.dur}s;box-shadow:0 0 20px ${ps.col}44`;
    const inner=document.createElement('div');inner.className='portal-inner';
    const is=ps.sz*0.65;
    inner.style.cssText=`width:${is}px;height:${is}px;top:${(ps.sz-is)/2}px;left:${(ps.sz-is)/2}px;border-color:${ps.col};opacity:0.2;animation-duration:${ps.dur*0.7}s`;
    wrap.appendChild(ring);wrap.appendChild(inner);bg.appendChild(wrap);
  });

  // Horizontal grid lines
  for(let i=0;i<8;i++){
    const l=document.createElement('div');l.className='grid-line';
    l.style.cssText=`left:0;right:0;height:1px;top:${10+i*11}%;animation-delay:${i*0.5}s`;
    bg.appendChild(l);
  }

  // Energy waves from center
  for(let i=0;i<5;i++){
    const w=document.createElement('div');w.className='energy-wave';
    w.style.cssText=`width:100px;height:100px;left:50%;top:50%;margin:-50px 0 0 -50px;animation-duration:${4+i*1.2}s;animation-delay:${i*0.8}s;border-color:rgba(0,212,255,${0.2-i*0.03})`;
    bg.appendChild(w);
  }

  // Vertical data streams
  for(let i=0;i<12;i++){
    const s=document.createElement('div');s.className='data-stream';
    const ht=40+Math.random()*100;
    s.style.cssText=`left:${Math.random()*100}%;height:${ht}px;background:linear-gradient(180deg,transparent,rgba(57,255,20,0.4),transparent);animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*5}s`;
    bg.appendChild(s);
  }
})();

// ══════════════════════ ENGINE ══════════════════════
let currentActivity=1;
let dragData=null;

const titles={
  1:'Activity 1 — Assemble the NPN Transistor Switch Circuit',
  2:'Activity 2 — Sequence the Switching Process',
  3:'Activity 3 — Complete the Transistor Control Workflow'
};
const descs={
  1:'A transistor switch circuit needs six components in the right positions. Drag each component chip from the bank and drop it into its correct slot on the circuit board. Click a filled slot to return it to the bank.',
  2:'When a Base signal arrives, a precise chain of events follows. Drag the process cards into the correct numbered order to show how the transistor switches the motor on.',
  3:'Now arrange all five steps of the complete transistor control system — from input signal all the way to motor operation — in the exact correct sequence to unlock the circuit.'
};

function setActivity(n){
  currentActivity=n;
  document.getElementById('act-title').textContent=titles[n];
  document.getElementById('act-desc').textContent=descs[n];
  [1,2,3].forEach(i=>document.getElementById('act'+i).style.display=(i===n)?'flex':'none');
  updateSteps();
}
function updateSteps(){
  [1,2,3].forEach(i=>{
    document.getElementById('s'+i).className='step-dot'+(i<currentActivity?' done':i===currentActivity?' active':'');
    if(i<3)document.getElementById('l'+i).className='step-line'+(i<currentActivity?' done':'');
  });
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}

// ══════════════════════ ACTIVITY 1: CIRCUIT BUILDER ══════════════════════
const A1={};
// The 6 components and their correct slot positions
A1.components=[
  {id:'battery',    label:'9V Battery',        color:'blue',   desc:'Power supply — Collector side'},
  {id:'resistor_b', label:'Base Resistor',     color:'violet', desc:'Limits current to the Base'},
  {id:'transistor', label:'BC547 NPN',          color:'blue',   desc:'The electronic switch'},
  {id:'resistor_c', label:'Load Resistor',      color:'violet', desc:'Protects the motor / load'},
  {id:'signal',     label:'Signal Source',      color:'green',  desc:'Tiny Base trigger current'},
  {id:'motor',      label:'Motor / Load',       color:'green',  desc:'The device being switched ON'}
];
// 6 slots defined by their role
A1.slots=[
  {id:'battery',    label:'POWER SUPPLY',       hint:'Top rail — large current source'},
  {id:'resistor_c', label:'COLLECTOR RESISTOR', hint:'Between power and Collector (C)'},
  {id:'transistor', label:'NPN TRANSISTOR',     hint:'Centre — the switching heart'},
  {id:'motor',      label:'MOTOR / LOAD',       hint:'Connected at the Collector output'},
  {id:'resistor_b', label:'BASE RESISTOR',      hint:'Between signal and Base (B)'},
  {id:'signal',     label:'SIGNAL SOURCE',      hint:'Drives the Base — tiny current input'}
];
A1.state={}; // slotId → componentId
A1.chipOrder=[];

A1.init=function(){
  A1.state={};
  A1.chipOrder=shuffle(A1.components.map(c=>c.id));
};

A1.render=function(){
  const a1=document.getElementById('act1');
  a1.innerHTML='';

  // Component bank
  const bank=document.createElement('div');
  bank.className='bank';
  bank.innerHTML='<h3>COMPONENT BANK</h3>';
  A1.chipOrder.forEach(cid=>{
    if(Object.values(A1.state).includes(cid))return;
    const comp=A1.components.find(c=>c.id===cid);
    const d=document.createElement('div');
    d.className=`drag-chip ${comp.color}`;
    d.innerHTML=`<span>${comp.label}</span>`;
    d.title=comp.desc;
    d.draggable=true;
    d.addEventListener('dragstart',e=>{dragData={type:'comp',value:cid};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>d.classList.remove('dragging'));
    bank.appendChild(d);
  });
  if(bank.children.length===1){
    const done=document.createElement('div');done.style.cssText='font-size:10px;color:var(--green);text-align:center;padding:8px;letter-spacing:.5px';
    done.textContent='All placed! ✓';bank.appendChild(done);
  }
  a1.appendChild(bank);

  // Circuit board
  const board=document.createElement('div');
  board.className='circuit-board';
  board.innerHTML='<h3>NPN SWITCH CIRCUIT</h3>';

  // NPN SVG schematic (always visible)
  const schematic=document.createElementNS('http://www.w3.org/2000/svg','svg');
  schematic.setAttribute('width','100%');schematic.setAttribute('height','170');schematic.setAttribute('viewBox','0 0 480 170');
  // Power rail
  schematic.innerHTML+=`<line x1="240" y1="10" x2="240" y2="50" stroke="rgba(0,212,255,0.35)" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="120" y1="10" x2="360" y2="10" stroke="rgba(0,212,255,0.25)" stroke-width="1.5"/>`;
  // Collector line
  schematic.innerHTML+=`<line x1="240" y1="80" x2="240" y2="50" stroke="rgba(0,212,255,0.35)" stroke-width="2"/>`;
  // Emitter to ground
  schematic.innerHTML+=`<line x1="240" y1="115" x2="240" y2="155" stroke="rgba(57,255,20,0.35)" stroke-width="2"/>
  <line x1="220" y1="155" x2="260" y2="155" stroke="rgba(57,255,20,0.4)" stroke-width="2"/>
  <line x1="226" y1="160" x2="254" y2="160" stroke="rgba(57,255,20,0.3)" stroke-width="1.5"/>
  <line x1="232" y1="165" x2="248" y2="165" stroke="rgba(57,255,20,0.2)" stroke-width="1"/>`;
  // Base line
  schematic.innerHTML+=`<line x1="210" y1="97" x2="130" y2="97" stroke="rgba(255,193,7,0.4)" stroke-width="2"/>`;
  // NPN transistor symbol
  schematic.innerHTML+=`
  <line x1="210" y1="70" x2="210" y2="125" stroke="rgba(0,212,255,0.7)" stroke-width="2.5"/>
  <line x1="210" y1="80" x2="240" y2="68" stroke="rgba(0,212,255,0.7)" stroke-width="2"/>
  <line x1="210" y1="115" x2="240" y2="127" stroke="rgba(57,255,20,0.7)" stroke-width="2"/>
  <polygon points="230,122 240,128 234,117" fill="rgba(57,255,20,0.7)"/>
  <text x="246" y="66" font-family="Space Mono" font-size="10" fill="rgba(0,212,255,0.8)">C</text>
  <text x="246" y="132" font-family="Space Mono" font-size="10" fill="rgba(57,255,20,0.8)">E</text>
  <text x="112" y="101" font-family="Space Mono" font-size="10" fill="rgba(255,193,7,0.8)">B</text>`;
  board.appendChild(schematic);

  // 2-column slot grid: left col = power/collector/transistor/motor, right col = base resistor/signal
  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px';

  const leftSlots=['battery','resistor_c','transistor','motor'];
  const rightSlots=['resistor_b','signal'];

  const leftCol=document.createElement('div');leftCol.style.cssText='display:flex;flex-direction:column;gap:9px';
  leftSlots.forEach(sid=>leftCol.appendChild(buildSlot(sid)));

  const rightCol=document.createElement('div');rightCol.style.cssText='display:flex;flex-direction:column;gap:9px;justify-content:center';
  rightSlots.forEach(sid=>rightCol.appendChild(buildSlot(sid)));

  grid.appendChild(leftCol);grid.appendChild(rightCol);
  board.appendChild(grid);
  a1.appendChild(board);

  function buildSlot(sid){
    const sDef=A1.slots.find(s=>s.id===sid);
    const wrap=document.createElement('div');wrap.className='circuit-slot';
    const label=document.createElement('div');label.className='slot-label';label.textContent=sDef.label;
    const slot=document.createElement('div');
    const placedId=A1.state[sid];
    slot.className='slot'+(placedId?' filled':'');
    slot.textContent=placedId?A1.components.find(c=>c.id===placedId).label:sDef.hint;
    slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
    slot.addEventListener('drop',e=>{
      e.preventDefault();slot.classList.remove('drag-over');
      if(dragData&&dragData.type==='comp'){
        if(dragData.value===sid){
          A1.state[sid]=dragData.value;
          A1.render();
        } else {
          showToast('That component belongs in a different slot — check the circuit labels!',true);
        }
      }
    });
    slot.addEventListener('click',()=>{if(A1.state[sid]){delete A1.state[sid];A1.render();}});
    wrap.appendChild(label);wrap.appendChild(slot);
    return wrap;
  }

  // Preview + buttons
  const preview=document.createElement('div');
  preview.className='motor-preview';
  preview.innerHTML='<h3>CIRCUIT STATUS</h3>';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id='motor-svg';svg.setAttribute('viewBox','0 0 140 140');
  renderCircuitStatus(svg,A1.state);
  preview.appendChild(svg);

  const btnRow=document.createElement('div');btnRow.className='btn-row';
  const allDone=A1.slots.every(s=>A1.state[s.id]);
  const checkBtn=document.createElement('button');checkBtn.className='btn green';checkBtn.textContent='Energise Circuit ▶';checkBtn.disabled=!allDone;
  checkBtn.addEventListener('click',A1.checkAndAdvance);
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.addEventListener('click',()=>{A1.init();A1.render();});
  btnRow.appendChild(checkBtn);btnRow.appendChild(resetBtn);
  preview.appendChild(btnRow);
  a1.appendChild(preview);
};

function renderCircuitStatus(svg,state){
  svg.innerHTML='';
  const count=Object.keys(state).length;
  const total=6;
  const pct=count/total;
  const col=pct<0.5?'#00d4ff':pct<1?'#9b5cf6':'#39ff14';
  // background
  svg.innerHTML+=`<rect x="0" y="0" width="140" height="140" rx="12" fill="rgba(0,10,25,.7)"/>`;
  // circuit ring
  const r=52,cx=70,cy=65;
  const circ=2*Math.PI*r;
  const dashLen=circ*pct;
  svg.innerHTML+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(0,212,255,.12)" stroke-width="8"/>`;
  svg.innerHTML+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-dasharray="${dashLen} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round" style="${count>0?`filter:drop-shadow(0 0 8px ${col})`:''}"/>`;
  // NPN label
  svg.innerHTML+=`<text x="70" y="58" text-anchor="middle" font-family="Fredoka" font-size="16" fill="${col}" font-weight="700">NPN</text>`;
  svg.innerHTML+=`<text x="70" y="76" text-anchor="middle" font-family="Space Mono" font-size="9" fill="rgba(0,212,255,.6)">BC547</text>`;
  // status
  const msg=count===total?'CIRCUIT COMPLETE':count===0?'NO COMPONENTS':count+'/'+total+' PLACED';
  svg.innerHTML+=`<text x="70" y="128" text-anchor="middle" font-family="Quicksand" font-size="9.5" fill="rgba(0,212,255,.6)">${msg}</text>`;
  if(count===total){
    // glow pulses
    svg.innerHTML+=`<circle cx="70" cy="65" r="60" fill="none" stroke="${col}" stroke-width="2" opacity="0.2"><animate attributeName="r" values="55;65;55" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0;0.3" dur="1.5s" repeatCount="indefinite"/></circle>`;
  }
}

A1.checkAndAdvance=function(){
  const allCorrect=A1.slots.every(s=>A1.state[s.id]===s.id);
  if(allCorrect){
    showPopup('⚡','Circuit Energised!','All six components are in the right positions! The battery powers the Collector, the Base Resistor controls the signal, and the BC547 transistor acts as the switch. The motor is ready to be driven. Next: learn the exact sequence of events!','Next: Switching Sequence →',()=>{setActivity(2);A2.init();A2.render();});
  } else {
    showToast('Some components are in the wrong slot — re-check the circuit description!',true);
  }
};

// ══════════════════════ ACTIVITY 2: PROCESS SEQUENCE ══════════════════════
const A2={};
A2.correctSteps=[
  {id:'p1', label:'A tiny signal current arrives at the Base (B) pin'},
  {id:'p2', label:'Base current opens the internal switch inside the transistor'},
  {id:'p3', label:'Large Collector current is now free to flow from C to E'},
  {id:'p4', label:'Current rushes through the motor — it starts to spin'},
  {id:'p5', label:'Signal stops → Base closes → Collector current stops → motor off'}
];
A2.placed=[null,null,null,null,null];
A2.cardOrder=[];

A2.init=function(){
  A2.placed=[null,null,null,null,null];
  A2.cardOrder=shuffle(A2.correctSteps.map(s=>s.id));
};

A2.render=function(){
  const a2=document.getElementById('act2');
  a2.innerHTML='';

  const bank=document.createElement('div');bank.className='process-bank';bank.innerHTML='<h3>PROCESS CARDS</h3>';
  A2.cardOrder.forEach(sid=>{
    if(A2.placed.includes(sid))return;
    const step=A2.correctSteps.find(s=>s.id===sid);
    const d=document.createElement('div');d.className='process-card';d.textContent=step.label;d.draggable=true;
    d.addEventListener('dragstart',e=>{dragData={type:'proc',value:sid};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>d.classList.remove('dragging'));
    bank.appendChild(d);
  });
  if(bank.children.length===1){
    const done=document.createElement('div');done.style.cssText='font-size:10px;color:var(--green);text-align:center;padding:8px';done.textContent='All steps placed! ✓';bank.appendChild(done);
  }
  a2.appendChild(bank);

  const frame=document.createElement('div');frame.className='sequence-frame';
  A2.correctSteps.forEach((step,i)=>{
    const row=document.createElement('div');row.className='seq-step'+(A2.placed[i]?' matched':'');
    const num=document.createElement('div');num.className='step-num';num.textContent=(i+1)+'.';row.appendChild(num);
    const slot=document.createElement('div');
    slot.className='step-slot'+(A2.placed[i]?' filled':'');
    slot.textContent=A2.placed[i]?A2.correctSteps.find(s=>s.id===A2.placed[i]).label:'drop process card here';
    row.appendChild(slot);
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();row.classList.remove('drag-over');
      if(dragData&&dragData.type==='proc'){
        if(dragData.value===step.id){
          A2.placed[i]=dragData.value;A2.render();
          if(A2.placed.every(p=>p!==null)){
            setTimeout(()=>showPopup('🔋','Sequence Locked In!','Perfect order! The tiny Base signal opens the transistor gate, the Collector current surges through, and the motor spins. Remove the signal and the whole chain stops automatically. Now build the complete control workflow!','Next: Full Workflow →',()=>{setActivity(3);A3.init();A3.render();}),500);
          }
        } else {
          showToast('That step doesn\'t belong here — think about what happens first!',true);
        }
      }
    });
    frame.appendChild(row);
  });
  a2.appendChild(frame);

  const side=document.createElement('div');side.style.cssText='display:flex;flex-direction:column;align-items:center;min-width:55px';
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.addEventListener('click',()=>{A2.init();A2.render();});
  side.appendChild(resetBtn);a2.appendChild(side);
};

// ══════════════════════ ACTIVITY 3: FULL WORKFLOW ══════════════════════
const A3={};
A3.correctOrder=[
  {id:'w1', label:'INPUT SIGNAL\nSensor / button sends a weak voltage to the Base', shortLabel:'Input Signal → Base'},
  {id:'w2', label:'BASE CURRENT\n~0.7V forward bias activates the Base junction', shortLabel:'Base Current Activates'},
  {id:'w3', label:'TRANSISTOR SWITCHING\nNPN opens: current path from Collector to Emitter', shortLabel:'Transistor Switches ON'},
  {id:'w4', label:'COLLECTOR CURRENT\nLarge current flows from battery through Collector→Emitter', shortLabel:'Collector Current Flows'},
  {id:'w5', label:'MOTOR OPERATION\nHigh current drives the motor — load turns ON fully', shortLabel:'Motor Turns ON'}
];
A3.placed=[null,null,null,null,null];
A3.cardOrder=[];

A3.init=function(){
  A3.placed=[null,null,null,null,null];
  A3.cardOrder=shuffle(A3.correctOrder.map(c=>c.id));
};

A3.render=function(){
  const a3=document.getElementById('act3');
  a3.innerHTML='';

  const bank=document.createElement('div');bank.className='workflow-bank';bank.innerHTML='<h3>WORKFLOW STEPS</h3>';
  A3.cardOrder.forEach(cid=>{
    if(A3.placed.includes(cid))return;
    const c=A3.correctOrder.find(c=>c.id===cid);
    const d=document.createElement('div');d.className='workflow-card';
    d.textContent=c.shortLabel;d.draggable=true;d.title=c.label.replace('\n','\n');
    d.addEventListener('dragstart',e=>{dragData={type:'wf',value:cid};d.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    d.addEventListener('dragend',()=>d.classList.remove('dragging'));
    bank.appendChild(d);
  });
  if(bank.children.length===1){
    const done=document.createElement('div');done.style.cssText='font-size:10px;color:var(--green);text-align:center;padding:8px';done.textContent='All placed! ✓';bank.appendChild(done);
  }
  a3.appendChild(bank);

  const steps=document.createElement('div');steps.className='workflow-steps';
  A3.correctOrder.forEach((step,i)=>{
    const row=document.createElement('div');row.className='wf-step'+(A3.placed[i]?' matched':'');
    const num=document.createElement('div');num.className='wf-num';num.textContent=(i+1)+'.';row.appendChild(num);
    const slot=document.createElement('div');
    slot.className='wf-slot'+(A3.placed[i]?' filled':'');
    slot.textContent=A3.placed[i]?A3.correctOrder.find(c=>c.id===A3.placed[i]).shortLabel:step.label.split('\n')[0]+' — drop here';
    row.appendChild(slot);
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();row.classList.remove('drag-over');
      if(dragData&&dragData.type==='wf'){
        if(dragData.value===step.id){
          A3.placed[i]=dragData.value;A3.render();
          if(A3.placed.every(p=>p!==null)){
            setTimeout(()=>showPopup('🚀','Control Workflow Complete!','You mapped the entire transistor control chain: signal arrives at the Base, the transistor opens, Collector current surges, and the motor turns on — all without a single mechanical switch! Ready to see the celebration?','Celebrate! ⚡',()=>{closePopup();setTimeout(showFinalPopup,300);}),500);
          }
        } else {
          showToast('That step belongs at a different point in the chain — trace the current path!',true);
        }
      }
    });
    steps.appendChild(row);
  });
  a3.appendChild(steps);

  const side=document.createElement('div');side.style.cssText='display:flex;flex-direction:column;align-items:center;min-width:55px';
  const resetBtn=document.createElement('button');resetBtn.className='btn ghost';resetBtn.textContent='Reset ↺';
  resetBtn.addEventListener('click',()=>{A3.init();A3.render();});
  side.appendChild(resetBtn);a3.appendChild(side);
};

// ══════════════════════ POPUPS ══════════════════════
function showPopup(icon,title,body,btnText,cb){
  document.getElementById('popup-icon').textContent=icon;
  document.getElementById('popup-title').textContent=title;
  document.getElementById('popup-body').textContent=body;
  const btn=document.getElementById('popup-btn');
  btn.textContent=btnText;btn.className='btn';
  btn.onclick=()=>{closePopup();if(cb)cb();};
  document.getElementById('popup-overlay').classList.add('show');
}
function closePopup(){document.getElementById('popup-overlay').classList.remove('show');}

function showFinalPopup(){
  spawnConfetti();
  document.getElementById('popup-icon').textContent='⚡';
  document.getElementById('popup-title').textContent='System Fully Operational!';
  const body=document.getElementById('popup-body');
  body.innerHTML=`<strong style="color:var(--blue)">You mastered the NPN Transistor Switch!</strong><br><br>
  The <b style="color:#fff">Base (B)</b> receives the tiny signal, the <b style="color:#fff">Collector (C)</b> holds the large current, and the <b style="color:#fff">Emitter (E)</b> releases it all.<br><br>
  A weak whisper of electricity commands a powerful current — that is the transistor superpower behind every automatic streetlight, alarm system, and robot in the world.<br><br>
  <em style="color:var(--green)">Portals open, circuits glow, the matrix celebrates — you are now a Circuit Commander! ⚡</em>`;
  body.style.fontSize='12px';body.style.lineHeight='1.65';body.style.color='var(--ink-dim)';
  const btn=document.getElementById('popup-btn');
  btn.textContent='Play Again ↺';btn.className='btn green';btn.style.cssText+='font-size:14px;padding:12px 30px';
  btn.onclick=()=>{closePopup();resetAll();};
  document.getElementById('popup-overlay').classList.add('show');
}

function resetAll(){A1.init();A2.init();A3.init();setActivity(1);A1.render();}

function showToast(msg,isError=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show'+(isError?' error':'');
  setTimeout(()=>t.className='',2800);
}

function spawnConfetti(){
  const colors=['#00d4ff','#39ff14','#ff0090','#9b5cf6','#ffc107','#ffffff'];
  for(let i=0;i<80;i++){
    setTimeout(()=>{
      const c=document.createElement('div');c.className='confetti-piece';
      const sz=4+Math.random()*7;
      c.style.cssText=`left:${Math.random()*100}%;background:${colors[0|(Math.random()*colors.length)]};animation-duration:${1.8+Math.random()*2}s;width:${sz}px;height:${sz}px;box-shadow:0 0 8px currentColor`;
      document.body.appendChild(c);setTimeout(()=>c.remove(),4500);
    },i*35);
  }
}

// ══════════════════════ INIT ══════════════════════
A1.init();A2.init();A3.init();
setActivity(1);A1.render();
</script>
</body>
</html>
