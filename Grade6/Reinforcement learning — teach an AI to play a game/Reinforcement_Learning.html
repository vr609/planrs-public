<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reinforcement Learning — Teach an AI to Play a Game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;}
  body{position:fixed;top:0;left:0;right:0;bottom:0;background:#1a0a00;}

  /* SAVANNA BACKGROUND */
  #bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .sky{position:absolute;top:0;left:0;right:0;height:62%;background:linear-gradient(180deg,#1a0a00 0%,#7a2e00 18%,#c45a00 38%,#e8820a 55%,#f4b842 70%,#f9d67a 85%,#fce9a0 100%);}
  .sun{position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff9e0 30%,#ffd95a 60%,#ffad00 100%);top:8%;left:50%;transform:translateX(-50%);box-shadow:0 0 60px 20px rgba(255,190,0,0.45),0 0 120px 50px rgba(255,140,0,0.2);animation:sunPulse 4s ease-in-out infinite;}
  @keyframes sunPulse{0%,100%{box-shadow:0 0 60px 20px rgba(255,190,0,0.45),0 0 120px 50px rgba(255,140,0,0.2);}50%{box-shadow:0 0 80px 30px rgba(255,200,0,0.6),0 0 160px 70px rgba(255,150,0,0.3);}}
  .ground{position:absolute;bottom:0;left:0;right:0;height:42%;background:linear-gradient(180deg,#8b5e1a 0%,#6b3d0e 40%,#4a2608 100%);}
  .grass-strip{position:absolute;top:0;left:0;right:0;height:30px;overflow:hidden;}
  .grass-blade{position:absolute;bottom:0;width:6px;border-radius:3px 3px 0 0;transform-origin:bottom center;animation:sway 3s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}

  /* BAOBAB TREES */
  .baobab{position:absolute;bottom:38%;pointer-events:none;}
  .baobab-trunk{position:absolute;bottom:0;left:50%;transform:translateX(-50%);background:#3d1a05;border-radius:4px 4px 2px 2px;}
  .baobab-top{position:absolute;left:50%;transform:translateX(-50%);background:#2d4a1a;border-radius:50% 50% 30% 30%;}
  .baobab-branch{position:absolute;background:#3d1a05;border-radius:2px;}

  /* ANIMALS */
  .animal{position:absolute;bottom:39%;pointer-events:none;}
  .giraffe{width:50px;height:90px;animation:giraffePace 18s linear infinite;}
  .elephant{width:70px;height:50px;animation:elephantPace 25s linear infinite;}
  @keyframes giraffePace{0%{left:-80px;transform:scaleX(1);}48%{left:calc(100vw + 80px);transform:scaleX(1);}49%{left:calc(100vw + 80px);transform:scaleX(-1);}100%{left:-80px;transform:scaleX(-1);}}
  @keyframes elephantPace{0%{right:-100px;transform:scaleX(1);}48%{right:calc(100vw + 100px);transform:scaleX(1);}49%{right:calc(100vw + 100px);transform:scaleX(-1);}100%{right:-100px;transform:scaleX(-1);}}

  /* FLOATING DUST */
  .dust{position:absolute;border-radius:50%;background:rgba(210,140,60,0.18);animation:floatDust linear infinite;pointer-events:none;}
  @keyframes floatDust{0%{transform:translateY(0) translateX(0);opacity:0;}20%{opacity:1;}80%{opacity:0.6;}100%{transform:translateY(-120px) translateX(30px);opacity:0;}}

  /* STAR PARTICLES */
  .sparkle{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd95a;animation:sparkleFly ease-in-out infinite;pointer-events:none;}
  @keyframes sparkleFly{0%,100%{opacity:0;transform:scale(0);}50%{opacity:1;transform:scale(1.5);}}

  /* GRASS WAVES */
  .grass-wave{position:absolute;bottom:38%;left:0;right:0;height:22px;overflow:visible;pointer-events:none;}
  .grass-wave svg{width:100%;height:22px;}

  /* MAIN LAYOUT */
  #app{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;}

  /* HEADER */
  #header{text-align:center;margin-bottom:8px;z-index:20;}
  #header h1{font-family:'Fredoka One',cursive;font-size:clamp(18px,3.2vw,32px);color:#fff9e0;text-shadow:0 0 20px rgba(255,160,0,0.9),2px 2px 0 rgba(80,30,0,0.8);letter-spacing:1px;line-height:1.1;}
  #header .sub{font-size:clamp(10px,1.4vw,14px);color:#ffd580;margin-top:2px;font-weight:600;letter-spacing:2px;text-transform:uppercase;}

  /* PROGRESS DOTS */
  #progress{display:flex;gap:10px;justify-content:center;margin-bottom:8px;z-index:20;}
  .pdot{width:28px;height:28px;border-radius:50%;border:2.5px solid rgba(255,200,80,0.5);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:rgba(255,200,80,0.5);transition:all 0.4s;}
  .pdot.active{border-color:#ffd040;color:#ffd040;background:rgba(255,200,40,0.15);box-shadow:0 0 12px rgba(255,200,0,0.5);}
  .pdot.done{border-color:#6ddb80;color:#fff;background:#3a9e4d;box-shadow:0 0 8px rgba(80,220,100,0.4);}

  /* ACTIVITY PANEL */
  #panel{width:min(94vw,860px);background:rgba(15,8,0,0.78);border:1.5px solid rgba(255,180,60,0.35);border-radius:18px;backdrop-filter:blur(8px);padding:14px 18px 12px;position:relative;flex-shrink:0;max-height:calc(100vh - 160px);overflow:hidden;}
  #panel h2{font-family:'Fredoka One',cursive;font-size:clamp(14px,2.2vw,20px);color:#ffd580;margin-bottom:8px;text-align:center;}
  #panel .instr{font-size:clamp(10px,1.3vw,13px);color:#f0c878;text-align:center;margin-bottom:10px;line-height:1.4;}

  /* DRAG ITEMS TRAY */
  .tray{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:10px;min-height:36px;}
  .drag-item{padding:6px 14px;border-radius:30px;font-size:clamp(10px,1.3vw,13px);font-weight:700;cursor:grab;user-select:none;border:1.5px solid;transition:transform 0.15s,box-shadow 0.15s;white-space:nowrap;}
  .drag-item:hover{transform:scale(1.06);}
  .drag-item:active{cursor:grabbing;transform:scale(0.96);}
  .drag-item.dragging{opacity:0.35;}

  /* DROP ZONES */
  .zones{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .drop-zone{border-radius:12px;border:2px dashed rgba(255,200,80,0.35);padding:8px 10px;min-height:70px;min-width:120px;flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;transition:border-color 0.2s,background 0.2s;}
  .drop-zone.over{border-color:#ffd040;background:rgba(255,200,40,0.1);}
  .drop-zone .zone-label{font-size:clamp(9px,1.2vw,11px);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;text-align:center;}
  .drop-zone .zone-icon{font-size:22px;margin-bottom:4px;}
  .drop-zone .dropped-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}

  /* CHECK BTN */
  .check-btn{display:block;margin:10px auto 0;padding:9px 32px;border-radius:30px;border:none;font-family:'Fredoka One',cursive;font-size:clamp(13px,1.8vw,17px);cursor:pointer;letter-spacing:1px;transition:transform 0.15s,box-shadow 0.15s;}
  .check-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(255,180,0,0.5);}

  /* FEEDBACK */
  .feedback{text-align:center;font-size:clamp(11px,1.5vw,14px);font-weight:700;margin-top:8px;min-height:20px;transition:all 0.3s;}

  /* ACTIVITY 2 SPECIFICS */
  #act2-arena{display:flex;gap:10px;align-items:flex-start;justify-content:center;}
  #cartpole-viz{width:200px;height:130px;flex-shrink:0;border-radius:12px;border:1.5px solid rgba(255,180,60,0.3);background:rgba(255,255,255,0.04);overflow:hidden;position:relative;}
  #act2-right{flex:1;max-width:520px;}
  #score-display{display:flex;gap:10px;justify-content:center;margin-bottom:8px;}
  .score-box{padding:5px 14px;border-radius:10px;text-align:center;min-width:90px;}
  .score-box .slabel{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
  .score-box .sval{font-family:'Fredoka One',cursive;font-size:22px;transition:all 0.3s;}

  /* ACTIVITY 3 SPECIFICS */
  #act3-grid{display:flex;gap:8px;align-items:flex-start;}
  .seq-slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1;}
  .seq-slot{width:120px;height:68px;border-radius:12px;border:2px dashed rgba(255,200,80,0.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:rgba(255,200,80,0.4);letter-spacing:1px;text-transform:uppercase;transition:all 0.25s;position:relative;}
  .seq-slot.over{border-color:#ffd040;background:rgba(255,200,40,0.1);}
  .seq-slot .slot-num{position:absolute;top:4px;left:6px;font-size:9px;color:rgba(255,200,80,0.4);font-weight:800;}
  #ai-progress{width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;margin-top:8px;}
  #ai-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#3dba5a,#7de880);width:0%;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}
  #ai-label{text-align:center;font-size:11px;color:#90d49a;margin-top:4px;font-weight:700;min-height:16px;}

  /* POPUP OVERLAY */
  #popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:none;align-items:center;justify-content:center;}
  #popup-overlay.show{display:flex;}
  #popup-box{background:linear-gradient(160deg,#1a0d00,#2d1a00);border:2px solid rgba(255,190,60,0.5);border-radius:22px;padding:28px 36px;text-align:center;max-width:380px;width:90%;box-shadow:0 0 60px rgba(255,160,0,0.3);}
  #popup-box .pop-icon{font-size:52px;margin-bottom:10px;}
  #popup-box h3{font-family:'Fredoka One',cursive;font-size:24px;color:#ffd580;margin-bottom:8px;}
  #popup-box p{font-size:13px;color:#f0c878;line-height:1.6;margin-bottom:16px;}
  #popup-box .fact{font-size:12px;color:#a0d4b0;background:rgba(60,160,90,0.15);border-radius:10px;padding:8px 12px;margin-bottom:16px;border:1px solid rgba(80,200,110,0.25);}
  .pop-btn{padding:10px 28px;border-radius:30px;border:none;font-family:'Fredoka One',cursive;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#f4a800,#e06000);color:#fff;letter-spacing:1px;transition:transform 0.15s;}
  .pop-btn:hover{transform:scale(1.06);}

  /* WRONG DROP SHAKE */
  @keyframes wrongShake{0%{transform:translateX(0);}15%{transform:translateX(-7px);}30%{transform:translateX(7px);}45%{transform:translateX(-5px);}60%{transform:translateX(5px);}75%{transform:translateX(-3px);}90%{transform:translateX(3px);}100%{transform:translateX(0);}}
  .wrong-flash{animation:wrongShake 0.45s ease;outline:2.5px solid #e04040 !important;background:rgba(220,40,40,0.18) !important;}

  /* RESET BUTTON */
  .reset-btn{display:inline-block;padding:9px 24px;border-radius:30px;border:1.5px solid rgba(255,180,60,0.4);font-family:'Fredoka One',cursive;font-size:clamp(12px,1.6vw,15px);cursor:pointer;letter-spacing:1px;background:rgba(255,255,255,0.06);color:#ffd580;transition:transform 0.15s,box-shadow 0.15s,background 0.15s;}
  .reset-btn:hover{transform:scale(1.05);background:rgba(255,160,0,0.15);box-shadow:0 2px 12px rgba(255,160,0,0.3);}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}

  /* TOAST */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(20,10,0,0.9);color:#ffd580;padding:10px 24px;border-radius:30px;font-size:13px;font-weight:700;z-index:200;transition:transform 0.4s;border:1px solid rgba(255,180,60,0.4);}
  #toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<h2 class="sr-only" style="position:absolute;left:-9999px;">Reinforcement Learning Interactive Activities — Savanna Theme</h2>

<!-- SAVANNA BACKGROUND -->
<div id="bg">
  <div class="sky"></div>
  <div class="sun"></div>
  <div id="ground" class="ground">
    <div class="grass-strip" id="grass-strip"></div>
  </div>
  <div class="grass-wave" id="grass-wave"></div>
  <div id="baobabs"></div>
  <div id="animals"></div>
  <div id="particles"></div>
</div>

<!-- APP -->
<div id="app">
  <div id="header">
    <h1>REINFORCEMENT LEARNING</h1>
    <div class="sub">⚡ Teach an AI to Play a Game ⚡</div>
  </div>

  <div id="progress">
    <div class="pdot active" id="pd1">1</div>
    <div class="pdot" id="pd2">2</div>
    <div class="pdot" id="pd3">3</div>
  </div>

  <div id="panel">
    <!-- Activities injected here -->
  </div>
</div>

<div id="popup-overlay">
  <div id="popup-box">
    <div class="pop-icon" id="pop-icon"></div>
    <h3 id="pop-title"></h3>
    <p id="pop-msg"></p>
    <div class="fact" id="pop-fact"></div>
    <button class="pop-btn" id="pop-btn"></button>
  </div>
</div>

<div id="toast">Drag items into the correct zones!</div>

<script>
const panel = document.getElementById('panel');
let currentActivity = 1;
let dragItem = null;
let dragOffset = {x:0, y:0};
let ghostEl = null;

// ============ BACKGROUND ANIMATIONS ============
function buildBackground() {
  // Grass blades
  const strip = document.getElementById('grass-strip');
  for(let i=0;i<80;i++){
    const b = document.createElement('div');
    b.className='grass-blade';
    const h = 12+Math.random()*14;
    b.style.cssText=`left:${(i/80)*100+Math.random()*1.2}%;height:${h}px;background:hsl(${85+Math.random()*20},${40+Math.random()*25}%,${28+Math.random()*18}%);animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*2}s;`;
    strip.appendChild(b);
  }

  // Baobabs
  const bc = document.getElementById('baobabs');
  const bpos = [8,20,78,90];
  bpos.forEach((p,i)=>{
    const tree = document.createElement('div');
    tree.className='baobab';
    const sc = 0.7+Math.random()*0.6;
    const tw = 22*sc, th = 60*sc;
    tree.style.cssText=`left:${p}%;transform:scale(${sc});transform-origin:bottom center;`;
    tree.innerHTML=`
      <div class="baobab-trunk" style="width:${tw}px;height:${th}px;"></div>
      <div class="baobab-top" style="width:${tw*3.5}px;height:${tw*2.2}px;bottom:${th-5}px;"></div>
      <div class="baobab-branch" style="width:${tw*0.3}px;height:${tw*1.2}px;bottom:${th+tw*1.2}px;left:${tw*0.9}px;transform:rotate(40deg);"></div>
      <div class="baobab-branch" style="width:${tw*0.3}px;height:${tw*1.0}px;bottom:${th+tw*1.0}px;left:${-tw*0.5}px;transform:rotate(-35deg);"></div>`;
    bc.appendChild(tree);
  });

  // Giraffe SVG
  const ac = document.getElementById('animals');
  const g = document.createElement('div');
  g.className='animal giraffe';
  g.style.cssText='left:-80px;';
  g.innerHTML=`<svg viewBox="0 0 50 90" width="50" height="90">
    <rect x="20" y="50" width="10" height="40" rx="4" fill="#c8860a"/>
    <rect x="10" y="10" width="10" height="45" rx="5" fill="#c8860a"/>
    <ellipse cx="15" cy="8" rx="8" ry="6" fill="#d49020"/>
    <ellipse cx="19" cy="3" rx="2" ry="4" fill="#c8860a"/>
    <ellipse cx="12" cy="4" rx="2" ry="3" fill="#c8860a"/>
    <rect x="8" y="55" width="6" height="30" rx="3" fill="#c8860a"/>
    <rect x="36" y="55" width="6" height="30" rx="3" fill="#c8860a"/>
    <ellipse cx="15" cy="8" rx="3" ry="2.5" fill="#7a4a00" opacity="0.4"/>
  </svg>`;
  ac.appendChild(g);

  // Elephant SVG
  const e = document.createElement('div');
  e.className='animal elephant';
  e.style.cssText='right:-100px;bottom:39.5%;';
  e.innerHTML=`<svg viewBox="0 0 70 50" width="70" height="50">
    <ellipse cx="38" cy="28" rx="26" ry="19" fill="#607080"/>
    <ellipse cx="16" cy="24" rx="13" ry="15" fill="#607080"/>
    <path d="M6 34 Q0 42 4 48 Q8 52 10 44" stroke="#607080" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="10" cy="12" rx="4" ry="8" fill="#607080"/>
    <ellipse cx="22" cy="12" rx="4" ry="7" fill="#607080"/>
    <rect x="20" y="40" width="8" height="10" rx="3" fill="#506070"/>
    <rect x="32" y="42" width="8" height="8" rx="3" fill="#506070"/>
    <ellipse cx="10" cy="22" rx="3" ry="2" fill="#405060" opacity="0.6"/>
  </svg>`;
  ac.appendChild(e);

  // Dust particles
  const pc = document.getElementById('particles');
  for(let i=0;i<22;i++){
    const d = document.createElement('div');
    d.className='dust';
    const s = 4+Math.random()*12;
    d.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*45}%;animation-duration:${5+Math.random()*8}s;animation-delay:${Math.random()*8}s;`;
    pc.appendChild(d);
  }
  for(let i=0;i<15;i++){
    const s = document.createElement('div');
    s.className='sparkle';
    s.style.cssText=`left:${Math.random()*100}%;top:${5+Math.random()*55}%;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*4}s;`;
    pc.appendChild(s);
  }
}

// ============ ACTIVITY 1 ============
const act1Data = {
  items:[
    {id:'a1',text:'Sheru the Dog',color:'#e8a02a',border:'#c07010',cat:'agent'},
    {id:'a2',text:'AI Player',color:'#e8a02a',border:'#c07010',cat:'agent'},
    {id:'a3',text:'The Park',color:'#3dab5a',border:'#1e7a30',cat:'environment'},
    {id:'a4',text:'Game World',color:'#3dab5a',border:'#1e7a30',cat:'environment'},
    {id:'a5',text:'Jump Left',color:'#5b8fe8',border:'#2a5cc0',cat:'action'},
    {id:'a6',text:'Flap Wings',color:'#5b8fe8',border:'#2a5cc0',cat:'action'},
    {id:'a7',text:'+10 Points',color:'#d43c3c',border:'#a01818',cat:'reward'},
    {id:'a8',text:'Gold Star',color:'#d43c3c',border:'#a01818',cat:'reward'},
    {id:'a9',text:'Max Score',color:'#8a5edc',border:'#5c30b0',cat:'goal'},
    {id:'a10',text:'Win the Game',color:'#8a5edc',border:'#5c30b0',cat:'goal'},
  ],
  zones:[
    {id:'agent',label:'AGENT',icon:'🤖',color:'#c07010',desc:'The AI player'},
    {id:'environment',label:'ENVIRONMENT',icon:'🌍',color:'#1e7a30',desc:'The world'},
    {id:'action',label:'ACTION',icon:'⚡',color:'#2a5cc0',desc:'What it does'},
    {id:'reward',label:'REWARD',icon:'🏆',color:'#a01818',desc:'The score'},
    {id:'goal',label:'GOAL',icon:'🎯',color:'#5c30b0',desc:'Win condition'},
  ]
};

function buildAct1(){
  const shuffled=[...act1Data.items].sort(()=>Math.random()-0.5);
  panel.innerHTML=`
    <h2>🦁 Activity 1: Know Your Team!</h2>
    <div class="instr">Drag each label into the correct category below</div>
    <div class="tray" id="tray1">${shuffled.map(it=>`
      <div class="drag-item" id="${it.id}" draggable="true"
        style="background:${it.color}22;color:${it.color};border-color:${it.border}66;"
        data-cat="${it.cat}">${it.text}</div>`).join('')}
    </div>
    <div class="zones" id="zones1">${act1Data.zones.map(z=>`
      <div class="drop-zone" id="zone-${z.id}" data-zone="${z.id}">
        <div class="zone-icon">${z.icon}</div>
        <div class="zone-label" style="color:${z.color}">${z.label}</div>
        <div class="dropped-items" id="dropped-${z.id}"></div>
      </div>`).join('')}
    </div>
    <div class="feedback" id="fb1"></div>
    <div class="btn-row">
      <button class="reset-btn" onclick="buildAct1()">🔄 Reset</button>
      <button class="check-btn" onclick="checkAct1()" style="background:linear-gradient(135deg,#f4a800,#e06000);color:#fff;margin:0;">Check Answers ✓</button>
    </div>`;
  setupDrag('#tray1 .drag-item','[data-zone]');
}

function checkAct1(){
  let correct=0,total=0;
  act1Data.zones.forEach(z=>{
    const cont=document.getElementById('dropped-'+z.id);
    cont.querySelectorAll('.drag-item').forEach(item=>{
      total++;
      if(item.dataset.cat===z.id){correct++;item.style.outline='2px solid #6ddb80';}
      else{item.style.outline='2px solid #e04040';}
    });
  });
  const fb=document.getElementById('fb1');
  if(total===0){showToast('Drag some items first!');return;}
  if(correct===total){
    fb.innerHTML='<span style="color:#6ddb80">🎉 Perfect! All correct!</span>';
    setTimeout(()=>showPopup(1),800);
  } else {
    fb.innerHTML=`<span style="color:#e08040">${correct}/${total} correct — keep trying!</span>`;
  }
}

// ============ ACTIVITY 2 ============
let act2Score={reward:0,penalty:0};
const act2Items=[
  {id:'b1',text:'+Stay Balanced',color:'#3dab5a',border:'#1e7a30',type:'reward',val:10},
  {id:'b2',text:'+Reach Target',color:'#3dab5a',border:'#1e7a30',type:'reward',val:15},

let cpAnim;
let cpState={angle:0.3,angVel:0.01,cartX:100,cartV:0,learned:0};
function startCartpole(){
  const canvas=document.getElementById('cpCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let t=0;
  function draw(){
    t+=0.04;
    cpState.learned=Math.min(1,act2Score.reward>0?(act2Score.reward/50):0);
    const damping=0.92+cpState.learned*0.07;
    const correction=cpState.learned*cpState.angle*0.18;
    cpState.angVel+=cpState.angle*0.04-correction+Math.sin(t*0.3)*0.002*(1-cpState.learned);
    cpState.angVel*=damping;
    cpState.angle+=cpState.angVel;
    cpState.angle=Math.max(-1.2,Math.min(1.2,cpState.angle));
    cpState.cartV+=correction*0.5;
    cpState.cartV*=0.9;
    cpState.cartX+=cpState.cartV;
    cpState.cartX=Math.max(30,Math.min(170,cpState.cartX));

    ctx.clearRect(0,0,200,130);
    ctx.fillStyle='rgba(255,200,80,0.04)';
    ctx.fillRect(0,0,200,130);
    // Track
    ctx.beginPath();ctx.moveTo(10,100);ctx.lineTo(190,100);
    ctx.strokeStyle='rgba(255,200,80,0.3)';ctx.lineWidth=2;ctx.stroke();
    // Cart
    const cx=cpState.cartX;
    ctx.fillStyle=cpState.learned>0.5?'#3dab5a':'#5b8fe8';
    ctx.beginPath();ctx.roundRect(cx-20,90,40,18,4);ctx.fill();
    // Wheels
    [[cx-12,108],[cx+12,108]].forEach(([wx,wy])=>{
      ctx.beginPath();ctx.arc(wx,wy,5,0,Math.PI*2);
      ctx.fillStyle='#c07010';ctx.fill();
    });
    // Pole
    const poleLen=55;
    const px=cx+Math.sin(cpState.angle)*poleLen;
    const py=90-Math.cos(cpState.angle)*poleLen;
    ctx.beginPath();ctx.moveTo(cx,90);ctx.lineTo(px,py);
    const lean=Math.abs(cpState.angle);
    ctx.strokeStyle=lean<0.15?'#6ddb80':lean<0.5?'#f4a800':'#e04040';
    ctx.lineWidth=4;ctx.lineCap='round';ctx.stroke();
    // Ball
    ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);
    ctx.fillStyle=lean<0.15?'#6ddb80':lean<0.5?'#f4a800':'#e04040';ctx.fill();
    // Status label
    ctx.fillStyle=cpState.learned>0.6?'#6ddb80':'rgba(255,200,80,0.7)';
    ctx.font='bold 9px Nunito,sans-serif';
    ctx.textAlign='center';
    ctx.fillText(cpState.learned>0.6?'AI LEARNED! ✓':lean<0.3?'BALANCING...':'LEARNING...',100,16);
    cpAnim=requestAnimationFrame(draw);
  }
  cancelAnimationFrame(cpAnim);
  draw();
}

function updateAct2Scores(){
  const net=act2Score.reward+act2Score.penalty;
  document.getElementById('rval').textContent='+'+act2Score.reward;

  document.getElementById('nval').textContent=(net>=0?'+':'')+net;
  cpState.learned=Math.min(1,Math.max(0,act2Score.reward/50));
}

function checkAct2(){
  let correct=0,total=0;
  act2Items.forEach(it=>{
    const el=document.getElementById(it.id);
    if(!el||el.parentElement.id==='tray2')return;
    total++;
    const pz=el.closest('[data-zone]');
    if(pz&&pz.dataset.zone===it.type){correct++;el.style.outline='2px solid #6ddb80';}
    else if(pz){el.style.outline='2px solid #e04040';}
  });
  const fb=document.getElementById('fb2');
  if(total===0){showToast('Drag some blocks first!');return;}
  if(correct===total){
    fb.innerHTML='<span style="color:#6ddb80">🎉 The AI is learning fast!</span>';
    setTimeout(()=>showPopup(2),800);
  } else {
    fb.innerHTML=`<span style="color:#e08040">${correct}/${total} correct — adjust the blocks!</span>`;
  }
}

// ============ DRAG AND DROP ENGINE ============
function setupDrag(itemSel, zoneSel){
  setTimeout(()=>{
    document.querySelectorAll(itemSel).forEach(el=>{
      el.addEventListener('dragstart',e=>{
        dragItem=el;
        el.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain',el.id);
      });
      el.addEventListener('dragend',e=>{
        el.classList.remove('dragging');
        dragItem=null;
      });
    });
    document.querySelectorAll(zoneSel).forEach(zone=>{
      zone.addEventListener('dragover',e=>{
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        zone.classList.add('over');
      });
      zone.addEventListener('dragleave',e=>{
        zone.classList.remove('over');
      });
      zone.addEventListener('drop',e=>{
        e.preventDefault();
        zone.classList.remove('over');
        const id=e.dataTransfer.getData('text/plain');
        const item=document.getElementById(id);
        if(!item)return;

        // ── VALIDATION: check if the item belongs in this zone ──
        const zoneKey = zone.dataset.zone; // e.g. 'agent', 'reward', '1'(slot number)
        let isCorrect = true;

        if(currentActivity===1){
          // item must have data-cat matching the zone id
          isCorrect = item.dataset.cat === zoneKey;
        } else if(currentActivity===2){
          // item must have data-type matching zone ('reward' or 'penalty')
          isCorrect = item.dataset.type === zoneKey;
        } else if(currentActivity===3){
          // zone.dataset.slot is the expected order number
          isCorrect = parseInt(item.dataset.order) === parseInt(zone.dataset.slot);
        }

        if(!isCorrect){
          // Shake the zone, flash the item, then return item to tray
          const trayId = currentActivity===1?'tray1':currentActivity===2?'tray2':'tray3';
          const tray = document.getElementById(trayId);
          item.classList.add('wrong-flash');
          zone.style.borderColor='#e04040';
          zone.style.background='rgba(220,40,40,0.1)';
          setTimeout(()=>{
            item.classList.remove('wrong-flash');
            item.style.outline='none';
            zone.style.borderColor='';
            zone.style.background='';
            if(tray) tray.appendChild(item);
          }, 480);
          showToast('❌ Wrong spot! Try another zone.');
          return;
        }

        // ── CORRECT: place the item ──
        item.style.outline='none';
        const dropId='dropped-'+zoneKey;
        const dropCont=document.getElementById(dropId);
        if(dropCont){
          dropCont.appendChild(item);
        } else if(zone.classList.contains('seq-slot')){
          // Activity 3: only one item per slot — displace existing back to tray
          const existing=zone.querySelector('.drag-item');
          if(existing){
            const tray3=document.getElementById('tray3');
            if(tray3) tray3.appendChild(existing);
          }
          zone.appendChild(item);
        } else {
          zone.appendChild(item);
        }
        // Update live scores/progress
        if(currentActivity===2) recalcAct2();
        if(currentActivity===3) recalcAct3();
      });
    });
    // Return to tray on tray drop
    ['tray1','tray2','tray3'].forEach(tid=>{
      const tray=document.getElementById(tid);
      if(!tray)return;
      tray.addEventListener('dragover',e=>{e.preventDefault();});
      tray.addEventListener('drop',e=>{
        e.preventDefault();
        const id=e.dataTransfer.getData('text/plain');
        const item=document.getElementById(id);
        if(item){tray.appendChild(item);item.style.outline='none';}
        if(currentActivity===2)recalcAct2();
        if(currentActivity===3)recalcAct3();
      });
    });
  },100);
}

function recalcAct2(){
  let r=0,p=0;
  act2Items.forEach(it=>{
    const el=document.getElementById(it.id);
    if(!el)return;
    const pz=el.closest('[data-zone]');
    if(!pz)return;
    if(pz.dataset.zone==='reward')r+=Math.abs(it.val);
    if(pz.dataset.zone==='penalty')p+=Math.abs(it.val);
  });
  act2Score.reward=r;act2Score.penalty=-p;
  updateAct2Scores();
}

function recalcAct3(){
  let filled=0;
  for(let n=1;n<=5;n++){
    const slot=document.getElementById('slot-'+n);
    if(slot&&slot.querySelector('.drag-item'))filled++;
  }
  const bar=document.getElementById('ai-bar');
  if(bar)bar.style.width=Math.round((filled/5)*100)+'%';
}

  1:{icon:'🦁',title:'Agent Identified!',msg:'You know your RL team now! The Agent is the AI learner, the Environment is the world it lives in, Actions are the choices it makes, Rewards are the positive signals, and the Goal is to maximize total score.',fact:'Real RL agents like AlphaGo played millions of games to learn — all through rewards and penalties!',btn:'Next: Train the AI →'},
  2:{icon:'🎮',title:'CartPole Conquered!',msg:'You have set up the feedback loop! When rewards outweigh penalties, the AI pole-balancing agent learns to stay upright. That\'s exactly how OpenAI\'s Gym CartPole works!',fact:'CartPole is one of the most famous RL benchmark problems — a cart balances a pole by moving left or right!',btn:'Final Challenge →'},
  3:{icon:'🏆',title:'RL Loop Complete!',msg:'INCREDIBLE! You\'ve built the complete Reinforcement Learning cycle: Observe → Act → Reward → Learn → Improve. Every game-playing AI — from Flappy Bird bots to chess champions — follows this exact loop!',fact:'DeepMind\'s AI learned to play Atari games from scratch using only pixel observations and a score as reward!',btn:'Play Again 🔄'},
};

function showPopup(act){
  const d=popupData[act];
  document.getElementById('pop-icon').textContent=d.icon;
  document.getElementById('pop-title').textContent=d.title;
  document.getElementById('pop-msg').textContent=d.msg;
  document.getElementById('pop-fact').textContent='🔬 Fun Fact: '+d.fact;
  document.getElementById('pop-btn').textContent=d.btn;
  document.getElementById('pop-btn').onclick=()=>{
    document.getElementById('popup-overlay').classList.remove('show');
    if(act<3){
      currentActivity=act+1;
      markProgress(act);
      loadActivity(currentActivity);
    } else {
      currentActivity=1;
      markProgress(0);
      loadActivity(1);
    }
  };
  document.getElementById('popup-overlay').classList.add('show');
}

function markProgress(done){
  [1,2,3].forEach(n=>{
    const d=document.getElementById('pd'+n);
    d.className='pdot';
    if(n<done+1&&done>0)d.classList.add('done');
    if(n===done+1)d.classList.add('active');
  });
  if(done===0){document.getElementById('pd1').className='pdot active';}
}

function loadActivity(n){
  cancelAnimationFrame(cpAnim);
  if(n===1)buildAct1();
  if(n===2)buildAct2();
  if(n===3)buildAct3();
}

// ============ TOAST ============
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ============ INIT ============
buildBackground();
loadActivity(1);
